<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E1A">
<script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОГЭ №11 — графики функций</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:'Onest',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --font-mono:ui-monospace,-apple-system,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#EEF1F7;
  --blob-1:rgba(120,150,255,.16);
  --blob-2:rgba(190,150,230,.14);
  --card:rgba(255,255,255,.8);
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.85);
  --glass-inset:rgba(255,255,255,.55);
  --hl:var(--hl-14);
  --muted-1:#8E8E93;
  --muted-2:#6E6E73;
  --muted-3:#48484A;
  --muted-4:#3A3A3C;
  --muted-5:#1D1D1F;
  --muted-6:#8E8E93;
  --paper:#FDFCF7;
  --grid:#DCE4F0;
  --ink:#004C99;
  --ink-active:#003A75;
  --pencil:#1D1D1F;
  --teacher:#FF3B30;
  --ok:#248A3D;
  --ok-tint:rgba(36,138,61,.1);
  --ok-shadow:rgba(36,138,61,.3);
  --shadow:0 10px 34px rgba(20,30,60,.08);
  --hl-10:rgba(0,76,153,.10);
  --hl-14:var(--hl);
  --hl-35:rgba(0,76,153,.35);
}
html[data-theme="dark"]{
  --bg:#0B0E1A;
  --blob-1:rgba(90,110,255,.22);
  --blob-2:rgba(150,90,220,.18);
  --paper:#151A2C;
  --card:rgba(30,37,64,.82);
  --glass:rgba(40,46,74,.5);
  --glass-strong:rgba(46,53,84,.65);
  --glass-border:rgba(255,255,255,.12);
  --glass-inset:rgba(255,255,255,.07);
  --hl:rgba(40,110,214,.26);
  --grid:#232A44;
  --ink:#2E7DE0;
  --ink-active:#4A93F0;
  --pencil:#F2F3F5;
  --teacher:#FF6961;
  --ok:#3E8E5B;
  --ok-tint:rgba(62,142,91,.14);
  --ok-shadow:rgba(62,142,91,.35);
  --shadow:0 10px 40px rgba(0,0,0,.55);
  --hl-10:rgba(46,125,224,.16);
  --hl-14:var(--hl);
  --hl-35:rgba(46,125,224,.5);
  --muted-1:#9A9AA2;
  --muted-2:#9A9AA2;
  --muted-3:#AEAEB4;
  --muted-4:#C7C7CC;
  --muted-5:#F2F3F5;
  --muted-6:#9A9AA2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    var(--bg);
  font-family:var(--font-ui);
  color:var(--pencil);
  min-height:100vh;
  padding:18px 12px 60px;
}
.wrap{max-width:820px;margin:0 auto;position:relative;z-index:1;pointer-events:none}
.wrap > *{pointer-events:auto}

/* ─── калькулятор в столбик (свой пример) — встраивает настоящие тренажёры через iframe ─── */
.calc-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.calc-tool-btn{flex:1;min-width:130px;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:11px 8px;cursor:pointer;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, border-color .12s, background .12s, color .12s;}
.calc-tool-btn:active{transform:scale(.96)}
.calc-tool-btn:hover{border-color:var(--ink)}
.calc-tool-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.calc-panel{display:none;position:relative;padding:18px;}
.calc-panel-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-strong);color:var(--muted-3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .15s;}
.calc-panel-close:active{transform:scale(.9)}
.calc-panel-close:hover{border-color:var(--ink)}
.calc-panel-title{font-family:var(--font-ui);font-weight:700;font-size:15px;color:var(--pencil);margin-bottom:14px;padding-right:32px;}
.calc-iframe{display:block;width:100%;border:none;border-radius:14px;background:transparent;}
.calc-history-panel{display:none;position:relative;padding:18px;margin-bottom:14px;}
.calc-history-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-right:32px;}
.calc-history-filter{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:6px 12px;cursor:pointer;transition:transform .15s, border-color .12s, background .12s, color .12s;}
.calc-history-filter:active{transform:scale(.96)}
.calc-history-filter:hover{border-color:var(--ink)}
.calc-history-filter.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.calc-history-list{display:flex;flex-direction:column;}
.calc-history-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--glass-border);}
.calc-history-row:first-child{border-top:none;}
.calc-history-num{font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-6);min-width:20px;}
.calc-history-expr{font-family:var(--font-mono);font-size:15px;color:var(--pencil);flex:1;}
.calc-history-copy{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:6px 10px;cursor:pointer;white-space:nowrap;transition:border-color .12s, background .12s;}
.calc-history-copy:hover{border-color:var(--ink)}
.calc-history-copy:active{transform:scale(.96)}
.calc-history-empty{font-family:var(--font-ui);font-size:14px;color:var(--muted-6);text-align:center;padding:16px 0;}

/* ─── интерактивная доска на фоне вокруг примера ─── */
#boardCanvas{position:fixed;top:0;left:0;z-index:2;touch-action:none;cursor:crosshair;border-radius:20px;}
#boardCanvasBg{position:fixed;top:0;left:0;z-index:0;touch-action:none;cursor:crosshair;}
#boardSpace{height:0;pointer-events:none;transition:height .2s ease;}
.board-toolbar{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:8px;align-items:center;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:20px;padding:9px 11px;box-shadow:var(--shadow);}
.toolbar-sep{width:1px;align-self:stretch;background:var(--glass-border);margin:2px 0;}
.board-tool-btn{width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s, border-color .15s, background .15s;}
.board-tool-btn:active{transform:scale(.92)}
.board-tool-btn:hover{border-color:var(--ink);}
.board-tool-btn.active{background:var(--ink);border-color:var(--ink);}
.board-tool-btn .dot{border-radius:50%;background:var(--pencil);display:block;}
.board-tool-btn.active .dot{background:#fff;}
.board-tool-btn.eraser{font-size:15px;}
.board-tool-btn.pen-main{font-size:15px;}
.board-tool-btn.color-btn.active{background:var(--glass);border-color:var(--ink);box-shadow:0 0 0 2px var(--ink);}
.tool-group{position:relative;}
/* всплывающее окошко с размерами (для ручки и ластика) — управляется из JS через
   класс .open, а не через :hover, потому что чистый CSS-hover рвётся, стоит
   курсору чуть отклониться от прямой линии между кнопкой и окошком */
.size-flyout{position:absolute;bottom:100%;right:0;margin-bottom:10px;display:none;gap:8px;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;padding:8px;box-shadow:var(--shadow);}
.size-flyout.open{display:flex;}
/* невидимый мостик над кнопкой, чтобы курсор не «выпадал» из зоны наведения,
   пока едет от кнопки к окошку */
.tool-group::after{content:'';position:absolute;left:0;right:0;bottom:100%;height:14px;}

/* ─── всплывающая палитра для «своего» цвета ─── */
.board-tool-btn.custom-color-btn{overflow:hidden;}
.color-picker-flyout{flex-direction:column;align-items:stretch;width:200px;padding:12px;gap:10px;}
.cp-sv-wrap{position:relative;width:100%;height:120px;border-radius:12px;overflow:hidden;cursor:crosshair;touch-action:none;}
.cp-sv{display:block;width:100%;height:100%;}
.cp-sv-thumb{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;top:0;left:0;}
.cp-row{display:flex;align-items:center;gap:8px;}
.cp-eyedropper{width:28px;height:28px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--pencil);transition:transform .15s;}
.cp-eyedropper:active{transform:scale(.9)}
.cp-eyedropper:hover{border-color:var(--ink);}
.cp-swatch{width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);}
.cp-hue-wrap{position:relative;flex:1;height:16px;touch-action:none;}
.cp-hue{position:absolute;inset:0;border-radius:8px;background:linear-gradient(to right,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);cursor:pointer;}
.cp-hue-thumb{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;}
.cp-rgb-row{display:flex;gap:6px;}
.cp-field{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.cp-field input{width:100%;box-sizing:border-box;text-align:center;border-radius:8px;border:1px solid var(--glass-border);background:var(--glass);color:var(--pencil);font-family:var(--font-mono);font-size:12px;padding:5px 2px;}
.cp-field label{font-size:10px;color:var(--muted-3);font-family:var(--font-ui);}

.board-view-toolbar{position:fixed;left:18px;bottom:18px;z-index:50;display:flex;gap:8px;align-items:center;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:20px;padding:9px 11px;box-shadow:var(--shadow);}
.board-zoom-label{min-width:44px;height:34px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-3);padding:0 6px;transition:transform .15s;}
.board-zoom-label:active{transform:scale(.92)}
.board-zoom-label:hover{border-color:var(--ink);}
.board-tool-btn.hand-tool{font-size:16px;}
.board-tool-btn.clear-btn{font-size:15px;}

/* ─── доска изначально выключена — включается отдельной кнопкой под переключателем темы ─── */
/* ─── Промпт №32 (по образцу Промпта №23 в ОГЭ №8): сами записи на доске
   (холсты) видны ВСЕГДА, независимо от того, включён ли у ЭТОГО участника
   инструмент рисования — если записи оставил учитель, ученик должен видеть
   их поверх тренажёра постоянно. Скрываем при data-board!="on" только
   панели инструментов: их незачем показывать, пока рисование не включено
   именно на этом устройстве. ─── */
html:not([data-board="on"]) .board-toolbar,
html:not([data-board="on"]) .board-view-toolbar{display:none;}
/* холст не должен перехватывать клики, пока перо не включено — иначе
   выключенная доска накрыла бы собой кнопки и поля тренажёра */
html:not([data-board="on"]) #boardCanvas,
html:not([data-board="on"]) #boardCanvasBg{pointer-events:none;}
html[data-board="on"] #boardSpace{height:72vh;transition:height .32s ease;}
/* при свёрнутых подсказках место под алгоритмами/счётчиками освобождается — отдаём его доске */
html[data-board="on"][data-focus="on"] #boardSpace{height:90vh;}
html[data-board="on"] body{background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    var(--bg);}
/* ─── свернуть подсказки: освобождает место для записи на доске ─── */
.focus-toggle{position:fixed;top:112px;right:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;}
.focus-toggle:hover{border-color:var(--ink)}
.focus-toggle:active{transform:scale(.92)}

/* ─── аккуратное сворачивание: max-height/opacity вместо мгновенного display:none ─── */
h1,.sub,.stats,.example-history-toggle,.example-history-panel,.submode-tabs{overflow:hidden;min-height:0;transition:max-height .32s ease, opacity .22s ease, margin .32s ease;}
h1{max-height:64px}
.sub{max-height:50px}
.stats{max-height:90px}
.example-history-toggle{max-height:56px}
.example-history-panel{max-height:220px}
.submode-tabs{max-height:56px}
html[data-focus="on"] h1,
html[data-focus="on"] .sub,
html[data-focus="on"] .stats,
html[data-focus="on"] .example-history-toggle,
html[data-focus="on"] .example-history-panel,
html[data-focus="on"] .submode-tabs{
  max-height:0;
  min-height:0;
  padding:0;
  border-width:0;
  opacity:0;
  margin-top:0;
  margin-bottom:0;
  pointer-events:none;
}
html[data-focus="on"] #pickerArea{display:none!important;}

/* ─── медали за пять решённых примеров подряд в этом прототипе ─── */
.mode-medals{font-family:var(--font-ui);font-size:12px;margin-top:4px;opacity:.85;}
.medal-badge-row{display:inline-flex;gap:3px;margin-left:8px;font-size:15px;vertical-align:middle;}
.medal-tray{position:fixed;left:0;right:0;bottom:0;z-index:150;display:none;gap:7px;align-items:center;padding:8px 16px;overflow-x:auto;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--glass-border);}
.medal-tray.show{display:flex;}
.medal-tray-icon{font-size:20px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));animation:medalPop .45s cubic-bezier(.34,1.56,.64,1) both;flex:none;}
@keyframes medalPop{0%{transform:scale(0);}70%{transform:scale(1.3);}100%{transform:scale(1);}}
.medal-flyer{position:fixed;z-index:300;pointer-events:none;font-size:44px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.3));transition:transform .85s cubic-bezier(.32,.9,.35,1), opacity .85s ease .1s;}

/* ─── история последних пяти примеров этого прототипа ─── */
.example-history-toggle{display:block;width:100%;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:11px 18px;cursor:pointer;margin-top:18px;margin-bottom:14px;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, background .12s;}
.example-history-toggle:active{transform:scale(.98)}
.example-history-toggle:hover{background:var(--hl-10);}
.example-history-panel{display:none;position:relative;padding:18px;margin-bottom:14px;}
.example-history-list{display:flex;flex-direction:column;}
.example-history-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--glass-border);}
.example-history-row:first-child{border-top:none;}
.example-history-mark{font-size:16px;flex:none;margin-top:1px;}
.example-history-prompt{font-family:var(--font-mono);font-size:14px;color:var(--pencil);line-height:1.4;}
.example-history-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.example-history-answer{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ok);line-height:1.3;}
.example-history-empty{font-family:var(--font-ui);font-size:14px;color:var(--muted-6);text-align:center;padding:16px 0;}
h1{font-family:var(--font-ui);font-weight:700;letter-spacing:-.02em;font-size:clamp(24px,5vw,34px);color:var(--pencil);text-align:center;}
.sub{font-family:var(--font-ui);font-weight:500;text-align:center;color:var(--muted-2);font-size:15px;margin:4px 0 22px;}
.group-title{font-family:var(--font-ui);font-weight:700;font-size:14px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 8px;}
.group-title:first-child{margin-top:0}
.modes{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.mode-card{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;text-align:left;
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-border);border-radius:14px;
  box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);
  padding:11px 18px;cursor:pointer;transition:transform .12s, border-color .12s;font-family:var(--font-ui);
}
.mode-card:hover{border-color:var(--ink); transform:translateX(3px)}
.mode-card .mtitle{font-weight:600;font-size:15px;color:var(--pencil);line-height:1.3;flex:1 1 260px;margin:0;}
.mode-card.random{background:linear-gradient(135deg, var(--hl-10), transparent);border-color:var(--ink);margin-bottom:14px;}
.mode-card.soon{opacity:.55;cursor:default;}
.mode-card.soon:hover{border-color:var(--glass-border);transform:none;}
.soon-badge{font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-1);background:var(--glass);border-radius:8px;padding:3px 8px;}
.task-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.type-nav{display:flex;align-items:center;gap:8px;}
.type-nav-btn{height:28px;flex:0 0 auto;border:1px solid var(--glass-border);border-radius:12px;background:var(--glass-strong);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-family:var(--font-ui);font-weight:600;font-size:12px;line-height:1;cursor:pointer;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;transition:transform .12s, border-color .12s;}
.type-nav-btn:hover{border-color:var(--ink)}
.type-nav-btn:active{transform:scale(.9)}
.submode-tabs{display:flex;gap:8px;margin-bottom:14px;}
.submode-tab{flex:1;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--muted-3);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:10px 6px;cursor:pointer;text-align:center;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, border-color .15s, color .15s, background .15s;}
.submode-tab:active{transform:scale(.96)}
.submode-tab:hover{border-color:var(--ink);}
.submode-tab.active{color:#fff;background:var(--ink);border-color:var(--ink);}
.coming-soon{font-family:var(--font-ui);font-weight:500;font-size:15px;color:var(--muted-3);text-align:center;padding:34px 16px;line-height:1.5;}
.back-btn{font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(16px) saturate(160%);transition:transform .15s;}
.back-btn:active{transform:scale(.96)}

<script>(function(){
  var btn=document.getElementById('themeToggle');
  function apply(t, persist){
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    if (persist) { try{ localStorage.setItem('theme', t); }catch(e){} }
  }
  apply(document.documentElement.getAttribute('data-theme') || 'light', false);
  btn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(cur, true);
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSystemChange = function(e){
      var explicit = false;
      try{ explicit = !!localStorage.getItem('theme'); }catch(err){}
      if (explicit) return;
      apply(e.matches ? 'dark' : 'light', false);
    };
    if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
    else if (mq.addListener) mq.addListener(onSystemChange);
  }
})();</script>
<script>(function(){
  var btn = document.getElementById('boardVisibilityToggle');
  function apply(on){
    document.documentElement.setAttribute('data-board', on ? 'on' : 'off');
    btn.classList.toggle('active', on);
    btn.title = on ? 'Скрыть доску' : 'Показать доску';
  }
  apply(false); // доска изначально выключена
  btn.addEventListener('click', function(){
    apply(document.documentElement.getAttribute('data-board') !== 'on');
  });
})();</script>

<script>
/* ═══════════════ утилиты ═══════════════ */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fmtNum(x) {
  const r = Math.round(x * 100) / 100;
  return (Number.isInteger(r) ? String(r) : String(r).replace('.', ',')).replace('-', '−');
}
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a || 1; }
function fmtFrac(num, den){
  if (den < 0) { den = -den; num = -num; }
  const g = gcd(num, den);
  num /= g; den /= g;
  if (den === 1) return fmtNum(num);
  const sign = num < 0 ? '−' : '';
  return `${sign}${Math.abs(num)}/${den}`;
}
function buildOptions(correct, candidates, fallbackGen) {
  const seen = new Set([correct]);
  const picked = [];
  for (const c of candidates) {
    if (!seen.has(c)) { seen.add(c); picked.push(c); }
    if (picked.length === 3) break;
  }
  let guard = 0;
  while (picked.length < 3 && guard < 30) {
    guard++;
    const extra = fallbackGen(guard);
    if (!seen.has(extra)) { seen.add(extra); picked.push(extra); }
  }
  return shuffleArr([correct, ...picked]);
}
function tableHTML(headers, rows) {
  return `<table class="data-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>` +
    `<tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}


function gen_linear_graph(){
  const k = pick([-2,-1,-0.5,0.5,1,2]);
  const b = pick([-3,-2,-1,1,2,3]);
  const C=120, scale=8, lim=14;
  function clipPoint(x,y){
    if (y > lim){ y = lim; x = (lim-b)/k; }
    else if (y < -lim){ y = -lim; x = (-lim-b)/k; }
    if (x > lim){ x = lim; y = k*lim+b; }
    else if (x < -lim){ x = -lim; y = k*(-lim)+b; }
    return [x,y];
  }
  const [x1,y1] = clipPoint(-20, k*-20+b);
  const [x2,y2] = clipPoint(20, k*20+b);
  const toPx=(x,y)=>[C+x*scale, C-y*scale];
  const [px1,py1]=toPx(x1,y1);
  const [px2,py2]=toPx(x2,y2);
  const svg = `<svg viewBox="0 0 240 240" width="240" height="240" style="display:block;margin:10px auto;background:var(--paper);border-radius:12px;border:1px solid var(--glass-border);">
    <line x1="0" y1="${C}" x2="240" y2="${C}" stroke="var(--grid)" stroke-width="2"/>
    <line x1="${C}" y1="0" x2="${C}" y2="240" stroke="var(--grid)" stroke-width="2"/>
    <text x="222" y="${C-6}" font-size="13" fill="var(--muted-3)">x</text>
    <text x="${C+6}" y="16" font-size="13" fill="var(--muted-3)">y</text>
    <line x1="${px1.toFixed(1)}" y1="${py1.toFixed(1)}" x2="${px2.toFixed(1)}" y2="${py2.toFixed(1)}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
  const kSign = k>0?'k > 0':'k < 0';
  const bSign = b>0?'b > 0':'b < 0';
  const correct = `${kSign}, ${bSign}`;
  const allOpts = ['k > 0, b > 0','k > 0, b < 0','k < 0, b > 0','k < 0, b < 0'];
  const options = shuffleArr(allOpts);
  return {
    prompt: `На рисунке изображён график функции <b>y = kx + b</b>. Определите знаки коэффициентов k и b.${svg}`,
    options, correctIndex: options.indexOf(correct),
    explain: `Прямая возрастает — k>0, убывает — k<0. Точка пересечения с осью y (при x=0) равна b: выше нуля — b>0, ниже — b<0. Здесь: ${correct}.`
  };
}

function gen_point_on_line(){
  const k = pick([-3,-2,-1,1,2,3]);
  const x0 = ri(-6,6);
  const b = ri(-10,10);
  const y0 = k*x0+b;
  const correct = b;
  const wrong1 = -b;
  const wrong2 = y0 - k*x0*2;
  const wrong3 = b + pick([-4,-3,3,4]);
  const options = buildOptions(String(correct), shuffleArr([wrong1,wrong2,wrong3]).map(String), kk=>String(correct+(kk%2?1:-1)*kk));
  return {
    prompt: `Прямая <b>y = ${k}x + b</b> проходит через точку (${x0}; ${y0}). Найдите b.`,
    options, correctIndex: options.indexOf(String(correct)),
    explain: `Подставим точку: ${y0} = ${k}·${x0} + b ⇒ b = ${y0} − ${k*x0} = ${correct}.`
  };
}

/* ═══════════════ память по прототипам + история + медали (localStorage) ═══════════════
   Каждый прототип (mode-card) хранит свой прогресс отдельно, под собственным ключом,
   поэтому переход между типами не теряет ни текущий пример, ни счётчик медалей —
   и всё это переживает перезагрузку страницы. */
const PROGRESS_NS = 'ogeProg:oge11:';
function loadProg(modeId) {
  try { const raw = localStorage.getItem(PROGRESS_NS + modeId); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function saveProg(modeId, data) {
  try { data.lastActiveAt = Date.now(); localStorage.setItem(PROGRESS_NS + modeId, JSON.stringify(data)); } catch (e) {}
}
function freshProg() {
  return { task: null, answered: false, hadWrongPick: false, pickedIndex: null,
           solvedInBatch: 0, errorsInBatch: 0, history: [], medals: { gold: 0, silver: 0, bronze: 0 } };
}
const SESSION_GAP_MS = 3 * 60 * 60 * 1000; // 3 часа без захода в этот прототип — считаем, что началась новая учебная сессия
function loadProgOrFresh(key) {
  const saved = loadProg(key);
  if (!saved) return freshProg();
  if (!saved.lastActiveAt || (Date.now() - saved.lastActiveAt) > SESSION_GAP_MS) {
    // новая сессия после паузы: обнуляем историю примеров и прогресс к медали (и незавершённую задачу),
    // но уже полученные медали не трогаем — это заслуженное достижение, а не сессионное состояние
    return Object.assign(freshProg(), { medals: saved.medals || { gold: 0, silver: 0, bronze: 0 } });
  }
  return saved;
}
let curProg = freshProg(); // прогресс ТЕКУЩЕГО прототипа — зеркалится в localStorage при каждом изменении

const MEDAL_EMOJI = { gold: '🥇', silver: '🥈', bronze: '🥉' };
const MEDAL_TITLE = { gold: 'Золото — пять примеров без ошибок', silver: 'Серебро — пять примеров, 1–2 ошибки', bronze: 'Бронза — пять примеров решено' };

function renderMedalBadges() {
  const row = document.getElementById('medalBadgeRow');
  if (!row) return;
  const m = curProg.medals || {};
  row.textContent = ['gold', 'silver', 'bronze'].filter(t => m[t]).map(t => `${MEDAL_EMOJI[t]}×${m[t]}`).join(' ');
}
function renderExampleHistory() {
  const list = document.getElementById('exampleHistoryList');
  const empty = document.getElementById('exampleHistoryEmpty');
  const btn = document.getElementById('exampleHistoryToggle');
  if (!list) return;
  const items = curProg.history || [];
  btn.textContent = `🕓 История примеров (${items.length})`;
  list.innerHTML = '';
  empty.style.display = items.length ? 'none' : 'block';
  items.forEach(h => {
    const row = document.createElement('div');
    row.className = 'example-history-row';
    const mark = document.createElement('span');
    mark.className = 'example-history-mark';
    mark.textContent = h.correct ? (h.hadError ? '🟡' : '✅') : '❌';
    const body = document.createElement('div');
    body.className = 'example-history-body';
    const prompt = document.createElement('span');
    prompt.className = 'example-history-prompt';
    prompt.innerHTML = h.prompt;
    body.appendChild(prompt);
    if (h.answer) {
      const answer = document.createElement('span');
      answer.className = 'example-history-answer';
      answer.innerHTML = 'Ответ: ' + h.answer;
      body.appendChild(answer);
    }
    row.appendChild(mark);
    row.appendChild(body);
    list.appendChild(row);
  });
}
document.getElementById('exampleHistoryToggle').onclick = () => {
  const panel = document.getElementById('exampleHistoryPanel');
  const willOpen = panel.style.display !== 'block';
  panel.style.display = willOpen ? 'block' : 'none';

};

function playMedalAnimation(tier) {
  const tray = document.getElementById('medalTray');
  const emoji = MEDAL_EMOJI[tier];
  const titleRect = els.taskTitle.getBoundingClientRect();
  const flyer = document.createElement('div');
  flyer.className = 'medal-flyer';
  flyer.textContent = emoji;
  flyer.style.left = (titleRect.left + titleRect.width / 2 - 22) + 'px';
  flyer.style.top = (titleRect.top - 10) + 'px';
  flyer.style.opacity = '0';
  flyer.style.transform = 'scale(.4)';
  document.body.appendChild(flyer);

  requestAnimationFrame(() => {
    flyer.style.opacity = '1';
    flyer.style.transform = 'scale(1.3)';
    setTimeout(() => {
      tray.classList.add('show');
      const trayRect = tray.getBoundingClientRect();
      const curRect = flyer.getBoundingClientRect();
      const dx = (trayRect.left + 24) - curRect.left;
      const dy = (trayRect.top + trayRect.height / 2 - 10) - curRect.top;
      flyer.style.transform = `translate(${dx}px, ${dy}px) scale(.5)`;
      flyer.style.opacity = '0.15';
      setTimeout(() => {
        flyer.remove();
        const icon = document.createElement('span');
        icon.className = 'medal-tray-icon';
        icon.textContent = emoji;
        icon.title = MEDAL_TITLE[tier];
        tray.appendChild(icon);
      }, 900);
    }, 650);
  });
}

function recordSolve() {
  const gotItRight = curProg.pickedIndex === curTask.correctIndex;
  curProg.history.unshift({ prompt: curTask.prompt, correct: gotItRight, hadError: !!curProg.hadWrongPick, answer: curTask.options[curTask.correctIndex] });
  curProg.history = curProg.history.slice(0, 5);
  curProg.solvedInBatch = (curProg.solvedInBatch || 0) + 1;

  let awardedTier = null;
  if (curProg.solvedInBatch >= 5) {
    const errs = curProg.errorsInBatch || 0;
    awardedTier = errs === 0 ? 'gold' : (errs <= 2 ? 'silver' : 'bronze');
    curProg.medals[awardedTier] = (curProg.medals[awardedTier] || 0) + 1;
    curProg.solvedInBatch = 0;
    curProg.errorsInBatch = 0;
  }
  saveProg(curMode, curProg);
  renderMedalBadges();
  renderExampleHistory();
  if (awardedTier) playMedalAnimation(awardedTier);
}

function renderPicker() {
  els.modesGrid.innerHTML = GROUPS.map(g => `
    <div class="group-title">${g.title}</div>
    <div class="modes">
      ${g.modes.map(m => {
        const p = loadProg(m.id);
        const meds = p && p.medals;
        const badges = meds ? ['gold', 'silver', 'bronze'].filter(t => meds[t]).map(t => `${MEDAL_EMOJI[t]}${meds[t]}`).join(' ') : '';
        return `<div class="mode-card" data-id="${m.id}"><div class="mtitle">${m.title}</div>${badges ? `<div class="mode-medals">${badges}</div>` : ''}</div>`;
      }).join('')}
    </div>
  `).join('');
  els.modesGrid.querySelectorAll('.mode-card').forEach(card => {
    card.onclick = () => { curMode = card.dataset.id; openTask(); };
  });
  // карточка «🎲 Случайно» живёт вне #modesGrid статично в разметке — её нужно
  // привязывать отдельно (раньше эта кнопка была нерабочей)
  const randomCard = document.querySelector('.mode-card.random[data-id]');
  if (randomCard) randomCard.onclick = () => { curMode = randomCard.dataset.id; openTask(); };
}

const COMING_SOON_TEXT = {
  learn: '🚧 Режим «Обучение» ещё в разработке. Здесь появится подробное объяснение решения — со всеми подсказками, шаг за шагом.',
  practice: '🚧 Режим «Тренировка» ещё в разработке. Здесь будут задания с частью подсказок — уже поменьше, чем в «Обучении».',
};

let curSubMode = 'exam';

function openTask() {
  els.picker.style.display = 'none';
  els.taskArea.style.display = 'block';
  const m = curMode === 'random' ? null : ALL_MODES.find(x => x.id === curMode);
  els.taskTitle.textContent = curMode === 'random' ? 'Случайно' : m.title;
  const showTypeNav = curMode !== 'random';
  els.prevTypeBtn.style.display = showTypeNav ? 'inline-flex' : 'none';
  els.nextTypeBtn.style.display = showTypeNav ? 'inline-flex' : 'none';
  curProg = (curMode !== 'random') ? loadProgOrFresh(curMode) : freshProg();

}
els.backBtn.onclick = () => {
  els.taskArea.style.display = 'none';
  els.picker.style.display = 'block';
  renderPicker();
};
function navigateType(delta){
  const idx = ALL_MODES.findIndex(x=>x.id===curMode);
  if(idx===-1) return; // в «случайно» стрелки скрыты
  const newIdx = (idx + delta + ALL_MODES.length) % ALL_MODES.length;
  curMode = ALL_MODES[newIdx].id;
  els.taskTitle.textContent = ALL_MODES[newIdx].title;
  curProg = loadProgOrFresh(curMode);
  renderMedalBadges();
  renderExampleHistory();
  resumeOrNewTask();
}
els.prevTypeBtn.onclick = ()=>navigateType(-1);
els.nextTypeBtn.onclick = ()=>navigateType(1);
els.refreshBtn.onclick = () => { if (curSubMode === 'exam') newTask(); };

els.basketAddBtn = document.getElementById('basketAddBtn');
els.basketAddBtn.onclick = () => {
  const rich = window.Basket ? window.Basket.extractFromSelectorsRich(['#questionPanel']) : null;

  window.Basket.add({ trainerId: 'oge11', modeTitle: els.taskTitle.textContent, text: rich.text, html: rich.html });

function switchSubMode(mode) {

  els.tabPractice.classList.toggle('active', mode === 'practice');

els.tabExam.onclick = () => switchSubMode('exam');

function renderCurrentTask() {
  els.questionPanel.style.display = 'block';
  els.questionPromptText.innerHTML = curTask.prompt;

  els.mcqOptions.innerHTML = curTask.options.map((opt, i) =>
    `<button class="mcq-btn" data-i="${i}"><span class="mlabel">${i + 1})</span><span>${opt}</span></button>`
  ).join('');
  els.changeAnswerBtn.style.display = 'none';
  attachMCQHandlers();

  els.mainPanel.style.display = 'none';
  els.explainBox.style.display = 'none';
  els.nextBtn.style.display = 'none';
}

function newTask() {
  const m = curMode === 'random' ? pick(ALL_MODES) : ALL_MODES.find(x => x.id === curMode);
  curTask = m.gen();
  taskAnswered = false;
  optionsLocked = false;
  hadWrongPick = false;

  window.scrollTo(0, 0);
  renderCurrentTask();

  if (curMode !== 'random') {
    curProg.task = curTask;
    curProg.answered = false;
    curProg.hadWrongPick = false;
    curProg.pickedIndex = null;
    saveProg(curMode, curProg);
  }
}

// при входе в прототип — восстановить последний пример (если есть), а не выдавать новый
function resumeOrNewTask() {
  if (curMode !== 'random' && curProg && curProg.task) {
    curTask = curProg.task;
    taskAnswered = !!curProg.answered;
    hadWrongPick = !!curProg.hadWrongPick;
    optionsLocked = taskAnswered;

    window.scrollTo(0, 0);
    renderCurrentTask();

    const btns = [...els.mcqOptions.querySelectorAll('.mcq-btn')];
    if (taskAnswered) {
      btns.forEach(b => { b.onclick = null; b.classList.add('disabled'); });
      if (typeof curProg.pickedIndex === 'number' && curProg.pickedIndex !== curTask.correctIndex && btns[curProg.pickedIndex]) {
        btns[curProg.pickedIndex].classList.add('wrong');
      }
      if (btns[curTask.correctIndex]) btns[curTask.correctIndex].classList.add('correct');
      finishTask(false);
    } else if (hadWrongPick && typeof curProg.pickedIndex === 'number') {
      optionsLocked = true;
      if (btns[curProg.pickedIndex]) btns[curProg.pickedIndex].classList.add('wrong');
      els.changeAnswerBtn.style.display = 'block';
    }
  } else {
    newTask();
  }
}

function attachMCQHandlers() {
  const btns = [...els.mcqOptions.querySelectorAll('.mcq-btn')];
  btns.forEach(b => {
    b.onclick = () => {
      if (optionsLocked || taskAnswered) return;
      optionsLocked = true;
      els.changeAnswerBtn.style.display = 'none';
      const i = Number(b.dataset.i);
      btns.forEach(x => { x.onclick = null; x.classList.add('disabled'); });
      if (i === curTask.correctIndex) {
        b.classList.add('correct');
        streak++; totalSolved++;
        els.stSolved.textContent = totalSolved;
        els.stStreak.textContent = streak;
        taskAnswered = true;
        if (curMode !== 'random') { curProg.answered = true; curProg.pickedIndex = i; saveProg(curMode, curProg); }
        finishTask();
      } else if (hadWrongPick) {
        b.classList.add('wrong');
        btns[curTask.correctIndex].classList.add('correct');
        streak = 0; totalErrors++;
        els.stErrors.textContent = totalErrors;
        els.stStreak.textContent = streak;
        taskAnswered = true;
        if (curMode !== 'random') { curProg.answered = true; curProg.pickedIndex = i; curProg.errorsInBatch = (curProg.errorsInBatch || 0) + 1; saveProg(curMode, curProg); }
        finishTask();
      } else {
        b.classList.add('wrong');
        hadWrongPick = true;
        streak = 0; totalErrors++;
        els.stErrors.textContent = totalErrors;
        els.stStreak.textContent = streak;
        els.changeAnswerBtn.style.display = 'block';
        if (curMode !== 'random') { curProg.hadWrongPick = true; curProg.pickedIndex = i; curProg.errorsInBatch = (curProg.errorsInBatch || 0) + 1; saveProg(curMode, curProg); }
      }
    };
  });
}

els.changeAnswerBtn.onclick = () => {
  if (taskAnswered) return;
  optionsLocked = false;
  const btns = [...els.mcqOptions.querySelectorAll('.mcq-btn')];
  btns.forEach(b => b.classList.remove('wrong', 'correct', 'disabled'));
  els.changeAnswerBtn.style.display = 'none';
  attachMCQHandlers();
};

function finishTask(isFreshSolve) {
  if (isFreshSolve === undefined) isFreshSolve = true;
  els.mainPanel.style.display = 'block';
  els.explainBox.style.display = 'block';
  els.explainBox.innerHTML = `<b>Решение:</b> ${curTask.explain}`;
  els.nextBtn.style.display = 'block';
  els.mainPanel.classList.remove('reveal');
  void els.mainPanel.offsetWidth;
  els.mainPanel.classList.add('reveal');

  if (isFreshSolve && curMode !== 'random') recordSolve();
}
els.nextBtn.onclick = newTask;

renderPicker();


/* ═══ Промпт №32: совместная работа не только на доске, но и в самом задании ═══
   Раньше в этом тренажёре в общий снимок состояния попадала только доска, и
   получалось нелепо: учитель открывал задание, а у ученика на экране
   оставался список типов — писать вместе было не над чем. Теперь
   синхронизируется то же, что и в ОГЭ №8: экран (выбор типа или задание),
   выбранный тип, режим и само текущее задание. Штрихи доски подмешиваются
   сюда же — общим снимком заведует session-share.js. */
function tsGetState(){
  const base = {
    // «на экране выбора» определяем по самому списку типов, а не по одной
    // конкретной области задания: в некоторых тренажёрах разные типы
    // открываются в разных областях, и признак по taskArea был бы неверным
    picker: els.picker.style.display !== 'none',
    curMode: typeof curMode !== 'undefined' ? curMode : null,
    curSubMode: typeof curSubMode !== 'undefined' ? curSubMode : null,
    curTask: typeof curTask !== 'undefined' ? curTask : null,
    taskAnswered: typeof taskAnswered !== 'undefined' ? !!taskAnswered : false,
    hadWrongPick: typeof hadWrongPick !== 'undefined' ? !!hadWrongPick : false,
  };
  if (window.__boardGetState) Object.assign(base, window.__boardGetState());
  if (window.__cardsGetState) Object.assign(base, window.__cardsGetState()); // Промпт №33 — добавленные примеры
  return base;
}
function tsApplyState(state){
  if (!state) return;
  // доска — независимо от того, на каком экране сейчас участник
  if (window.__boardApplyState) window.__boardApplyState(state);
  if (window.__cardsApplyState) window.__cardsApplyState(state); // Промпт №33
  if (typeof state.picker === 'undefined') return; // снимок без задания (пустая сессия)

  if (state.picker) {
    if (els.picker.style.display === 'none') {
      if (typeof showPicker === 'function') showPicker();
      else {
        els.taskArea.style.display = 'none';
        els.picker.style.display = 'block';
        if (typeof renderPicker === 'function') renderPicker();
      }
    }
    return;
  }
  if (els.picker.style.display !== 'none' || curMode !== state.curMode) {
    // тренажёры называют «открыть выбранный тип» по-разному: где-то это
    // openTask() при уже выставленном curMode, где-то startMode(id) —
    // берём то, что есть в этом файле
    if (typeof openTask === 'function') { curMode = state.curMode; openTask(); }
    else if (typeof startMode === 'function') { startMode(state.curMode); }
    else { curMode = state.curMode; }
  }
  if (typeof curSubMode !== 'undefined' && state.curSubMode && curSubMode !== state.curSubMode
      && typeof switchSubMode === 'function') {
    switchSubMode(state.curSubMode);
  }
  if (state.curTask) {
    // Промпт №31: перерисовываем только при настоящем изменении — иначе
    // каждый штрих собеседника заново проигрывал бы анимацию и дёргал экран
    const same = curTask
      && !!taskAnswered === !!state.taskAnswered
      && JSON.stringify(curTask) === JSON.stringify(state.curTask);
    if (!same) {
      curTask = state.curTask;
      taskAnswered = !!state.taskAnswered;
      if (typeof hadWrongPick !== 'undefined') hadWrongPick = !!state.hadWrongPick;
      renderCurrentTask();
    }
  }
}

window.__trainerState = { get: tsGetState, apply: tsApplyState,
  newTask: function(){ if (typeof newTask === 'function') newTask(); } };
if (window.TrainerSession) {
  window.TrainerSession.init({ trainer: 'oge11', getState: tsGetState, applyState: tsApplyState });
  if (els.answerInput) window.TrainerSession.registerField('main', els.answerInput);

  /* В ОГЭ №8 каждое действие само вызывает TrainerSession.push() — там эти
     вызовы расставлены по коду вручную. Здесь такой обвязки никогда не было,
     и добавлять её в каждую кнопку каждого тренажёра — верный способ
     что-нибудь пропустить. Поэтому просто следим за состоянием: как только
     оно изменилось (сменился экран, тип, режим или само задание) — рассылаем.
     Доска сюда не входит: её штрихи и так летят своим, живым каналом. */
  (function watchState(){
    let last = '';
    setInterval(() => {
      let sig;
      try {
        const s = tsGetState();
        sig = JSON.stringify([s.picker, s.curMode, s.curSubMode, s.curTask, s.taskAnswered, s.hadWrongPick]);
      } catch (e) { return; }
      if (sig === last) return;
      last = sig;
      window.TrainerSession.push();
    }, 300);
  })();
}
</script>



<script>
/* ─── плавная посадка блоков при изменении высоты .panel/.sheet ───
   Раньше при появлении подсказки/кнопки "дальше" панель ввода мгновенно
   скачком меняла высоту, а всё что ниже (статистика, теория) так же
   мгновенно дёргалось следом — расстояния оставались верными, но сам
   скачок выглядел "криво". ResizeObserver ловит ЛЮБОЕ изменение высоты
   независимо от того, какая функция его вызвала, и вместо мгновенного
   скачка красиво анимирует высоту — весь интерфейс ниже плавно
   "съезжает" на новое место, сохраняя одинаковый отступ всегда. */
function setupAutoHeightAnimation(el, duration){
  if(!el || typeof ResizeObserver==='undefined') return;
  duration = duration || 280;
  let lastH = null, resizing = false, settleTimer = null;
  const ro = new ResizeObserver(entries=>{
    if(resizing) return;
    const entry = entries[0];
    const cs = getComputedStyle(el);
    const newH = (entry.borderBoxSize && entry.borderBoxSize[0])
      ? entry.borderBoxSize[0].blockSize
      : entry.contentRect.height + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
    if(lastH===null){ lastH=newH; return; }
    if(Math.abs(newH-lastH)<1) return;
    const oldH = lastH;
    lastH = newH;
    resizing = true;
    el.style.height = oldH+'px';
    el.style.overflow = 'hidden';
    void el.offsetHeight;
    el.style.transition = 'height '+duration+'ms cubic-bezier(.4,0,.2,1)';
    requestAnimationFrame(()=>{ el.style.height = newH+'px'; });
    clearTimeout(settleTimer);
    settleTimer = setTimeout(()=>{
      el.style.transition = '';
      el.style.height = '';
      el.style.overflow = '';
      resizing = false;
      lastH = el.getBoundingClientRect().height;
    }, duration+50);
  });
  ro.observe(el);
}
const PANEL_ANIM_SELECTOR = '.panel:not(.calc-history-panel):not(.calc-panel):not(.example-history-panel):not(.coming-soon):not(.theory-block)';
document.querySelectorAll(PANEL_ANIM_SELECTOR).forEach(p=>setupAutoHeightAnimation(p));

</script>

<script>
/* ═══════════════ калькулятор в столбик («свой пример») ═══════════════
   Встраивает через iframe те же тренажёры сложения/вычитания/умножения/
   деления в столбик (файлы *_embed.html), чтобы часть примеров можно было
   решать вообще без использования тетради. Самостоятельный блок — не
   зависит от структуры els этого файла, ищет свои элементы напрямую. */
(function(){
  const CALC_OP_META = {
    add: { title: '➕ Сложение в столбик — свой пример', file: 'addition_embed.html' },
    sub: { title: '➖ Вычитание в столбик — свой пример', file: 'subtraction_embed.html' },
    mul: { title: '✖️ Умножение в столбик — свой пример', file: 'multiplication_embed.html' },
    div: { title: '➗ Деление в столбик — свой пример', file: 'division_embed.html' },
  };

  const calcPanel = document.getElementById('calcPanel');
  const calcPanelTitle = document.getElementById('calcPanelTitle');
  const calcIframe = document.getElementById('calcIframe');
  const calcPanelClose = document.getElementById('calcPanelClose');
  const calcHistoryBtn = document.getElementById('calcHistoryBtn');
  const calcHistoryPanel = document.getElementById('calcHistoryPanel');
  const calcHistoryClose = document.getElementById('calcHistoryClose');
  const calcHistoryList = document.getElementById('calcHistoryList');
  const calcHistoryEmpty = document.getElementById('calcHistoryEmpty');
  if (!calcPanel || !calcIframe) return; // блока калькулятора на странице нет — выходим тихо

  let calcResizeTimer = null;

  function openCalc(op) {
    calcPanel.style.display = 'block';
    calcPanelTitle.textContent = CALC_OP_META[op].title;
    calcIframe.style.height = '760px';
    calcIframe.src = `${CALC_OP_META[op].file}?embed=1`;
    document.querySelectorAll('.calc-tool-btn[data-op]').forEach(b => b.classList.toggle('active', b.dataset.op === op));
    calcPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    clearInterval(calcResizeTimer);
    calcResizeTimer = setInterval(fitCalcIframe, 400);
  }
  function fitCalcIframe() {
    if (!calcIframe || calcPanel.style.display === 'none') { clearInterval(calcResizeTimer); return; }
    try {
      const doc = calcIframe.contentWindow && calcIframe.contentWindow.document;
      if (doc && doc.documentElement) {
      const wrapEl = doc.querySelector('.wrap');
      const h = wrapEl ? wrapEl.getBoundingClientRect().height : Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
      if (h > 0) calcIframe.style.height = (Math.ceil(h) + 40) + 'px';
      }
    } catch (e) { /* кросс-доменные ограничения — оставляем текущую высоту */ }
  }
  function closeCalc() {
    calcPanel.style.display = 'none';
    calcIframe.src = 'about:blank';
    clearInterval(calcResizeTimer);
    document.querySelectorAll('.calc-tool-btn[data-op]').forEach(b => b.classList.remove('active'));
  }
  document.querySelectorAll('.calc-tool-btn[data-op]').forEach(btn => {
    btn.onclick = () => openCalc(btn.dataset.op);
  });
  if (calcPanelClose) calcPanelClose.onclick = closeCalc;
  calcIframe.addEventListener('load', fitCalcIframe);

  /* ─── история решений: копится за всё время, пока открыта страница ─── */
  let calcHistory = [];
  let calcHistoryNextId = 1;
  let calcHistoryFilter = 'all';

  function addCalcHistoryEntry(op, expr, result) {
    calcHistory.push({ id: calcHistoryNextId++, op, expr, result });
    if (calcHistoryPanel.style.display === 'block') renderCalcHistory();
  }
  function renderCalcHistory() {
    const items = calcHistoryFilter === 'all' ? calcHistory : calcHistory.filter(h => h.op === calcHistoryFilter);
    calcHistoryList.innerHTML = '';
    calcHistoryEmpty.style.display = items.length ? 'none' : 'block';
    items.slice().reverse().forEach(h => {
      const row = document.createElement('div');
      row.className = 'calc-history-row';
      const num = document.createElement('span');
      num.className = 'calc-history-num';
      num.textContent = '№' + h.id;
      const expr = document.createElement('span');
      expr.className = 'calc-history-expr';
      expr.textContent = h.expr;
      const copyBtn = document.createElement('button');
      copyBtn.className = 'calc-history-copy';
      copyBtn.textContent = '⧉ ' + h.result;
      copyBtn.title = 'Скопировать результат';
      copyBtn.onclick = () => copyCalcResult(h.result, copyBtn);
      row.appendChild(num);
      row.appendChild(expr);
      row.appendChild(copyBtn);
      calcHistoryList.appendChild(row);
    });
  }
  function copyCalcResult(result, btn) {
    const done = () => {
      btn.textContent = '✓ скопировано';
      setTimeout(() => { btn.textContent = '⧉ ' + result; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(String(result)).then(done).catch(done);
    } else {
      done();
    }
  }
  function toggleCalcHistory() {
    const willOpen = calcHistoryPanel.style.display !== 'block';
    calcHistoryPanel.style.display = willOpen ? 'block' : 'none';
    calcHistoryBtn.classList.toggle('active', willOpen);
    if (willOpen) {
      renderCalcHistory();
      calcHistoryPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }
  function closeCalcHistory() {
    calcHistoryPanel.style.display = 'none';
    calcHistoryBtn.classList.remove('active');
  }
  document.querySelectorAll('.calc-history-filter').forEach(btn => {
    btn.onclick = () => {
      calcHistoryFilter = btn.dataset.filter;
      document.querySelectorAll('.calc-history-filter').forEach(b => b.classList.toggle('active', b === btn));
      renderCalcHistory();
    };
  });
  if (calcHistoryBtn) calcHistoryBtn.onclick = toggleCalcHistory;
  if (calcHistoryClose) calcHistoryClose.onclick = closeCalcHistory;

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (d && d.source === 'oge-calc-history' && d.op && d.expr && d.result !== undefined) {
      addCalcHistoryEntry(d.op, d.expr, d.result);
    }
  });
})();
</script>
