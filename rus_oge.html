<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E1A">
<script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОГЭ. Русский язык — задания ФИПИ</title>
<link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="onest.css">
<style>
/* Токены — те же, что у тренажёров по математике (oge19.html), кроме акцента:
   у русского языка свой тон, как на макете новой главной, чтобы по цвету было
   сразу видно, в каком предмете находишься. Всё остальное стекло — общее. */
:root{
  --font-ui:'Onest',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --bg:#EEF1F7;
  --blob-1:rgba(194,64,95,.14);
  --blob-2:rgba(190,150,230,.14);
  --card:rgba(255,255,255,.8);
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.85);
  --glass-inset:rgba(255,255,255,.55);
  --muted-1:#8E8E93;
  --muted-2:#6E6E73;
  --muted-3:#48484A;
  --muted-4:#3A3A3C;
  --muted-5:#1D1D1F;
  --muted-6:#8E8E93;
  --ink:#9E2A47;
  --ink-2:#C2405F;
  --pencil:#1D1D1F;
  --teacher:#D70015;
  --bad-tint:rgba(215,0,21,.08);
  --ok:#248A3D;
  --ok-tint:rgba(36,138,61,.1);
  --ok-shadow:rgba(36,138,61,.3);
  --shadow:0 10px 34px rgba(20,30,60,.08);
  --hl-10:rgba(158,42,71,.09);
  --text-bg:rgba(255,255,255,.66);
}
html[data-theme="dark"]{
  --bg:#0B0E1A;
  --blob-1:rgba(194,64,95,.2);
  --blob-2:rgba(150,90,220,.18);
  --card:rgba(30,37,64,.82);
  --glass:rgba(40,46,74,.5);
  --glass-strong:rgba(46,53,84,.65);
  --glass-border:rgba(255,255,255,.12);
  --glass-inset:rgba(255,255,255,.07);
  --ink:#D25A76;
  --ink-2:#E07390;
  --pencil:#F2F3F5;
  --teacher:#FF6961;
  --bad-tint:rgba(255,105,97,.12);
  --ok:#4CB872;
  --ok-tint:rgba(76,184,114,.14);
  --ok-shadow:rgba(62,142,91,.35);
  --shadow:0 10px 40px rgba(0,0,0,.55);
  --hl-10:rgba(210,90,118,.16);
  --text-bg:rgba(20,25,44,.6);
  --muted-1:#9A9AA2;
  --muted-2:#9A9AA2;
  --muted-3:#AEAEB4;
  --muted-4:#C7C7CC;
  --muted-5:#F2F3F5;
  --muted-6:#9A9AA2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    var(--bg);
  font-family:var(--font-ui);
  color:var(--pencil);
  min-height:100vh;
  padding:18px 12px 60px;
}
.wrap{max-width:820px;margin:0 auto}
h1{font-weight:700;letter-spacing:-.02em;font-size:clamp(24px,5vw,34px);text-align:center;}
.sub{font-weight:500;text-align:center;color:var(--muted-2);font-size:15px;margin:4px 0 22px;}
/* на телефоне угловые кнопки сходятся к заголовку — даём им свою строку */
@media (max-width:620px){ body{padding-top:66px} }
.home-btn,.theme-toggle{position:fixed;top:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:60;color:var(--ink);font-size:18px;text-decoration:none;transition:transform .15s;}
.home-btn{left:16px}
.theme-toggle{right:16px}
.home-btn:hover,.theme-toggle:hover{border-color:var(--ink)}
.home-btn:active,.theme-toggle:active{transform:scale(.92)}

.modes{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.section-title{font-weight:700;font-size:13px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;margin:14px 4px 4px;}
.mode-card{
  display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;text-align:left;width:100%;
  background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-border);border-radius:14px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);
  padding:11px 18px;cursor:pointer;transition:transform .12s, border-color .12s;font-family:var(--font-ui);color:var(--pencil);
}
.mode-card:hover:not(:disabled){border-color:var(--ink);transform:translateX(3px)}
.mode-card:disabled{cursor:default;opacity:.62}
a.mode-card{text-decoration:none;box-sizing:border-box}
.mode-card .mtitle{font-weight:600;font-size:15px;line-height:1.3;flex:1 1 260px;}
.mode-card .msub{font-size:13px;font-weight:500;color:var(--muted-3);flex:1 1 100%;}
.mode-card .mprog{font-size:13px;font-weight:600;color:var(--ok);}
.mode-card .mbad{font-size:13px;font-weight:600;color:var(--teacher);}
.mode-card.all-card .mtitle{font-weight:700}
.picker-head{display:flex;margin-bottom:4px}

.task-head{display:flex;flex-wrap:wrap;row-gap:8px;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.corner{display:flex;flex-wrap:wrap;row-gap:6px;align-items:center;gap:8px;}
.task-title{font-weight:600;font-size:15px;color:var(--muted-3)}
.back-btn,.nav-btn{font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s,border-color .15s;}
.nav-btn{padding:8px 12px;min-width:40px}
.back-btn:hover,.nav-btn:hover:not(:disabled){border-color:var(--ink)}
.back-btn:active,.nav-btn:active{transform:scale(.96)}
.nav-btn:disabled{opacity:.4;cursor:default}

.submode-tabs{display:flex;gap:8px;margin-bottom:14px;}
.submode-tab{flex:1;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--muted-3);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:10px 6px;cursor:pointer;text-align:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .15s,border-color .15s;}
.submode-tab:hover{border-color:var(--ink);}
.submode-tab:active{transform:scale(.96)}
.submode-tab.active{color:#fff;background:linear-gradient(135deg,var(--ink-2),var(--ink));border-color:var(--ink);}
.mode-hint{font-size:13px;font-weight:500;color:var(--muted-2);margin:-6px 4px 12px;}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:100px;background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;padding:10px 12px;text-align:center;}
@media(max-width:359px){.stat{min-width:0}}
.stat .v{font-weight:700;font-size:20px;color:var(--ink);}
.stat .l{font-weight:500;font-size:12px;color:var(--muted-6);}

.panel{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:22px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);padding:20px;margin-bottom:14px;}
@keyframes revealUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.panel.reveal{animation:revealUp .38s cubic-bezier(.22,.9,.35,1) both;}

/* Общий текст к №2, 3, 10–12. Длинный (до 70 предложений), поэтому живёт в своём
   окне с прокруткой: иначе задание уезжало бы на несколько экранов вниз от текста,
   а ученику нужно постоянно сверяться с номерами предложений. */
.text-box{background:var(--text-bg);border:1px solid var(--glass-border);border-radius:16px;margin-bottom:16px;}
.text-box summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.text-box summary::-webkit-details-marker{display:none}
.text-box summary::after{content:'свернуть';font-weight:500;font-size:12.5px;color:var(--muted-2)}
.text-box:not([open]) summary::after{content:'показать'}
.text-body{padding:0 16px 14px;max-height:46vh;overflow:auto;font-size:15.5px;line-height:1.6;color:var(--muted-5);}
.text-body p{margin:0 0 6px}

.q{font-weight:500;font-size:clamp(16px,2.6vw,18px);color:var(--muted-5);line-height:1.55;margin-bottom:14px;}
.q p{margin:0 0 6px}
.q table{border-collapse:collapse;width:100%;margin:6px 0}
.q td{padding:3px 6px;vertical-align:top}
.q sup{font-size:.7em;color:var(--ink);font-weight:700}
/* шапки колонок, продублированные внутрь колонок (см. stackHeads): на широком
   экране их показывает строка-шапка, на телефоне — эти копии над каждой колонкой */
.q .col-head{display:none;margin:10px 0 4px}
/* №4 у ФИПИ свёрстан таблицей в две колонки (правила | предложения). На телефоне
   две колонки не помещаются — ставим колонки друг под другом, а сами пары
   «А) правило» внутри оставляем строками. :has — чтобы не трогать мелкие таблицы */
@media (max-width:620px){
  .q tr:has(> td > table){display:flex;flex-direction:column}
  .q tr:has(> td > table) > td{display:block;width:auto}
  .q td{overflow-wrap:break-word}
  .q tr.col-heads{display:none}
  .q .col-head{display:block}
}

.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;font-family:var(--font-ui);font-size:15px;line-height:1.45;color:var(--pencil);background:var(--card);border:1.5px solid var(--glass-border);border-radius:14px;padding:11px 14px;cursor:pointer;transition:border-color .12s, background .12s;}
.opt p{margin:0}
.opt .onum{font-weight:700;color:var(--muted-1);flex:0 0 auto;min-width:20px}
.opt .obox{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted-1);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.picked{border-color:var(--ink);background:var(--hl-10);}
.opt.picked .obox{background:var(--ink);border-color:var(--ink);}
.opt.picked .obox::after{content:'✓'}
.opt.correct{border-color:var(--ok);background:var(--ok-tint);}
.opt.wrong{border-color:var(--teacher);background:var(--bad-tint);}
.opt:disabled{cursor:default}

.match{display:flex;gap:10px;flex-wrap:wrap;}
.match label{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:16px;color:var(--muted-3);}
.match select{font-family:var(--font-ui);font-size:17px;font-weight:600;color:var(--pencil);background:var(--card);border:1.5px solid var(--glass-border);border-radius:12px;padding:9px 12px;min-width:72px;cursor:pointer;}
.match select:focus{outline:none;border-color:var(--ink)}

.answer-row{display:flex;flex-direction:column;gap:6px;}
.answer-label{font-weight:600;font-size:14px;color:var(--muted-3);}
.answer-input{font-family:var(--font-ui);font-size:18px;font-weight:500;color:var(--pencil);background:var(--card);border:1.5px solid var(--glass-border);border-radius:14px;padding:12px 14px;width:100%;}
.answer-input:focus{outline:none;border-color:var(--ink)}
.answer-input.correct{border-color:var(--ok);background:var(--ok-tint)}
.answer-input.wrong{border-color:var(--teacher);background:var(--bad-tint)}
.answer-hint{font-size:12.5px;font-weight:500;color:var(--muted-2);}

.check-btn,.next-btn{font-family:var(--font-ui);font-weight:600;font-size:16px;color:#fff;border:none;border-radius:14px;padding:13px 26px;cursor:pointer;width:100%;margin-top:14px;transition:transform .15s;}
.check-btn{background:linear-gradient(135deg,var(--ink-2),var(--ink));}
.next-btn{background:var(--ok);box-shadow:0 6px 18px var(--ok-shadow);}
.check-btn:active,.next-btn:active{transform:scale(.98)}
.check-btn:disabled{opacity:.5;cursor:default}
.feedback{font-weight:600;font-size:15px;margin-top:12px;line-height:1.45;}
.feedback.bad{color:var(--teacher)}
.feedback.good{color:var(--ok)}
.answer-box{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--ok-tint);border:1px solid var(--ok);font-size:15px;line-height:1.5;color:var(--pencil);}
.answer-box b{color:var(--ok)}
.sol-row{display:flex;margin-top:12px;}
.soft-btn{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:11px;padding:9px 14px;cursor:pointer;transition:transform .15s,border-color .15s;}
.soft-btn:hover{border-color:var(--ink)}
.soft-btn:active{transform:scale(.96)}
/* подпись источника — мелко и спокойно: она для честности, а не для ученика */
.source-note{font-weight:500;font-size:12.5px;color:var(--muted-3);margin-top:14px;}
.unchecked-tag{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:600;color:var(--teacher);}
.empty{font-weight:500;font-size:15px;color:var(--muted-3);text-align:center;padding:30px 16px;line-height:1.5;}
</style>
</head>
<body>
<!-- ?subject=rus: главная открывается сразу на русском, даже если ученик пришёл
     по прямой ссылке и на главной ещё не выбирал предмет -->
<a class="home-btn" id="homeBtn" href="index.html?subject=rus" title="Ко всем тренажёрам" aria-label="Ко всем тренажёрам">←</a>
<button class="theme-toggle" id="themeToggle" title="Светлая/тёмная тема" aria-label="Переключить тему">🌙</button>
<script>(function(){
  var btn=document.getElementById('themeToggle');
  function apply(t, persist){
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    if (persist) { try{ localStorage.setItem('theme', t); }catch(e){} }
  }
  apply(document.documentElement.getAttribute('data-theme') || 'light', false);
  btn.addEventListener('click', function(){
    apply(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
  });
})();</script>

<div class="wrap">
  <h1>ОГЭ. Русский язык</h1>
  <div class="sub" id="pageSub">задания из открытого банка ФИПИ</div>

<script src="rus-oge-fipi.js"></script>
<script>
(function(){
'use strict';
// ── Настройки ────────────────────────────────────────────────────────────────
// Сколько попыток даёт «Экзамен». Даниил просил «3–4»; взяли 3 — столько же
// решает средний ученик за разумное время, и это одна правка, если захочется 4.
const EXAM_ATTEMPTS = 3;

// Названия номеров — по демоверсии ФИПИ (структура ОГЭ-2026/2027: 13 заданий;
// №1 изложение и №13 сочинение — на отдельных страницах rus_oge01.html и rus_oge13.html).
const NUMS = [
  {n:2,  title:'Грамматическая основа', part:2},
  {n:3,  title:'Характеристики предложений', part:2},
  {n:4,  title:'Пунктуационные правила', part:2},
  {n:5,  title:'Расстановка запятых', part:2},
  {n:6,  title:'Объяснение написания', part:2},
  {n:7,  title:'Пропущенные буквы', part:2},
  {n:8,  title:'Формы слова', part:2},
  {n:9,  title:'Замена словосочетания', part:2},
  {n:10, title:'Содержание текста', part:2},
  {n:11, title:'Средства выразительности', part:2},
  {n:12, title:'Лексический анализ', part:2},
];
// подсказка о форме ответа — как в бланке ОГЭ
const HINTS = {
  5: 'Цифры без пробелов и запятых, в любом порядке',
  7: 'Цифры без пробелов и запятых, в любом порядке',
  8: 'Одно слово',
  9: 'Словосочетание',
  12: 'Слово или слова — как просят в задании',
};

const DATA = window.RUS_OGE_FIPI || {tasks:[], texts:{}};
const params = new URLSearchParams(location.search);
// ?all=1 — предпросмотр для преподавателя: показать и задания, чей ответ ФИПИ ещё
// не подтвердил. Ученику по умолчанию — только подтверждённые: неверный ключ хуже,
// чем меньше заданий.
const SHOW_ALL = params.get('all') === '1';
const POOL = {};
DATA.tasks.forEach(t => {
  if (!SHOW_ALL && !t.ok) return;
  (POOL[t.n] = POOL[t.n] || []).push(t);
});
// Подтемы внутри номера (по списку преподавателя русского): DATA.topics[n] — порядок и
// названия, у задания tp — его подтемы. Задание может попасть в несколько подтем (в №3–4
// одно задание бывает сразу про ССП и про вводные слова), поэтому tp — массив.
// Номер без подтем открывается сразу заданиями, как раньше.
const TOPICS = DATA.topics || {};
function topicsOf(n){
  // подтему без подтверждённых заданий не показываем: кнопка в пустоту хуже, чем её нет
  return (TOPICS[n] || []).filter(tp => (POOL[n] || []).some(t => (t.tp || []).includes(tp.id)));
}
function listOf(n, topic){
  const all = POOL[n] || [];
  return topic ? all.filter(t => (t.tp || []).includes(topic)) : all;
}

// ── Память ───────────────────────────────────────────────────────────────────
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
// итог по заданию: ok — решено верно, bad — не решено (попытки кончились),
// shown — подсмотрен ответ в «Тренировке» (в «верно» не идёт)
let results = LS.get('rusOge:results', {});
let mode = LS.get('rusOge:mode', 'exam');

// ── Состояние экрана ────────────────────────────────────────────────────────
const S = { screen:'picker', n:null, topic:null, list:[], idx:0, picked:new Set(), tries:0, done:false, revealed:false, last:null };

const $ = id => document.getElementById(id);

// ── Нормализация ответов ────────────────────────────────────────────────────
function normText(s){
  return String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[\s.,;:!?«»"'()]+/g, '');
}
// №5 и №7: в бланке цифры принимаются в любом порядке
function normDigits(s){
  return Array.from(new Set(String(s || '').replace(/\D/g, '').split(''))).sort().join('');
}
function isDigitsTask(t){ return t.k === 'text' && (t.n === 5 || t.n === 7); }

function maskToNums(mask){
  const out = [];
  String(mask).split('').forEach((c, i) => { if (c === '1') out.push(i + 1); });
  return out;
}
function answerText(t){
  if (t.k === 'mask') return maskToNums(t.a).join(', ');
  if (t.k === 'match'){
    const L = ['А', 'Б', 'В', 'Г', 'Д'];
    return String(t.a).split('').map((d, i) => L[i] + ' — ' + d).join(', ') + ' (в бланк: ' + t.a + ')';
  }
  return t.a;
}

function checkAnswer(t, value){
  if (t.k === 'mask' || t.k === 'match') return value === t.a;
  if (isDigitsTask(t)) return normDigits(value) !== '' && normDigits(value) === normDigits(t.a);
  const v = normText(value);
  if (!v) return false;
  return [t.a].concat(t.alt || []).some(x => normText(x) === v);
}

// ── Экран выбора номера ─────────────────────────────────────────────────────
function renderPicker(){
  $('pickerArea').style.display = '';
  $('taskArea').style.display = 'none';
  $('pageSub').textContent = 'задания из открытого банка ФИПИ';
  const grid = $('modesGrid');
  const total = DATA.tasks.length;
  const okCount = DATA.tasks.filter(t => t.ok).length;
  let html = '<div class="section-title">Часть 2 — краткий ответ</div>';
  NUMS.forEach(m => {
    const list = POOL[m.n] || [];
    const solved = list.filter(t => results[t.id] === 'ok').length;
    const all = DATA.tasks.filter(t => t.n === m.n).length;
    let sub;
    if (!list.length) sub = all ? `${all} заданий · ответы ещё сверяются с сайтом ФИПИ` : 'скоро';
    else sub = SHOW_ALL ? `${list.length} заданий (предпросмотр, вместе с несверенными)` : `${list.length} заданий · ответы подтверждены сайтом ФИПИ`;
    const tc = topicsOf(m.n).length;
    if (list.length && tc) sub += ` · ${tc} ${plural(tc, 'тема', 'темы', 'тем')}`;
    html += `<button class="mode-card" data-n="${m.n}"${list.length ? '' : ' disabled'}>
      <span class="mtitle">№${m.n}. ${m.title}</span>
      ${solved ? `<span class="mprog">✓ ${solved} из ${list.length}</span>` : ''}
      <span class="msub">${sub}</span></button>`;
  });
  // №1 и №13 живут на своих страницах (там аудио или темы, черновик и образцы), отсюда — ссылки
  html += '<div class="section-title">Изложение и сочинение</div>' +
    '<a class="mode-card" id="izlLink" href="rus_oge01.html"><span class="mtitle">№1. Сжатое изложение</span>' +
    '<span class="msub">43 аудиозаписи ФИПИ · микротемы, самопроверка и образцы</span></a>' +
    '<a class="mode-card" id="essayLink" href="rus_oge13.html"><span class="mtitle">№13. Сочинение-рассуждение</span>' +
    '<span class="msub">99 текстов ФИПИ · темы 13.1–13.3, самопроверка и образцы</span></a>';
  grid.innerHTML = html;
  grid.querySelectorAll('.mode-card[data-n]').forEach(b => b.addEventListener('click', () => {
    const n = +b.dataset.n;
    topicsOf(n).length ? renderTopics(n) : openNumber(n);
  }));
  if (!SHOW_ALL && okCount < total) {
    $('pageSub').textContent = `задания из открытого банка ФИПИ · сверено с ФИПИ ${okCount} из ${total}`;
  }
}

function plural(k, one, few, many){
  const a = k % 10, b = k % 100;
  return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
}
// счёт по списку заданий: сколько решено верно и сколько провалено — по подтемам это
// и есть подсказка репетитору, что повторять с учеником
function tally(list){
  let ok = 0, bad = 0;
  list.forEach(t => { if (results[t.id] === 'ok') ok++; else if (results[t.id] === 'bad') bad++; });
  return {ok, bad};
}
function progSpans(list){
  const c = tally(list);
  return (c.ok ? `<span class="mprog">✓ ${c.ok} из ${list.length}</span>` : '') +
    (c.bad ? `<span class="mbad">✗ ${c.bad}</span>` : '');
}

// ── Экран подтем номера ─────────────────────────────────────────────────────
function renderTopics(n){
  const meta = NUMS.find(m => m.n === n);
  S.screen = 'topics'; S.n = n; S.topic = null;
  $('pickerArea').style.display = '';
  $('taskArea').style.display = 'none';
  $('pageSub').textContent = `№${n}. ${meta.title}`;
  const url = new URL(location.href);
  url.searchParams.set('n', n); url.searchParams.delete('t'); url.searchParams.delete('tp');
  history.replaceState(null, '', url);
  const all = POOL[n] || [];
  let html = '<div class="picker-head"><button class="back-btn" id="topicsBack">← все номера</button></div>';
  html += `<button class="mode-card all-card" data-tp="">
    <span class="mtitle">Все задания №${n} вперемешку</span>${progSpans(all)}
    <span class="msub">${all.length} заданий</span></button>`;
  html += '<div class="section-title">По темам</div>';
  topicsOf(n).forEach(tp => {
    const list = listOf(n, tp.id);
    html += `<button class="mode-card" data-tp="${tp.id}">
      <span class="mtitle">${escapeHTML(tp.title)}</span>${progSpans(list)}
      <span class="msub">${list.length} ${plural(list.length, 'задание', 'задания', 'заданий')}</span></button>`;
  });
  const grid = $('modesGrid');
  grid.innerHTML = html;
  $('topicsBack').addEventListener('click', goPicker);
  grid.querySelectorAll('.mode-card[data-tp]').forEach(b => b.addEventListener('click', () => openNumber(n, null, b.dataset.tp || null)));
}

// ── Номер и задание ─────────────────────────────────────────────────────────
function openNumber(n, id, topic){
  if (topic && !topicsOf(n).some(tp => tp.id === topic)) topic = null;
  const list = listOf(n, topic);
  if (!list.length) return;
  S.screen = 'task'; S.n = n; S.topic = topic || null; S.list = list;
  let idx = id ? list.findIndex(t => t.id === id) : -1;
  if (idx < 0) {
    // возвращаемся туда, где остановились, а если номер новый — к первому нерешённому;
    // у каждой подтемы своё «где остановились», иначе вход в тему прыгал бы в чужую
    const last = LS.get(lastKey(), null);
    idx = last ? list.findIndex(t => t.id === last) : -1;
    if (idx < 0) idx = Math.max(0, list.findIndex(t => !results[t.id]));
  }
  openTask(idx);
}

function lastKey(){ return 'rusOge:last:' + S.n + (S.topic ? ':' + S.topic : ''); }

function openTask(idx){
  const list = S.list;
  S.idx = (idx + list.length) % list.length;
  S.picked = new Set(); S.tries = 0; S.done = false; S.revealed = false; S.last = null;
  const t = list[S.idx];
  LS.set(lastKey(), t.id);
  const url = new URL(location.href);
  url.searchParams.set('n', S.n); url.searchParams.set('t', t.id);
  if (S.topic) url.searchParams.set('tp', S.topic); else url.searchParams.delete('tp');
  history.replaceState(null, '', url);
  renderTask(true);
}

function curTask(){ return S.list[S.idx]; }
function topicTitle(){
  const tp = S.topic && (TOPICS[S.n] || []).find(x => x.id === S.topic);
  return tp ? tp.title : '';
}

function renderTask(animate){
  const t = curTask();
  const meta = NUMS.find(m => m.n === S.n);
  $('pickerArea').style.display = 'none';
  $('taskArea').style.display = '';
  $('pageSub').textContent = `№${S.n}. ${meta.title}` + (S.topic ? ` · ${topicTitle()}` : '');
  $('taskTitle').textContent = `задание ${S.idx + 1} из ${S.list.length}`;
  $('backBtn').textContent = topicsOf(S.n).length ? '← темы' : '← все задания';
  $('tabPractice').classList.toggle('active', mode === 'practice');
  $('tabExam').classList.toggle('active', mode === 'exam');
  $('modeHint').textContent = mode === 'exam'
    ? `${EXAM_ATTEMPTS} попытки на задание, ответ открывается после последней`
    : 'Сколько угодно попыток и кнопка «Показать ответ»';
  renderStats();

  const P = $('questionPanel');
  let html = '';
  if (t.t && DATA.texts[t.t]) {
    html += `<details class="text-box" open><summary>Текст</summary><div class="text-body">${DATA.texts[t.t]}</div></details>`;
  }
  html += `<div class="q">${t.q}</div>`;

  if (t.k === 'mask') {
    html += '<div class="opts" id="opts">' + (t.o || []).map((o, i) =>
      `<button class="opt" data-i="${i}" type="button"><span class="obox"></span><span class="onum">${i + 1})</span><span class="otext">${o}</span></button>`).join('') + '</div>';
  } else if (t.k === 'match') {
    const L = ['А', 'Б', 'В', 'Г', 'Д'];
    const cnt = String(t.a).length;
    html += '<div class="answer-label" style="margin-bottom:8px">Ответ:</div><div class="match" id="match">' +
      Array.from({length: cnt}, (_, i) => `<label>${L[i]}<select data-i="${i}"><option value="">—</option>${[1,2,3,4,5].map(d => `<option value="${d}">${d}</option>`).join('')}</select></label>`).join('') + '</div>';
  } else {
    html += `<div class="answer-row"><label class="answer-label" for="answerInput">Ответ:</label>
      <input class="answer-input" id="answerInput" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="${isDigitsTask(t) ? 'numeric' : 'text'}">
      ${HINTS[t.n] ? `<div class="answer-hint">${HINTS[t.n]}</div>` : ''}</div>`;
  }

  html += '<button class="check-btn" id="checkBtn">Проверить</button>';
  html += '<div class="feedback" id="feedback"></div>';
  html += '<div id="answerBox"></div>';
  if (mode === 'practice') html += '<div class="sol-row" id="solRow"><button class="soft-btn" id="showBtn">Показать ответ</button></div>';
  html += '<button class="next-btn" id="nextBtn" style="display:none">Следующее задание →</button>';
  html += `<div class="source-note">Источник: открытый банк заданий ФИПИ, задание ${t.id}${t.ok ? '' : '<span class="unchecked-tag">ответ ещё не сверен с ФИПИ</span>'}</div>`;
  P.innerHTML = html;
  stackHeads(P.querySelector('.q'));
  if (animate) { P.classList.remove('reveal'); void P.offsetWidth; P.classList.add('reveal'); }

  if (t.k === 'mask') {
    P.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      if (S.done) return;
      const i = +b.dataset.i;
      S.picked.has(i) ? S.picked.delete(i) : S.picked.add(i);
      b.classList.toggle('picked', S.picked.has(i));
      clearMarks();
    }));
  } else if (t.k === 'match') {
    P.querySelectorAll('#match select').forEach(s => s.addEventListener('change', clearMarks));
  } else {
    const inp = $('answerInput');
    inp.addEventListener('input', clearMarks);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runCheck(); } });
  }
  $('checkBtn').addEventListener('click', runCheck);
  $('nextBtn').addEventListener('click', () => openTask(S.idx + 1));
  if ($('showBtn')) $('showBtn').addEventListener('click', toggleReveal);
}

// В №4 строка-шапка («ПУНКТУАЦИОННЫЕ ПРАВИЛА | ПРЕДЛОЖЕНИЯ») стоит отдельной
// строкой над колонками. На телефоне колонки встают друг под другом, и шапка
// оторвалась бы от своей колонки — поэтому кладём копию шапки внутрь колонки.
function stackHeads(q){
  if (!q) return;
  q.querySelectorAll('tr').forEach(tr => {
    const cells = Array.from(tr.children);
    if (cells.filter(td => td.querySelector('table')).length < 2) return;
    const head = tr.previousElementSibling;
    if (!head || head.querySelector('table')) return;
    const hc = Array.from(head.children);
    cells.forEach((td, i) => {
      if (!td.querySelector('table') || !hc[i] || !hc[i].textContent.trim()) return;
      const d = document.createElement('div');
      d.className = 'col-head';
      d.innerHTML = hc[i].innerHTML;
      td.prepend(d);
    });
    head.classList.add('col-heads');
  });
}

// после правки ответа прошлая красная подсветка уже не про этот ответ
function clearMarks(){
  if (S.done) return;
  const P = $('questionPanel');
  P.querySelectorAll('.opt.wrong').forEach(b => b.classList.remove('wrong'));
  const inp = $('answerInput'); if (inp) inp.classList.remove('wrong');
  const fb = $('feedback'); if (fb.classList.contains('bad')) { fb.textContent = ''; fb.className = 'feedback'; }
}

function currentValue(){
  const t = curTask();
  if (t.k === 'mask') return (t.o || []).map((_, i) => S.picked.has(i) ? '1' : '0').join('');
  if (t.k === 'match') return Array.from($('questionPanel').querySelectorAll('#match select')).map(s => s.value || '0').join('');
  return $('answerInput').value;
}
function isEmpty(v){
  const t = curTask();
  if (t.k === 'mask') return !v.includes('1');
  if (t.k === 'match') return /0/.test(v);
  return !String(v).trim();
}

function runCheck(){
  if (S.done) return;
  const t = curTask();
  const v = currentValue();
  const fb = $('feedback');
  if (isEmpty(v)) {
    fb.className = 'feedback bad';
    fb.textContent = t.k === 'match' ? 'Выбери цифру для каждой буквы' : t.k === 'mask' ? 'Отметь хотя бы один вариант' : 'Впиши ответ';
    return;
  }
  S.tries++;
  if (checkAnswer(t, v)) {
    finish(S.revealed ? 'shown' : 'ok');
    fb.className = 'feedback good';
    fb.textContent = S.revealed ? 'Верно — но ответ был подсмотрен' : 'Верно!';
    return;
  }
  markWrong(t, v);
  if (mode === 'exam' && S.tries >= EXAM_ATTEMPTS) {
    finish('bad');
    fb.className = 'feedback bad';
    fb.textContent = 'Попытки закончились.';
    return;
  }
  fb.className = 'feedback bad';
  fb.textContent = mode === 'exam'
    ? `Неверно. Осталось попыток: ${EXAM_ATTEMPTS - S.tries}`
    : 'Неверно. Попробуй ещё раз или посмотри ответ';
}

function markWrong(t, v){
  if (t.k === 'mask') {
    // красным — только отмеченные лишние: недостающие не подсвечиваем, иначе
    // одна ошибка выдала бы весь ответ ещё до конца попыток
    $('questionPanel').querySelectorAll('.opt').forEach(b => {
      const i = +b.dataset.i;
      if (S.picked.has(i) && t.a[i] !== '1') b.classList.add('wrong');
    });
  } else if (t.k === 'text') {
    $('answerInput').classList.add('wrong');
  }
}

function finish(kind){
  const t = curTask();
  S.done = true;
  // итог задания пишем один раз: повторный заход в уже решённое задание не
  // должен ни добавлять «верно», ни портить прошлый результат
  if (!results[t.id]) { results[t.id] = kind; LS.set('rusOge:results', results); }
  $('checkBtn').disabled = true;
  const P = $('questionPanel');
  if (t.k === 'mask') {
    P.querySelectorAll('.opt').forEach(b => {
      const i = +b.dataset.i;
      b.disabled = true;
      if (t.a[i] === '1') b.classList.add('correct');
      else if (S.picked.has(i)) b.classList.add('wrong');
    });
  } else if (t.k === 'match') {
    P.querySelectorAll('#match select').forEach(s => s.disabled = true);
  } else {
    const inp = $('answerInput');
    inp.readOnly = true;
    inp.classList.remove('wrong');
    inp.classList.add(kind === 'bad' ? 'wrong' : 'correct');
  }
  if ($('solRow')) $('solRow').style.display = 'none';
  if (kind !== 'ok' && !S.revealed) showAnswer();
  $('nextBtn').style.display = '';
  renderStats();
}

function showAnswer(){
  $('answerBox').innerHTML = `<div class="answer-box">Ответ: <b>${escapeHTML(answerText(curTask()))}</b></div>`;
}
function toggleReveal(){
  S.revealed = !S.revealed;
  if (S.revealed) { showAnswer(); $('showBtn').textContent = 'Скрыть ответ'; }
  else { $('answerBox').innerHTML = ''; $('showBtn').textContent = 'Показать ответ'; }
}
function escapeHTML(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderStats(){
  const list = S.list || [];
  const {ok, bad} = tally(list);
  $('statOk').textContent = ok;
  $('statBad').textContent = bad;
  $('statDoneL').textContent = S.topic ? 'решено в теме' : 'решено в номере';
  $('statDone').textContent = `${list.filter(t => results[t.id]).length} из ${list.length}`;
}

// ── Кнопки ──────────────────────────────────────────────────────────────────
function goPicker(){
  S.screen = 'picker'; S.topic = null;
  const url = new URL(location.href);
  url.searchParams.delete('n'); url.searchParams.delete('t'); url.searchParams.delete('tp');
  history.replaceState(null, '', url);
  renderPicker();
}
// из задания — на шаг назад: в номере с подтемами это экран тем, а не список номеров
$('backBtn').addEventListener('click', () => topicsOf(S.n).length ? renderTopics(S.n) : goPicker());
$('prevBtn').addEventListener('click', () => openTask(S.idx - 1));
$('nextBtnTop').addEventListener('click', () => openTask(S.idx + 1));
function setMode(m){
  if (mode === m) return;
  mode = m; LS.set('rusOge:mode', m);
  // смена режима начинает задание заново: попытки «Экзамена» и подсмотренный
  // ответ «Тренировки» нельзя переносить друг в друга
  openTask(S.idx);
}
$('tabPractice').addEventListener('click', () => setMode('practice'));
$('tabExam').addEventListener('click', () => setMode('exam'));

// ── Старт ───────────────────────────────────────────────────────────────────
const startN = +params.get('n');
if (startN && (POOL[startN] || []).length) {
  // ?n=9 без задания — экран тем номера (на него ведёт «← темы» и обновление страницы)
  if (!params.get('t') && topicsOf(startN).length) renderTopics(startN);
  else openNumber(startN, params.get('t'), params.get('tp'));
}
else renderPicker();

// для тестов: состояние страницы без доступа к замыканию
window.__rusOge = { S, POOL, TOPICS, topicsOf, checkAnswer, answerText, normDigits, EXAM_ATTEMPTS };
})();
</script>
