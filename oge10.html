<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОГЭ №10 — теория вероятности</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Sora','Helvetica Neue',Arial,sans-serif;
  --font-mono:ui-monospace,-apple-system,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#EEF1F7;
  --blob-1:rgba(120,150,255,.16);
  --blob-2:rgba(190,150,230,.14);
  --card:rgba(255,255,255,.8);
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.85);
  --glass-inset:rgba(255,255,255,.55);
  --hl:var(--hl-14);
  --muted-1:#8E8E93;
  --muted-2:#6E6E73;
  --muted-3:#48484A;
  --muted-4:#3A3A3C;
  --muted-5:#1D1D1F;
  --muted-6:#8E8E93;
  --muted-7:#C7C7CC;
  --muted-8:#8E8E93;
  --paper:#FDFCF7;
  --grid:#DCE4F0;
  --margin-red:#FF9F0A;
  --ink:#004C99;
  --ink-active:#003A75;
  --pencil:#1D1D1F;
  --teacher:#FF3B30;
  --ok:#248A3D;
  --ok-tint:rgba(36,138,61,.1);
  --ok-shadow:rgba(36,138,61,.3);
  --moved:#5AC8FA;
  --shadow:0 10px 34px rgba(20,30,60,.08);
  --cell:34px;
  --hl-10:rgba(0,76,153,.10);
  --hl-14:var(--hl);
  --hl-35:rgba(0,76,153,.35);
}

html[data-theme="dark"]{
  --bg:#0B0E1A;
  --blob-1:rgba(90,110,255,.22);
  --blob-2:rgba(150,90,220,.18);
  --paper:#151A2C;
  --card:rgba(30,37,64,.82);
  --glass:rgba(40,46,74,.5);
  --glass-strong:rgba(46,53,84,.65);
  --glass-border:rgba(255,255,255,.12);
  --glass-inset:rgba(255,255,255,.07);
  --hl:rgba(40,110,214,.26);
  --grid:#232A44;
  --margin-red:#FF9F0A;
  --ink:#2E7DE0;
  --ink-active:#4A93F0;
  --pencil:#F2F3F5;
  --teacher:#FF6961;
  --ok:#3E8E5B;
  --ok-tint:rgba(62,142,91,.14);
  --ok-shadow:rgba(62,142,91,.35);
  --moved:#64D2FF;
  --shadow:0 10px 40px rgba(0,0,0,.55);
  --hl-10:rgba(46,125,224,.16);
  --hl-14:var(--hl);
  --hl-35:rgba(46,125,224,.5);
  --muted-1:#9A9AA2;
  --muted-2:#9A9AA2;
  --muted-3:#AEAEB4;
  --muted-4:#C7C7CC;
  --muted-5:#F2F3F5;
  --muted-6:#9A9AA2;
  --muted-7:#3A3F55;
  --muted-8:#9A9AA2;
  --hover-1:rgba(127,160,255,.08);
  --hover-2:rgba(127,160,255,.14);
}
html[data-theme="dark"] input{background:var(--card)}

*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    var(--bg);
  background-size:auto,auto,24px 24px,24px 24px,auto;
  font-family:var(--font-ui);
  color:var(--pencil);
  min-height:100vh;
  padding:18px 12px 60px;
}
.wrap{max-width:820px;margin:0 auto;position:relative;pointer-events:none}
.wrap > *{pointer-events:auto}
/* пока доска включена: всё содержимое .wrap не перехватывает клики (можно рисовать
   поверх текста/картинок/таблиц), кроме самих управляющих элементов — их явно
   возвращаем выше холста; заодно снимаем backdrop-filter (он создаёт свой контекст
   наложения и не даёт кнопкам внутри карточек пробиться выше холста по z-index) */
html[data-board="on"] .wrap *{pointer-events:none;}
html[data-board="on"] .wrap button,
html[data-board="on"] .wrap input,
html[data-board="on"] .wrap select,
html[data-board="on"] .wrap textarea,
html[data-board="on"] .wrap a,
html[data-board="on"] .wrap [contenteditable="true"],
html[data-board="on"] .wrap [role="button"]{pointer-events:auto;position:relative;z-index:3;}
html[data-board="on"] .wrap,
html[data-board="on"] .wrap *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
/* элементы вроде mainPanel.reveal заканчивают анимацию появления с "мёртвым"
   transform:translateY(0) (matrix identity) — он визуально ничего не делает,
   но по спецификации CSS всё равно создаёт свой контекст наложения и не даёт
   кнопкам внутри (например nextBtn) пробиться выше холста; поэтому гасим
   transform и саму анимацию у всех НЕуправляющих элементов, пока доска включена */
html[data-board="on"] .wrap *:not(button):not(input):not(select):not(textarea):not(a):not([contenteditable="true"]):not([role="button"]){transform:none!important;animation:none!important;}

/* ─── калькулятор в столбик (свой пример) — встраивает настоящие тренажёры через iframe ─── */
.calc-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.calc-tool-btn{flex:1;min-width:130px;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:11px 8px;cursor:pointer;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, border-color .12s, background .12s, color .12s;}
.calc-tool-btn:active{transform:scale(.96)}
.calc-tool-btn:hover{border-color:var(--ink)}
.calc-tool-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.calc-panel{display:none;position:relative;padding:18px;}
.calc-panel-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-strong);color:var(--muted-3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .15s;}
.calc-panel-close:active{transform:scale(.9)}
.calc-panel-close:hover{border-color:var(--ink)}
.calc-panel-title{font-family:var(--font-ui);font-weight:700;font-size:15px;color:var(--pencil);margin-bottom:14px;padding-right:32px;}
.calc-iframe{display:block;width:100%;border:none;border-radius:14px;background:transparent;}
.calc-history-panel{display:none;position:relative;padding:18px;margin-bottom:14px;}
.calc-history-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-right:32px;}
.calc-history-filter{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:6px 12px;cursor:pointer;transition:transform .15s, border-color .12s, background .12s, color .12s;}
.calc-history-filter:active{transform:scale(.96)}
.calc-history-filter:hover{border-color:var(--ink)}
.calc-history-filter.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.calc-history-list{display:flex;flex-direction:column;}
.calc-history-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--glass-border);}
.calc-history-row:first-child{border-top:none;}
.calc-history-num{font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-6);min-width:20px;}
.calc-history-expr{font-family:var(--font-mono);font-size:15px;color:var(--pencil);flex:1;}
.calc-history-copy{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:6px 10px;cursor:pointer;white-space:nowrap;transition:border-color .12s, background .12s;}
.calc-history-copy:hover{border-color:var(--ink)}
.calc-history-copy:active{transform:scale(.96)}
.calc-history-empty{font-family:var(--font-ui);font-size:14px;color:var(--muted-6);text-align:center;padding:16px 0;}

/* ─── интерактивная доска на фоне вокруг примера ─── */
#boardCanvas{position:fixed;top:0;left:0;z-index:2;touch-action:none;cursor:crosshair;border-radius:20px;}
#boardCanvasBg{position:fixed;top:0;left:0;z-index:0;touch-action:none;cursor:crosshair;}
#boardSpace{height:0;pointer-events:none;transition:height .2s ease;}
.board-toolbar{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:8px;align-items:center;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:20px;padding:9px 11px;box-shadow:var(--shadow);}
.toolbar-sep{width:1px;align-self:stretch;background:var(--glass-border);margin:2px 0;}
.board-tool-btn{width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s, border-color .15s, background .15s;}
.board-tool-btn:active{transform:scale(.92)}
.board-tool-btn:hover{border-color:var(--ink);}
.board-tool-btn.active{background:var(--ink);border-color:var(--ink);}
.board-tool-btn .dot{border-radius:50%;background:var(--pencil);display:block;}
.board-tool-btn.active .dot{background:#fff;}
.board-tool-btn.eraser{font-size:15px;}
.board-tool-btn.pen-main{font-size:15px;}
.board-tool-btn.color-btn.active{background:var(--glass);border-color:var(--ink);box-shadow:0 0 0 2px var(--ink);}
.tool-group{position:relative;}
/* всплывающее окошко с размерами (для ручки и ластика) — управляется из JS через
   класс .open, а не через :hover, потому что чистый CSS-hover рвётся, стоит
   курсору чуть отклониться от прямой линии между кнопкой и окошком */
.size-flyout{position:absolute;bottom:100%;right:0;margin-bottom:10px;display:none;gap:8px;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;padding:8px;box-shadow:var(--shadow);}
.size-flyout.open{display:flex;}
/* невидимый мостик над кнопкой, чтобы курсор не «выпадал» из зоны наведения,
   пока едет от кнопки к окошку */
.tool-group::after{content:'';position:absolute;left:0;right:0;bottom:100%;height:14px;}

/* ─── всплывающая палитра для «своего» цвета ─── */
.board-tool-btn.custom-color-btn{overflow:hidden;}
.color-picker-flyout{flex-direction:column;align-items:stretch;width:200px;padding:12px;gap:10px;}
.cp-sv-wrap{position:relative;width:100%;height:120px;border-radius:12px;overflow:hidden;cursor:crosshair;touch-action:none;}
.cp-sv{display:block;width:100%;height:100%;}
.cp-sv-thumb{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;top:0;left:0;}
.cp-row{display:flex;align-items:center;gap:8px;}
.cp-eyedropper{width:28px;height:28px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--pencil);transition:transform .15s;}
.cp-eyedropper:active{transform:scale(.9)}
.cp-eyedropper:hover{border-color:var(--ink);}
.cp-swatch{width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);}
.cp-hue-wrap{position:relative;flex:1;height:16px;touch-action:none;}
.cp-hue{position:absolute;inset:0;border-radius:8px;background:linear-gradient(to right,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);cursor:pointer;}
.cp-hue-thumb{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;}
.cp-rgb-row{display:flex;gap:6px;}
.cp-field{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.cp-field input{width:100%;box-sizing:border-box;text-align:center;border-radius:8px;border:1px solid var(--glass-border);background:var(--glass);color:var(--pencil);font-family:var(--font-mono);font-size:12px;padding:5px 2px;}
.cp-field label{font-size:10px;color:var(--muted-3);font-family:var(--font-ui);}

.board-view-toolbar{position:fixed;left:18px;bottom:18px;z-index:50;display:flex;gap:8px;align-items:center;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:20px;padding:9px 11px;box-shadow:var(--shadow);}
.board-zoom-label{min-width:44px;height:34px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-3);padding:0 6px;transition:transform .15s;}
.board-zoom-label:active{transform:scale(.92)}
.board-zoom-label:hover{border-color:var(--ink);}
.board-tool-btn.hand-tool{font-size:16px;}
.board-tool-btn.clear-btn{font-size:15px;}

/* ─── доска изначально выключена — включается отдельной кнопкой под переключателем темы ─── */
html:not([data-board="on"]) #boardCanvas,
html:not([data-board="on"]) #boardCanvasBg,
html:not([data-board="on"]) .board-toolbar,
html:not([data-board="on"]) .board-view-toolbar{display:none;}
html[data-board="on"] #boardSpace{height:72vh;transition:height .32s ease;}
/* при свёрнутых подсказках место под алгоритмами/счётчиками освобождается — отдаём его доске */
html[data-board="on"][data-focus="on"] #boardSpace{height:90vh;}
html[data-board="on"] body{background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    var(--bg);}

/* ─── свернуть подсказки: освобождает место для записи на доске ─── */
.focus-toggle{position:fixed;top:64px;left:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;}
.focus-toggle:hover{border-color:var(--ink)}
.focus-toggle:active{transform:scale(.92)}

/* ─── аккуратное сворачивание: max-height/opacity вместо мгновенного display:none ─── */
h1,.sub,.stats,.hint,.example-history-toggle,.example-history-panel,.submode-tabs{overflow:hidden;min-height:0;transition:max-height .32s ease, opacity .22s ease, margin .32s ease;}
h1{max-height:64px}
.sub{max-height:50px}
.stats{max-height:90px}
.hint{max-height:50px}
.example-history-toggle{max-height:56px}
.example-history-panel{max-height:220px}
.submode-tabs{max-height:56px}
html[data-focus="on"] h1,
html[data-focus="on"] .sub,
html[data-focus="on"] .stats,
html[data-focus="on"] .hint,
html[data-focus="on"] .example-history-toggle,
html[data-focus="on"] .example-history-panel,
html[data-focus="on"] .submode-tabs{
  max-height:0;
  min-height:0;
  padding:0;
  border-width:0;
  opacity:0;
  margin-top:0;
  margin-bottom:0;
  pointer-events:none;
}
html[data-focus="on"] #pickerArea{display:none!important;}

/* ─── медали за пять решённых примеров подряд в этом прототипе ─── */
.mode-medals{font-family:var(--font-ui);font-size:12px;margin-top:4px;opacity:.85;}
.medal-badge-row{display:inline-flex;gap:3px;margin-left:8px;font-size:15px;vertical-align:middle;}
.medal-tray{position:fixed;left:0;right:0;bottom:0;z-index:150;display:none;gap:7px;align-items:center;padding:8px 16px;overflow-x:auto;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--glass-border);}
.medal-tray.show{display:flex;}
.medal-tray-icon{font-size:20px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));animation:medalPop .45s cubic-bezier(.34,1.56,.64,1) both;flex:none;}
@keyframes medalPop{0%{transform:scale(0);}70%{transform:scale(1.3);}100%{transform:scale(1);}}
.medal-flyer{position:fixed;z-index:300;pointer-events:none;font-size:44px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.3));transition:transform .85s cubic-bezier(.32,.9,.35,1), opacity .85s ease .1s;}

/* ─── история последних пяти примеров этого прототипа ─── */
.example-history-toggle{display:block;width:100%;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:11px 18px;cursor:pointer;margin-top:18px;margin-bottom:14px;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, background .12s;}
.example-history-toggle:active{transform:scale(.98)}
.example-history-toggle:hover{background:var(--hl-10);}
.example-history-panel{display:none;position:relative;padding:18px;margin-bottom:14px;}
.example-history-list{display:flex;flex-direction:column;}
.example-history-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--glass-border);}
.example-history-row:first-child{border-top:none;}
.example-history-mark{font-size:16px;flex:none;margin-top:1px;}
.example-history-prompt{font-family:var(--font-mono);font-size:14px;color:var(--pencil);line-height:1.4;}
.example-history-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.example-history-answer{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ok);line-height:1.3;}
.example-history-empty{font-family:var(--font-ui);font-size:14px;color:var(--muted-6);text-align:center;padding:16px 0;}

h1{font-family:var(--font-ui);font-weight:700;letter-spacing:-.02em;font-size:clamp(24px,5vw,34px);color:var(--pencil);text-align:center;}
.sub{font-family:var(--font-ui);font-weight:500;text-align:center;color:var(--muted-2);font-size:15px;margin:4px 0 22px;}

/* ─── выбор типа ─── */
.modes{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.mode-card{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:6px 16px;
  text-align:left;
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-border);
  border-radius:14px;
  box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);
  padding:11px 18px;
  cursor:pointer;
  transition:transform .12s, border-color .12s;
  font-family:var(--font-ui);
}
.mode-card:hover{border-color:var(--ink); transform:translateX(3px)}
.mode-card .mnum{font-family:var(--font-mono);font-size:12px;color:var(--muted-1);flex:0 0 auto;min-width:22px;white-space:nowrap;}
.mode-card .mtitle{font-weight:600;font-size:15px;color:var(--pencil);line-height:1.3;flex:1 1 260px;margin:0;}
.mode-card .mex{font-family:var(--font-mono);font-size:13px;color:var(--ink);flex:0 0 auto;}
.mode-card.random{background:linear-gradient(135deg, var(--hl-10), transparent);border-color:var(--ink);}

/* ─── шапка задачи ─── */
.task-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.back-btn{font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(16px) saturate(160%);transition:transform .15s;}
.back-btn:active{transform:scale(.96)}
.back-btn:hover{border-color:var(--ink)}
.task-title{font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--muted-3)}
.corner{font-family:var(--font-ui);font-weight:500;display:flex;align-items:center;gap:10px;}
.type-nav{display:flex;align-items:center;gap:8px;}
.type-nav-btn{height:28px;flex:0 0 auto;border:1px solid var(--glass-border);border-radius:12px;background:var(--glass-strong);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-family:var(--font-ui);font-weight:600;font-size:12px;line-height:1;cursor:pointer;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;transition:transform .12s, border-color .12s;}
.type-nav-btn:hover{border-color:var(--ink)}
.type-nav-btn:active{transform:scale(.9)}
/* ─── плавающая клавиатура ─── */
.keypad{display:grid;grid-template-columns:repeat(3, 44px);gap:6px;}
.keypad button{width:44px;height:40px;border:1px solid var(--glass-border);border-radius:12px;background:var(--glass);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-family:var(--font-mono);font-size:18px;cursor:pointer;touch-action:manipulation;}
.keypad button:active{background:var(--hl);}
.keypad button.kp-minus{color:var(--teacher);font-weight:700;}
.keypad button.kp-back{font-size:15px;color:var(--muted-6);}
.keypad button.kp-comma{font-weight:700;color:var(--ink);}
.keypad button.kp-enter{grid-column:span 2;width:auto;height:38px;font-family:var(--font-ui);font-weight:600;font-size:14px;background:var(--ink);color:#fff;border-color:var(--ink);}
.keypad button.kp-enter:active{background:var(--ink-active);}
.keypad-float{position:fixed;top:112px;right:16px;background:var(--glass-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:20px;padding:12px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:50;}
.keypad-close{position:absolute;top:-11px;right:-11px;width:26px;height:26px;border-radius:50%;background:var(--teacher);color:#fff;border:2px solid #fff;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.keypad-close:active{transform:scale(.9)}
.keypad-drag-handle{position:absolute;top:-11px;left:-11px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;border:2px solid #fff;font-size:12px;line-height:1;cursor:grab;display:flex;align-items:center;justify-content:center;touch-action:none;}
.keypad-drag-handle:active{cursor:grabbing;}
.keypad-toggle{position:fixed;top:112px;right:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:18px;cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:50;transition:transform .15s;}
.keypad-toggle:active{transform:scale(.92)}
@media(max-width:720px){.keypad-float{top:auto;bottom:16px;right:16px}}
.refresh-btn{width:28px;height:28px;flex:0 0 auto;border:1px solid var(--glass-border);border-radius:50%;background:var(--glass-strong);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-size:15px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .18s, border-color .12s;}
.refresh-btn:hover{border-color:var(--ink);transform:rotate(80deg)}
.refresh-btn:active{transform:scale(.9)}

/* ─── тетрадный лист (для деления в столбик) ─── */
.sheet{
  position:relative;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    var(--paper);
  background-size:var(--cell) var(--cell);
  border:1px solid var(--glass-border);
  border-radius:20px;
  box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);
  padding:calc(var(--cell)) calc(var(--cell)*.8) calc(var(--cell)*1.2) calc(var(--cell)*2);
  overflow-x:auto;
  min-height:calc(var(--cell)*7);
  margin-bottom:14px;
}
.sheet::before{
  content:'';
  position:absolute;
  top:0;bottom:0;
  left:calc(var(--cell)*1.5);
  width:2px;
  background:var(--margin-red);
  opacity:.55;
}
#board{display:inline-block;min-width:100%;position:relative;}
.bring-down-ghost{
  position:absolute;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-mono);
  font-size:calc(var(--cell)*.62);
  color:var(--ink);
  pointer-events:none;
  transition:transform .42s cubic-bezier(.3,.85,.3,1);
  will-change:transform;
  z-index:5;
}
.row{display:flex;height:var(--cell)}
.c{
  width:var(--cell);
  height:var(--cell);
  flex:0 0 var(--cell);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-mono);
  font-size:calc(var(--cell)*.62);
  color:var(--ink);
  position:relative;
}
.c.dim{color:var(--muted-7)}
.c.hl{color:var(--ink-active);background:var(--hl-10);border-radius:6px}
.c.uline{border-bottom:2.5px solid var(--ink)}
.c.vline{border-left:2.5px solid var(--ink)}
.c.target{outline:2px dashed var(--teacher);outline-offset:-4px;border-radius:8px;animation:pulse 1s infinite;}
@keyframes pulse{50%{outline-color:transparent}}
.c.quo{color:var(--teacher);font-weight:700}
.c.minus{color:var(--ink)}

/* ─── панель ─── */
.panel{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:22px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);padding:20px;margin-bottom:14px;}
.panel.fade-out{opacity:0;transform:translateY(-6px);transition:opacity .2s ease, transform .2s ease;}
@keyframes revealUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
#mainPanel.reveal{animation:revealUp .38s cubic-bezier(.22,.9,.35,1) both;}
.prompt{font-family:var(--font-ui);font-weight:500;font-size:clamp(17px,3.2vw,20px);color:var(--muted-5);margin-bottom:14px;line-height:1.4;}
.prompt b{color:var(--ink)}
.inrow{display:flex;gap:10px}
#stepInput, #finalInput{
  flex:1;
  font-family:var(--font-mono);
  font-size:22px;
  padding:10px 14px;
  border:1px solid var(--glass-border);
  background:var(--card);
  border-radius:14px;
  color:var(--ink);
  width:100%;
  min-width:0;
}
#stepInput:focus, #finalInput:focus{outline:none;border-color:var(--ink)}
#stepInput.shake, #finalInput.shake{animation:shake .35s}
#stepInput:disabled, #finalInput:disabled{opacity:.5;cursor:not-allowed}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
button.go{font-family:var(--font-ui);font-weight:600;font-size:16px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:11px 24px;cursor:pointer;box-shadow:0 6px 18px var(--hl-35);}
button.go:active{transform:scale(.96)}
button.go:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.hint{font-family:var(--font-ui);font-weight:500;color:var(--teacher);font-size:15px;margin-top:12px;min-height:20px;line-height:1.4;}
.hint.good{color:var(--ok)}

/* ─── виджет дроби (пустые поля) ─── */
.mixed-fill{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-family:var(--font-mono);font-size:22px;color:var(--ink);padding:10px 0 4px;}
.mixed-source{color:var(--pencil);white-space:nowrap;}
.mixed-box{
  width:52px;
  font-family:var(--font-mono);
  font-size:19px;
  text-align:center;
  padding:9px 4px;
  border:1.5px solid var(--glass-border);
  background:var(--card);
  border-radius:10px;
  color:var(--ink);
}
.mixed-box:focus{outline:none;border-color:var(--ink)}
.mixed-box:disabled{opacity:.85}
.mixed-box.ok{border-color:var(--ok);background:var(--ok-tint);color:var(--ok);}
.mixed-box.bad{border-color:var(--teacher);background:rgba(255,59,48,.12);color:var(--teacher);}
.mixed-vfrac{display:inline-flex;flex-direction:column;align-items:center;gap:5px;}
.mixed-bar{width:52px;height:2px;background:currentColor;}

/* ─── плашка Тренировка/Экзамен ─── */
.submode-tabs{display:flex;gap:8px;margin-bottom:14px;}
.submode-tab{flex:1;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--muted-3);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:10px 6px;cursor:pointer;text-align:center;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, border-color .15s, color .15s, background .15s;}
.submode-tab:active{transform:scale(.96)}
.submode-tab:hover{border-color:var(--ink);}
.submode-tab.active{color:#fff;background:var(--ink);border-color:var(--ink);}

/* ─── план решения ─── */
.plan{font-family:var(--font-ui);font-weight:500;font-size:14px;color:var(--muted-4);background:var(--hl-10);border-radius:14px;padding:12px 15px;margin:2px 0 14px;line-height:1.5;}
.plan b{color:var(--ink)}
.step-why{font-family:var(--font-ui);font-weight:500;font-size:14px;color:var(--muted-2);margin-bottom:6px;line-height:1.4;}

.explain{font-family:var(--font-ui);font-size:15px;color:var(--muted-4);line-height:1.55;}
.explain b{color:var(--ink)}
.next-btn{font-family:var(--font-ui);font-weight:600;font-size:16px;background:var(--ok);color:#fff;border:none;border-radius:14px;padding:13px 26px;cursor:pointer;width:100%;margin-top:14px;box-shadow:0 6px 18px var(--ok-shadow);transition:transform .15s;}
.next-btn:active{transform:scale(.98)}
.solution-btn{display:none;width:100%;font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--ink);background:var(--glass);border:1.5px dashed var(--ink);border-radius:14px;padding:12px 18px;cursor:pointer;margin-bottom:14px;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, background .12s;}
.solution-btn:hover{background:var(--hl-10);}
.solution-btn:active{transform:scale(.98);}
.euler-svg{display:block;margin:14px auto 4px;max-width:100%;height:auto;}
.tree-svg{display:block;margin:14px auto 4px;max-width:100%;height:auto;}

/* ─── статистика ─── */
.stats{display:flex;gap:10px;flex-wrap:wrap;}
.stat{flex:1;min-width:110px;background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);padding:12px 14px;text-align:center;}
.stat .v{font-family:var(--font-ui);font-weight:700;font-size:22px;color:var(--ink);}
.stat .l{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-6);}

.theme-toggle{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;}
.theme-toggle:hover{border-color:var(--ink)}
.theme-toggle:active{transform:scale(.92)}
.board-visibility-toggle{top:64px;transition:transform .15s;}
.board-visibility-toggle:active{transform:scale(.92)}
.board-visibility-toggle.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.home-btn{position:fixed;top:16px;left:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;text-decoration:none;}
.home-btn:hover{border-color:var(--ink)}
.home-btn:active{transform:scale(.92)}
@media(max-width:480px){:root{--cell:28px}.sheet{padding-left:calc(var(--cell)*2)}}
</style>
</head>

<a class="home-btn" href="index.html" title="Ко всем тренажёрам" aria-label="Ко всем тренажёрам">←</a>
<button class="theme-toggle" id="themeToggle" title="Светлая/тёмная тема" aria-label="Переключить тему">🌙</button>
<button class="theme-toggle board-visibility-toggle" id="boardVisibilityToggle" title="Показать доску" aria-label="Показать/скрыть доску">🖊️</button>
<script>(function(){
  var btn=document.getElementById('themeToggle');
  function apply(t, persist){
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    if (persist) { try{ localStorage.setItem('theme', t); }catch(e){} }
  }
  apply(document.documentElement.getAttribute('data-theme') || 'light', false);
  btn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(cur, true);
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSystemChange = function(e){
      var explicit = false;
      try{ explicit = !!localStorage.getItem('theme'); }catch(err){}
      if (explicit) return;
      apply(e.matches ? 'dark' : 'light', false);
    };
    if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
    else if (mq.addListener) mq.addListener(onSystemChange);
  }
})();</script>
<script>(function(){
  var btn = document.getElementById('boardVisibilityToggle');
  function apply(on){
    document.documentElement.setAttribute('data-board', on ? 'on' : 'off');
    btn.classList.toggle('active', on);
    btn.title = on ? 'Скрыть доску' : 'Показать доску';
  }
  apply(false); // доска изначально выключена
  btn.addEventListener('click', function(){
    apply(document.documentElement.getAttribute('data-board') !== 'on');
  });
})();</script>

<!-- кнопка "свернуть подсказки" намеренно лежит здесь, СНАРУЖИ .wrap, а не внутри
     него: у .wrap свой контекст наложения (нужен для доски), и любой position:fixed
     элемент ВНУТРИ .wrap не смог бы пробиться выше #boardCanvas по z-index -->
<button class="focus-toggle" id="focusToggle" title="Свернуть подсказки" aria-label="Свернуть/показать подсказки и алгоритм">⛶</button>
  <script>(function(){
    var btn = document.getElementById('focusToggle');
    function apply(on){
      document.documentElement.setAttribute('data-focus', on ? 'on' : 'off');
      btn.title = on ? 'Показать подсказки' : 'Свернуть подсказки';
    }
    apply(false);
    btn.addEventListener('click', function(){
      apply(document.documentElement.getAttribute('data-focus') !== 'on');
    });
  })();</script>

<script>
/* ═══════════════ утилиты ═══════════════ */
const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = arr=>arr[ri(0,arr.length-1)];
function shuffleArr(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=ri(0,i); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function fracStr(a,b){ return `<span class="vfrac"><span class="vnum">${a}</span><span class="vden">${b}</span></span>`; }
function fmtRu(x){ return String(x).replace('.', ','); }
// случайная композиция total на `parts` положительных слагаемых
function splitN(total, parts){
  const cuts = new Set();
  while(cuts.size < parts-1) cuts.add(ri(1,total-1));
  const sorted = [...cuts].sort((a,b)=>a-b);
  const bounds = [0, ...sorted, total];
  const res = [];
  for(let i=0;i<parts;i++) res.push(bounds[i+1]-bounds[i]);
  return res;
}

/* ───────── ввод ответа словами: "тридцать четыре" наравне с "34" ───────── */
function parseRuNumber(raw){
  if(raw==null) return NaN;
  const s=String(raw).trim();
  if(s==='') return NaN;
  const plain=s.replace(',','.');
  if(/^[+-]?\d+(\.\d+)?$/.test(plain)) return Number(plain);
  return parseRuNumberWords(s);
}
function parseRuNumberWords(raw){
  let s=raw.toLowerCase().replace(/ё/g,'е').replace(/[-−–]/g,' ').replace(/\s+/g,' ').trim();
  if(s==='') return NaN;
  let negative=false;
  if(/^минус\s+/.test(s)){ negative=true; s=s.replace(/^минус\s+/,''); }
  else if(s==='минус') return NaN;
  const words=s.split(' ').filter(Boolean);
  if(!words.length) return NaN;
  const ones={ноль:0,один:1,одна:1,одно:1,два:2,две:2,три:3,четыре:4,пять:5,шесть:6,семь:7,восемь:8,девять:9,
    десять:10,одиннадцать:11,двенадцать:12,тринадцать:13,четырнадцать:14,пятнадцать:15,шестнадцать:16,семнадцать:17,восемнадцать:18,девятнадцать:19};
  const tens={двадцать:20,тридцать:30,сорок:40,пятьдесят:50,шестьдесят:60,семьдесят:70,восемьдесят:80,девяносто:90};
  const hundreds={сто:100,двести:200,триста:300,четыреста:400,пятьсот:500,шестьсот:600,семьсот:700,восемьсот:800,девятьсот:900};
  const thousandWords=new Set(['тысяча','тысячи','тысяч']);
  const millionWords=new Set(['миллион','миллиона','миллионов']);
  let total=0, current=0, matched=false;
  for(const w of words){
    if(w in hundreds){ current+=hundreds[w]; matched=true; continue; }
    if(w in tens){ current+=tens[w]; matched=true; continue; }
    if(w in ones){ current+=ones[w]; matched=true; continue; }
    if(thousandWords.has(w)){ total+=(current||1)*1000; current=0; matched=true; continue; }
    if(millionWords.has(w)){ total+=(current||1)*1000000; current=0; matched=true; continue; }
    return NaN;
  }
  total+=current;
  if(!matched) return NaN;
  return negative?-total:total;
}

/* ═══════════════ виджет: деление в столбик ═══════════════ */
function createDivWidget(sheetEl, qaPanelEls, spec, onDone){
  // spec: {dividend:string, divisor:number, decimal:bool, maxDecimalDigits:number, question:string}
  qaPanelEls.inrow.style.display='flex';
  qaPanelEls.mixedFill.style.display='none';
  const P = { dividend: spec.dividend, divisor: spec.divisor, decimal: !!spec.decimal };
  let S = { phase:'group', pos:0, w:0, qStr:'', log:[], ext:'', commaDone:false, errStep:0 };
  let pendingBringDownAnim = null;  // мета для анимации «сноса» цифры вниз

  function firstGroupLen(){
    let g=1;
    while(g < P.dividend.length && Number(P.dividend.slice(0,g)) < P.divisor) g++;
    return g;
  }
  function decDigitsSoFar(){
    if(!S.commaDone) return 0;
    return S.qStr.length - S.qStr.indexOf(',') - 1;
  }
  function expected(){
    switch(S.phase){
      case 'group': return firstGroupLen();
      case 'q':     return Math.floor(S.w / P.divisor);
      case 'prod':  return S.qd * P.divisor;
      case 'rem':   return S.w - S.qd * P.divisor;
    }
  }

  function render(){
    const n = P.dividend.length;
    const D = n + 1 + (P.decimal ? (spec.maxDecimalDigits||2) : 0);
    const divisorStr = String(P.divisor);
    const qMax = Math.max(S.qStr.length + 1, divisorStr.length);
    const maxEnd = Math.max(S.pos, ...S.log.map(e=>e.endCol), 0);
    const cols = Math.max(D + 1 + Math.max(divisorStr.length, qMax) + 1, maxEnd + 2);
    const rows = [];
    const blank = ()=>Array.from({length:cols},()=>({ch:'',cls:''}));

    const r0 = blank();
    const g = (S.phase==='group') ? 0 : firstGroupLen();
    for(let i=0;i<n;i++){
      r0[i+1].ch = P.dividend[i];
      if(S.phase!=='group' && i<g && S.log.length===0) r0[i+1].cls='hl';
      if(S.phase!=='group' && i>=S.pos) r0[i+1].cls += ' dim';
    }
    for(let i=0;i<S.ext.length;i++){ r0[n+1+i].ch = S.ext[i]; }
    r0[D].cls='vline';
    for(let i=0;i<divisorStr.length;i++){ r0[D+1+i].ch = divisorStr[i]; r0[D+1+i].cls='uline'; }
    for(let i=divisorStr.length;i<qMax;i++) r0[D+1+i].cls='uline';
    rows.push(r0);

    const logRows = [];
    for(const e of S.log){
      const rr = blank();
      const t = e.text;
      const start = e.endCol - t.length + 1;
      for(let i=0;i<t.length;i++){ rr[start+i].ch = t[i]; if(e.type==='sub') rr[start+i].cls='uline'; }
      if(e.type==='sub'){ rr[start-1].ch='−'; rr[start-1].cls='minus uline'; }
      logRows.push(rr);
    }
    while(logRows.length<1) logRows.push(blank());

    const r1 = logRows[0];
    if(!r1[D].ch) r1[D].cls += ' vline';
    for(let i=0;i<S.qStr.length;i++){ r1[D+1+i].ch = S.qStr[i]; r1[D+1+i].cls='quo'; }
    if(S.phase==='q') r1[D+1+S.qStr.length].cls='target quo';
    if(S.phase==='prod' || S.phase==='rem'){
      const rowIdx = S.log.length;
      while(logRows.length <= rowIdx) logRows.push(blank());
      logRows[rowIdx][S.pos].cls += ' target';
    }
    rows.push(...logRows);

    sheetEl.querySelector('#board').innerHTML = rows.map(rr=>
      '<div class="row">'+rr.map(c=>`<div class="c ${c.cls}">${c.ch}</div>`).join('')+'</div>'
    ).join('');
  }

  function setPrompt(){
    const p = qaPanelEls.prompt;
    const v = P.divisor;
    switch(S.phase){
      case 'group': p.innerHTML = `${spec.question ? `<div class="step-why">${spec.question}</div>` : ''}Делим <b>${P.dividend}</b> на <b>${v}</b>. Сколько первых цифр делимого возьмём для первого шага?`; break;
      case 'q':     p.innerHTML = `Делим <b>${S.w}</b> на <b>${v}</b>. Какую цифру пишем в частное?`; break;
      case 'prod':  p.innerHTML = `Умножаем: <b>${S.qd} × ${v}</b> = ?`; break;
      case 'rem':   p.innerHTML = `Вычитаем: <b>${S.w} − ${S.qd*v}</b> = ?`; break;
    }
  }
  function setHint(t, good){ qaPanelEls.hint.textContent=t; qaPanelEls.hint.className='hint'+(good?' good':''); }

  function bringDown(){
    const n = P.dividend.length;
    const d = S.pos < n ? P.dividend[S.pos] : '0';
    const fromCol = S.pos + 1;
    const last = S.log[S.log.length-1];
    if(last && last.type==='val'){
      const rowIdx = S.log.length - 1;
      last.text += d; last.endCol = S.pos+1; S.w = S.w*10+Number(d);
      pendingBringDownAnim = { fromCol, toRow: rowIdx+1, toCol: S.pos+1, digit: d };
    }
    else if(S.log.length===0){ S.ext += d; S.w = S.w*10+Number(d); } // спускать пока некуда — некуда падать
    else {
      const rowIdx = S.log.length;
      S.log.push({type:'val', text:String(S.w)+d, endCol:S.pos+1}); S.w = S.w*10+Number(d);
      pendingBringDownAnim = { fromCol, toRow: rowIdx+1, toCol: S.pos+1, digit: d };
    }
    S.pos++; S.errStep=0;
  }

  function playBringDownAnimation(meta){
    const board = sheetEl.querySelector('#board');
    const rows = board.querySelectorAll('.row');
    const srcRow = rows[0], dstRow = rows[meta.toRow];
    if(!srcRow || !dstRow) return;
    const srcCell = srcRow.children[meta.fromCol];
    const dstCell = dstRow.children[meta.toCol];
    if(!srcCell || !dstCell) return;

    const boardRect = board.getBoundingClientRect();
    const srcRect = srcCell.getBoundingClientRect();
    const dstRect = dstCell.getBoundingClientRect();

    dstCell.style.opacity = '0';

    const ghost = document.createElement('div');
    ghost.className = 'bring-down-ghost';
    ghost.textContent = meta.digit;
    ghost.style.left = (srcRect.left - boardRect.left) + 'px';
    ghost.style.top = (srcRect.top - boardRect.top) + 'px';
    ghost.style.width = srcRect.width + 'px';
    ghost.style.height = srcRect.height + 'px';
    board.appendChild(ghost);

    const cleanup = ()=>{
      if(ghost.parentNode) ghost.remove();
      dstCell.style.opacity = '';
    };
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        const dx = dstRect.left - srcRect.left;
        const dy = dstRect.top - srcRect.top;
        ghost.style.transform = `translate(${dx}px, ${dy}px)`;
      });
    });
    ghost.addEventListener('transitionend', cleanup, {once:true});
    setTimeout(cleanup, 550);
  }
  function startDecimal(){
    if(!S.commaDone){ S.qStr += ','; S.commaDone = true; setHint('Цифры закончились, а остаток не ноль. Ставим запятую и сносим ноль!', true); }
    bringDown(); S.phase='q';
  }
  function finish(rem){
    S.phase='done'; render();
    onDone({ quotientStr: S.qStr, remainder: rem, dividend: Number(P.dividend), divisor: P.divisor });
  }

  function applyAnswer(exp){
    const v = P.divisor, n = P.dividend.length;
    switch(S.phase){
      case 'group': { S.pos = exp; S.w = Number(P.dividend.slice(0,exp)); S.phase='q'; break; }
      case 'q': {
        S.qStr += String(exp);
        if(exp===0){
          if(S.pos < n){ bringDown(); S.phase='q'; }
          else if(P.decimal && S.w>0 && decDigitsSoFar() < (spec.maxDecimalDigits||2)){ startDecimal(); }
          else { finish(S.w); return; }
        } else { S.qd = exp; S.phase='prod'; }
        break;
      }
      case 'prod': { S.log.push({type:'sub', text:String(exp), endCol:S.pos}); S.phase='rem'; break; }
      case 'rem': {
        const rem = exp;
        const capReached = P.decimal && decDigitsSoFar() >= (spec.maxDecimalDigits||2);
        if(capReached){ S.log.push({type:'val', text:String(rem), endCol:S.pos}); finish(rem); return; }
        if(S.pos < n){ S.log.push({type:'val', text:String(rem), endCol:S.pos}); S.w = rem; bringDown(); S.phase='q'; }
        else if(P.decimal && rem>0){ S.log.push({type:'val', text:String(rem), endCol:S.pos}); S.w = rem; startDecimal(); }
        else { S.log.push({type:'val', text:String(rem), endCol:S.pos}); finish(rem); return; }
        break;
      }
    }
    S.errStep=0; render(); setPrompt();
    if(pendingBringDownAnim){ playBringDownAnimation(pendingBringDownAnim); pendingBringDownAnim = null; }
  }

  function submit(){
    const input = qaPanelEls.input;
    if(input.value==='') return;
    const ans = parseRuNumber(input.value);
    const exp = expected();
    if(ans !== exp){
      S.errStep++;
      input.classList.remove('shake'); void input.offsetWidth; input.classList.add('shake');
      if(S.errStep>=3){
        setHint(`Правильный ответ: ${exp}.`);
        applyAnswer(exp);
      } else {
        setHint('Попробуй ещё раз.');
      }
      input.value=''; input.focus({preventScroll:true});
      return;
    }
    setHint(pick(['Верно!','Точно!','Отлично!','Так держать!']), true);
    applyAnswer(exp);
    input.value=''; input.focus({preventScroll:true});
  }

  qaPanelEls.goBtn.onclick = submit;
  qaPanelEls.input.onkeydown = e=>{ if(e.key==='Enter') submit(); };
  render(); setPrompt(); setHint(''); setTimeout(()=>qaPanelEls.input.focus({preventScroll:true}),30);
}

/* ═══════════════ общая логика для виджетов «впиши в клеточки» ═══════════════ */
function attachFillBoxes(hostEls, boxes, onDone){
  // boxes: [{el, answer}, ...] — общая проверка + подсветка ok/bad для любого набора полей
  let done = false;
  function checkAll(){
    if(done) return;
    const allCorrect = boxes.every(b => b.el.value.trim()!=='' && parseRuNumber(b.el.value.trim())===Number(b.answer));
    if(allCorrect){
      done = true;
      boxes.forEach(b=>{ b.el.disabled = true; });
      hostEls.hint.textContent = pick(['Верно!','Точно!','Отлично!']);
      hostEls.hint.className = 'hint good';
      setTimeout(onDone, 500);
    }
  }
  boxes.forEach((b,i)=>{
    b.el.addEventListener('input', ()=>{
      const raw = b.el.value.trim();
      b.el.classList.remove('ok','bad');
      if(raw!==''){
        if(parseRuNumber(raw)===Number(b.answer)) b.el.classList.add('ok');
        else b.el.classList.add('bad');
      }
      checkAll();
    });
    b.el.addEventListener('keydown', e=>{
      if(e.key==='Enter' && i<boxes.length-1) boxes[i+1].el.focus({preventScroll:true});
    });
  });
  setTimeout(()=>boxes[0].el.focus({preventScroll:true}), 30);
}

/* ═══════════════ виджет: дробь вероятности (числитель/знаменатель пустые) ═══════════════ */
function createProbFracWidget(fracEls, spec, onDone){
  // spec: {question, num, den} — благоприятные/все, оба поля ученик заполняет сам.
  // Проверка выполняется не на каждое нажатие клавиши, а только по кнопке «ОК»
  // (или по Enter на знаменателе), после того как обе клетки заполнены.
  fracEls.prompt.innerHTML = spec.question || '';
  fracEls.hint.textContent = '';
  fracEls.hint.className = 'hint';
  fracEls.container.innerHTML = `
    <span class="mixed-source">P(A) =</span>
    <span class="mixed-vfrac">
      <input class="mixed-box" id="pfNum" type="text" inputmode="numeric" autocomplete="off" maxlength="4">
      <span class="mixed-bar"></span>
      <input class="mixed-box" id="pfDen" type="text" inputmode="numeric" autocomplete="off" maxlength="4">
    </span>
    <button type="button" class="go" id="pfGo">ОК</button>
  `;
  const numBox = fracEls.container.querySelector('#pfNum');
  const denBox = fracEls.container.querySelector('#pfDen');
  const goBtn = fracEls.container.querySelector('#pfGo');
  let done = false;

  function submit(){
    if(done) return;
    const numRaw = numBox.value.trim(), denRaw = denBox.value.trim();
    if(numRaw==='' || denRaw===''){
      fracEls.hint.textContent = 'Заполни оба поля дроби.';
      fracEls.hint.className = 'hint';
      return;
    }
    const numOk = parseRuNumber(numRaw)===Number(spec.num);
    const denOk = parseRuNumber(denRaw)===Number(spec.den);
    numBox.classList.toggle('ok', numOk);
    numBox.classList.toggle('bad', !numOk);
    denBox.classList.toggle('ok', denOk);
    denBox.classList.toggle('bad', !denOk);
    if(numOk && denOk){
      done = true;
      numBox.disabled = true; denBox.disabled = true; goBtn.disabled = true;
      fracEls.hint.textContent = pick(['Верно!','Точно!','Отлично!']);
      fracEls.hint.className = 'hint good';
      setTimeout(onDone, 500);
    } else {
      fracEls.hint.textContent = 'Проверь оба числа и попробуй ещё раз.';
      fracEls.hint.className = 'hint';
    }
  }

  [numBox, denBox].forEach(b=>{
    b.addEventListener('input', ()=>{ b.classList.remove('ok','bad'); });
  });
  numBox.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); denBox.focus({preventScroll:true}); } });
  denBox.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
  goBtn.onclick = submit;

  setTimeout(()=>numBox.focus({preventScroll:true}), 30);
}

/* ═══════════════ генераторы типов (классическая вероятность) ═══════════════ */

function gen_type1(){
  // пирожки на тарелке
  const total = pick([8,10,16,20]);
  const counts = splitN(total,3);
  const fillings = ['мясом','капустой','вишнёй'];
  const idx = ri(0,2);
  const favorable = counts[idx];
  const partsText = fillings.map((f,i)=>`${counts[i]} с ${f}`).join(', ').replace(/, ([^,]*)$/, ' и $1');
  const answer = Math.round((favorable/total)*10000)/10000;
  return {

/* ═══════════════ игральные кости ═══════════════
   Один кубик даёт знаменатель 6 = 2·3, два кубика — 36 = 2²·3². Чтобы
   вероятность сокращалась до конечной десятичной дроби, тройка в
   знаменателе должна полностью сократиться числителем. Поэтому события на
   одном кубике годятся только те, где ровно 3 благоприятных исхода из 6

const DIE_EVENTS = [

  { favSet:[4,5,6], text:'выпадет число, большее 3', textOnce:'выпало число, большее 3', textBoth:'оба раза выпало число, большее 3' },

const SUM_COUNT = {2:1,3:2,4:3,5:4,6:5,7:6,8:5,9:4,10:3,11:2,12:1};
const SUM_PAIRS = [[4,7],[5,8],[6,9],[7,10]]; // только пары, где количество исходов в сумме даёт 9 (9/36=0,25)
function sumCombosText(s){
  const combos=[];
  for(let a=1;a<=6;a++){ const b=s-a; if(b>=1 && b<=6) combos.push(`${a}+${b}`); }
  return combos.join(', ');
}

/* ─── SVG: дерево случайного опыта и диаграммы Эйлера ─── */
function svgText(x,y,t,opts){
  opts = opts||{};
  const size=opts.size||15, weight=opts.weight||500, color=opts.color||'var(--pencil)', anchor=opts.anchor||'middle';
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="var(--font-ui)" font-size="${size}" font-weight="${weight}" fill="${color}">${t}</text>`;
}
function buildTreeSVG(p1,p2,p3){
  const q1 = Math.round((1-p1)*100)/100, q2 = Math.round((1-p2)*100)/100, q3 = Math.round((1-p3)*100)/100;
  const S=[300,26], A=[150,110], NA=[450,110], B1=[75,196], NB1=[225,196], B2=[375,196], NB2=[525,196];
  const line=(p,q)=>`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="var(--ink)" stroke-width="1.6"/>`;
  const dot=p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--ink)"/>`;
  const mid=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];
  const m1=mid(S,A), m2=mid(S,NA), m3=mid(A,B1), m4=mid(A,NB1), m5=mid(NA,B2), m6=mid(NA,NB2);
  return `<svg class="tree-svg" viewBox="0 0 600 240" xmlns="http://www.w3.org/2000/svg">
${line(S,A)}${line(S,NA)}${line(A,B1)}${line(A,NB1)}${line(NA,B2)}${line(NA,NB2)}
${dot(S)}${dot(A)}${dot(NA)}${dot(B1)}${dot(NB1)}${dot(B2)}${dot(NB2)}
${svgText(S[0],S[1]-12,'S',{size:16})}
${svgText(A[0]-16,A[1]-6,'A',{size:16,anchor:'end'})}
${svgText(NA[0]+16,NA[1]-6,'Ā',{size:16,anchor:'start'})}
${svgText(B1[0],B1[1]+20,'B')}${svgText(NB1[0],NB1[1]+20,'B̄')}
${svgText(B2[0],B2[1]+20,'B')}${svgText(NB2[0],NB2[1]+20,'B̄')}
${svgText(m1[0]-16,m1[1]-6,fmtRu(p1),{size:13,anchor:'end'})}
${svgText(m2[0]+16,m2[1]-6,fmtRu(q1),{size:13,anchor:'start'})}
${svgText(m3[0]-14,m3[1]+2,fmtRu(p2),{size:13,anchor:'end'})}
${svgText(m4[0]+14,m4[1]+2,fmtRu(q2),{size:13,anchor:'start'})}
${svgText(m5[0]-14,m5[1]+2,fmtRu(p3),{size:13,anchor:'end'})}
${svgText(m6[0]+14,m6[1]+2,fmtRu(q3),{size:13,anchor:'start'})}
</svg>`;
}
function svgEulerFrame(){
  return `<rect x="4" y="4" width="392" height="252" fill="none" stroke="var(--pencil)" stroke-width="1.4"/>
<circle cx="140" cy="140" r="95" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
<circle cx="260" cy="140" r="95" fill="none" stroke="var(--ink)" stroke-width="1.6"/>
${svgText(35,55,'A',{size:17,weight:600})}${svgText(352,55,'B',{size:17,weight:600})}`;
}
function buildEulerRegionsSVG(outside,aOnly,both,bOnly,mode){
  const fmt = v => mode==='count' ? String(v) : fmtRu(v);
  return `<svg class="euler-svg" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
${svgEulerFrame()}
${svgText(200,25,fmt(outside))}
${svgText(95,140,fmt(aOnly))}
${svgText(200,145,fmt(both))}
${svgText(305,140,fmt(bOnly))}
</svg>`;
}
function buildEulerDotsSVG(points,mode){
  const parts = points.map(p=>{
    const c = `<circle cx="${p.x}" cy="${p.y}" r="3" fill="var(--pencil)"/>`;
    const t = mode==='prob' ? svgText(p.x+8,p.y+4,fmtRu(p.v),{size:12,anchor:'start'}) : '';
    return c+t;
  }).join('');
  return `<svg class="euler-svg" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
${svgEulerFrame()}
${parts}
</svg>`;
}

    red = ri(Math.max(1,Math.round(total*0.08)), Math.round(total*0.3));

    if(rest>=2 && rest%2===0) break;

  const favorable = red+purple;
  const answer = Math.round((favorable/total)*10000)/10000;
  return {
    prompt: `В магазине канцтоваров продаётся ${total} ручек: ${red} красных, ${green} зелёных, ${purple} фиолетовых, остальные синие и чёрные, их поровну. Найдите вероятность того, что случайно выбранная в этом магазине ручка будет красной или фиолетовой.`,
    answer,
    explain: `Красных или фиолетовых — ${red} + ${purple} = ${favorable}. Всего ручек — ${total}. P = ${favorable}⁄${total} = ${fmtRu(answer)}.`,
    simple:true
  };
}

/* ─── карандаши — условная вероятность (без возвращения) ─── */

/* ─── монета: номер броска не важен — вероятность решки в конкретном броске ─── */
const ORD_UNITS_PREP = ['','первом','втором','третьем','четвёртом','пятом','шестом','седьмом','восьмом','девятом'];
const ORD_TEENS_PREP = ['десятом','одиннадцатом','двенадцатом','тринадцатом','четырнадцатом','пятнадцатом','шестнадцатом','семнадцатом','восемнадцатом','девятнадцатом'];
const CARD_TENS = ['','','двадцать','тридцать','сорок','пятьдесят'];
const ORD_TENS_PREP = ['','','двадцатом','тридцатом','сороковом','пятидесятом'];
function ordinalRu(n){
  if(n<10) return ORD_UNITS_PREP[n];
  if(n<20) return ORD_TEENS_PREP[n-10];
  const tens=Math.floor(n/10), units=n%10;
  if(units===0) return ORD_TENS_PREP[tens];
  return `${CARD_TENS[tens]} ${ORD_UNITS_PREP[units]}`;
}
function gen_type21(){
  const total = pick([10,16,20,25,40,50]);
  const heads = ri(Math.round(total*0.3), Math.round(total*0.7));
  const favorable = total-heads;
  const pos = ri(1,total);
  const answer = Math.round((favorable/total)*10000)/10000;
  return {
    prompt: `Монету бросили ${total} раз. Известно, что орёл выпал ${heads} раз. Найдите вероятность того, что при ${ordinalRu(pos)} по счёту броске выпала решка.`,
    answer,
    explain: `Все ${total} бросков равноправны — любой из них с одинаковой вероятностью мог оказаться решкой, независимо от его номера по счёту. Решка выпала ${total} − ${heads} = ${favorable} раз из ${total}. P = ${favorable}⁄${total} = ${fmtRu(answer)}.`,
    simple:true
  };
}

/* ─── дерево случайного опыта — формула полной вероятности ─── */
const TREE_PRESETS = [
  {p1:0.25,p2:0.8,p3:0.4}, {p1:0.3,p2:0.7,p3:0.2}, {p1:0.4,p2:0.6,p3:0.9},

];
function gen_type23(){
  const {p1,p2,p3} = pick(TREE_PRESETS);

  const answer = Math.round((t1+t2)*10000)/10000;
  return {

    explain: `По формуле полной вероятности: P(B) = P(A)·P(B|A) + P(Ā)·P(B|Ā) = ${fmtRu(p1)}·${fmtRu(p2)} + ${fmtRu(q1)}·${fmtRu(p3)} = ${fmtRu(t1)} + ${fmtRu(t2)} = ${fmtRu(answer)}.`,
    simple:true
  };
}

/* ─── диаграмма Эйлера: точки с вероятностями рядом с каждой ─── */
const EULER_DIST8 = [[1,2,3,2],[2,2,2,2],[1,3,2,2],[2,1,3,2],[3,2,1,2],[2,3,1,2]];
function gen_type26(){
  const dist = pick(EULER_DIST8);
  const keys = ['outside','aOnly','both','bOnly'];
  const totalPts = dist.reduce((a,b)=>a+b,0);
  const percents = splitN(100,totalPts);
  let i=0;
  const groups = {outside:[],aOnly:[],both:[],bOnly:[]};
  keys.forEach((key,gi)=>{ for(let k=0;k<dist[gi];k++){ groups[key].push(percents[i]/100); i++; } });
  const points = [];
  keys.forEach(key=>{ groups[key].forEach((v,idx)=>{ const [x,y]=EULER_SLOTS[key][idx]; points.push({x,y,v}); }); });
  const outsideVals = groups.outside;
  const answer = Math.round(outsideVals.reduce((a,b)=>a+b,0)*100)/100;
  return {
    prompt: `На рисунке изображена диаграмма Эйлера для случайных событий A и B в некотором случайном опыте с равновозможными исходами. Точками показаны все элементарные события и около каждого указана его вероятность. Найдите вероятность события <span style="text-decoration:overline">A∪B</span>.${buildEulerDotsSVG(points,'prob')}`,
    answer,
    explain: `Событие «ни A, ни B» — это точки вне обоих кругов. Складываем их вероятности: ${outsideVals.map(fmtRu).join(' + ')} = ${fmtRu(answer)}.`,
    simple:true
  };
}

  };
}

/* ═══════════════ память по прототипам + история + медали (localStorage) ═══════════════ */
const PROGRESS_NS = 'ogeProg:oge10:';
function loadProg(key) {
  try { const raw = localStorage.getItem(PROGRESS_NS + key); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function saveProg(key, data) {
  try { data.lastActiveAt = Date.now(); localStorage.setItem(PROGRESS_NS + key, JSON.stringify(data)); } catch (e) {}
}
function freshProg() {
  return { task: null, answered: false, history: [], solvedInBatch: 0, errorsInBatch: 0,
           medals: { gold: 0, silver: 0, bronze: 0 } };
}
const SESSION_GAP_MS = 3 * 60 * 60 * 1000; // 3 часа без захода в этот прототип — считаем, что началась новая учебная сессия
function loadProgOrFresh(key) {
  const saved = loadProg(key);
  if (!saved) return freshProg();
  if (!saved.lastActiveAt || (Date.now() - saved.lastActiveAt) > SESSION_GAP_MS) {
    // новая сессия после паузы: обнуляем историю примеров и прогресс к медали (и незавершённую задачу),
    // но уже полученные медали не трогаем — это заслуженное достижение, а не сессионное состояние
    return Object.assign(freshProg(), { medals: saved.medals || { gold: 0, silver: 0, bronze: 0 } });
  }
  return saved;
}
let curProg = freshProg();
const MEDAL_EMOJI = { gold: '🥇', silver: '🥈', bronze: '🥉' };
const MEDAL_TITLE = { gold: 'Золото — пять примеров без ошибок', silver: 'Серебро — пять примеров, 1–2 ошибки', bronze: 'Бронза — пять примеров решено' };
function medalBadgeText(medals) {
  if (!medals) return '';
  return ['gold', 'silver', 'bronze'].filter(t => medals[t]).map(t => `${MEDAL_EMOJI[t]}${medals[t]}`).join(' ');
}
function renderMedalBadges() {
  const row = document.getElementById('medalBadgeRow');
  if (row) row.textContent = medalBadgeText(curProg.medals);
}
function renderExampleHistory() {
  const list = document.getElementById('exampleHistoryList');
  const empty = document.getElementById('exampleHistoryEmpty');
  const btn = document.getElementById('exampleHistoryToggle');
  if (!list) return;
  const items = curProg.history || [];
  btn.textContent = `🕓 История примеров (${items.length})`;
  list.innerHTML = '';
  empty.style.display = items.length ? 'none' : 'block';
  items.forEach(h => {
    const row = document.createElement('div');
    row.className = 'example-history-row';
    const mark = document.createElement('span');
    mark.className = 'example-history-mark';
    mark.textContent = h.hadError ? '🟡' : '✅';
    const body = document.createElement('div');
    body.className = 'example-history-body';
    const prompt = document.createElement('span');
    prompt.className = 'example-history-prompt';
    prompt.innerHTML = h.prompt;
    body.appendChild(prompt);
    if (h.answer) {
      const answer = document.createElement('span');
      answer.className = 'example-history-answer';
      answer.innerHTML = 'Ответ: ' + h.answer;
      body.appendChild(answer);
    }
    row.appendChild(mark); row.appendChild(body);
    list.appendChild(row);
  });
}

function playMedalAnimation(tier) {
  const tray = document.getElementById('medalTray');
  const emoji = MEDAL_EMOJI[tier];
  const titleRect = els.taskTitle.getBoundingClientRect();
  const flyer = document.createElement('div');
  flyer.className = 'medal-flyer';
  flyer.textContent = emoji;
  flyer.style.left = (titleRect.left + titleRect.width / 2 - 22) + 'px';
  flyer.style.top = (titleRect.top - 10) + 'px';
  flyer.style.opacity = '0';
  flyer.style.transform = 'scale(.4)';
  document.body.appendChild(flyer);

  requestAnimationFrame(() => {
    flyer.style.opacity = '1';
    flyer.style.transform = 'scale(1.3)';
    setTimeout(() => {
      tray.classList.add('show');
      const trayRect = tray.getBoundingClientRect();
      const curRect = flyer.getBoundingClientRect();
      const dx = (trayRect.left + 24) - curRect.left;
      const dy = (trayRect.top + trayRect.height / 2 - 10) - curRect.top;
      flyer.style.transform = `translate(${dx}px, ${dy}px) scale(.5)`;
      flyer.style.opacity = '0.15';
      setTimeout(() => {
        flyer.remove();
        const icon = document.createElement('span');
        icon.className = 'medal-tray-icon';
        icon.textContent = emoji;
        icon.title = MEDAL_TITLE[tier];
        tray.appendChild(icon);
      }, 900);
    }, 650);
  });
}
let hadErrorThisTask = false;
function recordSolve() {
  curProg.history.unshift({ prompt: curTask.prompt, hadError: hadErrorThisTask, answer: fmtRu(curTask.answer) });
  curProg.history = curProg.history.slice(0, 5);
  if (hadErrorThisTask) curProg.errorsInBatch = (curProg.errorsInBatch || 0) + 1;
  curProg.solvedInBatch = (curProg.solvedInBatch || 0) + 1;
  let awardedTier = null;
  if (curProg.solvedInBatch >= 5) {
    const errs = curProg.errorsInBatch || 0;
    awardedTier = errs === 0 ? 'gold' : (errs <= 2 ? 'silver' : 'bronze');
    curProg.medals[awardedTier] = (curProg.medals[awardedTier] || 0) + 1;
    curProg.solvedInBatch = 0;
    curProg.errorsInBatch = 0;
  }
  saveProg(curMode, curProg);
  renderMedalBadges();
  renderExampleHistory();
  if (awardedTier) playMedalAnimation(awardedTier);
}

function navigateType(delta){

function renderCurrentTask(){
  // страница всегда открывается на тексте задания, а не на месте прошлого скролла
  window.scrollTo(0,0);

  els.questionPanel.style.display='block';
  els.questionPromptText.innerHTML = curTask.prompt;

  els.fracPanel.style.display='none';
  els.sheetArea.style.display='none';
  els.qaPanel.style.display='none';
  els.finalInput.disabled=false;
  els.finalGo.disabled=false;

  els.mainPanel.style.display='none';
  els.nextBtn.style.display='none';
  els.explainBox.style.display='none';

  if (curSubMode === 'exam') {
    // экзамен: для ЛЮБОГО типа — сразу поле ответа, без пошаговых подсказок.
    // Кнопка «показать решение» появится только после 5 неверных попыток.
    curTask.steps = [];

    els.showSolutionBtn.style.display='none';
    els.showSolutionBtn.textContent = 'Показать решение и ответ';
    els.showSolutionBtn.onclick = null;
    showFinalPanel();
  } else if (curTask.simple) {
    // тренировка, упрощённые типы (без пошаговой дроби/деления в столбик) —
    // сразу предлагаем вписать итоговый ответ, а решение можно посмотреть по кнопке
    curTask.steps = [];
    els.planPanel.style.display='none';
    els.showSolutionBtn.style.display='block';
    els.showSolutionBtn.textContent = 'Показать решение и ответ';
    els.showSolutionBtn.onclick = ()=>{
      if (taskAnswered) return;
      if (solutionShown) hideSolution(); else revealSolution();
    };
    showFinalPanel();
  } else {
    els.showSolutionBtn.style.display='none';
    els.planPanel.style.display='block';
    els.planText.innerHTML = `<b>План решения.</b> ${SHARED_PLAN}`;
    els.finalPanel.style.display='none';
    curTask.steps = [
      { type:'fracfill2',
        question:`Вероятность равна отношению количества благоприятных исходов к общему числу исходов. Впиши дробь сам:`,
        num: curTask.favorable, den: curTask.total },
      { type:'div', dividend:String(curTask.favorable), divisor:curTask.total, decimal:true,
        maxDecimalDigits: decimalDigitsOf(curTask.answer),
        question:`Разделим дробь в столбик, чтобы получить десятичную вероятность.` },
    ];
    runStep();
  }
}

function newTask(){
  const m = curMode==='random' ? pick(MODES) : MODES.find(x=>x.id===curMode);
  curTask = m.gen();
  stepIdx = 0;
  taskAnswered = false;
  stepsDone = false;
  finalErrStep = 0;
  examAttempts = 0;
  solutionShown = false;
  hadErrorThisTask = false;

  if (curMode !== 'random') {
    curProg.task = curTask;
    curProg.answered = false;
    saveProg(curMode, curProg);
  }

  renderCurrentTask();
}

// при входе в прототип (или переходе между ними стрелками) — восстановить последний
// пример, а не выдавать новый; для "случайно" прогресс не хранится вовсе
function resumeOrNewTask(){
  if (curMode !== 'random' && curProg && curProg.task) {
    curTask = curProg.task;
    stepIdx = 0;
    taskAnswered = !!curProg.answered;
    stepsDone = false;
    finalErrStep = 0;
    examAttempts = 0;
    solutionShown = false;
    hadErrorThisTask = false;

    renderCurrentTask();

    if (taskAnswered) {
      els.sheetArea.style.display = 'none';
      els.qaPanel.style.display = 'none';
      els.planPanel.style.display = 'none';
      els.fracPanel.style.display = 'none';
      els.finalPanel.style.display = 'none';
      finishTask(false);
    }
  } else {
    newTask();
  }
}

function revealSolution(){
  solutionShown = true;
  els.showSolutionBtn.textContent = 'Скрыть решение и ответ';
  els.mainPanel.style.display='block';
  els.explainBox.style.display='block';
  els.explainBox.innerHTML = `<b>Решение:</b> ${curTask.explain}`;
  els.nextBtn.style.display='block';

  els.mainPanel.classList.add('reveal');
}
function hideSolution(){
  solutionShown = false;
  els.showSolutionBtn.textContent = 'Показать решение и ответ';
  els.mainPanel.style.display='none';
  els.explainBox.style.display='none';
  els.nextBtn.style.display='none';
}
/* els.showSolutionBtn.onclick назначается в newTask() отдельно для каждого
   режима (тренировка/экзамен) — см. выше */

function runStep(){
  if(taskAnswered) return;
  const steps = curTask.steps;
  if(stepIdx >= steps.length){
    showFinalPanel();
    return;
  }
  const step = steps[stepIdx];
  if(step.type==='fracfill2'){
    els.fracPanel.style.display='block';
    createProbFracWidget(fracPanelEls(), step, ()=>{
      stepIdx++; setTimeout(runStep, 400);
    });
  } else if(step.type==='div'){
    // fracPanel НЕ трогаем — заполненная дробь остаётся на экране, пока
    // рядом появляется деление в столбик
    els.sheetArea.style.display='block';
    els.qaPanel.style.display='block';
    createDivWidget(document.getElementById('sheetArea'), qaPanelEls(), step, ()=>{
      stepIdx++; setTimeout(runStep, 500);
    });
  }
  syncKeypadVisibility();
}

function showFinalPanel(){
  stepsDone = true;
  els.finalPanel.style.display='block';
  els.finalInput.value='';
  els.finalHint.textContent = '';
  els.finalHint.className='hint';
  setTimeout(()=>els.finalInput.focus({preventScroll:true}), 30);
  syncKeypadVisibility();
}

function normDec(x){ return Math.round(Number(String(x).replace(',','.'))*10000)/10000; }
function decimalDigitsOf(x){
  const s = String(x);
  const i = s.indexOf('.');
  return i===-1 ? 1 : Math.max(1, s.length - i - 1);
}

function submitFinal(){
  if(taskAnswered) return;
  const raw = els.finalInput.value.trim();
  if(raw==='') return;
  const ok = normDec(parseRuNumber(raw)) === normDec(curTask.answer);
  if(!ok){
    totalErrors++; els.stErrors.textContent = totalErrors;
    hadErrorThisTask = true;
    streak = 0; els.stStreak.textContent = streak;
    els.finalInput.classList.remove('shake'); void els.finalInput.offsetWidth; els.finalInput.classList.add('shake');
    if(curSubMode==='exam'){
      examAttempts++;
      const left = 5 - examAttempts;
      if(left<=0){
        els.finalHint.textContent = 'Попытки закончились — можешь посмотреть решение.';
        els.finalHint.className='hint';
        els.finalInput.disabled = true;
        els.finalGo.disabled = true;
        els.showSolutionBtn.style.display='block';
        els.showSolutionBtn.textContent = 'Показать решение и ответ';
        els.showSolutionBtn.onclick = finishRound;
      } else {
        els.finalHint.textContent = `Неверно. Осталось попыток: ${left}.`;
        els.finalHint.className='hint';
      }
    } else {
      finalErrStep++;
      if(finalErrStep>=3){
        els.finalHint.textContent = `Правильный ответ: ${fmtRu(curTask.answer)}.`;
        els.finalHint.className='hint';
        finishRound();
      } else {
        els.finalHint.textContent='Попробуй ещё раз.';
        els.finalHint.className='hint';
      }
    }
    els.finalInput.value=''; els.finalInput.focus({preventScroll:true});
    return;
  }
  els.finalHint.textContent = pick(['Верно!','Точно!','Отлично!']);
  els.finalHint.className='hint good';
  streak++; els.stStreak.textContent = streak;
  finishRound();
}
els.finalGo.onclick = submitFinal;
els.finalInput.onkeydown = e=>{ if(e.key==='Enter') submitFinal(); };

function finishRound(){
  taskAnswered = true;
  totalSolved++;
  els.stSolved.textContent = totalSolved;
  els.finalInput.disabled = true;
  els.finalGo.disabled = true;
  if (curMode !== 'random') {
    curProg.answered = true;
    saveProg(curMode, curProg);

  finishTask(true);
}

function finishTask(isFreshSolve){
  // прогресс/медали фиксируем сразу, синхронно — иначе быстрый клик по "следующий
  // пример" может сменить curTask/curProg ещё до срабатывания setTimeout ниже
  if (isFreshSolve && curMode !== 'random') recordSolve();

  els.showSolutionBtn.style.display='none';
  const fading = [els.sheetArea, els.qaPanel, els.planPanel, els.fracPanel, els.finalPanel].filter(el=>el.style.display!=='none');
  fading.forEach(el=>el.classList.add('fade-out'));
  setTimeout(()=>{
    [els.sheetArea, els.qaPanel, els.planPanel, els.fracPanel, els.finalPanel].forEach(el=>{ el.style.display='none'; });
    fading.forEach(el=>el.classList.remove('fade-out'));
    syncKeypadVisibility();

    els.mainPanel.style.display='block';
    els.explainBox.style.display='block';
    els.explainBox.innerHTML = `<b>Решение:</b> ${curTask.explain}`;
    els.nextBtn.style.display='block';

    els.mainPanel.classList.remove('reveal');
    void els.mainPanel.offsetWidth; // перезапуск анимации
    els.mainPanel.classList.add('reveal');
  }, fading.length ? 190 : 0);
}
