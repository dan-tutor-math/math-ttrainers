<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0B0E1A">
<script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конспект — Mathh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="works.css">
<style>
/* Конспект сессии (промпт №16): список сессий и редактор страниц.
   Отдельная страница, а не режим досок — по решению Даниила: конспект
   правится постранично, как тетрадь, а не на бесконечном полотне.
   Оформление — тренажёров (works.css), холст страницы — белый лист. */
.wrap{max-width:980px;margin:0 auto;}

/* ── список сессий ── */
.sl-list{display:flex;flex-direction:column;gap:10px;}
.sl-row{display:flex;align-items:center;gap:14px;margin:0;padding:14px 18px;}
.sl-row.current{border-color:var(--ink);}
.sl-main{flex:1;min-width:0;cursor:pointer;}
.sl-name{font-size:17px;font-weight:700;line-height:1.25;word-break:break-word;}
.sl-meta{font-size:13.5px;color:var(--muted-2);margin-top:3px;}
.sl-meta b{color:var(--ok);font-weight:600;}
.sl-acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.sl-name-input{font-size:16px;padding:7px 10px;max-width:420px;}
.sl-confirm{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--teacher);font-weight:600;}
.sl-empty{text-align:center;color:var(--muted-2);padding:34px 10px;line-height:1.55;}
.sl-top{display:flex;justify-content:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}

/* ── редактор ── */
body.editing{padding:0;overflow:hidden;height:100vh;}
body.editing .wrap{display:none;}
.ed{display:none;height:100vh;flex-direction:column;}
body.editing .ed{display:flex;}
.ed-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--glass-border);background:var(--glass-strong);
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);z-index:5;flex-wrap:wrap;}
.ed-title{flex:1;min-width:180px;font-family:var(--font-ui);font-size:17px;font-weight:700;color:var(--pencil);background:transparent;
  border:1.5px solid transparent;border-radius:10px;padding:6px 8px;}
.ed-title:hover{border-color:var(--glass-border);}
.ed-title:focus{outline:none;border-color:var(--ink);background:var(--card);}
.ed-count{font-size:13px;color:var(--muted-2);white-space:nowrap;}
.ed-body{flex:1;display:flex;min-height:0;}
.ed-pages{width:236px;flex:0 0 236px;overflow-y:auto;padding:12px 10px 18px;border-right:1px solid var(--glass-border);background:var(--glass);}
.pg-item{position:relative;border:2px solid transparent;border-radius:12px;padding:6px;margin-bottom:8px;cursor:pointer;background:var(--card);}
.pg-item:hover{border-color:var(--glass-border);}
.pg-item.sel{border-color:var(--ink);}
.pg-item.drop-before{box-shadow:0 -3px 0 var(--ink);}
.pg-item.drop-after{box-shadow:0 3px 0 var(--ink);}
.pg-item canvas{display:block;width:100%;height:auto;border-radius:6px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08);}
.pg-num{position:absolute;left:10px;top:10px;font-size:11px;font-weight:700;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 6px;}
.pg-cap{font-size:11.5px;line-height:1.3;color:var(--muted-3);margin-top:5px;word-break:break-word;}
.pg-cap .pg-res{display:inline-block;font-weight:700;border-radius:6px;padding:0 5px;margin-top:2px;}
.pg-res.ok{background:var(--ok-tint);color:var(--ok);}
.pg-res.bad{background:rgba(255,59,48,.12);color:var(--teacher);}
.pg-res.none,.pg-res.notes,.pg-res.blank{background:var(--hl-10);color:var(--ink);}
.pg-acts{position:absolute;right:10px;top:10px;display:none;gap:3px;}
.pg-item:hover .pg-acts,.pg-item.sel .pg-acts{display:flex;}
.pg-acts button{width:24px;height:24px;border-radius:7px;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer;line-height:24px;padding:0;}
.pg-acts button:hover{background:#000;}
.pg-acts button.del:hover{background:var(--teacher);}
.pg-confirm{display:flex;gap:4px;align-items:center;justify-content:space-between;margin-top:6px;font-size:12px;font-weight:600;color:var(--teacher);}
.pg-add{width:100%;margin-top:2px;}
.ed-stage{flex:1;position:relative;min-width:0;overflow:hidden;}
.ed-stage canvas#pc{position:absolute;touch-action:none;background:#fff;box-shadow:0 8px 30px rgba(20,30,60,.16);border-radius:4px;}
.ed-tools{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center;
  background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);
  border-radius:18px;padding:6px 8px;box-shadow:var(--shadow);z-index:4;max-width:calc(100% - 20px);}
.tb{min-width:34px;height:34px;border-radius:11px;border:1px solid var(--glass-border);background:var(--glass);color:var(--pencil);cursor:pointer;
  font-family:var(--font-ui);font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 8px;}
.tb:hover{border-color:var(--ink);}
.tb.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.tb:disabled{opacity:.4;cursor:default;}
.tb.txt{font-size:12.5px;}
.tsep{width:1px;align-self:stretch;background:var(--glass-border);margin:2px 2px;}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--glass-border);cursor:pointer;padding:0;}
.sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink);}
.wd{width:30px;height:30px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.wd span{display:block;border-radius:50%;background:var(--pencil);}
.wd.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset;}
.tgroup{display:flex;align-items:center;gap:4px;}
.ed-nav{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;z-index:4;
  background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:14px;padding:5px 8px;box-shadow:var(--shadow);font-size:14px;font-weight:600;}
.ed-nav .tb{height:30px;}
.ed-empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:var(--muted-2);padding:20px;line-height:1.55;}
.ed-empty.on{display:flex;}
.txt-edit{position:absolute;z-index:6;min-width:60px;border:1.5px dashed var(--ink);background:rgba(255,255,255,.92);color:#000;resize:none;overflow:hidden;
  padding:0;margin:0;line-height:1.25;white-space:pre;outline:none;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;}
.busy{opacity:.6;pointer-events:none;}
@media (max-width:760px){
  .ed-pages{width:150px;flex-basis:150px;}
  .pg-cap{display:none;}
}
</style>
</head>
<body>
<a class="corner-btn left" href="index.html" id="homeBtn" title="К тренажёрам">←</a>

<div class="wrap" id="listView">
  <h1>Конспекты сессий</h1>
  <div class="sub">страницы сохраняются сами, когда в тренажёре переходишь к следующему заданию</div>
  <div class="sl-top">
    <button class="btn quiet small" id="slNew" type="button">＋ Начать новую сессию</button>
  </div>
  <div class="sl-list" id="slList"></div>
</div>

<div class="ed" id="edView">
  <div class="ed-top">
    <button class="btn quiet small" id="edBack" type="button">← Все сессии</button>
    <input class="ed-title" id="edTitle" type="text" maxlength="80" aria-label="Название сессии" title="Нажмите, чтобы переименовать">
    <span class="ed-count" id="edCount"></span>
    <button class="btn quiet small" id="edBoard" type="button" title="Каждая страница — отдельный лист доски">Сохранить как доску</button>
    <button class="btn small" id="edPdf" type="button">Собрать PDF</button>
  </div>
  <div class="ed-body">
    <div class="ed-pages" id="edPages"></div>
    <div class="ed-stage" id="edStage">
      <canvas id="pc"></canvas>
      <div class="ed-tools" id="edTools">
        <div class="tgroup">
          <button class="tb" data-tool="select" title="Выделение (V): выделить, двигать, менять размер">⬚</button>
          <button class="tb" data-tool="pen" title="Ручка (P)">✏️</button>
          <button class="tb" data-tool="eraser" title="Ластик (E)">🧽</button>
          <button class="tb" data-tool="text" title="Текст (T)">T</button>
          <button class="tb" data-tool="line" title="Линия (L)">╱</button>
          <button class="tb" data-tool="arrow" title="Стрелка (A)">↗</button>
          <button class="tb" data-tool="rect" title="Прямоугольник (R)">▭</button>
          <button class="tb" data-tool="ellipse" title="Эллипс (O)">◯</button>
        </div>
        <span class="tsep"></span>
        <div class="tgroup" id="edColors"></div>
        <div class="tgroup" id="edWidths"></div>
        <div class="tgroup" id="edErModes" hidden>
          <button class="tb txt" data-ermode="area" title="Стирает только то, что под ластиком">▦ Область</button>
          <button class="tb txt" data-ermode="stroke" title="Касание удаляет штрих или фигуру целиком">〰 Штрих</button>
        </div>
        <span class="tsep"></span>
        <div class="tgroup">
          <button class="tb" id="edUndo" title="Отменить (Ctrl+Z)">↶</button>
          <button class="tb" id="edRedo" title="Вернуть (Ctrl+Shift+Z)">↷</button>
          <button class="tb txt" id="edCopy" title="Копировать (Ctrl+C)">Копировать</button>
          <button class="tb txt" id="edPaste" title="Вставить (Ctrl+V)">Вставить</button>
          <button class="tb" id="edDel" title="Удалить выделенное (Delete)">🗑</button>
        </div>
      </div>
      <div class="ed-nav" id="edNav">
        <button class="tb" id="edPrev" title="Предыдущая страница (PageUp)">◀</button>
        <span id="edPos">—</span>
        <button class="tb" id="edNext" title="Следующая страница (PageDown)">▶</button>
      </div>
      <div class="ed-empty" id="edEmpty">В этой сессии пока нет страниц.<br>Добавьте пустую страницу слева или поработайте в тренажёрах.</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="jspdf.umd.min.js"></script>
<script src="notes-store.js"></script>
<script src="notes-editor.js"></script>
</body>
</html>
