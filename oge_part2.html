<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E1A">
<script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОГЭ, часть 2 — задания демоверсии</title>
<link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="onest.css">
<style>
/* формулы KaTeX прячем, пока не подтвердится, что нужные шрифты реально
   загружены — иначе на долю секунды может мелькнуть текст, отрисованный
   запасным системным шрифтом с другими пропорциями (степени/скобки
   выглядят непропорционально крупными), а затем резко "дёрнуться" в
   правильный размер. Класс katex-fonts-ready ставится в конце прогрева. */
.katex{visibility:hidden}
html.katex-fonts-ready .katex{visibility:visible}
:root{
  --font-ui:'Onest',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --font-mono:ui-monospace,-apple-system,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#EEF1F7;
  --blob-1:rgba(120,150,255,.16);
  --blob-2:rgba(190,150,230,.14);
  --card:rgba(255,255,255,.8);
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.85);
  --glass-inset:rgba(255,255,255,.55);
  --hl:var(--hl-14);
  --muted-1:#8E8E93;
  --muted-2:#6E6E73;
  --muted-3:#48484A;
  --muted-4:#3A3A3C;
  --muted-5:#1D1D1F;
  --muted-6:#8E8E93;
  --paper:#FDFCF7;
  --grid:#DCE4F0;
  --ink:#004C99;
  --ink-active:#003A75;
  --pencil:#1D1D1F;
  --teacher:#FF3B30;
  --ok:#248A3D;
  --ok-tint:rgba(36,138,61,.1);
  --ok-shadow:rgba(36,138,61,.3);
  --shadow:0 10px 34px rgba(20,30,60,.08);
  --hl-10:rgba(0,76,153,.10);
  --hl-14:var(--hl);
  --hl-35:rgba(0,76,153,.35);
  /* цвета внутри вырезанных из демоверсии рисунков (см. oge-part2-figs.js) */
  --fig-grid:#9aa1ad;
}
html[data-theme="dark"]{
  --bg:#0B0E1A;
  --blob-1:rgba(90,110,255,.22);
  --blob-2:rgba(150,90,220,.18);
  --paper:#151A2C;
  --card:rgba(30,37,64,.82);
  --glass:rgba(40,46,74,.5);
  --glass-strong:rgba(46,53,84,.65);
  --glass-border:rgba(255,255,255,.12);
  --glass-inset:rgba(255,255,255,.07);
  --hl:rgba(40,110,214,.26);
  --grid:#232A44;
  --ink:#2E7DE0;
  --ink-active:#4A93F0;
  --pencil:#F2F3F5;
  --teacher:#FF6961;
  --ok:#3E8E5B;
  --ok-tint:rgba(62,142,91,.14);
  --ok-shadow:rgba(62,142,91,.35);
  --shadow:0 10px 40px rgba(0,0,0,.55);
  --hl-10:rgba(46,125,224,.16);
  --hl-14:var(--hl);
  --hl-35:rgba(46,125,224,.5);
  --muted-1:#9A9AA2;
  --muted-2:#9A9AA2;
  --muted-3:#AEAEB4;
  --muted-4:#C7C7CC;
  --muted-5:#F2F3F5;
  --muted-6:#9A9AA2;
  --fig-grid:#5C6688;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    var(--bg);
  font-family:var(--font-ui);
  color:var(--pencil);
  min-height:100vh;
  padding:18px 12px 60px;
}
.wrap{max-width:860px;margin:0 auto;position:relative;z-index:1;pointer-events:none}
.wrap > *{pointer-events:auto}

/* ─── калькулятор в столбик (свой пример) — встраивает настоящие тренажёры через iframe ─── */
.calc-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.calc-tool-btn{flex:1;min-width:130px;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:11px 8px;cursor:pointer;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, border-color .12s, background .12s, color .12s;}
.calc-tool-btn:active{transform:scale(.96)}
.calc-tool-btn:hover{border-color:var(--ink)}
.calc-tool-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.calc-panel{display:none;position:relative;padding:18px;}
.calc-panel-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-strong);color:var(--muted-3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .15s;}
.calc-panel-close:active{transform:scale(.9)}
.calc-panel-close:hover{border-color:var(--ink)}
.calc-panel-title{font-family:var(--font-ui);font-weight:700;font-size:15px;color:var(--pencil);margin-bottom:14px;padding-right:32px;}
.calc-iframe{display:block;width:100%;border:none;border-radius:14px;background:transparent;}
.calc-history-panel{display:none;position:relative;padding:18px;margin-bottom:14px;}
.calc-history-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-right:32px;}
.calc-history-filter{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:6px 12px;cursor:pointer;transition:transform .15s, border-color .12s, background .12s, color .12s;}
.calc-history-filter:active{transform:scale(.96)}
.calc-history-filter:hover{border-color:var(--ink)}
.calc-history-filter.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.calc-history-list{display:flex;flex-direction:column;}
.calc-history-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--glass-border);}
.calc-history-row:first-child{border-top:none;}
.calc-history-num{font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-6);min-width:20px;}
.calc-history-expr{font-family:var(--font-mono);font-size:15px;color:var(--pencil);flex:1;}
.calc-history-copy{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:6px 10px;cursor:pointer;white-space:nowrap;transition:border-color .12s, background .12s;}
.calc-history-copy:hover{border-color:var(--ink)}
.calc-history-copy:active{transform:scale(.96)}
.calc-history-empty{font-family:var(--font-ui);font-size:14px;color:var(--muted-6);text-align:center;padding:16px 0;}

/* ─── интерактивная доска на фоне вокруг примера ─── */
#boardCanvas{position:fixed;top:0;left:0;z-index:2;touch-action:none;cursor:crosshair;border-radius:20px;}
#boardCanvasBg{position:fixed;top:0;left:0;z-index:0;touch-action:none;cursor:crosshair;}
/* Промпт №60 (включается EXAM.boardPinned). trainer-board.js ставит холст
   листа в координатах ДОКУМЕНТА, а position:fixed считает их от окна — при
   прокрутке заметки уезжали вместе с экраном, а не с заданием. И холст выше
   .wrap по z-index перехватывал нажатия: «Проверить» и поле ответа под ним
   не нажимались. Как в ОГЭ №8: absolute и без pointer-events — рисование
   запускает document-обработчик в trainer-board.js, а кнопки и поля он
   пропускает сам (isBoardInteractiveTarget) */
html[data-board-pinned] #boardCanvas{position:absolute;pointer-events:none;}
#boardSpace{height:0;pointer-events:none;transition:height .2s ease;}
.board-toolbar{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:8px;align-items:center;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:20px;padding:9px 11px;box-shadow:var(--shadow);}
.toolbar-sep{width:1px;align-self:stretch;background:var(--glass-border);margin:2px 0;}
.board-tool-btn{width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s, border-color .15s, background .15s;}
.board-tool-btn:active{transform:scale(.92)}
.board-tool-btn:hover{border-color:var(--ink);}
.board-tool-btn.active{background:var(--ink);border-color:var(--ink);}
.board-tool-btn .dot{border-radius:50%;background:var(--pencil);display:block;}
.board-tool-btn.active .dot{background:#fff;}
.board-tool-btn.eraser{font-size:15px;}
.board-tool-btn.pen-main{font-size:15px;}
.board-tool-btn.color-btn.active{background:var(--glass);border-color:var(--ink);box-shadow:0 0 0 2px var(--ink);}
.tool-group{position:relative;}
/* всплывающее окошко с размерами (для ручки и ластика) — управляется из JS через
   класс .open, а не через :hover, потому что чистый CSS-hover рвётся, стоит
   курсору чуть отклониться от прямой линии между кнопкой и окошком */
.size-flyout{position:absolute;bottom:100%;right:0;margin-bottom:10px;display:none;gap:8px;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;padding:8px;box-shadow:var(--shadow);}
.size-flyout.open{display:flex;}
/* невидимый мостик над кнопкой, чтобы курсор не «выпадал» из зоны наведения,
   пока едет от кнопки к окошку */
.tool-group::after{content:'';position:absolute;left:0;right:0;bottom:100%;height:14px;}

/* ─── всплывающая палитра для «своего» цвета ─── */
.board-tool-btn.custom-color-btn{overflow:hidden;}
.color-picker-flyout{flex-direction:column;align-items:stretch;width:200px;padding:12px;gap:10px;}
.cp-sv-wrap{position:relative;width:100%;height:120px;border-radius:12px;overflow:hidden;cursor:crosshair;touch-action:none;}
.cp-sv{display:block;width:100%;height:100%;}
.cp-sv-thumb{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;top:0;left:0;}
.cp-row{display:flex;align-items:center;gap:8px;}
.cp-eyedropper{width:28px;height:28px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--pencil);transition:transform .15s;}
.cp-eyedropper:active{transform:scale(.9)}
.cp-eyedropper:hover{border-color:var(--ink);}
.cp-swatch{width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);}
.cp-hue-wrap{position:relative;flex:1;height:16px;touch-action:none;}
.cp-hue{position:absolute;inset:0;border-radius:8px;background:linear-gradient(to right,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);cursor:pointer;}
.cp-hue-thumb{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;}
.cp-rgb-row{display:flex;gap:6px;}
.cp-field{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.cp-field input{width:100%;box-sizing:border-box;text-align:center;border-radius:8px;border:1px solid var(--glass-border);background:var(--glass);color:var(--pencil);font-family:var(--font-mono);font-size:12px;padding:5px 2px;}
.cp-field label{font-size:10px;color:var(--muted-3);font-family:var(--font-ui);}

.board-view-toolbar{position:fixed;left:18px;bottom:18px;z-index:50;display:flex;gap:8px;align-items:center;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:20px;padding:9px 11px;box-shadow:var(--shadow);}
.board-zoom-label{min-width:44px;height:34px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-3);padding:0 6px;transition:transform .15s;}
.board-zoom-label:active{transform:scale(.92)}
.board-zoom-label:hover{border-color:var(--ink);}
.board-tool-btn.hand-tool{font-size:16px;}
.board-tool-btn.clear-btn{font-size:15px;}

/* ─── доска изначально выключена — включается отдельной кнопкой под переключателем темы ─── */
html:not([data-board="on"]) .board-toolbar,
html:not([data-board="on"]) .board-view-toolbar{display:none;}
html:not([data-board="on"]) #boardCanvas,
html:not([data-board="on"]) #boardCanvasBg{pointer-events:none;}
html[data-board="on"] #boardSpace{height:72vh;transition:height .32s ease;}
html[data-board="on"][data-focus="on"] #boardSpace{height:90vh;}
html[data-board="on"] body{background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    var(--bg);}
/* ─── свернуть подсказки: освобождает место для записи на доске ─── */
.focus-toggle{position:fixed;top:112px;right:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;}
.focus-toggle:hover{border-color:var(--ink)}
.focus-toggle:active{transform:scale(.92)}

/* ─── аккуратное сворачивание: max-height/opacity вместо мгновенного display:none ─── */
h1,.sub,.stats,.submode-row{overflow:hidden;min-height:0;transition:max-height .32s ease, opacity .22s ease, margin .32s ease;}
h1{max-height:64px}
.sub{max-height:50px}
.stats{max-height:90px}
.submode-row{max-height:56px}
html[data-focus="on"] h1,
html[data-focus="on"] .sub,
html[data-focus="on"] .stats,
html[data-focus="on"] .submode-row{
  max-height:0;
  min-height:0;
  padding:0;
  border-width:0;
  opacity:0;
  margin-top:0;
  margin-bottom:0;
  pointer-events:none;
}
html[data-focus="on"] #pickerArea{display:none!important;}
h1{font-family:var(--font-ui);font-weight:700;letter-spacing:-.02em;font-size:clamp(24px,5vw,34px);color:var(--pencil);text-align:center;}
.sub{font-family:var(--font-ui);font-weight:500;text-align:center;color:var(--muted-2);font-size:15px;margin:4px 0 18px;}
.submode-tabs{display:flex;gap:8px;}
.submode-row{margin-bottom:14px;}
.submode-tab{flex:1;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--muted-3);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:10px 6px;cursor:pointer;text-align:center;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, border-color .15s, color .15s, background .15s;}
.submode-tab:active{transform:scale(.96)}
.submode-tab:hover{border-color:var(--ink);}
.submode-tab.active{color:#fff;background:var(--ink);border-color:var(--ink);}
.refresh-btn{width:28px;height:28px;flex:0 0 auto;border:1px solid var(--glass-border);border-radius:50%;background:var(--glass-strong);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-size:15px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .18s, border-color .12s;}
.refresh-btn:hover{border-color:var(--ink);transform:rotate(80deg)}
.refresh-btn:active{transform:scale(.9)}
.basket-add-btn{width:28px;height:28px;flex:0 0 auto;border:1px solid var(--glass-border);border-radius:50%;background:var(--glass-strong);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-size:13px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s, border-color .12s, background .2s, color .2s;}
.basket-add-btn:hover{border-color:var(--ink)}
.basket-add-btn:active{transform:scale(.9)}
.basket-add-btn.ok{background:var(--ok, #34c759);border-color:var(--ok, #34c759);color:#fff;}
.task-title{font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--muted-3);}
.panel{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:22px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);padding:20px;margin-bottom:14px;}
@keyframes revealUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
#mainPanel.reveal{animation:revealUp .38s cubic-bezier(.22,.9,.35,1) both;}

/* ─── экран выбора прототипа (как список типов в ОГЭ №8) ─── */
.group-title{font-family:var(--font-ui);font-weight:700;font-size:14px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;margin:0 2px 10px;}
.modes{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
.mode-card{display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;text-align:left;background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:14px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);padding:11px 18px;cursor:pointer;transition:transform .12s, border-color .12s;font-family:var(--font-ui);}
.mode-card:hover{border-color:var(--ink);transform:translateX(3px)}
.mode-card .mtitle{font-weight:600;font-size:15px;color:var(--pencil);line-height:1.3;flex:0 0 auto;margin:0;}
.mode-card .mpeek{font-family:var(--font-ui);font-size:13px;color:var(--muted-6);line-height:1.35;flex:1 1 240px;min-width:0;}
.mode-card .mcount{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-3);flex:0 0 auto;}
/* разделы списка, когда задания номера собраны в группы (ОГЭ №20 из банка ФИПИ) */
/* название группы бывает длинным — на телефоне переносим его, а не
   распираем страницу вбок (у обычных карточек название не переносится) */
.mode-card[data-gid] .mtitle{flex:0 1 auto;max-width:100%}
.proto-section{font-family:var(--font-ui);font-weight:700;font-size:13px;color:var(--muted-3);margin:16px 2px 2px;}
.proto-section:first-child{margin-top:4px}
/* подпись источника под условием — как в ОГЭ №19; внутри #egeQuestion,
   поэтому едет и в «Подборку», и на доску */
.ege-source{font-family:var(--font-ui);font-weight:500;font-size:12.5px;color:var(--muted-3);margin:10px 0 0;}
.mode-card .mdone{font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--ok);flex:0 0 auto;}
/* шапка задания: слева переходы между прототипами, справа название и «в подборку».
   flex-wrap — чтобы на телефоне кнопки переносились, а не вылезали за край */
.task-head{display:flex;flex-wrap:wrap;row-gap:8px;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding-right:62px;}
.type-nav{display:flex;flex-wrap:wrap;row-gap:6px;align-items:center;gap:8px;}
.type-nav-btn{height:28px;flex:0 0 auto;border:1px solid var(--glass-border);border-radius:12px;background:var(--glass-strong);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-family:var(--font-ui);font-weight:600;font-size:12px;line-height:1;cursor:pointer;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;transition:transform .12s, border-color .12s;}
.type-nav-btn:hover{border-color:var(--ink)}
.type-nav-btn:active{transform:scale(.9)}
.back-btn{font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:8px 14px;cursor:pointer;transition:transform .12s, border-color .12s;}
.back-btn:active{transform:scale(.96)}
.back-btn:hover{border-color:var(--ink)}
.corner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.src-note{font-family:var(--font-ui);font-size:12px;color:var(--muted-6);}

/* ─── условие ─── */
.ege-text{font-family:var(--font-ui);font-weight:400;font-size:clamp(16px,2.6vw,18px);line-height:1.6;color:var(--muted-5);}
.ege-text b{font-weight:700}
.ege-text .katex{font-size:1.06em}
/* рисунок кладём на «бумагу»: внутри вырезанных из демоверсии SVG белая
   подложка и сетка нарисованы переменными --fig-bg/--fig-grid, поэтому
   в тёмной теме рисунок перекрашивается вместе со страницей */
.ege-fig{background:var(--paper);border:1px solid var(--glass-border);border-radius:14px;padding:12px;margin:14px auto 4px;max-width:520px;color:var(--pencil);--fig-bg:var(--paper);}
.ege-fig svg{display:block;width:100%;height:auto;max-height:320px;}
.ege-table{width:100%;border-collapse:collapse;margin:12px 0 4px;font-family:var(--font-ui);font-size:14px;}
.ege-table td{border:1px solid var(--glass-border);padding:6px 10px;text-align:center;}
.ege-table tr td:first-child{text-align:left;font-weight:600;color:var(--muted-3);}
.ege-list{margin:8px 0 8px 22px;}
.ege-list li{margin:4px 0;}
/* таблицы с заголовком и столбцы «установите соответствие» — из заданий
   базового уровня (ege-base-bank.js). Широкая таблица на телефоне
   прокручивается внутри .ege-tbl, а не распирает страницу */
.ege-tbl{overflow-x:auto;margin:12px 0 4px;}
.ege-tbl .ege-table{margin:0;min-width:420px;}
.ege-table th{border:1px solid var(--glass-border);padding:6px 10px;font-weight:600;font-size:13px;line-height:1.3;color:var(--muted-3);background:var(--hl-10);}
.ege-match{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin:12px 0;}
.ege-match > div > div{margin:3px 0;}
.ege-match .ege-fig{margin:4px 0;}
.ege-match-h{font-weight:600;font-size:.88em;letter-spacing:.02em;color:var(--muted-3);}
@media (max-width:560px){.ege-match{grid-template-columns:1fr;}}
.ege-stmts{margin:10px 0;}
.ege-stmts > div{margin:4px 0;padding-left:1.4em;text-indent:-1.4em;}

/* ─── поля ответа ─── */
.answer-area{margin-top:18px;}
.input-answer-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.answer-input{
  font-family:var(--font-mono);font-size:18px;color:var(--ink);
  background:var(--card);border:1.5px solid var(--glass-border);border-radius:14px;
  padding:11px 14px;width:150px;
}
.answer-input.wide{width:min(340px,100%);}
.answer-input:focus{outline:none;border-color:var(--ink)}
.answer-input.good{border-color:var(--ok);background:var(--ok-tint);color:var(--ok);}
.answer-input.bad{border-color:var(--teacher);background:rgba(255,59,48,.1);color:var(--teacher);}
.answer-input.fixed{border-color:var(--ink);border-style:dashed;background:var(--hl-10);}
@keyframes shakeInput{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.answer-input.shake{animation:shakeInput .35s;}
.check-btn{font-family:var(--font-ui);font-weight:600;font-size:15px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:11px 22px;cursor:pointer;transition:transform .15s;}
.check-btn:active{transform:scale(.98)}
.check-btn:disabled{opacity:.5;cursor:default}
.p2-field{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.p2-label{font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--muted-3);min-width:28px;}
.p2-unit{font-family:var(--font-ui);font-size:14px;color:var(--muted-6);}
.field-hint{font-family:var(--font-ui);font-size:12px;color:var(--muted-6);flex-basis:100%;margin:-4px 0 0 38px;}
.yn-group{display:flex;gap:8px;}
.yn-btn{font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--muted-3);background:var(--card);border:1.5px solid var(--glass-border);border-radius:12px;padding:9px 20px;cursor:pointer;transition:transform .12s, border-color .12s, background .12s, color .12s;}
.yn-btn:hover{border-color:var(--ink)}
.yn-btn:active{transform:scale(.96)}
.yn-btn.sel{background:var(--ink);border-color:var(--ink);color:#fff;}
.yn-group.good .yn-btn.sel{background:var(--ok);border-color:var(--ok);}
.yn-group.bad .yn-btn.sel{background:var(--teacher);border-color:var(--teacher);}
.yn-group.fixed .yn-btn.sel{background:var(--ink);border-style:dashed;}
.sym-bar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px;}
.sym-btn{font-family:var(--font-mono);font-size:15px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:9px;padding:5px 11px;cursor:pointer;transition:transform .12s, border-color .12s;}
.sym-btn:hover{border-color:var(--ink)}
.sym-btn:active{transform:scale(.94)}
.answer-msg{font-family:var(--font-ui);font-size:13px;color:var(--teacher);margin-top:8px;min-height:0;}
.manual-note{font-family:var(--font-ui);font-size:13px;color:var(--muted-6);margin-top:10px;line-height:1.45;}
.ans-note{font-weight:400;font-size:14px;color:var(--muted-6);}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.soft-btn{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:11px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .12s, border-color .12s;}
.soft-btn:hover{border-color:var(--ink)}
.soft-btn:active{transform:scale(.96)}

/* ─── несколько заданий на экране (как в ОГЭ №8) ─── */
.work-zone{position:relative;left:50%;transform:translateX(-50%);max-width:calc(100vw - 24px);width:var(--work-w, 100%);}
.work-resize-handle{position:absolute;top:0;bottom:0;width:10px;cursor:ew-resize;touch-action:none;z-index:5;}
.work-resize-handle.left{left:0;}
.work-resize-handle.right{right:0;}
.tasks-columns{display:grid;gap:14px;align-items:start;}
/* без min-width:0 колонка сетки растёт по самому широкому содержимому, и
   таблица задания распирала страницу на телефоне вместо прокрутки в .ege-tbl */
.tasks-columns > *{min-width:0;}
.added-task-card{position:relative;}
.card-btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.card-btn-row .soft-btn{margin-top:0;}
.icon-only{font-size:15px;line-height:1;padding:8px 11px;}
.added-remove-btn{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--teacher);background:none;border:1px solid transparent;border-radius:11px;padding:8px 10px;cursor:pointer;margin-left:auto;transition:border-color .12s;}
.added-remove-btn:hover{border-color:var(--teacher)}
.added-explain{margin-top:12px;border-top:1px solid var(--glass-border);padding-top:12px;}
.add-rail{position:fixed;left:12px;top:50%;transform:translateY(-50%);z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;}
.add-rail-toggle{width:44px;height:44px;flex:0 0 auto;border:none;border-radius:50%;background:var(--ink);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .15s;}
.add-rail-toggle:hover{transform:scale(1.06)}
.add-rail.open .add-rail-toggle{transform:rotate(45deg)}
.add-rail-body{display:none;flex-direction:column;gap:6px;background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;padding:10px 8px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:70vh;overflow-y:auto;}
.add-rail.open .add-rail-body{display:flex;}
.add-rail-label{font-family:var(--font-ui);font-weight:600;font-size:11px;color:var(--muted-3);text-align:center;margin-bottom:2px;}
.add-rail-body .add-qty-btn{min-width:46px;text-align:center;padding:8px 6px;font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--ink);background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:10px;cursor:pointer;}
.add-rail-body .add-qty-btn:hover{border-color:var(--ink)}
.add-rail-sep{height:1px;background:var(--glass-border);margin:4px 2px;}
.add-rail-act{padding:7px 6px;font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--ink);background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:10px;cursor:pointer;}
.add-rail-act:hover{border-color:var(--ink)}

/* ─── медали за серию без ошибок ─── */
.medal-badge-row{display:inline-flex;flex-wrap:wrap;row-gap:3px;gap:3px;font-size:15px;vertical-align:middle;}
.medal-tray{position:fixed;left:0;right:0;bottom:0;z-index:150;display:none;gap:7px;align-items:center;padding:8px 16px;overflow-x:auto;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--glass-border);}
.medal-tray.show{display:flex;}
html[data-medals="on"] .board-toolbar,
html[data-medals="on"] .board-view-toolbar{bottom:64px;}
.medal-tray-icon{font-size:20px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));animation:medalPop .45s cubic-bezier(.34,1.56,.64,1) both;flex:none;}
@keyframes medalPop{0%{transform:scale(0);}70%{transform:scale(1.3);}100%{transform:scale(1);}}
.medal-flyer{position:fixed;z-index:300;pointer-events:none;font-size:44px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.3));transition:transform .85s cubic-bezier(.32,.9,.35,1), opacity .85s ease .1s;}
.mode-medals{font-family:var(--font-ui);font-size:12px;opacity:.85;flex:0 0 auto;}

/* ─── история решённых заданий ─── */
/* отступ сверху как в ОГЭ-тренажёрах (18px): у .stats стоит overflow:hidden ради плавного
   сворачивания, он срезает тень карточек, и при 2px кнопка визуально прилипала к статистике */
.example-history-toggle{display:block;width:100%;margin:18px 0 14px;font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:10px;cursor:pointer;transition:border-color .12s;}
.example-history-toggle:hover{border-color:var(--ink)}
.example-history-panel{display:none;position:relative;padding:18px;}
.example-history-list{display:flex;flex-direction:column;}
.example-history-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--glass-border);}
.example-history-row:first-child{border-top:none;}
.example-history-num{font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-6);min-width:26px;}
.example-history-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-family:var(--font-ui);font-size:14px;color:var(--muted-4);}
.example-history-answer{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ok);}
.example-history-answer.bad{color:var(--teacher)}
.example-history-empty{font-family:var(--font-ui);font-size:14px;color:var(--muted-6);text-align:center;padding:16px 0;}

/* ─── плавающая клавиатура для ввода с телефона ─── */
.keypad{display:grid;grid-template-columns:repeat(3, 44px);gap:6px}
.keypad button{width:44px;height:40px;border:1px solid var(--glass-border);border-radius:12px;background:var(--glass);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-family:var(--font-mono);font-size:18px;cursor:pointer;touch-action:manipulation}
.keypad button:active{background:var(--hl)}
.keypad button.kp-minus{color:var(--teacher);font-weight:700}
.keypad button.kp-back{grid-column:span 3;width:auto;height:36px;font-size:15px;color:var(--muted-6);}
.keypad button.kp-enter{grid-column:span 3;width:auto;height:38px;font-family:var(--font-ui);font-weight:600;font-size:14px;background:var(--ink);color:#fff;border-color:var(--ink);}
.keypad button.kp-enter:active{background:var(--ink-active);}
.keypad-float{position:fixed;top:160px;right:16px;background:var(--glass-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:20px;padding:12px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:210;}
.keypad-close{position:absolute;top:-11px;right:-11px;width:26px;height:26px;border-radius:50%;background:var(--teacher);color:#fff;border:2px solid #fff;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.keypad-close:active{transform:scale(.9)}
.keypad-drag-handle{position:absolute;top:-11px;left:-11px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;border:2px solid #fff;font-size:12px;line-height:1;cursor:grab;display:flex;align-items:center;justify-content:center;touch-action:none;}
.keypad-toggle{position:fixed;top:160px;right:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s;}
.keypad-toggle:active{transform:scale(.92)}
/* на ноутбуке и телефоне справа сверху клавиатура ложится прямо на задание —
   опускаем её в нижний угол, как в ОГЭ №8 */
@media(max-width:1250px){.keypad-float,.keypad-toggle{top:auto;bottom:16px;right:16px}}
/* на узком экране колонка добавления не должна наезжать на задание */
@media (max-width:760px){
  .add-rail{left:6px;}
  .add-rail-toggle{width:38px;height:38px;font-size:20px;}
  .add-rail-body{padding:8px 6px;}
  .add-rail-body .add-qty-btn{min-width:38px;font-size:11px;padding:6px 4px;}
}

/* ─── решение ─── */
.sol-hint{font-family:var(--font-ui);font-size:15px;line-height:1.55;color:var(--muted-4);background:var(--hl-10);border-radius:14px;padding:12px 14px;margin-bottom:14px;}
.sol-hint b{color:var(--ink)}
.sol-step{font-family:var(--font-ui);font-size:15px;line-height:1.6;color:var(--muted-4);border-top:1px solid var(--glass-border);padding:12px 0 2px;display:flex;gap:12px;}
.sol-step:first-child{border-top:none;padding-top:2px;}
.sol-step .no{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--glass-strong);border:1px solid var(--glass-border);color:var(--ink);font-family:var(--font-ui);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:2px;}
.sol-step .body{flex:1;min-width:0;overflow-x:auto;}
.sol-step .katex-display{margin:8px 0;}
.sol-answer{font-family:var(--font-ui);font-weight:600;font-size:17px;color:var(--ink);border-top:1px solid var(--glass-border);margin-top:12px;padding-top:12px;line-height:1.6;}
.crit{margin-top:14px;}
.crit summary{font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--muted-3);cursor:pointer;}
.crit table{width:100%;border-collapse:collapse;margin-top:10px;font-family:var(--font-ui);font-size:13px;color:var(--muted-4);}
.crit td{border:1px solid var(--glass-border);padding:8px 10px;vertical-align:top;line-height:1.45;}
.crit td.pts{width:56px;text-align:center;font-weight:700;color:var(--ink);}
.next-btn{font-family:var(--font-ui);font-weight:600;font-size:16px;background:var(--ok);color:#fff;border:none;border-radius:14px;padding:13px 26px;cursor:pointer;width:100%;margin-top:14px;box-shadow:0 6px 18px var(--ok-shadow);transition:transform .15s;}
.next-btn:active{transform:scale(.98)}
.stats{display:flex;gap:10px;flex-wrap:wrap;}
/* плашки статистики без тени, как кнопки калькулятора над ними: у .stats
   overflow:hidden (плавное сворачивание), он срезал тень снизу и по углам,
   и оставались только полоски по бокам */
.stat{flex:1;min-width:110px;background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;padding:12px 14px;text-align:center;}
/* Промпт №63: на экране меньше 360px три карточки счёта с min-width:110px не
   помещались в ряд, третья уходила на вторую строку и обрезалась (у .stats
   max-height и overflow:hidden). Там им разрешено сжиматься */
@media(max-width:359px){.stat{min-width:0}}
.stat .v{font-family:var(--font-ui);font-weight:700;font-size:22px;color:var(--ink);}
.stat .l{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-6);}
.theme-toggle{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;}
.theme-toggle:hover{border-color:var(--ink)}
.theme-toggle:active{transform:scale(.92)}
.board-visibility-toggle{top:64px;transition:transform .15s;}
.board-visibility-toggle:active{transform:scale(.92)}
.board-visibility-toggle.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.home-btn{position:fixed;top:16px;left:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;text-decoration:none;}
.home-btn:hover{border-color:var(--ink)}
.home-btn:active{transform:scale(.92)}
</style>
<link rel="stylesheet" href="katex-0.18.5.css" id="katexCss">
<script src="katex-0.18.5.js"></script>

<script>
/* прогрев шрифтов KaTeX: запускаем загрузку/декодирование всех начертаний
   сразу, как только страница начала рисоваться (см. скрытый блок выше),
   и как только браузер подтвердит готовность — открываем показ формул
   классом на <html>. Это защищает от ситуации, когда первая же открытая
   задача успевает отрисоваться раньше, чем нужный шрифт декодировался. */
(function(){
  function ready(){ document.documentElement.classList.add('katex-fonts-ready'); }
  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    document.fonts.ready.then(ready).catch(ready);
    setTimeout(ready, 1500); // подстраховка, если Font Loading API поведёт себя не так, как ожидается
  } else {
    ready();
  }
})();
</script>

<button class="theme-toggle" id="themeToggle" title="Светлая/тёмная тема" aria-label="Переключить тему">🌙</button>

<script>(function(){
  var btn=document.getElementById('themeToggle');
  function apply(t, persist){
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    if (persist) { try{ localStorage.setItem('theme', t); }catch(e){} }
  }
  apply(document.documentElement.getAttribute('data-theme') || 'light', false);
  btn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(cur, true);
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSystemChange = function(e){
      var explicit = false;
      try{ explicit = !!localStorage.getItem('theme'); }catch(err){}
      if (explicit) return;
      apply(e.matches ? 'dark' : 'light', false);
    };
    if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
    else if (mq.addListener) mq.addListener(onSystemChange);
  }
})();</script>
<script>(function(){
  var btn = document.getElementById('boardVisibilityToggle');
  function apply(on){
    document.documentElement.setAttribute('data-board', on ? 'on' : 'off');
    btn.classList.toggle('active', on);
    btn.title = on ? 'Скрыть доску' : 'Показать доску';
  }
  apply(false); // доска изначально выключена
  btn.addEventListener('click', function(){
    apply(document.documentElement.getAttribute('data-board') !== 'on');
  });
})();</script>

<script>
/* ═══════════════ настройки экзамена ═══════════════
   ОГЭ, часть 2 (oge_part2.html, Промпт №61) — та же страница, что ЕГЭ
   профиль (ege_prof.html), с банком заданий 20–25 ОГЭ. Логику здесь НЕ
   правят: её правят в ege_prof.html и пересобирают этот файл командой
   python3 sync_ege_pages.py — он сохраняет этот блок настроек, а всё
   остальное берёт из профиля. Тест test_prompt61_oge_demo.py проверяет,
   что страницы не разошлись. */
const EXAM = {
  slug: 'oge_part2',         // имя файла = слаг тренажёра в совместной сессии
  idPrefix: 'oge',           // id позиции в каталоге, подборке и на доске: oge20
  title: 'ОГЭ',
  bank: window.OGE_PART2_BANK,
  figs: window.OGE_PART2_FIGS,
  fipi: window.OGE_PART2_FIPI,   // задания из открытого банка ФИПИ (*-fipi.js), может не быть
  showPart: true,            // здесь только вторая часть ОГЭ — задания 20–25
  // первой части на этой странице нет, но поле нужно логике страницы
  part1Format: 'Ответ — целое число или конечная десятичная дробь, например −0,8',
  // промпт №60 — как в профиле: пока включено только в ЕГЭ базе
  boardPinned: false,        // заметки приклеены к заданию, кнопки под ними нажимаются
  calcShared: false,         // «Сложить/Вычесть/…/История» открываются у обоих в сессии
  fipiSplit: true,           // промпт №22: список номера — колонки «ФИПИ» и «Наши»
};
/* ═══════════════ конец настроек ═══════════════ */

/* ═══════════════ ОГЭ, часть 2 — логика страницы ═══════════════
   Одна страница на все позиции экзамена: номер задания приходит в адресе
   (?n=7). Задания, решения и рисунки лежат в банке и файле рисунков (см.
   EXAM): страница не знает ни одной формулы — добавление новых прототипов
   её не трогает. */
const BANK = (EXAM.bank || { tasks: {} }).tasks;
/* Задания из открытого банка ФИПИ лежат отдельными файлами: их собирает
   скрипт выгрузки, и руками они не правятся, а банк с демоверсией написан
   руками — смешивать их в одном файле нельзя, иначе следующая сборка затрёт
   ручные правки. EXAM.fipi — маленький оглавляющий файл (*-fipi.js):
   files — какой файл у какого номера. Сами задания номера (сотни штук,
   сотни килобайт) грузятся только когда этот номер открыли: страница
   ОГЭ ч. 2 одна на шесть номеров, и тянуть банк всех номеров ради одного
   незачем. Пришедшие задания сливаются с ручным банком: у номера появляются
   разделы и группы, задания встают в конец списка прототипов. Идея (hint)
   у заданий группы общая, критерии — общие на номер */
function mergeFipiNumber(n){
  const F = EXAM.fipi;
  const t = BANK[n], src = F && F.tasks && F.tasks[n];
  if (!t || !src) return;
  t.sections = src.sections || [];
  t.groups = src.groups || [];
  const hint = {};
  t.groups.forEach(g => { hint[g.id] = g.hint; });
  const have = new Set(t.protos.map(p => p.id));
  (src.protos || []).forEach(p => {
    if (have.has(p.id)) return;   // такой id уже есть в ручном банке — ручной главнее
    t.protos.push(Object.assign({ src: F.source, hint: hint[p.group], criteria: src.criteria }, p));
  });
}
const fipiState = {};     // номер → 'loading' | 'done' | 'failed'
const fipiWaiters = {};
// у номера есть файл ФИПИ, и он ещё не пришёл (и не упал)
function fipiPending(n){
  const F = EXAM.fipi;
  return !!(F && F.files && F.files[n] && fipiState[n] !== 'done' && fipiState[n] !== 'failed');
}
/* cb — сразу, если ждать нечего; иначе после загрузки файла номера. Не
   загрузился (нет сети) — cb всё равно зовётся: номер работает с тем, что
   есть в ручном банке, как до банка ФИПИ */
function ensureFipi(n, cb){
  if (!fipiPending(n)) { cb(); return; }
  (fipiWaiters[n] = fipiWaiters[n] || []).push(cb);
  if (fipiState[n] === 'loading') return;
  fipiState[n] = 'loading';
  const done = ok => {
    fipiState[n] = ok ? 'done' : 'failed';
    if (ok) mergeFipiNumber(n);
    const list = fipiWaiters[n] || [];
    fipiWaiters[n] = [];
    list.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  };
  const tag = document.createElement('script');
  tag.src = EXAM.fipi.files[n];
  tag.onload = () => done(!!(EXAM.fipi.tasks && EXAM.fipi.tasks[n]));
  tag.onerror = () => done(false);
  document.head.appendChild(tag);
}

/* ── формулы и рисунки ──
   В банке текст обычный, формулы внутри $…$ (в строке) и $$…$$ (отдельной
   строкой), рисунок — [[fig:ключ]]. KaTeX подключён прямо в файле, как в
   ОГЭ №8: дроби с настоящей чертой, корни по высоте содержимого. */
function tex(src, display){
  try { return katex.renderToString(src, { throwOnError: false, output: 'htmlAndMathml', displayMode: !!display }); }
  catch (e) { return src; }
}
function rich(src){
  let s = String(src == null ? '' : src);
  s = s.replace(/\[\[fig:([\w.-]+)\]\]/g, (m, key) => FIGS[key] ? '<div class="ege-fig">' + FIGS[key] + '</div>' : '');
  return s.replace(/\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g, (m, disp, inline) =>
    disp != null ? tex(disp, true) : tex(inline, false));
}
// 259200 → «259 200»: в ответах ЕГЭ разряды принято разделять, а читать
// шестизначное число без пробелов неудобно
function prettyNum(s){
  const m = /^(-?)(\d+)(?:([.,])(\d+))?$/.exec(String(s).trim());
  if (!m) return String(s);
  const int = m[2].length > 4 ? m[2].replace(/\B(?=(\d{3})+(?!\d))/g, ' ') : m[2];
  return m[1] + int + (m[3] ? ',' + m[4] : '');
}

/* ═══════════════ разбор введённого ответа ═══════════════
   Часть 1 — целое число или конечная десятичная дробь, как на бланке.
   Часть 2 — ответом может быть точное значение (72√3, 169/5), набор корней
   (с π) или множество (промежутки, точки, неравенства), поэтому здесь свой
   маленький калькулятор выражений и разбор множеств: сравниваем не строки,
   а значения — «169/5» и «33,8» это один и тот же ответ. */
function normMinus(s){ return String(s).replace(/[−–—‐‑]/g, '-'); }
function stripSpaces(s){ return s.replace(/[\s   ]/g, ''); }

function parsePlain(raw){
  const s = stripSpaces(normMinus(raw)).replace(',', '.');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return parseFloat(s);
}

function normExpr(src){
  let s = stripSpaces(normMinus(src)).toLowerCase();
  s = s.replace(/sqrt|корень/g, '√').replace(/√/g, '√');
  s = s.replace(/infinity|inf|беск/g, '∞');
  s = s.replace(/pi|пи|п/g, 'π');
  s = s.replace(/[·×\*]/g, '*').replace(/[:÷]/g, '/').replace(/,/g, '.');
  return s;
}
// число из выражения: 72√3, 169/5, -15π/4, 2^3, (1+√5)/2 …; NaN — не разобрали
function evalExpr(src){
  const s = normExpr(src);
  if (!s) return NaN;
  let i = 0;
  const peek = () => s[i];
  function number(){
    const m = /^\d+(\.\d+)?/.exec(s.slice(i));
    if (!m) return null;
    i += m[0].length;
    return parseFloat(m[0]);
  }
  function startsPrimary(c){ return c === '(' || c === 'π' || c === '∞' || c === '√' || c === 'l' || /[0-9]/.test(c || ''); }
  /* логарифм: «log_3(84)», «log3(84)», «log_(1/2)8», «lg 5», «ln 2». В ответах
     №16 (неравенства) концы промежутков бывают вида log₃ 84 — без этого ответ
     ученика не разобрался бы вовсе, а десятичное приближение неверно по сути */
  function logarithm(){
    let base;
    if (s.startsWith('lg', i)) { i += 2; base = 10; }
    else if (s.startsWith('ln', i)) { i += 2; base = Math.E; }
    else if (s.startsWith('log', i)) {
      i += 3;
      if (peek() === '_') i++;
      if (peek() === '(') { i++; base = expr(); if (peek() !== ')') throw 0; i++; }
      else { base = number(); if (base === null) throw 0; }
    } else throw 0;
    const arg = power();
    if (!(base > 0) || base === 1 || !(arg > 0)) throw 0;
    return Math.log(arg) / Math.log(base);
  }
  function primary(){
    const c = peek();
    if (c === 'l') return logarithm();
    if (c === '(') { i++; const v = expr(); if (peek() !== ')') throw 0; i++; return v; }
    if (c === 'π') { i++; return Math.PI; }
    if (c === '∞') { i++; return Infinity; }
    if (c === '√') { i++; const v = power(); if (v < 0) throw 0; return Math.sqrt(v); }
    const n = number();
    if (n === null) throw 0;
    return n;
  }
  function power(){
    const b = primary();
    if (peek() === '^') { i++; return Math.pow(b, unary()); }
    return b;
  }
  function unary(){
    if (peek() === '-') { i++; return -unary(); }
    if (peek() === '+') { i++; return unary(); }
    return power();
  }
  function term(){
    let v = unary();
    for (;;) {
      const c = peek();
      if (c === '*') { i++; v *= unary(); }
      else if (c === '/') { i++; v /= unary(); }
      else if (startsPrimary(c)) { v *= power(); }   // 2π, 3√2, 72√3
      else break;
    }
    return v;
  }
  function expr(){
    let v = term();
    for (;;) {
      const c = peek();
      if (c === '+') { i++; v += term(); }
      else if (c === '-') { i++; v -= term(); }
      else break;
    }
    return v;
  }
  try {
    const v = expr();
    return i === s.length ? v : NaN;
  } catch (e) { return NaN; }
}
function sameNum(a, b){
  if (a === b) return true;                       // в т.ч. ±∞
  if (!isFinite(a) || !isFinite(b)) return false;
  return Math.abs(a - b) <= 1e-9 * Math.max(1, Math.abs(b));
}
// «−15π/4; −7π/2» → [−11.78…, −10.99…]; запятую-разделитель отличаем от
// запятой в десятичной дроби по соседям
function splitItems(src){
  const s = normMinus(src);
  const out = [];
  let depth = 0, cur = '';
  for (let k = 0; k < s.length; k++) {
    const ch = s[k];
    if ('([{'.indexOf(ch) >= 0) depth++;
    if (')]}'.indexOf(ch) >= 0) depth--;
    const isSep = depth === 0 && (ch === ';' ||
      (ch === ',' && !(/\d/.test(s[k - 1] || '') && /\d/.test(s[k + 1] || ''))));
    if (isSep) { out.push(cur); cur = ''; } else cur += ch;
  }
  out.push(cur);
  return out.map(x => x.trim()).filter(x => x !== '');
}
function parseNums(src){
  const items = splitItems(src).map(evalExpr);
  return items.some(isNaN) ? null : items;
}
/* пары — ответ системы уравнений: «(−1; 4); (1; 4)». Порядок пар не важен,
   порядок чисел внутри пары — важен (это x и y) */
function parsePairs(src){
  const out = [];
  for (const item of splitItems(src)) {
    const it = stripSpaces(item);
    if (!/^\(.*\)$/.test(it)) return null;
    const xy = splitItems(it.slice(1, -1)).map(evalExpr);
    if (xy.length !== 2 || xy.some(isNaN)) return null;
    out.push(xy);
  }
  return out.length ? out : null;
}
function samePairs(a, b){
  if (!a || !b || a.length !== b.length) return false;
  const ord = arr => arr.slice().sort((p, q) => p[0] - q[0] || p[1] - q[1]);
  const x = ord(a), y = ord(b);
  return x.every((p, k) => sameNum(p[0], y[k][0]) && sameNum(p[1], y[k][1]));
}
function sameNumSets(a, b){
  if (!a || !b || a.length !== b.length) return false;
  const x = a.slice().sort((p, q) => p - q), y = b.slice().sort((p, q) => p - q);
  return x.every((v, k) => sameNum(v, y[k]));
}

/* множество: промежутки «(1;4]», точки «1/3», неравенства «a<-18»,
   «−16<a<0», «a=0»; объединение — «;», «∪» или «U» */
function parseSet(src){
  let s = normMinus(src).toLowerCase();
  s = s.replace(/<=/g, '≤').replace(/>=/g, '≥').replace(/\s+или\s+/g, ';');
  s = s.replace(/∪/g, ';').replace(/\bu\b/g, ';');
  s = s.replace(/[a-zа-я]\s*∈\s*/g, '');
  const items = splitItems(s);
  if (!items.length) return null;
  const out = [];
  for (const raw of items) {
    const item = stripSpaces(raw);
    if (/^[\(\[].*[\)\]]$/.test(item)) {
      const parts = splitItems(item.slice(1, -1));
      if (parts.length !== 2) return null;
      const lo = evalExpr(parts[0]), hi = evalExpr(parts[1]);
      if (isNaN(lo) || isNaN(hi) || lo > hi) return null;
      out.push({ lo, loC: item[0] === '[' && isFinite(lo), hi, hiC: item[item.length - 1] === ']' && isFinite(hi) });
      continue;
    }
    if (/^\{.*\}$/.test(item)) {
      for (const p of splitItems(item.slice(1, -1))) {
        const v = evalExpr(p);
        if (isNaN(v)) return null;
        out.push({ lo: v, loC: true, hi: v, hiC: true });
      }
      continue;
    }
    if (/[<>≤≥=]/.test(item)) {
      const parts = item.split(/([<>≤≥=])/).filter(x => x !== '');
      const isVar = x => /^[a-zа-я]$/.test(x);
      if (parts.length === 3 && (isVar(parts[0]) || isVar(parts[2]))) {
        let [l, op, r] = parts;
        if (isVar(r)) { // «5 < a» → «a > 5»
          const flip = { '<': '>', '>': '<', '≤': '≥', '≥': '≤', '=': '=' };
          [l, r] = [r, l]; op = flip[op];
        }
        const v = evalExpr(r);
        if (isNaN(v)) return null;
        if (op === '<') out.push({ lo: -Infinity, loC: false, hi: v, hiC: false });
        else if (op === '≤') out.push({ lo: -Infinity, loC: false, hi: v, hiC: true });
        else if (op === '>') out.push({ lo: v, loC: false, hi: Infinity, hiC: false });
        else if (op === '≥') out.push({ lo: v, loC: true, hi: Infinity, hiC: false });
        else out.push({ lo: v, loC: true, hi: v, hiC: true });
        continue;
      }
      if (parts.length === 5 && isVar(parts[2])) {
        const a = evalExpr(parts[0]), b = evalExpr(parts[4]);
        const op1 = parts[1], op2 = parts[3];
        if (isNaN(a) || isNaN(b)) return null;
        if ((op1 === '<' || op1 === '≤') && (op2 === '<' || op2 === '≤')) {
          out.push({ lo: a, loC: op1 === '≤' && isFinite(a), hi: b, hiC: op2 === '≤' && isFinite(b) });
        } else if ((op1 === '>' || op1 === '≥') && (op2 === '>' || op2 === '≥')) {
          out.push({ lo: b, loC: op2 === '≥' && isFinite(b), hi: a, hiC: op1 === '≥' && isFinite(a) });
        } else return null;
        continue;
      }
      return null;
    }
    const v = evalExpr(item);
    if (isNaN(v)) return null;
    out.push({ lo: v, loC: true, hi: v, hiC: true });
  }
  // склеиваем пересекающиеся и соприкасающиеся куски, чтобы «(1;3);[3;4]»
  // и «(1;4]» считались одним и тем же ответом
  out.sort((p, q) => p.lo - q.lo || (p.loC === q.loC ? 0 : (p.loC ? -1 : 1)));
  const merged = [];
  for (const iv of out) {
    const last = merged[merged.length - 1];
    if (last && (iv.lo < last.hi || (sameNum(iv.lo, last.hi) && (last.hiC || iv.loC)))) {
      if (iv.hi > last.hi) { last.hi = iv.hi; last.hiC = iv.hiC; }
      else if (sameNum(iv.hi, last.hi)) last.hiC = last.hiC || iv.hiC;
    } else merged.push(Object.assign({}, iv));
  }
  return merged;
}
function sameSets(a, b){
  if (!a || !b || a.length !== b.length) return false;
  return a.every((iv, k) => sameNum(iv.lo, b[k].lo) && sameNum(iv.hi, b[k].hi)
    && (!isFinite(iv.lo) || iv.loC === b[k].loC) && (!isFinite(iv.hi) || iv.hiC === b[k].hiC));
}

const PROGRESS_NS = 'ogeProg:' + EXAM.slug + ':';

/* ═══ конспект урока: снимок области вместе с заметками поверх неё ═══
   Снимаем ровно тот кусок, который сейчас заменяется (одна карточка или вся
   рабочая зона), и после снимка стираем заметки доски в его границах —
   иначе линии остались бы висеть над уже другим заданием. */
function snapshotAndClear(scope, targetEl){
  if (!targetEl) return;
  const rect = targetEl.getBoundingClientRect();
  if (rect.width <= 0 || rect.height <= 0) return; // область не видна — снимать нечего
  const finish = () => { if (window.__boardClearInScreenRect) window.__boardClearInScreenRect(rect); };
  if (window.LessonHistory) window.LessonHistory.captureIfEnabled(scope, targetEl).then(finish);
  else finish();
}

function task(n){ return BANK[n]; }
function protos(n){ return (task(n) || {}).protos || []; }
function protoById(n, pid){ return protos(n).find(p => p.id === pid) || protos(n)[0] || null; }
/* Группы заданий (ОГЭ №20 из открытого банка ФИПИ). Там у номера сотни
   заданий, и плоский список карточек нечитаем: задания одного вида (поле
   group) показываются одной карточкой группы. И ◀ ▶, и «Следующее задание»,
   и «+», и ⟳ у карточки ходят ВНУТРИ группы: учитель выбрал вид задания —
   «ещё такое же» должно быть того же вида, а не следующим по списку банка.
   Задания без group (демоверсия) — своя «группа» из таких же. У номеров без
   групп (весь ЕГЭ) это просто весь список, как было */
function groupsOf(n){ return (task(n) || {}).groups || []; }
function groupById(n, gid){ return groupsOf(n).find(g => g.id === gid) || null; }
function sibs(pid){
  const list = protos(S.n);
  const p = list.find(q => q.id === pid);
  const g = p ? (p.group || null) : null;
  const same = list.filter(q => (q.group || null) === g);
  return same.length ? same : list;
}
// подпись источника: у заданий из банка ФИПИ — его номер, как в ОГЭ №19
function sourceHTML(p){

// 1 штука, 3 штуки, 21 штука, 200 штук
function plural(k, one, few, many){
  const a = k % 10, b = k % 100;
  if (a === 1 && b !== 11) return one;
  if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return few;
  return many;
}

/* начало условия для карточки в списке прототипов: формулы остаются
   формулами (иначе у «Найдите корень уравнения …» вся суть в многоточии),
   поэтому обрезаем строку только там, где все $…$ уже закрыты */
function protoPeek(p){
  // у прототипов с одинаковым началом условия («Установите соответствие…»,
  // «План местности разбит на клетки…») в банке есть своё короткое описание
  if (p.peek) return rich(p.peek);
  const src = String(p.text)
    // формула отдельной строкой ($$…$$, система уравнений в ОГЭ №20) в
    // однострочной подписи карточки — в строку, иначе карточка раздувается
    .replace(/\$\$([\s\S]+?)\$\$/g, (m, f) => '$' + f + '$')
    .replace(/\[\[fig:[\w.-]+\]\]/g, '')
    .replace(/<br\s*\/?>/gi, ' ')
    .replace(/<[^>]+>/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  const LIMIT = 110;
  if (src.length <= LIMIT) return rich(src);
  let cut = -1, dollars = 0;
  for (let i = 0; i < src.length; i++) {
    if (src[i] === '$') dollars++;
    if (i >= LIMIT && dollars % 2 === 0 && src[i] === ' ') { cut = i; break; }
  }
  if (cut < 0) return rich(src);
  return rich(src.slice(0, cut)) + '…';
}

/* Список номера с группами: сначала задания без группы (демоверсия), потом
   разделы («Уравнения», «Системы уравнений»…) и в них карточки групп —
   название, сколько заданий (или сколько решено) и условие первого как
   пример. Нажатие открывает первое нерешённое задание группы */
/* Промпт №22: в ОГЭ (EXAM.fipiSplit) список номера делится на колонки
   «ФИПИ» и «Наши» (fipi-split.js). Задание ФИПИ — из открытого банка
   (поле fipi) или из демоверсии (src «Демоверсия …»: её составил ФИПИ,
   формулировка и решение слово в слово). Группа — ФИПИ, если все её
   задания из банка. В ЕГЭ флага нет, и список остаётся одним, как был */
function fipiAttr(items){
  if (!EXAM.fipiSplit) return '';

function renderGroupedPicker(list){
  const t = task(S.n);
  const loose = list.filter(p => !p.group);
  let html = loose.map((p, i) => `
    <div class="mode-card" data-pid="${p.id}"${fipiAttr([p])}>

      ${isSolved(p.id) ? '<div class="mdone">✓ решено</div>' : ''}
      <div class="mpeek">${protoPeek(p)}</div>
    </div>`).join('');
  let section = null;
  groupsOf(S.n).forEach(g => {
    const items = list.filter(p => p.group === g.id);
    if (!items.length) return;
    if (g.section !== section) {
      section = g.section;
      const sec = (t.sections || []).find(x => x.id === section);
      if (sec) html += '<div class="proto-section">' + sec.title + '</div>';
    }
    const done = items.filter(p => isSolved(p.id)).length;

             : '<div class="mcount">' + items.length + ' ' + plural(items.length, 'задание', 'задания', 'заданий') + '</div>'}
      <div class="mpeek">${protoPeek(items[0])}</div>

  });

      if (card.dataset.pid) { openTask(S.n, card.dataset.pid); return; }
      const items = list.filter(p => p.group === card.dataset.gid);

  els.pageSub.textContent = subtitleOf(t);
}

const FIELD_HINTS = {
  num: 'число; можно точной записью: 12√3, 17/4',
  nums: 'несколько чисел через «;», например: −π/4; 3π/2',
  set: 'промежутки и точки, например: (−∞; 2); 5; [7; +∞)',
  setLog: 'промежутки и точки, логарифм — так: log_3(5), например: (0; log_5(3)]; [2; +∞)',
  setParam: 'например: a &lt; −1; 2 &lt; a &lt; 5; a = 7',
  pairs: 'пары через «;», например: (1; −2); (3; 0)',
  seq: 'номера под буквами подряд, без пробелов и запятых — например, 4312',
  seqAny: 'номера подряд, без пробелов и запятых — например, 135',
};
function fieldHint(f){
  if (f.seq) return f.anyOrder ? FIELD_HINTS.seqAny : FIELD_HINTS.seq;
  if (f.type === 'set') {
    // буква в эталоне — это параметр («a < −1»), но не «log» в конце промежутка
    const v = String(f.value).replace(/log|lg|ln/g, '');
    if (/[a-zа-я]/i.test(v)) return FIELD_HINTS.setParam;
    return /log/.test(f.value) ? FIELD_HINTS.setLog : FIELD_HINTS.set;
  }
  return FIELD_HINTS[f.type] || '';
}
// у базового уровня частей нет — все задания считаются первой частью
function partOf(n){ return (task(n) || {}).part || 1; }
function subtitleOf(t){
  return t.title + (EXAM.showPart ? ' · часть ' + t.part : '') + ' · ' +
    t.points + (t.points === 1 ? ' балл' : ' балла');
}
// «Ответ: 12 (порядок цифр не важен)», «Ответ: 6840 (подходят также: …)» —
// ученик, записавший другой верный вариант, должен увидеть, что он тоже верен
function answerLine(p){
  if (p.proof) return '';   // у доказательства ответа нет — только само доказательство
  if (partOf(S.n) !== 1) return 'Ответ. ' + rich(p.answerTex || '');
  let s = 'Ответ: ' + prettyNum(p.answer);
  if (p.anyOrder) s += ' <span class="ans-note">(порядок цифр не важен)</span>';
  if (p.alts && p.alts.length) s += ' <span class="ans-note">(подходят также: ' + p.alts.map(prettyNum).join(', ') + ')</span>';
  return s;
}
function fieldsOf(p){
  return partOf(S.n) === 1
    ? [{ id: 'main', label: 'Ответ:', type: 'plain', value: p.answer, tex: prettyNum(p.answer),
         alts: p.alts || [], anyOrder: !!p.anyOrder, seq: !!p.seq }]
    : (p.fields || []);
}
/* Поля ответа рисуются одинаково для основного задания и для добавленных
   карточек — отличаются только корневым узлом, состоянием и префиксом id,
   под которым поле регистрируется в совместной сессии. */
function buildAnswerArea(root, p, st, prefix, onChanged){
  const list = fieldsOf(p);
  /* Промпт №61: задание на доказательство (ОГЭ №24) — полей нет, проверять
     нечего. Кнопка открывает доказательство и критерии, как после ответа;
     счёт не меняется: самопроверку нельзя засчитать ни решённой, ни ошибкой.
     Без этой ветки пустой список полей «проходил» проверку, и задание
     считалось решённым по одному нажатию */
  if (p.proof) {
    root.innerHTML = '<div class="input-answer-row"><button class="check-btn">Сверить с доказательством</button></div>' +
      '<div class="answer-msg"></div>';
    root.querySelector('.check-btn').onclick = () => {
      if (st.answered) return;
      st.answered = true;
      onChanged();
    };
    return;
  }
  let html = '';
  list.forEach(f => {
    html += '<div class="p2-field" data-fid="' + f.id + '">';
    html += '<span class="p2-label">' + f.label + '</span>';
    if (f.type === 'yesno') {
      html += '<span class="yn-group" data-fid="' + f.id + '">' +
        '<button class="yn-btn" data-val="да">да</button><button class="yn-btn" data-val="нет">нет</button></span>';
    } else {
      const wide = (f.type === 'set' || f.type === 'nums' || f.type === 'pairs') ? ' wide' : '';
      html += '<input type="text" class="answer-input' + wide + '" data-fid="' + f.id + '" ' +
        (f.type === 'plain' ? 'inputmode="decimal" ' : '') +
        'autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">';
      if (f.unit) html += '<span class="p2-unit">' + f.unit + '</span>';
      const hint = fieldHint(f);
      if (hint) html += '<span class="field-hint">' + hint + '</span>';
    }
    html += '</div>';
  });
  // клавиатура телефона не набирает ни π, ни корень — кладём их рядом с полем
  if (partOf(S.n) === 2 && list.some(f => f.type !== 'yesno')) {
    html += '<div class="sym-bar">' + ['π', '√', '∞', '≤', '≥', '∪', ';', '/', '(', ')']
      .map(c => '<button class="sym-btn" data-ch="' + c + '">' + c + '</button>').join('') + '</div>';
  }
  html += '<div class="input-answer-row"><button class="check-btn">Проверить</button></div>';
  html += '<div class="answer-msg"></div>';
  root.innerHTML = html;

  const submit = () => { runCheck(p, st, root); onChanged(); };
  root.querySelectorAll('input.answer-input').forEach(inp => {
    inp.addEventListener('focus', () => { lastFocusedInput = inp; syncKeypadVisibility(); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    if (TS && TS.registerField) TS.registerField('ege:' + prefix + ':' + p.id + ':' + inp.dataset.fid, inp);
    if (!lastFocusedInput) lastFocusedInput = inp;
  });
  root.querySelectorAll('.yn-btn').forEach(btn => {
    btn.onclick = () => {
      if (st.answered) return;
      st.yn[btn.parentElement.dataset.fid] = btn.dataset.val;
      onChanged();
    };
  });
  root.querySelectorAll('.sym-btn').forEach(btn => {
    btn.onclick = () => insertSymbol(root, btn.dataset.ch);
  });
  root.querySelector('.check-btn').onclick = submit;
}
// вставка π, √ и прочего в поле, в котором последний раз стоял курсор
function insertSymbol(root, ch){
  let inp = lastFocusedInput;
  if (!inp || !root.contains(inp) || inp.disabled) inp = root.querySelector('input.answer-input:not([disabled])');
  if (!inp) return;
  const pos = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
  const end = inp.selectionEnd == null ? pos : inp.selectionEnd;
  inp.value = inp.value.slice(0, pos) + ch + inp.value.slice(end);
  const caret = pos + ch.length;
  inp.focus();
  try { inp.setSelectionRange(caret, caret); } catch (e) {}
  // событие нужно, чтобы набранное улетело собеседнику в совместной сессии
  inp.dispatchEvent(new Event('input', { bubbles: true }));
}
// подсветка полей и кнопки по состоянию — тоже общая для задания и карточек
function applyAnswerMarks(root, p, st){
  fieldsOf(p).forEach(f => {
    const mark = st.marks[f.id] || '';
    const inp = root.querySelector('input.answer-input[data-fid="' + f.id + '"]');
    if (inp) {
      inp.classList.remove('good', 'bad', 'fixed');
      if (mark) inp.classList.add(mark);
      inp.disabled = !!st.answered;
      if (mark === 'fixed' && inp.value !== f.value) inp.value = f.value;
    }
    const grp = root.querySelector('.yn-group[data-fid="' + f.id + '"]');
    if (grp) {
      grp.classList.remove('good', 'bad', 'fixed');
      if (mark) grp.classList.add(mark);
      const val = mark === 'fixed' ? f.value : st.yn[f.id];
      grp.querySelectorAll('.yn-btn').forEach(b => b.classList.toggle('sel', b.dataset.val === val));
    }
  });
  const btn = root.querySelector('.check-btn');
  if (btn) { btn.disabled = !!st.answered; btn.style.display = st.answered ? 'none' : 'inline-block'; }
}
function renderAnswerArea(){
  if (TS && TS.unregisterFieldsWithPrefix) TS.unregisterFieldsWithPrefix('ege:main:');
  buildAnswerArea(els.answerArea, curProto, S, 'main', () => render());
  els.answerMsg = els.answerArea.querySelector('.answer-msg');
}
function renderSolution(){
  const p = curProto;
  els.solHint.innerHTML = p.hint ? '<b>Идея.</b> ' + rich(p.hint) : '';
  els.solSteps.innerHTML = (p.steps || []).map((st, i) =>

  els.solAnswer.innerHTML = answerLine(p);

      '<tr><td class="pts">' + row[0] + '</td><td>' + rich(row[1]) + '</td></tr>').join('');
  }
}
/* Какое задание сейчас нарисовано в #taskArea. Условие, поле ответа и разбор
   рисует только openTask, а при запуске страница стоит на первом прототипе
   номера из адреса, НО ничего не нарисовав (открыт список прототипов). Если
   собеседник открыл как раз этот прототип, совпадения S.n/S.pid мало — без
   этой отметки ученик видел пустую карточку до смены прототипа. */
let drawnTask = null;
function openTask(n, pid){
  if (!task(n)) return;
  // задания ФИПИ этого номера ещё не пришли: без них pid не найдётся и
  // откроется демоверсия — открываем, когда файл номера загрузится
  if (fipiPending(n)) { ensureFipi(n, () => openTask(n, pid)); return; }
  // задание на экране сейчас сменится — сперва снимок в конспект урока
  // вместе с заметками доски поверх него
  if (S.screen === 'task') snapshotAndClear('whole', els.workZone);
  S.screen = 'task';
  S.n = n;
  if (progLoadedFor !== n) { curProg = loadProgFor(n); progLoadedFor = n; }
  const p = pid ? protoById(n, pid) : protos(n)[0];
  S.pid = p.id;
  curProto = p;
  drawnTask = n + ':' + p.id;
  S.answered = false; S.hadWrong = false; S.correct = false;
  S.marks = {}; S.yn = {};
  S.sol = false;
  S.step = S.mode === 'learn' ? 1 : 0;
  lastFocusedInput = null;

  const t = task(n);
  els.pageTitle.textContent = EXAM.title + ' · №' + n;
  els.pageSub.textContent = subtitleOf(t);
  const idx = protos(n).findIndex(x => x.id === p.id);
  // у прототипа может быть своё название (в ОГЭ, часть 2 — «№0. Задание из
  // демоверсии ОГЭ 2027»), тогда в шапке оно, а не порядковый номер; номер
  // задания и так стоит в заголовке страницы
  const grp = p.group ? groupById(n, p.group) : null;
  if (grp) {
    // в названии группы бывают формулы — поэтому разметкой, а номер считаем внутри группы
    const sl = sibs(p.id);
    els.taskTitle.innerHTML = rich(grp.title) + ' · задание ' + (sl.findIndex(x => x.id === p.id) + 1) + ' из ' + sl.length;
  } else {
    els.taskTitle.textContent = p.title ? p.title : '№' + n + ' · прототип ' + (idx + 1) + ' из ' + protos(n).length;
  }
  document.title = EXAM.title + ' · №' + n + ' — ' + t.title;
  els.questionText.innerHTML = rich(p.text) + (p.fig && FIGS[p.fig] ? '<div class="ege-fig">' + FIGS[p.fig] + '</div>' : '') + sourceHTML(p);
  els.manualNote.innerHTML = p.manual ? '⚠️ ' + rich(p.manual) : '';
  els.manualNote.style.display = p.manual ? 'block' : 'none';
  renderAnswerArea();
  renderSolution();
  renderKeypadKeys();   // во второй части на клавиатуре есть π, √ и знаки промежутков
  regenCards();         // добавленные карточки набираются заново от нового задания
  renderPicker();
  render();
  syncUrl();
  window.scrollTo(0, 0);
}
// адрес всегда показывает открытое задание: перезагрузка и «поделиться

/* Промпт №73: хук для стрелок между номерами (exam-nav.js). Номер меняется
   тем же openTask, что и прототип: снимок в конспект, карточки «+» заново,
   адрес — всё как при смене прототипа. pid() — открытый прототип, пока на
   экране задание: его exam-nav запоминает, чтобы вернуть при возврате на
   номер; на списке прототипов null — помним последний открытый */
window.__examNav = {
  n: () => S.n,
  pid: () => (S.screen === 'task' && curProto) ? S.pid : null,
  open: (n, pid) => { if (task(n)) ensureFipi(n, () => openTask(n, pid && protoById(n, pid) ? pid : null)); },
};
/* «Типы» номера с группами — в порядке экрана выбора: сначала задания без
   группы (демоверсия) по одному, потом группы. У номеров без групп (ЕГЭ)
   типов нет: там прототип и есть тип, хватает ◀ ▶ прототипов */
function typeUnits(){
  if (!groupsOf(S.n).length) return [];
  const list = protos(S.n);
  return list.filter(p => !p.group).map(p => [p])
    .concat(groupsOf(S.n).map(g => list.filter(p => p.group === g.id)).filter(a => a.length));
}
// соседний тип по кругу; группу открываем, как карточка на экране выбора, —
// с первого нерешённого задания
function typeNeighbour(delta){
  const units = typeUnits();
  const i = units.findIndex(u => u.some(p => p.id === S.pid));
  const u = units[(i + delta + units.length) % units.length];
  return (u.find(p => !isSolved(p.id)) || u[0]).id;
}
// сосед по списку прототипов этого номера, по кругу
function protoNeighbour(delta){
  const list = sibs(S.pid);
  const i = list.findIndex(p => p.id === S.pid);
  return list[(i + delta + list.length) % list.length];
}

/* ═══════════════ проверка ответа ═══════════════ */
function checkField(f, value, st){
  // → true/false, либо null, если запись не разобрали (это не ошибка ученика,
  // а просьба записать иначе: на бланке ЕГЭ формат ответа тоже оговорён)
  if (f.type === 'yesno') {
    const v = st.yn[f.id];
    return v ? v === f.value : null;
  }
  const raw = String(value || '').trim();
  if (!raw) return null;
  // верными считаются эталон и все ответы «<или>» из ключа ФИПИ (alts)
  const accepted = [f.value].concat(f.alts || []);
  if (f.type === 'plain' && f.seq) {
    // последовательность цифр (соответствия, выбор утверждений): на бланке
    // её пишут подряд. Пробелы между цифрами ничего не путают — убираем;
    // а «1, 2» — не неверный ответ, а другая запись: просим переписать
    const d = stripSpaces(raw);
    if (!/^\d+$/.test(d)) return null;
    const key = x => f.anyOrder ? String(x).split('').sort().join('') : String(x);
    return accepted.some(a => key(a) === key(d));
  }
  if (f.type === 'plain') {
    const v = parsePlain(raw);
    return v === null ? null : accepted.some(a => sameNum(v, parsePlain(a)));
  }
  if (f.type === 'num') {
    let s = raw;
    if (f.unit) s = s.replace(new RegExp('\\s*' + f.unit + '\\.?$', 'i'), '');
    const v = evalExpr(s);
    return isNaN(v) ? null : sameNum(v, evalExpr(f.value));
  }
  if (f.type === 'nums') {
    const v = parseNums(raw);
    return v === null ? null : sameNumSets(v, parseNums(f.value));
  }
  if (f.type === 'set') {
    const v = parseSet(raw);
    return v === null ? null : sameSets(v, parseSet(f.value));
  }
  if (f.type === 'pairs') {
    const v = parsePairs(raw);
    return v === null ? null : samePairs(v, parsePairs(f.value));
  }
  return null;
}
/* Проверка одного задания — хоть основного, хоть добавленной карточки.
   Счёт (решено/ошибок/серия), медали и история — общие на страницу:
   добавленные задания это такие же задания, просто рядом. */
function runCheck(p, st, root){
  if (st.answered) return;
  const list = fieldsOf(p);
  const results = {};
  let unparsed = false;
  list.forEach(f => {
    const inp = root.querySelector('input.answer-input[data-fid="' + f.id + '"]');
    results[f.id] = checkField(f, inp ? inp.value : null, st);
    if (results[f.id] === null) unparsed = true;
  });
  const msgEl = root.querySelector('.answer-msg');
  if (unparsed) {
    const seqBad = list.some(f => f.seq && results[f.id] === null);
    if (msgEl) msgEl.textContent = seqBad
      ? 'Запишите номера подряд — без запятых и других знаков, как на бланке'
      : partOf(S.n) === 1 ? EXAM.part1Format : 'Заполни все поля так, как подсказано под ними';
    return;
  }
  if (msgEl) msgEl.textContent = '';
  const allOk = list.every(f => results[f.id] === true);
  list.forEach(f => { st.marks[f.id] = results[f.id] ? 'good' : 'bad'; });

  if (allOk) {
    st.answered = true; st.correct = true;
    totalSolved++; streak++;
    markSolved(p.id);
    addHistory(p, st, true);
    awardMedals();
  } else if (st.hadWrong) {
    // вторая неудачная попытка — как в ОГЭ №8: подставляем верный ответ
    // и открываем разбор
    st.answered = true; st.correct = false;
    list.forEach(f => { if (!results[f.id]) st.marks[f.id] = 'fixed'; });
    totalErrors++; streak = 0;
    curProg.errorsInBatch = (curProg.errorsInBatch || 0) + 1;
    addHistory(p, st, false);
  } else {
    st.hadWrong = true;
    totalErrors++; streak = 0;
    // ошибка в пятёрке решает, какой будет медаль: без ошибок — золото
    curProg.errorsInBatch = (curProg.errorsInBatch || 0) + 1;
    saveProg();
    const bad = root.querySelector('.answer-input.bad');
    if (bad) { bad.classList.remove('shake'); void bad.offsetWidth; bad.classList.add('shake'); }
  }
}
function check(){ runCheck(curProto, S, els.answerArea); render(); }

/* ═══════════════ несколько заданий на экране ═══════════════
   Кнопки «+1…+10» дописывают карточки в конец рабочей зоны, НЕ перерисовывая
   ни уже стоящие карточки, ни основное задание: набранный, но ещё не
   проверенный текст в них не должен пропадать. В карточке — только само
   задание: условие, поле ответа и её собственные кнопки; ни вкладок режима,
   ни статистики, ни клавиатуры — весь остальной интерфейс тренажёра один на
   странице. Состояние карточки той же формы, что и у основного задания,
   поэтому проверка (runCheck) и подсветка (applyAnswerMarks) — общие. */
function freshCard(pid){ return { pid, answered: false, hadWrong: false, correct: false, marks: {}, yn: {}, sol: false }; }
// следующий прототип этого же номера, по кругу: прототипов на номер немного,
// поэтому новые карточки идут по списку подряд, а не случайно — так на экране
// не оказывается пять копий одного и того же задания
function pidAfter(pid){
  const list = sibs(pid);
  const i = list.findIndex(p => p.id === pid);
  return list[(i + 1 + list.length) % list.length].id;
}
function nextCardPid(){
  const last = S.cards.length ? S.cards[S.cards.length - 1].pid : S.pid;
  return pidAfter(last);
}
function cardProto(c){ return protoById(S.n, c.pid); }

// разбор для карточки: то же, что показывает основная панель решения, но
// одним куском — в карточке нет ни пошагового «Обучения», ни кнопки «дальше»
function solutionHTML(p){
  let h = '';
  if (p.hint) h += '<div class="sol-hint"><b>Идея.</b> ' + rich(p.hint) + '</div>';
  h += (p.steps || []).map((st, i) =>
    '<div class="sol-step"><span class="no">' + (i + 1) + '</span><div class="body">' + rich(st) + '</div></div>').join('');
  if (!p.proof) h += '<div class="sol-answer">' + answerLine(p) + '</div>';
  if (p.criteria) {
    h += '<details class="crit"><summary>Критерии оценивания ФИПИ (максимум ' + task(S.n).points + ' б.)</summary><table>' +
      p.criteria.map(row => '<tr><td class="pts">' + row[0] + '</td><td>' + rich(row[1]) + '</td></tr>').join('') + '</table></details>';
  }
  return h;
}
function cardEl(idx){ return els.tasksColumns.querySelector('.added-task-card[data-idx="' + idx + '"]'); }

function makeCardEl(c, idx){
  const p = cardProto(c);
  const div = document.createElement('div');
  div.className = 'panel added-task-card';
  div.dataset.idx = String(idx);
  /* .added-card-question — ровно условие, без полей и кнопок: и «В подборку»,
     и снимок на доску берут у карточки то же самое, что у основного задания
     берут из #egeQuestion (см. TRAINER_CAPTURE в boards-core.js) */
  div.innerHTML =
    '<div class="added-card-question"><div class="ege-text">' + rich(p.text) +
      (p.fig && FIGS[p.fig] ? '<div class="ege-fig">' + FIGS[p.fig] + '</div>' : '') + sourceHTML(p) + '</div></div>' +
    '<div class="answer-area"></div>' +
    (p.manual ? '<div class="manual-note">⚠️ ' + rich(p.manual) + '</div>' : '') +
    '<div class="card-btn-row">' +
      '<button class="soft-btn icon-only added-refresh-btn" title="Другой прототип">⟳</button>' +
      '<button class="soft-btn icon-only added-basket-btn" title="В подборку">📥</button>' +
      '<button class="soft-btn added-solution-btn">Показать решение и ответ</button>' +
      '<button class="added-remove-btn">− Убрать</button>' +
    '</div>' +
    '<div class="added-explain" style="display:none"></div>';

  const area = div.querySelector('.answer-area');

  div.querySelector('.added-refresh-btn').onclick = guard('refreshOne', () => refreshCard(+div.dataset.idx));
  div.querySelector('.added-remove-btn').onclick = guard('deleteTask', () => removeCard(+div.dataset.idx));
  div.querySelector('.added-solution-btn').onclick = guard('showSolution', () => {
    const cur = S.cards[+div.dataset.idx];
    if (!cur || cur.answered) return;
    cur.sol = !cur.sol;
    syncCard(+div.dataset.idx);
  });
  const basketBtn = div.querySelector('.added-basket-btn');
  basketBtn.onclick = () => {
