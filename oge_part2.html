    basketBtn.classList.add('ok');
    basketBtn.textContent = '✓';
    setTimeout(() => { basketBtn.classList.remove('ok'); basketBtn.textContent = '📥'; }, 900);
  };
  return div;
}
// подсветка полей и кнопки карточки по её состоянию; DOM карточки не
// пересоздаём — иначе пропадёт набранный текст в соседних полях
function syncCard(idx){
  const c = S.cards[idx], div = cardEl(idx);
  if (!c || !div) return;
  const p = cardProto(c);
  applyAnswerMarks(div.querySelector('.answer-area'), p, c);
  // вне «Тренировки» раскрытое вручную решение закрываем: в «Экзамене» его
  // быть не должно, а в «Обучении» разбор идёт по шагам у основного задания
  if (S.mode !== 'practice' && !c.answered && c.sol) c.sol = false;
  const solBtn = div.querySelector('.added-solution-btn');
  solBtn.style.display = (S.mode === 'practice' && !c.answered) ? 'inline-flex' : 'none';
  solBtn.textContent = c.sol ? 'Скрыть решение и ответ' : 'Показать решение и ответ';
  const explain = div.querySelector('.added-explain');
  const show = c.answered || c.sol;
  explain.style.display = show ? 'block' : 'none';
  explain.innerHTML = show ? solutionHTML(p) : '';
}
function syncAllCards(){ S.cards.forEach((c, i) => syncCard(i)); }

function renderCards(skipPush){
  // #card1Wrapper не трогаем: в нём живут рабочие узлы, на которые уже
  // указывают ссылки в els — перерисовываем только добавленные карточки
  if (TS && TS.unregisterFieldsWithPrefix) TS.unregisterFieldsWithPrefix('ege:card');
  els.tasksColumns.querySelectorAll('.added-task-card').forEach(el => el.remove());
  S.cards.forEach((c, i) => els.tasksColumns.appendChild(makeCardEl(c, i)));
  syncAllCards();
  applyColumns();
  syncAddUI();
  if (!skipPush && TS && TS.push) TS.push();
}
function appendCards(n){
  for (let k = 0; k < n; k++) {
    const c = freshCard(nextCardPid());
    S.cards.push(c);
    els.tasksColumns.appendChild(makeCardEl(c, S.cards.length - 1));
    syncCard(S.cards.length - 1);
  }
  render();
  if (TS && TS.push) TS.push();
}
function removeCard(idx){
  snapshotAndClear('single', cardEl(idx));
  S.cards.splice(idx, 1);
  renderCards();   // сдвинулись индексы — перерисовываем список целиком
  render();
}
function clearCards(){
  snapshotAndClear('whole', els.tasksColumns);
  S.cards = [];
  renderCards();
  render();
}
function refreshCard(idx){
  const c = S.cards[idx];
  if (!c) return;
  snapshotAndClear('single', cardEl(idx));
  S.cards[idx] = freshCard(pidAfter(c.pid));
  const old = cardEl(idx);
  if (old) { old.replaceWith(makeCardEl(S.cards[idx], idx)); syncCard(idx); }
  else renderCards(true);
  render();
  if (TS && TS.push) TS.push();
}
// при переходе на другой прототип карточки набираются заново — от нового
// основного задания и в прежнем количестве; их прежние ответы уже не про это
function regenCards(){
  if (!S.cards.length) return;
  let pid = S.pid;
  S.cards = S.cards.map(() => { pid = pidAfter(pid); return freshCard(pid); });
  renderCards(true);   // рассылку сделает сам openTask, уже согласованным снимком
}

/* пороги по общему числу заданий: 1–3 → одна колонка, 4–6 → две, дальше три */
function applyColumns(){
  const total = 1 + S.cards.length;
  let cols = total <= 3 ? 1 : (total <= 6 ? 2 : 3);
  if (window.innerWidth < 560) cols = 1;
  else if (window.innerWidth < 820) cols = Math.min(cols, 2);
  els.tasksColumns.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
  els.tasksColumns.style.gridTemplateRows = 'repeat(' + Math.max(1, Math.ceil(total / cols)) + ', auto)';
}
window.addEventListener('resize', () => { if (S.screen === 'task') applyColumns(); });

/* ── «В подборку» ──
   Личная кнопка у каждой карточки кладёт только её; 📥 в шапке и «📥 Все» в
   колонке добавления — все задания, которые сейчас на экране. */
function addOneToBasket(selector, label){
  if (!window.Basket) return false;
  const r = window.Basket.extractFromSelectorsRich([selector]);
  if (!r || !r.text) return false;
  window.Basket.add({
    trainerId: EXAM.idPrefix + S.n,
    modeTitle: task(S.n).title + ' · прототип ' + label,
    text: r.text, html: r.html,
  });
  return true;
}
function mainBasketLabel(){ return String(protos(S.n).findIndex(p => p.id === S.pid) + 1); }
function addAllToBasket(){
  addOneToBasket('#egeQuestion', mainBasketLabel());
  S.cards.forEach((c, i) => addOneToBasket('.added-task-card[data-idx="' + i + '"] .added-card-question',
    String(protos(S.n).findIndex(p => p.id === c.pid) + 1)));
}
function flashOk(btn, back){
  btn.classList.add('ok');
  btn.textContent = '✓';
  setTimeout(() => { btn.classList.remove('ok'); btn.textContent = back; }, 900);
}
els.basketInlineBtn.onclick = () => {
  if (addOneToBasket('#egeQuestion', mainBasketLabel())) flashOk(els.basketInlineBtn, '📥');
};

/* ── колонка добавления ── */
let addRailOpen = false;
function syncAddUI(){
  const has = S.cards.length > 0;
  els.addRail.classList.toggle('open', addRailOpen);
  els.addRailToggle.setAttribute('aria-expanded', addRailOpen ? 'true' : 'false');
  els.addRailToggle.title = addRailOpen ? 'Свернуть' : 'Добавить задания';
  els.addRailSep.style.display = has ? 'block' : 'none';

}
els.addRailToggle.onclick = () => { addRailOpen = !addRailOpen; syncAddUI(); };
els.addRailBody.querySelectorAll('.add-qty-btn').forEach(btn => {
  btn.onclick = guard('switchTask', () => appendCards(+btn.dataset.n));
});
els.addClearBtn.onclick = guard('deleteTask', clearCards);
els.addToBasketAllBtn.onclick = () => {

  addAllToBasket();
  flashOk(els.addToBasketAllBtn, '📥 Все');
};

/* ═══ растягиваемая рабочая зона ═══
   Колонки с заданиями тянутся за любой край и расширяются симметрично —
   нужно прежде всего при трёх колонках, но доступно всегда. */
const WORK_W_KEY = EXAM.slug + ':workZoneW';
/* ширина рабочей зоны «по умолчанию» — вся ширина её родителя (--work-w не
   задана, 100%). Нужна clampWorkW: клавиатура ограничивает растягивание,
   только когда стоит СБОКУ от зоны такой ширины. В узком окне (тренажёр в
   панели на доске, пол-экрана) клавиатура висит поверх зоны уже по
   умолчанию — там её предел только сжимал зону при первом же касании
   края до узкой полосы и не давал растянуть обратно под окно */
function workZoneBaseW(){
  try {
    const p = els.workZone.parentElement;
    const cs = getComputedStyle(p);
    return p.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
  } catch (e) { return 0; }
}
function clampWorkW(w){
  const min = 380;
  let max = window.innerWidth - 24;
  try {
    if (els.keypadFloat && getComputedStyle(els.keypadFloat).display !== 'none') {
      // край рабочей зоны не должен заезжать под плавающую клавиатуру
      const byKeypad = 2 * (els.keypadFloat.getBoundingClientRect().left - 16 - window.innerWidth / 2);
      if (byKeypad > 0 && byKeypad >= workZoneBaseW()) max = Math.min(max, byKeypad);
    }
  } catch (e) {}
  max = Math.max(min, max);
  return Math.min(max, Math.max(min, w));
}
try {
  const w = parseFloat(localStorage.getItem(WORK_W_KEY));
  if (w) els.workZone.style.setProperty('--work-w', clampWorkW(w) + 'px');
} catch (e) {}
function setupWorkZoneResize(handleEl, side){
  let start = null;
  handleEl.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { handleEl.setPointerCapture(e.pointerId); } catch (err) {}
    handleEl.classList.add('dragging');
    start = { x: e.clientX, w: els.workZone.getBoundingClientRect().width };
  });
  handleEl.addEventListener('pointermove', e => {
    if (!start) return;
    const dx = (side === 'right') ? (e.clientX - start.x) : (start.x - e.clientX);
    els.workZone.style.setProperty('--work-w', clampWorkW(start.w + dx * 2) + 'px');
  });
  const end = () => {
    if (!start) return;
    start = null;
    handleEl.classList.remove('dragging');
    try { localStorage.setItem(WORK_W_KEY, String(parseFloat(getComputedStyle(els.workZone).width))); } catch (e) {}
    setTimeout(forceRepaintWorkArea, 30);
    // ширина рабочей зоны уходит собеседнику: заметки поверх заданий имеют
    // смысл только в том же масштабе, в каком их рисовали
    if (TS && TS.push) TS.push();
  };
  handleEl.addEventListener('pointerup', end);
  handleEl.addEventListener('pointercancel', end);
}
setupWorkZoneResize(els.workResizeLeft, 'left');
setupWorkZoneResize(els.workResizeRight, 'right');
/* после растягивания и после прокрутки иногда остаются «призрачные»
   полупрозрачные прямоугольники — лечится принудительной перерисовкой */
function forceRepaint(el){
  if (!el) return;
  const prev = el.style.opacity;
  el.style.opacity = '0.999999';
  requestAnimationFrame(() => { el.style.opacity = prev; });
}
function forceRepaintWorkArea(){ forceRepaint(els.workZone); forceRepaint(els.keypadFloat); }
let repaintTimer = null;
window.addEventListener('scroll', () => {
  clearTimeout(repaintTimer);
  repaintTimer = setTimeout(forceRepaintWorkArea, 120);
}, { passive: true });

/* ═══ плавающая клавиатура ═══
   Экранная клавиатура телефона не набирает ни π, ни корень, ни знаки
   промежутков — во второй части они на клавиатуре есть, в первой не нужны
   (там ответ — число с бланка). */
let keypadOpen = true;
function renderKeypadKeys(){
  // раскладка одна на все тренажёры — keypad.js; во второй части ещё π, √,
  // ∞ и знаки промежутков
  els.keypadButtons.innerHTML = Keypad.keys(partOf(S.n) === 2 ? ['π','√','∞','≤','≥','∪','(',')',';'] : []);
  Keypad.bind(els.keypadButtons, keypadPress);
}
// поле, в которое пишет клавиатура: последнее, где стоял курсор — иначе
// первое свободное; так одна клавиатура обслуживает и основное задание, и карточки
function keypadTarget(){
  let inp = lastFocusedInput;
  if (!inp || !els.workZone.contains(inp) || inp.disabled) {
    inp = els.workZone.querySelector('input.answer-input:not([disabled])');
  }
  return inp;
}
function keypadPress(ch){
  const inp = keypadTarget();
  if (!inp) return;
  lastFocusedInput = inp;
  const area = inp.closest('.answer-area');
  if (ch === 'enter') {
    const btn = area && area.querySelector('.check-btn');
    if (btn && !btn.disabled) btn.click();
    return;
  }
  if (ch === 'back') {
    const pos = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
    const end = inp.selectionEnd == null ? pos : inp.selectionEnd;
    const from = (pos === end) ? Math.max(0, pos - 1) : pos;
    inp.value = inp.value.slice(0, from) + inp.value.slice(end);
    inp.focus();
    try { inp.setSelectionRange(from, from); } catch (e) {}
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    return;
  }
  insertSymbol(area || els.workZone, ch);
}
function syncKeypadVisibility(){
  const free = S.screen === 'task' && els.taskArea.style.display !== 'none' &&
    !!els.workZone.querySelector('input.answer-input:not([disabled])');
  els.keypadFloat.style.display = (free && keypadOpen) ? 'block' : 'none';
  els.kpToggle.style.display = (free && !keypadOpen) ? 'flex' : 'none';
}
els.kpClose.onclick = () => { keypadOpen = false; syncKeypadVisibility(); };
els.kpToggle.onclick = () => { keypadOpen = true; syncKeypadVisibility(); };
(function makeKeypadDraggable(floatEl, handleEl){
  let dragging = false, offX = 0, offY = 0;
  function clamp(x, y){
    const maxX = Math.max(4, window.innerWidth - floatEl.offsetWidth - 4);
    const maxY = Math.max(4, window.innerHeight - floatEl.offsetHeight - 4);
    return { x: Math.min(Math.max(x, 4), maxX), y: Math.min(Math.max(y, 4), maxY) };
  }
  handleEl.addEventListener('pointerdown', e => {
    dragging = true;
    const r = floatEl.getBoundingClientRect();
    floatEl.style.left = r.left + 'px';
    floatEl.style.top = r.top + 'px';
    floatEl.style.right = 'auto';
    // На телефоне CSS прижимает клавиатуру к низу (bottom:16px). Если его не
    // сбросить, при заданном top панель растягивается до низа экрана и за ней
    // остаётся пустой «хвост».
    floatEl.style.bottom = 'auto';
    offX = e.clientX - r.left; offY = e.clientY - r.top;
    try { handleEl.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  handleEl.addEventListener('pointermove', e => {
    if (!dragging) return;
    const pos = clamp(e.clientX - offX, e.clientY - offY);
    floatEl.style.left = pos.x + 'px';
    floatEl.style.top = pos.y + 'px';
  });
  const up = e => { dragging = false; try { handleEl.releasePointerCapture(e.pointerId); } catch (err) {} };
  handleEl.addEventListener('pointerup', up);
  handleEl.addEventListener('pointercancel', up);
  window.addEventListener('resize', () => {
    if (floatEl.style.left && floatEl.style.left !== 'auto') {
      const r = floatEl.getBoundingClientRect();
      const pos = clamp(r.left, r.top);
      floatEl.style.left = pos.x + 'px';
      floatEl.style.top = pos.y + 'px';
    }
  });
})(els.keypadFloat, els.kpDragHandle);

/* ═══════════════ запуск ═══════════════ */
const URL_PARAMS = new URLSearchParams(location.search);
const URL_N = (function(){
  const v = parseInt(URL_PARAMS.get('n'), 10);
  return BANK[v] ? v : null;
})();
S.n = URL_N || NUMS[0];
curProto = protos(S.n)[0];
S.pid = curProto.id;
curProg = loadProgFor(S.n); progLoadedFor = S.n;
renderKeypadKeys();
renderAnswerArea(); renderSolution(); showPicker();
syncUrl();

/* ═══ общий снимок для совместной сессии, доски и карточек ═══
   Схема та же, что в остальных тренажёрах после Промпта №54: состояние
   версионируется (__tsRev/__tsBy), пришедшее от собеседника назад не
   рассылается, изменения ловит таймер. Значения полей ответа синхронизирует
   session-share сам — через registerField (см. renderAnswerArea). */
function cardsSnapshot(){
  return S.cards.map(c => ({
    pid: c.pid, answered: !!c.answered, hadWrong: !!c.hadWrong, correct: !!c.correct,
    marks: c.marks || {}, yn: c.yn || {}, sol: !!c.sol,
  }));
}
function tsGetState(){
  const base = {
    egeScreen: S.screen, egeN: S.n, egePid: S.pid, curSubMode: S.mode,
    answered: !!S.answered, hadWrong: !!S.hadWrong, correct: !!S.correct,
    marks: S.marks, yn: S.yn, sol: !!S.sol, step: S.step,
    cards: cardsSnapshot(),
    // ширина растянутой рабочей зоны: задания и заметки поверх них должны быть
    // видны обоим в одном масштабе
    workW: parseFloat(getComputedStyle(els.workZone).width) || null,
    totalSolved, streak, totalErrors,
  };
  if (window.__boardGetState) Object.assign(base, window.__boardGetState());
  // какой калькулятор в столбик открыт (и открыта ли его история) — общее:
  // учитель жмёт «Сложить», у ученика открывается то же окно
  if (EXAM.calcShared && window.__calcGetState) Object.assign(base, window.__calcGetState());
  return base;
}
function tsApplyState(state){
  if (!state) return;
  if (window.__boardApplyState) window.__boardApplyState(state);
  if (typeof state.egeN === 'undefined') return; // снимок без задания (пустая сессия)
  if (!BANK[state.egeN]) return;
  // в снимке задание ФИПИ, а файл номера ещё не пришёл — применим снимок
  // целиком после загрузки, иначе вместо задания открылась бы демоверсия
  if (fipiPending(state.egeN)) { ensureFipi(state.egeN, () => tsApplyState(state)); return; }
  if (EXAM.calcShared && window.__calcApplyState) window.__calcApplyState(state);

  // Сравниваем с прототипом, который реально откроется: неизвестный id (банк
  // у собеседника новее) заменяется первым, и иначе openTask звался бы на
  // каждом снимке, заваливая конспект урока одинаковыми снимками.
  // drawnTask нужен потому, что прототип, на котором страница стоит с
  // запуска, ещё не нарисован — совпадения номера и id тут мало
  const wantPid = (protoById(state.egeN, state.egePid) || {}).id;
  const needDraw = state.egeScreen !== 'picker' && drawnTask !== state.egeN + ':' + wantPid;
  if (state.egeN !== S.n || wantPid !== S.pid || needDraw) openTask(state.egeN, wantPid);
  // экран (список прототипов или само задание) тоже общий: учитель вернулся
  // к списку — ученик вернулся вместе с ним
  if (state.egeScreen === 'picker') { S.screen = 'picker'; renderPicker(); render(); return; }
  S.screen = 'task';
  if (state.curSubMode && state.curSubMode !== S.mode) S.mode = state.curSubMode;
  S.answered = !!state.answered;
  S.hadWrong = !!state.hadWrong;
  S.correct = !!state.correct;
  S.marks = state.marks || {};
  S.yn = state.yn || {};
  S.sol = !!state.sol;
  S.step = state.step || 0;
  if (typeof state.workW === 'number' && state.workW > 0) {
    els.workZone.style.setProperty('--work-w', clampWorkW(state.workW) + 'px');
  }
  /* Карточки перерисовываем ТОЛЬКО когда их список действительно изменился:
     перерисовка пересоздаёт поля ввода, а в них в этот момент может набирать
     ответ собеседник — его текст потерялся бы на каждом чужом штрихе доски. */
  const incoming = (state.cards || []).filter(c => c && c.pid && protoById(S.n, c.pid))
    .map(c => ({ pid: c.pid, answered: !!c.answered, hadWrong: !!c.hadWrong, correct: !!c.correct,
                 marks: c.marks || {}, yn: c.yn || {}, sol: !!c.sol }));
  // при совпадении объекты состояния НЕ подменяем: на них уже ссылаются
  // обработчики нарисованных карточек (кнопки «да/нет», проверка ответа)
  if (JSON.stringify(cardsSnapshot()) !== JSON.stringify(incoming)) {
    S.cards = incoming;
    renderCards(true);
  }
  render();
}
function tsWatchSig(s){
  return JSON.stringify([s.egeScreen, s.egeN, s.egePid, s.curSubMode, s.answered, s.hadWrong,
    s.correct, s.marks, s.yn, s.sol, s.step, s.cards, s.workW,
    // приведение обязательно: мост калькулятора объявлен в следующем
    // <script>, и исходная подпись таймера снимается ещё без него — без
    // приведения первый тик счёл бы это своей правкой и разослал бы экран
    // только что подключившегося поверх учительского
    s.calcOp || null, !!s.calcHist]);
}
let tsPeerSig = null;
/* Версия задания в общем снимке: снимок уходит и с каждым штрихом доски, неся
   то задание, которое было у отправителя В ТОТ МОМЕНТ. Без версии такой
   снимок, догнавший свежий ответ ученика, откатывал бы ответ назад. */
let tsRev = -1, tsRevBy = '';
const tsMe = Math.random().toString(36).slice(2, 10);
function tsGetStateVersioned(){
  return Object.assign(tsGetState(), { __tsRev: tsRev, __tsBy: tsRevBy });
}
function tsIncomingWins(state){
  if (typeof state.__tsRev !== 'number') return true;
  if (tsRev < 0) return true;
  if (state.__tsRev !== tsRev) return state.__tsRev > tsRev;
  return String(state.__tsBy || '') > tsRevBy;
}
function tsApplyStateFromPeer(state){
  if (!state) return;
  if (!tsIncomingWins(state)) {
    if (window.__boardApplyState) window.__boardApplyState(state);
    if (window.__cardsApplyState) window.__cardsApplyState(state);
    return;
  }
  if (typeof state.__tsRev === 'number') { tsRev = state.__tsRev; tsRevBy = String(state.__tsBy || ''); }
  tsApplyState(state);
  try { tsPeerSig = tsWatchSig(tsGetState()); } catch (e) {}
}
/* Мост __trainerState нужен только кадрам-iframe из trainer-multi.js. Здесь
   добавленные задания рисуются прямо на странице (как в ОГЭ №8), поэтому
   trainer-multi.js не подключён и мост не нужен. */
if (window.TrainerSession) {
  // конспект урока: счётчик снимков и кнопка «скачать PDF» живут в панели
  // совместного доступа — она одна на все тренажёры
  if (window.LessonHistory) {
    window.TrainerSession.registerHistoryUI({
      getCount: window.LessonHistory.getCount,
      onDownload: window.LessonHistory.downloadPdf,
    });
  }
  window.TrainerSession.init({ trainer: EXAM.slug, getState: tsGetStateVersioned, applyState: tsApplyStateFromPeer })
    .then(function(){
      /* Номер задания в адресе — это выбор учителя, сделанный на главной
         («ОГЭ, часть 2 → №7»). Снимок из базы к этому моменту мог вернуть
         страницу на прошлое задание, поэтому после подключения адрес
         пересиливает — но только у ведущего: присоединившегося уводит за
         ведущим сама сессия. */
      if (URL_N && URL_N !== S.n && window.TrainerSession.isLeader && window.TrainerSession.isLeader()) {
        openTask(URL_N);
      }
    }, function(){});

  (function watchState(){
    let last = '';
    try { last = tsWatchSig(tsGetState()); } catch (e) {}
    setInterval(() => {
      let sig;
      try { sig = tsWatchSig(tsGetState()); }
      catch (e) { return; }
      if (sig === last) return;
      last = sig;
      const echo = sig === tsPeerSig;
      tsPeerSig = null;
      if (echo) return;
      tsRev = Math.max(tsRev, 0) + 1; tsRevBy = tsMe;
      window.TrainerSession.push();
    }, 300);
  })();
}
</script>

<script>
/* ─── плавная посадка блоков при изменении высоты .panel ───
   ResizeObserver ловит ЛЮБОЕ изменение высоты независимо от того, какая
   функция его вызвала, и вместо мгновенного скачка красиво анимирует
   высоту — всё, что ниже, плавно съезжает на новое место. */
function setupAutoHeightAnimation(el, duration){
  if(!el || typeof ResizeObserver==='undefined') return;
  duration = duration || 280;
  let lastH = null, resizing = false, settleTimer = null;
  const ro = new ResizeObserver(entries=>{
    if(resizing) return;
    const entry = entries[0];
    const cs = getComputedStyle(el);
    const newH = (entry.borderBoxSize && entry.borderBoxSize[0])
      ? entry.borderBoxSize[0].blockSize
      : entry.contentRect.height + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
    if(lastH===null){ lastH=newH; return; }
    if(Math.abs(newH-lastH)<1) return;
    const oldH = lastH;
    lastH = newH;
    resizing = true;
    el.style.height = oldH+'px';
    el.style.overflow = 'hidden';
    void el.offsetHeight;
    el.style.transition = 'height '+duration+'ms cubic-bezier(.4,0,.2,1)';
    requestAnimationFrame(()=>{ el.style.height = newH+'px'; });
    clearTimeout(settleTimer);
    settleTimer = setTimeout(()=>{
      el.style.transition = '';
      el.style.height = '';
      el.style.overflow = '';
      resizing = false;
      lastH = el.getBoundingClientRect().height;
    }, duration+50);
  });
  ro.observe(el);
}
document.querySelectorAll('.panel:not(.calc-history-panel):not(.calc-panel)').forEach(p=>setupAutoHeightAnimation(p));
</script>

<!-- Промпт №16: конспект сессии — страница задания с записями перед его сменой -->
<script src="notes-store.js"></script>
<script src="lesson-notes.js"></script>
<script>
/* ═══════════════ калькулятор в столбик («свой пример») ═══════════════
   Встраивает через iframe те же тренажёры сложения/вычитания/умножения/
   деления в столбик (файлы *_embed.html). Самостоятельный блок — не
   зависит от остального кода страницы, ищет свои элементы напрямую. */
(function(){
  const CALC_OP_META = {
    add: { title: '➕ Сложение в столбик — свой пример', file: 'addition_embed.html' },
    sub: { title: '➖ Вычитание в столбик — свой пример', file: 'subtraction_embed.html' },
    mul: { title: '✖️ Умножение в столбик — свой пример', file: 'multiplication_embed.html' },
    div: { title: '➗ Деление в столбик — свой пример', file: 'division_embed.html' },
  };

  const calcPanel = document.getElementById('calcPanel');
  const calcPanelTitle = document.getElementById('calcPanelTitle');
  const calcIframe = document.getElementById('calcIframe');
  const calcPanelClose = document.getElementById('calcPanelClose');
  const calcHistoryBtn = document.getElementById('calcHistoryBtn');
  const calcHistoryPanel = document.getElementById('calcHistoryPanel');
  const calcHistoryClose = document.getElementById('calcHistoryClose');
  const calcHistoryList = document.getElementById('calcHistoryList');
  const calcHistoryEmpty = document.getElementById('calcHistoryEmpty');
  if (!calcPanel || !calcIframe) return;

  let calcResizeTimer = null;
  let calcOp = null;   // какой калькулятор открыт — для общего снимка сессии

  function openCalc(op, fromPeer) {
    calcOp = op;
    calcPanel.style.display = 'block';
    calcPanelTitle.textContent = CALC_OP_META[op].title;
    calcIframe.style.height = '760px';
    calcIframe.src = `${CALC_OP_META[op].file}?embed=1`;
    document.querySelectorAll('.calc-tool-btn[data-op]').forEach(b => b.classList.toggle('active', b.dataset.op === op));
    // у собеседника страницу не дёргаем: прокрутку ведущего и так везёт
    // синхронное перемещение по доске
    if (!fromPeer) calcPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    clearInterval(calcResizeTimer);
    calcResizeTimer = setInterval(fitCalcIframe, 400);
  }
  function fitCalcIframe() {
    if (!calcIframe || calcPanel.style.display === 'none') { clearInterval(calcResizeTimer); return; }
    try {
      const doc = calcIframe.contentWindow && calcIframe.contentWindow.document;
      if (doc && doc.documentElement) {
        const wrapEl = doc.querySelector('.wrap');
        const h = wrapEl ? wrapEl.getBoundingClientRect().height : Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
        if (h > 0) calcIframe.style.height = (Math.ceil(h) + 40) + 'px';
      }
    } catch (e) { /* кросс-доменные ограничения — оставляем текущую высоту */ }
  }
  function closeCalc() {
    calcOp = null;
    calcPanel.style.display = 'none';
    calcIframe.src = 'about:blank';
    clearInterval(calcResizeTimer);
    document.querySelectorAll('.calc-tool-btn[data-op]').forEach(b => b.classList.remove('active'));
  }
  document.querySelectorAll('.calc-tool-btn[data-op]').forEach(btn => {
    btn.onclick = () => openCalc(btn.dataset.op);
  });
  if (calcPanelClose) calcPanelClose.onclick = closeCalc;
  calcIframe.addEventListener('load', fitCalcIframe);

  let calcHistory = [];
  let calcHistoryNextId = 1;
  let calcHistoryFilter = 'all';

  function addCalcHistoryEntry(op, expr, result) {
    calcHistory.push({ id: calcHistoryNextId++, op, expr, result });
    if (calcHistoryPanel.style.display === 'block') renderCalcHistory();
  }
  function renderCalcHistory() {
    const items = calcHistoryFilter === 'all' ? calcHistory : calcHistory.filter(h => h.op === calcHistoryFilter);
    calcHistoryList.innerHTML = '';
    calcHistoryEmpty.style.display = items.length ? 'none' : 'block';
    items.slice().reverse().forEach(h => {
      const row = document.createElement('div');
      row.className = 'calc-history-row';
      const num = document.createElement('span');
      num.className = 'calc-history-num';
      num.textContent = '№' + h.id;
      const expr = document.createElement('span');
      expr.className = 'calc-history-expr';
      expr.textContent = h.expr;
      const copyBtn = document.createElement('button');
      copyBtn.className = 'calc-history-copy';
      copyBtn.textContent = '⧉ ' + h.result;
      copyBtn.title = 'Скопировать результат';
      copyBtn.onclick = () => copyCalcResult(h.result, copyBtn);
      row.appendChild(num);
      row.appendChild(expr);
      row.appendChild(copyBtn);
      calcHistoryList.appendChild(row);
    });
  }
  function copyCalcResult(result, btn) {
    const done = () => {
      btn.textContent = '✓ скопировано';
      setTimeout(() => { btn.textContent = '⧉ ' + result; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(String(result)).then(done).catch(done);
    } else {
      done();
    }
  }
  function toggleCalcHistory(e, fromPeer) {
    const willOpen = calcHistoryPanel.style.display !== 'block';
    calcHistoryPanel.style.display = willOpen ? 'block' : 'none';
    calcHistoryBtn.classList.toggle('active', willOpen);
    if (willOpen) {
      renderCalcHistory();
      if (!fromPeer) calcHistoryPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }
  function closeCalcHistory() {
    calcHistoryPanel.style.display = 'none';
    calcHistoryBtn.classList.remove('active');
  }
  document.querySelectorAll('.calc-history-filter').forEach(btn => {
    btn.onclick = () => {
      calcHistoryFilter = btn.dataset.filter;
      document.querySelectorAll('.calc-history-filter').forEach(b => b.classList.toggle('active', b === btn));
      renderCalcHistory();
    };
  });
  if (calcHistoryBtn) calcHistoryBtn.onclick = toggleCalcHistory;
  if (calcHistoryClose) calcHistoryClose.onclick = closeCalcHistory;

  /* Мост для общего снимка сессии (включается EXAM.calcShared). Общее —
     только КАКОЕ окно открыто; пример внутри калькулятора (кадр *_embed.html
     сессию не подключает) и записи истории у каждого свои. Открывать заново
     тот же калькулятор нельзя: смена src стёрла бы набранный пример */
  window.__calcGetState = function(){
    return { calcOp: calcOp, calcHist: calcHistoryPanel.style.display === 'block' };
  };
  window.__calcApplyState = function(st){
    if (!st || !('calcOp' in st)) return;   // снимок со страницы без моста
    const want = CALC_OP_META[st.calcOp] ? st.calcOp : null;
    if (want !== calcOp) { if (want) openCalc(want, true); else closeCalc(); }
    const histOpen = calcHistoryPanel.style.display === 'block';
    if (typeof st.calcHist === 'boolean' && st.calcHist !== histOpen) toggleCalcHistory(null, true);
  };

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (d && d.source === 'oge-calc-history' && d.op && d.expr && d.result !== undefined) {
      addCalcHistoryEntry(d.op, d.expr, d.result);
    }
  });
})();
</script>
