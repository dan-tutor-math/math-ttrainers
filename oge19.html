<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОГЭ №19 — верные утверждения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Sora','Helvetica Neue',Arial,sans-serif;
  --font-mono:ui-monospace,-apple-system,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#EEF1F7;
  --blob-1:rgba(120,150,255,.16);
  --blob-2:rgba(190,150,230,.14);
  --card:rgba(255,255,255,.8);
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.85);
  --glass-inset:rgba(255,255,255,.55);
  --hl:var(--hl-14);
  --muted-1:#8E8E93;
  --muted-2:#6E6E73;
  --muted-3:#48484A;
  --muted-4:#3A3A3C;
  --muted-5:#1D1D1F;
  --muted-6:#8E8E93;
  --paper:#FDFCF7;
  --grid:#DCE4F0;
  --ink:#004C99;
  --ink-active:#003A75;
  --pencil:#1D1D1F;
  --teacher:#FF3B30;
  --ok:#248A3D;
  --ok-tint:rgba(36,138,61,.1);
  --ok-shadow:rgba(36,138,61,.3);
  --shadow:0 10px 34px rgba(20,30,60,.08);
  --hl-10:rgba(0,76,153,.10);
  --hl-14:var(--hl);
  --hl-35:rgba(0,76,153,.35);
}
html[data-theme="dark"]{
  --bg:#0B0E1A;
  --blob-1:rgba(90,110,255,.22);
  --blob-2:rgba(150,90,220,.18);
  --paper:#151A2C;
  --card:rgba(30,37,64,.82);
  --glass:rgba(40,46,74,.5);
  --glass-strong:rgba(46,53,84,.65);
  --glass-border:rgba(255,255,255,.12);
  --glass-inset:rgba(255,255,255,.07);
  --hl:rgba(40,110,214,.26);
  --grid:#232A44;
  --ink:#2E7DE0;
  --ink-active:#4A93F0;
  --pencil:#F2F3F5;
  --teacher:#FF6961;
  --ok:#3E8E5B;
  --ok-tint:rgba(62,142,91,.14);
  --ok-shadow:rgba(62,142,91,.35);
  --shadow:0 10px 40px rgba(0,0,0,.55);
  --hl-10:rgba(46,125,224,.16);
  --hl-14:var(--hl);
  --hl-35:rgba(46,125,224,.5);
  --muted-1:#9A9AA2;
  --muted-2:#9A9AA2;
  --muted-3:#AEAEB4;
  --muted-4:#C7C7CC;
  --muted-5:#F2F3F5;
  --muted-6:#9A9AA2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    var(--bg);
  font-family:var(--font-ui);
  color:var(--pencil);
  min-height:100vh;
  padding:18px 12px 60px;
}
.wrap{max-width:820px;margin:0 auto;position:relative;z-index:1;pointer-events:none}
.wrap > *{pointer-events:auto}

/* ─── калькулятор в столбик (свой пример) — встраивает настоящие тренажёры через iframe ─── */
.calc-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.calc-tool-btn{flex:1;min-width:130px;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:11px 8px;cursor:pointer;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, border-color .12s, background .12s, color .12s;}
.calc-tool-btn:active{transform:scale(.96)}
.calc-tool-btn:hover{border-color:var(--ink)}
.calc-tool-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.calc-panel{display:none;position:relative;padding:18px;}
.calc-panel-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-strong);color:var(--muted-3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .15s;}
.calc-panel-close:active{transform:scale(.9)}
.calc-panel-close:hover{border-color:var(--ink)}
.calc-panel-title{font-family:var(--font-ui);font-weight:700;font-size:15px;color:var(--pencil);margin-bottom:14px;padding-right:32px;}
.calc-iframe{display:block;width:100%;border:none;border-radius:14px;background:transparent;}
.calc-history-panel{display:none;position:relative;padding:18px;margin-bottom:14px;}
.calc-history-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-right:32px;}
.calc-history-filter{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:6px 12px;cursor:pointer;transition:transform .15s, border-color .12s, background .12s, color .12s;}
.calc-history-filter:active{transform:scale(.96)}
.calc-history-filter:hover{border-color:var(--ink)}
.calc-history-filter.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.calc-history-list{display:flex;flex-direction:column;}
.calc-history-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--glass-border);}
.calc-history-row:first-child{border-top:none;}
.calc-history-num{font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-6);min-width:20px;}
.calc-history-expr{font-family:var(--font-mono);font-size:15px;color:var(--pencil);flex:1;}
.calc-history-copy{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:6px 10px;cursor:pointer;white-space:nowrap;transition:border-color .12s, background .12s;}
.calc-history-copy:hover{border-color:var(--ink)}
.calc-history-copy:active{transform:scale(.96)}
.calc-history-empty{font-family:var(--font-ui);font-size:14px;color:var(--muted-6);text-align:center;padding:16px 0;}

/* ─── интерактивная доска на фоне вокруг примера ─── */
#boardCanvas{position:fixed;top:0;left:0;z-index:2;touch-action:none;cursor:crosshair;border-radius:20px;}
#boardCanvasBg{position:fixed;top:0;left:0;z-index:0;touch-action:none;cursor:crosshair;}
#boardSpace{height:0;pointer-events:none;transition:height .2s ease;}
.board-toolbar{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:8px;align-items:center;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:20px;padding:9px 11px;box-shadow:var(--shadow);}
.toolbar-sep{width:1px;align-self:stretch;background:var(--glass-border);margin:2px 0;}
.board-tool-btn{width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s, border-color .15s, background .15s;}
.board-tool-btn:active{transform:scale(.92)}
.board-tool-btn:hover{border-color:var(--ink);}
.board-tool-btn.active{background:var(--ink);border-color:var(--ink);}
.board-tool-btn .dot{border-radius:50%;background:var(--pencil);display:block;}
.board-tool-btn.active .dot{background:#fff;}
.board-tool-btn.eraser{font-size:15px;}
.board-tool-btn.pen-main{font-size:15px;}
.board-tool-btn.color-btn.active{background:var(--glass);border-color:var(--ink);box-shadow:0 0 0 2px var(--ink);}
.tool-group{position:relative;}
/* всплывающее окошко с размерами (для ручки и ластика) — управляется из JS через
   класс .open, а не через :hover, потому что чистый CSS-hover рвётся, стоит
   курсору чуть отклониться от прямой линии между кнопкой и окошком */
.size-flyout{position:absolute;bottom:100%;right:0;margin-bottom:10px;display:none;gap:8px;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;padding:8px;box-shadow:var(--shadow);}
.size-flyout.open{display:flex;}
/* невидимый мостик над кнопкой, чтобы курсор не «выпадал» из зоны наведения,
   пока едет от кнопки к окошку */
.tool-group::after{content:'';position:absolute;left:0;right:0;bottom:100%;height:14px;}

/* ─── всплывающая палитра для «своего» цвета ─── */
.board-tool-btn.custom-color-btn{overflow:hidden;}
.color-picker-flyout{flex-direction:column;align-items:stretch;width:200px;padding:12px;gap:10px;}
.cp-sv-wrap{position:relative;width:100%;height:120px;border-radius:12px;overflow:hidden;cursor:crosshair;touch-action:none;}
.cp-sv{display:block;width:100%;height:100%;}
.cp-sv-thumb{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;top:0;left:0;}
.cp-row{display:flex;align-items:center;gap:8px;}
.cp-eyedropper{width:28px;height:28px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--pencil);transition:transform .15s;}
.cp-eyedropper:active{transform:scale(.9)}
.cp-eyedropper:hover{border-color:var(--ink);}
.cp-swatch{width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);}
.cp-hue-wrap{position:relative;flex:1;height:16px;touch-action:none;}
.cp-hue{position:absolute;inset:0;border-radius:8px;background:linear-gradient(to right,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);cursor:pointer;}
.cp-hue-thumb{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;}
.cp-rgb-row{display:flex;gap:6px;}
.cp-field{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.cp-field input{width:100%;box-sizing:border-box;text-align:center;border-radius:8px;border:1px solid var(--glass-border);background:var(--glass);color:var(--pencil);font-family:var(--font-mono);font-size:12px;padding:5px 2px;}
.cp-field label{font-size:10px;color:var(--muted-3);font-family:var(--font-ui);}

.board-view-toolbar{position:fixed;left:18px;bottom:18px;z-index:50;display:flex;gap:8px;align-items:center;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:20px;padding:9px 11px;box-shadow:var(--shadow);}
.board-zoom-label{min-width:44px;height:34px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-3);padding:0 6px;transition:transform .15s;}
.board-zoom-label:active{transform:scale(.92)}
.board-zoom-label:hover{border-color:var(--ink);}
.board-tool-btn.hand-tool{font-size:16px;}
.board-tool-btn.clear-btn{font-size:15px;}

/* ─── доска изначально выключена — включается отдельной кнопкой под переключателем темы ─── */
html:not([data-board="on"]) #boardCanvas,
html:not([data-board="on"]) #boardCanvasBg,
html:not([data-board="on"]) .board-toolbar,
html:not([data-board="on"]) .board-view-toolbar{display:none;}
html[data-board="on"] #boardSpace{height:72vh;transition:height .32s ease;}
/* при свёрнутых подсказках место под алгоритмами/счётчиками освобождается — отдаём его доске */
html[data-board="on"][data-focus="on"] #boardSpace{height:90vh;}
html[data-board="on"] body{background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    var(--bg);}
/* ─── свернуть подсказки: освобождает место для записи на доске ─── */
.focus-toggle{position:fixed;top:112px;right:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;}
.focus-toggle:hover{border-color:var(--ink)}
.focus-toggle:active{transform:scale(.92)}

/* ─── аккуратное сворачивание: max-height/opacity вместо мгновенного display:none ─── */
h1,.sub,.stats,.submode-tabs{overflow:hidden;min-height:0;transition:max-height .32s ease, opacity .22s ease, margin .32s ease;}
h1{max-height:64px}
.sub{max-height:50px}
.stats{max-height:90px}
.submode-tabs{max-height:56px}
html[data-focus="on"] h1,
html[data-focus="on"] .sub,
html[data-focus="on"] .stats,
html[data-focus="on"] .submode-tabs{
  max-height:0;
  min-height:0;
  padding:0;
  border-width:0;
  opacity:0;
  margin-top:0;
  margin-bottom:0;
  pointer-events:none;
}
html[data-focus="on"] #pickerArea{display:none!important;}
h1{font-family:var(--font-ui);font-weight:700;letter-spacing:-.02em;font-size:clamp(24px,5vw,34px);color:var(--pencil);text-align:center;}
.sub{font-family:var(--font-ui);font-weight:500;text-align:center;color:var(--muted-2);font-size:15px;margin:4px 0 22px;}
.task-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.submode-tabs{display:flex;gap:8px;margin-bottom:14px;}
.submode-tab{flex:1;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--muted-3);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:10px 6px;cursor:pointer;text-align:center;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, border-color .15s, color .15s, background .15s;}
.submode-tab:active{transform:scale(.96)}
.submode-tab:hover{border-color:var(--ink);}
.submode-tab.active{color:#fff;background:var(--ink);border-color:var(--ink);}
.coming-soon{font-family:var(--font-ui);font-weight:500;font-size:15px;color:var(--muted-3);text-align:center;padding:34px 16px;line-height:1.5;}
.refresh-btn{width:28px;height:28px;flex:0 0 auto;border:1px solid var(--glass-border);border-radius:50%;background:var(--glass-strong);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-size:15px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .18s, border-color .12s;}
.refresh-btn:hover{border-color:var(--ink);transform:rotate(80deg)}
.refresh-btn:active{transform:scale(.9)}
.task-title{font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--muted-3)}
.panel{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:22px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);padding:20px;margin-bottom:14px;}
@keyframes revealUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
#mainPanel.reveal{animation:revealUp .38s cubic-bezier(.22,.9,.35,1) both;}
.prompt{font-family:var(--font-ui);font-weight:500;font-size:clamp(16px,3vw,19px);color:var(--muted-5);margin-bottom:14px;line-height:1.5;}
.stmt-title{font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--muted-3);margin-bottom:10px;}
.stmt-list{display:flex;flex-direction:column;gap:8px;}
.stmt{
  display:flex;align-items:flex-start;gap:12px;text-align:left;
  font-family:var(--font-mono);font-size:15px;color:var(--pencil);
  background:var(--card);border:1.5px solid var(--glass-border);border-radius:14px;
  padding:12px 16px;cursor:pointer;transition:border-color .12s, background .12s;
}
.stmt .slabel{font-family:var(--font-ui);font-weight:700;color:var(--muted-1);flex:0 0 auto;}
.stmt .stext{font-family:var(--font-ui);font-size:15px;line-height:1.4;}
.stmt:hover:not(.disabled){border-color:var(--ink)}
.stmt.picked{border-color:var(--ink);background:var(--hl-10);}
.stmt.correct{border-color:var(--ok);background:var(--ok-tint);color:var(--ok);}
.stmt.wrong{border-color:var(--teacher);background:rgba(255,59,48,.1);color:var(--teacher);}
.stmt.disabled{cursor:default}
.check-btn{font-family:var(--font-ui);font-weight:600;font-size:16px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:13px 26px;cursor:pointer;width:100%;margin-top:14px;transition:transform .15s;}
.check-btn:active{transform:scale(.98)}
.check-btn:disabled{opacity:.5;cursor:default}
.change-answer-btn{display:none;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--teacher);background:none;border:none;padding:10px 2px 0;cursor:pointer;text-decoration:underline;animation:revealUp .3s ease both;transition:opacity .15s;}
.change-answer-btn:active{opacity:.6}
.explain{font-family:var(--font-ui);font-size:15px;color:var(--muted-4);line-height:1.55;}
.explain b{color:var(--ink)}
.next-btn{font-family:var(--font-ui);font-weight:600;font-size:16px;background:var(--ok);color:#fff;border:none;border-radius:14px;padding:13px 26px;cursor:pointer;width:100%;margin-top:14px;box-shadow:0 6px 18px var(--ok-shadow);transition:transform .15s;}
.next-btn:active{transform:scale(.98)}
.stats{display:flex;gap:10px;flex-wrap:wrap;}
.stat{flex:1;min-width:110px;background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);padding:12px 14px;text-align:center;}
.stat .v{font-family:var(--font-ui);font-weight:700;font-size:22px;color:var(--ink);}
.stat .l{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-6);}
.theme-toggle{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;}
.theme-toggle:hover{border-color:var(--ink)}
.theme-toggle:active{transform:scale(.92)}
.board-visibility-toggle{top:64px;transition:transform .15s;}
.board-visibility-toggle:active{transform:scale(.92)}
.board-visibility-toggle.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.home-btn{position:fixed;top:16px;left:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;text-decoration:none;}
.home-btn:hover{border-color:var(--ink)}
.home-btn:active{transform:scale(.92)}
</style>
</head>
<body>
<a class="home-btn" href="index.html" title="Ко всем тренажёрам" aria-label="Ко всем тренажёрам">←</a>
<button class="theme-toggle" id="themeToggle" title="Светлая/тёмная тема" aria-label="Переключить тему">🌙</button>
<button class="theme-toggle board-visibility-toggle" id="boardVisibilityToggle" title="Показать доску" aria-label="Показать/скрыть доску">🖊️</button>
<script>(function(){
  var btn=document.getElementById('themeToggle');
  function apply(t, persist){
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    if (persist) { try{ localStorage.setItem('theme', t); }catch(e){} }
  }
  apply(document.documentElement.getAttribute('data-theme') || 'light', false);
  btn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(cur, true);
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSystemChange = function(e){
      var explicit = false;
      try{ explicit = !!localStorage.getItem('theme'); }catch(err){}
      if (explicit) return;
      apply(e.matches ? 'dark' : 'light', false);
    };
    if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
    else if (mq.addListener) mq.addListener(onSystemChange);
  }
})();</script>

<script>
/* ═══════════════ утилиты ═══════════════ */
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sampleN(arr, n) {
  return shuffleArr(arr).slice(0, n);
}

/* ═══════════════ банк утверждений ═══════════════ */
const TRUE_STATEMENTS = [

  { text: 'В параллелограмме противоположные стороны равны.', explain: 'Это свойство следует из определения параллелограмма.' },
  { text: 'Диагональ квадрата делит его на два равных прямоугольных треугольника.', explain: 'Диагональ квадрата — ось симметрии, делящая его на два равных прямоугольных треугольника.' },
  { text: 'Все углы прямоугольника прямые.', explain: 'Это следует из определения прямоугольника.' },
];
const FALSE_STATEMENTS = [
  { text: 'Сумма углов треугольника равна 360°.', explain: 'Неверно: сумма углов треугольника равна 180°, а не 360°.' },

  { text: 'Внешний угол треугольника всегда меньше внутреннего угла, не смежного с ним.', explain: 'Неверно: внешний угол треугольника равен сумме двух внутренних углов, не смежных с ним, и потому больше каждого из них.' },
];

function genStatementsTask(){
  const trueCount = 2;
  const falseCount = 3;
  const chosenTrue = sampleN(TRUE_STATEMENTS, trueCount);
  const chosenFalse = sampleN(FALSE_STATEMENTS, falseCount);
  const all = shuffleArr([
    ...chosenTrue.map(s => ({ ...s, isTrue: true })),
    ...chosenFalse.map(s => ({ ...s, isTrue: false })),
  ]);
  return { statements: all };
}

/* ═══════════════ управление ═══════════════ */
let totalSolved = 0, streak = 0, totalErrors = 0;
let curTask = null, taskAnswered = false, checked = false, hadWrongPick = false;
let pickedSet = new Set();

const els = {
  refreshBtn: document.getElementById('refreshBtn'),
  tabLearn: document.getElementById('tabLearn'),
  tabPractice: document.getElementById('tabPractice'),
  tabExam: document.getElementById('tabExam'),
  comingSoonPanel: document.getElementById('comingSoonPanel'),
  questionPanel: document.getElementById('questionPanel'),
  stmtList: document.getElementById('stmtList'),
  checkBtn: document.getElementById('checkBtn'),
  changeAnswerBtn: document.getElementById('changeAnswerBtn'),
  mainPanel: document.getElementById('mainPanel'),
  explainBox: document.getElementById('explainBox'),
  nextBtn: document.getElementById('nextBtn'),
  stSolved: document.getElementById('stSolved'),
  stErrors: document.getElementById('stErrors'),
  stStreak: document.getElementById('stStreak'),
};

const COMING_SOON_TEXT = {
  learn: '🚧 Режим «Обучение» ещё в разработке. Здесь появится подробное объяснение решения — со всеми подсказками, шаг за шагом.',
  practice: '🚧 Режим «Тренировка» ещё в разработке. Здесь будут задания с частью подсказок — уже поменьше, чем в «Обучении».',
};

let curSubMode = 'exam';

function switchSubMode(mode) {
  curSubMode = mode;
  els.tabLearn.classList.toggle('active', mode === 'learn');
  els.tabPractice.classList.toggle('active', mode === 'practice');
  els.tabExam.classList.toggle('active', mode === 'exam');

  if (mode === 'exam') {
    els.comingSoonPanel.style.display = 'none';
    els.refreshBtn.style.display = 'inline-flex';
    newTask();
  } else {
    els.questionPanel.style.display = 'none';
    els.mainPanel.style.display = 'none';
    els.refreshBtn.style.display = 'none';
    els.comingSoonPanel.textContent = COMING_SOON_TEXT[mode];
    els.comingSoonPanel.style.display = 'block';
  }
}
els.tabLearn.onclick = () => switchSubMode('learn');
els.tabPractice.onclick = () => switchSubMode('practice');
els.tabExam.onclick = () => switchSubMode('exam');
els.refreshBtn.onclick = () => { if (curSubMode === 'exam') newTask(); };

function newTask() {
  curTask = genStatementsTask();
  taskAnswered = false;
  checked = false;
  hadWrongPick = false;
  pickedSet = new Set();

  window.scrollTo(0, 0);

  els.questionPanel.style.display = 'block';
  els.stmtList.innerHTML = curTask.statements.map((s, i) =>
    `<div class="stmt" data-i="${i}"><span class="slabel">${i + 1})</span><span class="stext">${s.text}</span></div>`
  ).join('');
  els.checkBtn.style.display = 'block';
  els.checkBtn.disabled = false;
  els.changeAnswerBtn.style.display = 'none';
  attachStmtHandlers();

  els.mainPanel.style.display = 'none';
  els.explainBox.style.display = 'none';
  els.nextBtn.style.display = 'none';
}

function attachStmtHandlers() {
  const items = [...els.stmtList.querySelectorAll('.stmt')];
  items.forEach(el => {
    el.onclick = () => {
      if (taskAnswered) return;
      const i = Number(el.dataset.i);
      if (pickedSet.has(i)) { pickedSet.delete(i); el.classList.remove('picked'); }
      else { pickedSet.add(i); el.classList.add('picked'); }
    };
  });
}

function correctIndexSet() {
  const s = new Set();
  curTask.statements.forEach((st, i) => { if (st.isTrue) s.add(i); });
  return s;
}
function setsEqual(a, b) {
  if (a.size !== b.size) return false;
  for (const x of a) if (!b.has(x)) return false;
  return true;
}

els.checkBtn.onclick = () => {
  if (taskAnswered) return;
  checked = true;
  const correctSet = correctIndexSet();
  const items = [...els.stmtList.querySelectorAll('.stmt')];
  const isCorrect = setsEqual(pickedSet, correctSet);

  if (isCorrect) {
    items.forEach((el, i) => {
      el.classList.add('disabled');
      if (correctSet.has(i)) el.classList.add('correct');
    });
    streak++; totalSolved++;
    els.stSolved.textContent = totalSolved;
    els.stStreak.textContent = streak;
    taskAnswered = true;
    els.checkBtn.style.display = 'none';
    finishTask();
  } else if (hadWrongPick) {
    items.forEach((el, i) => {
      el.classList.add('disabled');
      if (correctSet.has(i)) el.classList.add('correct');
      else if (pickedSet.has(i)) el.classList.add('wrong');
    });
    streak = 0; totalErrors++;
    els.stErrors.textContent = totalErrors;
    els.stStreak.textContent = streak;
    taskAnswered = true;
    els.checkBtn.style.display = 'none';
    finishTask();
  } else {
    items.forEach((el, i) => {
      if (pickedSet.has(i) && !correctSet.has(i)) el.classList.add('wrong');
    });
    hadWrongPick = true;
    streak = 0; totalErrors++;
    els.stErrors.textContent = totalErrors;
    els.stStreak.textContent = streak;
    els.changeAnswerBtn.style.display = 'block';
  }
};

els.changeAnswerBtn.onclick = () => {
  if (taskAnswered) return;
  pickedSet = new Set();
  const items = [...els.stmtList.querySelectorAll('.stmt')];
  items.forEach(el => el.classList.remove('picked', 'wrong', 'correct', 'disabled'));
  els.changeAnswerBtn.style.display = 'none';
  attachStmtHandlers();
};

function finishTask() {
  els.mainPanel.style.display = 'block';
  els.explainBox.style.display = 'block';
  const correctSet = correctIndexSet();
  const nums = [...correctSet].map(i => i + 1).sort((a, b) => a - b).join(', ');
  const details = curTask.statements.map((s, i) => `${i + 1}) ${s.isTrue ? '<b>верно.</b>' : 'неверно.'} ${s.explain}`).join('<br>');
  els.explainBox.innerHTML = `<b>Верные утверждения: ${nums}.</b><br><br>${details}`;
  els.nextBtn.style.display = 'block';
  els.mainPanel.classList.remove('reveal');
  void els.mainPanel.offsetWidth;
  els.mainPanel.classList.add('reveal');
}
els.nextBtn.onclick = newTask;

switchSubMode('exam');
</script>



<script>
/* ─── плавная посадка блоков при изменении высоты .panel/.sheet ───
   Раньше при появлении подсказки/кнопки "дальше" панель ввода мгновенно
   скачком меняла высоту, а всё что ниже (статистика, теория) так же
   мгновенно дёргалось следом — расстояния оставались верными, но сам
   скачок выглядел "криво". ResizeObserver ловит ЛЮБОЕ изменение высоты
   независимо от того, какая функция его вызвала, и вместо мгновенного
   скачка красиво анимирует высоту — весь интерфейс ниже плавно
   "съезжает" на новое место, сохраняя одинаковый отступ всегда. */
function setupAutoHeightAnimation(el, duration){
  if(!el || typeof ResizeObserver==='undefined') return;
  duration = duration || 280;
  let lastH = null, resizing = false, settleTimer = null;
  const ro = new ResizeObserver(entries=>{
    if(resizing) return;
    const entry = entries[0];
    const cs = getComputedStyle(el);
    const newH = (entry.borderBoxSize && entry.borderBoxSize[0])
      ? entry.borderBoxSize[0].blockSize
      : entry.contentRect.height + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
    if(lastH===null){ lastH=newH; return; }
    if(Math.abs(newH-lastH)<1) return;
    const oldH = lastH;
    lastH = newH;
    resizing = true;
    el.style.height = oldH+'px';
    el.style.overflow = 'hidden';
    void el.offsetHeight;
    el.style.transition = 'height '+duration+'ms cubic-bezier(.4,0,.2,1)';
    requestAnimationFrame(()=>{ el.style.height = newH+'px'; });
    clearTimeout(settleTimer);
    settleTimer = setTimeout(()=>{
      el.style.transition = '';
      el.style.height = '';
      el.style.overflow = '';
      resizing = false;
      lastH = el.getBoundingClientRect().height;
    }, duration+50);
  });
  ro.observe(el);
}
const PANEL_ANIM_SELECTOR = '.panel:not(.calc-history-panel):not(.calc-panel):not(.example-history-panel):not(.coming-soon):not(.theory-block)';
document.querySelectorAll(PANEL_ANIM_SELECTOR).forEach(p=>setupAutoHeightAnimation(p));

</script>

<script>
/* ═══════════════ интерактивная доска на фоне ═══════════════ */
(function(){
  const canvas = document.getElementById('boardCanvas');
  const ctx = canvas.getContext('2d');
  // отдельный оффскрин-слой только для чернил: ластик (destination-out) стирает
  // содержимое ТОЛЬКО этого слоя, а сетка рисуется отдельно на основном холсте
  // и затем чернила накладываются сверху обычным source-over — так ластик
  // больше не «прогрызает» дыры в клетчатой сетке
  const inkCanvas = document.createElement('canvas');
  const inkCtx = inkCanvas.getContext('2d');

  // второй, независимый холст — «фон»: лежит на всю страницу НИЖЕ обычного
  // контента (z-index:-1 в CSS), поэтому карточки задания перекрывают его
  // собой, а свободное место вокруг них доступно для рисования
  const canvasBg = document.getElementById('boardCanvasBg');
  const ctxBg = canvasBg.getContext('2d');
  const inkCanvasBg = document.createElement('canvas');
  const inkCtxBg = inkCanvasBg.getContext('2d');

  const toolbar = document.getElementById('boardToolbar');
  const zoomResetBtn = document.getElementById('zoomResetBtn');

  // ═══ модель данных: штрихи хранятся в «мировых» координатах (=координаты
  // документа, как обычный page-scroll), а не в пикселях экрана. Холст же —
  // это просто окно viewport-размера, которое на каждый кадр перерисовывает
  // видимый кусок этого мира с учётом прокрутки страницы, панорамирования
  // и масштаба. Так рисунок всегда остаётся «приклеен» к странице, а зум
  // по-настоящему приближает/отдаляет содержимое, а не просто холст. ═══

  let tool = 'pen';          // 'pen' | 'eraser' | 'line' | 'hand'
  let penWidth = 2;          // тонкая по умолчанию
  let penColor = '#000000';  // чёрный по умолчанию
  let eraserSize = 26;       // средний ластик по умолчанию
  let dpr = Math.max(1, window.devicePixelRatio || 1);

  let strokes = [];          // завершённые штрихи: {tool,color,width,points:[{x,y}...]}
  let currentStroke = null;  // штрих, который рисуется прямо сейчас (для живого превью)
  const UNDO_LIMIT = 60;
  const undoStack = [];      // снимки массива strokes (лёгкие — это просто точки, не пиксели)

  // ── масштаб и панорамирование (в локальных пикселях листа) ──
  let viewScale = 1, panX = 0, panY = 0;
  const ZOOM_MIN = 0.5, ZOOM_MAX = 3, ZOOM_STEP = 1.2;

  // ── доска пишет строго поверх «тетрадного листа» примера (.sheet), а не
  // поверх всей страницы: холст каждый кадр подгоняется под текущий
  // getBoundingClientRect() этого листа, поэтому локальные координаты —
  // это просто пиксели внутри листа, без поправки на прокрутку страницы ──
  let boardTarget = null;
  function resolveBoardTarget(){
    // первая рабочая зона доски — всегда именно тетрадный лист примера (.sheet),
    // независимо от режима фокуса; вторая зона (фон) обслуживается отдельным
    // холстом ниже и в этот выбор не входит
    const sheets = [...document.querySelectorAll('.sheet')];
    for (const el of sheets) if (el.offsetParent !== null) return el;
    const fallbacks = [document.getElementById('mainPanel'), document.getElementById('taskArea'), document.querySelector('.panel')];
    for (const el of fallbacks) if (el && el.offsetParent !== null) return el;
    return null;
  }

  function worldToScreenTransform(){
    const s = viewScale * dpr;
    return [s, 0, 0, s, -panX * s, -panY * s];
  }
  function screenToWorld(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) / viewScale + panX,
      y: (clientY - rect.top) / viewScale + panY,
    };
  }

  function resizeCanvas(){
    dpr = Math.max(1, window.devicePixelRatio || 1);
    syncBoardTarget();
    redraw();
  }

  // ── синхронизирует размер/положение холста с текущим прямоугольником
  // листа; вызывается каждый кадр, пока доска включена, — так холст сам
  // следует за прокруткой страницы, ресайзом окна и ростом листа (например,
  // когда в столбик дописывается новая строка) ──
  function syncBoardTarget(){
    const el = resolveBoardTarget();
    boardTarget = el;
    if (!el) { canvas.style.display = 'none'; return false; }
    const rect = el.getBoundingClientRect();
    if (rect.width <= 0 || rect.height <= 0) { canvas.style.display = 'none'; return false; }
    canvas.style.display = '';
    canvas.style.left = rect.left + 'px';
    canvas.style.top = rect.top + 'px';
    const w = Math.round(rect.width), h = Math.round(rect.height);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
    if (canvas.width !== pw || canvas.height !== ph) {
      canvas.width = pw;
      canvas.height = ph;
      inkCanvas.width = pw;
      inkCanvas.height = ph;
    }
    return true;
  }

  function drawStroke(targetCtx, s){
    if (!s || s.points.length === 0) return;
    targetCtx.save();
    targetCtx.globalCompositeOperation = (s.tool === 'eraser') ? 'destination-out' : 'source-over';
    targetCtx.strokeStyle = s.color || '#000';
    targetCtx.lineWidth = s.width;
    targetCtx.lineCap = 'round';
    targetCtx.lineJoin = 'round';
    const pts = s.points;
    targetCtx.beginPath();
    if (pts.length === 1) {
      // одиночная точка — рисуем короткий отрезок «на месте»
      const p = pts[0];
      targetCtx.moveTo(p.x, p.y);
      targetCtx.lineTo(p.x + 0.01, p.y + 0.01);
    } else if (pts.length === 2) {
      // ровно 2 точки — это либо инструмент «линия» (должна остаться идеально
      // прямой), либо очень короткий росчерк, где сглаживать нечего
      targetCtx.moveTo(pts[0].x, pts[0].y);
      targetCtx.lineTo(pts[1].x, pts[1].y);
    } else {
      // сглаживание через квадратичные кривые по серединам отрезков —
      // стандартный приём для рисования от руки: убирает «углы» на изломах,
      // не требуя менять сами записанные точки
      targetCtx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length - 1; i++) {
        const midX = (pts[i].x + pts[i + 1].x) / 2;
        const midY = (pts[i].y + pts[i + 1].y) / 2;
        targetCtx.quadraticCurveTo(pts[i].x, pts[i].y, midX, midY);
      }
      const last = pts[pts.length - 1];
      const prev = pts[pts.length - 2];
      targetCtx.quadraticCurveTo(prev.x, prev.y, last.x, last.y);
    }
    targetCtx.stroke();
    targetCtx.restore();
  }

  let redrawScheduled = false;

  function redraw(){
    if (redrawScheduled) return;
    redrawScheduled = true;
    requestAnimationFrame(()=>{
      redrawScheduled = false;
      if (!boardTarget) return;
      const m = worldToScreenTransform();

      // чернила рисуются на отдельном слое (чтобы ластик стирал только их),
      // а затем накладываются на основной холст обычным source-over —
      // свою сетку холст больше не рисует: клетка — это фон самого .sheet,
      // доска лишь пишет поверх него прозрачным слоем
      inkCtx.save();
      inkCtx.setTransform(1, 0, 0, 1, 0, 0);
      inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
      inkCtx.restore();
      inkCtx.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]);
      for (const s of strokes) drawStroke(inkCtx, s);
      if (currentStroke) drawStroke(inkCtx, currentStroke);

      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();
      ctx.drawImage(inkCanvas, 0, 0);
    });
  }

  function pushUndo(surface){
    undoStack.push({ surface, data: (surface === 'bg' ? bgStrokes : strokes).slice() });
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  }
  function undo(){
    // общий стек на обе поверхности: Ctrl+Z отменяет последнее действие,
    // где бы оно ни произошло — на листе или на фоне
    if (undoStack.length === 0) return;
    const entry = undoStack.pop();
    if (entry.surface === 'bg') { bgStrokes = entry.data; redrawBg(); }
    else { strokes = entry.data; redraw(); }
  }
  function clearBoard(){
    pushUndo('sheet');
    strokes = [];
    pushUndo('bg');
    bgStrokes = [];
    redraw();
    redrawBg();
  }

  // ── панорамирование: средняя ИЛИ правая кнопка мыши, ИЛИ инструмент «рука» + левая кнопка ──
  let panning = false;
  let panStartClientX = 0, panStartClientY = 0, panStartPanX = 0, panStartPanY = 0;

  function startPan(e){
    panning = true;
    try { canvas.setPointerCapture(e.pointerId); } catch(_){}
    panStartClientX = e.clientX; panStartClientY = e.clientY;
    panStartPanX = panX; panStartPanY = panY;
    updateCursor();
  }
  function updateCursor(){
    canvas.style.cursor = panning ? 'grabbing' : (tool === 'hand' ? 'grab' : 'crosshair');
    canvasBg.style.cursor = bgPanning ? 'grabbing' : (tool === 'hand' ? 'grab' : 'crosshair');
  }

  let drawing = false;

  canvas.addEventListener('contextmenu', e=> e.preventDefault()); // правая кнопка теперь двигает доску, а не открывает системное меню
  canvas.addEventListener('pointerdown', e=>{
    if (e.button === 1 || e.button === 2) { startPan(e); e.preventDefault(); return; } // средняя ИЛИ правая кнопка — панорамирование
    if (tool === 'hand') {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      startPan(e); e.preventDefault(); return;
    }
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    drawing = true;
    try { canvas.setPointerCapture(e.pointerId); } catch(_){}
    pushUndo('sheet');
    const p = screenToWorld(e.clientX, e.clientY);
    if (tool === 'line') {
      currentStroke = { tool: 'line', color: penColor, width: penWidth, points: [p, p] };
    } else if (tool === 'eraser') {
      currentStroke = { tool: 'eraser', width: eraserSize, points: [p] };
    } else {
      currentStroke = { tool: 'pen', color: penColor, width: penWidth, points: [p] };
    }
    redraw();
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', e=>{
    if (panning) {
      panX = panStartPanX - (e.clientX - panStartClientX) / viewScale;
      panY = panStartPanY - (e.clientY - panStartClientY) / viewScale;
      redraw();
      e.preventDefault();
      return;
    }
    if (!drawing || !currentStroke) return;
    if (tool === 'line') {
      const p = screenToWorld(e.clientX, e.clientY);
      currentStroke.points[1] = p; // линия — всегда ровно 2 точки: старт и текущая
    } else {
      // getCoalescedEvents() восстанавливает промежуточные точки, которые браузер
      // «схлопнул» при быстром движении мыши/пера — это повышает эффективную
      // частоту дискретизации и вместе со сглаживанием в drawStroke() даёт
      // заметно менее угловатую линию
      const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      const list = events.length ? events : [e];
      for (const ev of list) {
        const p = screenToWorld(ev.clientX, ev.clientY);
        currentStroke.points.push(p);
      }
    }
    redraw();
    e.preventDefault();
  });

  function endStroke(e){
    if (panning) {
      panning = false;
      try { canvas.releasePointerCapture(e.pointerId); } catch(_){}
      updateCursor();
      return;
    }
    if (!drawing) return;
    drawing = false;
    if (currentStroke) {
      // на случай, если pointerup пришёл без предшествующего pointermove
      // ровно в этой точке — досчитываем финальную позицию по самому событию
      if (typeof e.clientX === 'number') {
        const p = screenToWorld(e.clientX, e.clientY);
        if (tool === 'line') currentStroke.points[1] = p;
        else currentStroke.points.push(p);
      }
      strokes.push(currentStroke);
      currentStroke = null;
    }
    try { canvas.releasePointerCapture(e.pointerId); } catch(_){}
    redraw();
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  /* ─────────────── вторая зона доски: фон (вся страница) ───────────────
     координаты «мировые» — как обычная прокрутка страницы, — поэтому
     рисунок остаётся «приклеен» к странице при скролле; здесь же живут
     полноценные панорамирование и масштаб (кнопки +/− в тулбаре) */

  let bgStrokes = [];
  let bgCurrentStroke = null;
  let bgViewScale = 1, bgPanX = 0, bgPanY = 0;
  const BG_GRID = 24; // px — совпадает с шагом клетки основного дизайна (--grid)

  function bgWorldToScreenTransform(){
    const s = bgViewScale * dpr;
    return [s, 0, 0, s, -(bgPanX + window.scrollX) * s, -(bgPanY + window.scrollY) * s];
  }
  function bgScreenToWorld(clientX, clientY){
    return {
      x: clientX / bgViewScale + bgPanX + window.scrollX,
      y: clientY / bgViewScale + bgPanY + window.scrollY,
    };
  }

  function resizeBgCanvas(){
    dpr = Math.max(1, window.devicePixelRatio || 1);
    const w = window.innerWidth, h = window.innerHeight;
    canvasBg.style.width = w + 'px';
    canvasBg.style.height = h + 'px';
    const pw = Math.round(w * dpr), ph = Math.round(h * dpr);
    if (canvasBg.width !== pw || canvasBg.height !== ph) {
      canvasBg.width = pw;
      canvasBg.height = ph;
      inkCanvasBg.width = pw;
      inkCanvasBg.height = ph;
    }
    redrawBg();
  }

  function drawBgGrid(){
    const topLeft = bgScreenToWorld(0, 0);
    const bottomRight = bgScreenToWorld(window.innerWidth, window.innerHeight);
    const gridColor = (getComputedStyle(document.documentElement).getPropertyValue('--grid') || '#dfe6f3').trim() || '#dfe6f3';
    const startX = Math.floor(topLeft.x / BG_GRID) * BG_GRID;
    const startY = Math.floor(topLeft.y / BG_GRID) * BG_GRID;
    ctxBg.strokeStyle = gridColor;
    ctxBg.lineWidth = 1 / bgViewScale;
    ctxBg.beginPath();
    for (let x = startX; x <= bottomRight.x; x += BG_GRID) { ctxBg.moveTo(x, topLeft.y); ctxBg.lineTo(x, bottomRight.y); }
    for (let y = startY; y <= bottomRight.y; y += BG_GRID) { ctxBg.moveTo(topLeft.x, y); ctxBg.lineTo(bottomRight.x, y); }
    ctxBg.stroke();
  }

  let bgRedrawScheduled = false;
  function redrawBg(){
    if (bgRedrawScheduled) return;
    bgRedrawScheduled = true;
    requestAnimationFrame(()=>{
      bgRedrawScheduled = false;
      const m = bgWorldToScreenTransform();

      inkCtxBg.save();
      inkCtxBg.setTransform(1, 0, 0, 1, 0, 0);
      inkCtxBg.clearRect(0, 0, inkCanvasBg.width, inkCanvasBg.height);
      inkCtxBg.restore();
      inkCtxBg.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]);
      for (const s of bgStrokes) drawStroke(inkCtxBg, s);
      if (bgCurrentStroke) drawStroke(inkCtxBg, bgCurrentStroke);

      ctxBg.setTransform(1, 0, 0, 1, 0, 0);
      ctxBg.clearRect(0, 0, canvasBg.width, canvasBg.height);
      ctxBg.setTransform(m[0], m[1], m[2], m[3], m[4], m[5]);
      drawBgGrid();
      ctxBg.setTransform(1, 0, 0, 1, 0, 0);
      ctxBg.drawImage(inkCanvasBg, 0, 0);
    });
  }

  // ── панорамирование фона: средняя/правая кнопка мыши, ИЛИ «рука» + левая ──
  let bgPanning = false;
  let bgPanStartClientX = 0, bgPanStartClientY = 0, bgPanStartPanX = 0, bgPanStartPanY = 0;

  function startBgPan(e){
    bgPanning = true;
    try { canvasBg.setPointerCapture(e.pointerId); } catch(_){}
    bgPanStartClientX = e.clientX; bgPanStartClientY = e.clientY;
    bgPanStartPanX = bgPanX; bgPanStartPanY = bgPanY;
    updateCursor();
  }

  let bgDrawing = false;

  canvasBg.addEventListener('contextmenu', e=> e.preventDefault());
  canvasBg.addEventListener('pointerdown', e=>{
    if (e.button === 1 || e.button === 2) { startBgPan(e); e.preventDefault(); return; }
    if (tool === 'hand') {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      startBgPan(e); e.preventDefault(); return;
    }
    if (e.pointerType === 'mouse' && e.button !== 0) return;

    bgDrawing = true;
    try { canvasBg.setPointerCapture(e.pointerId); } catch(_){}
    pushUndo('bg');
    const p = bgScreenToWorld(e.clientX, e.clientY);
    if (tool === 'line') {
      bgCurrentStroke = { tool: 'line', color: penColor, width: penWidth, points: [p, p] };
    } else if (tool === 'eraser') {
      bgCurrentStroke = { tool: 'eraser', width: eraserSize, points: [p] };
    } else {
      bgCurrentStroke = { tool: 'pen', color: penColor, width: penWidth, points: [p] };
    }
    redrawBg();
    e.preventDefault();
  });

  canvasBg.addEventListener('pointermove', e=>{
    if (bgPanning) {
      bgPanX = bgPanStartPanX - (e.clientX - bgPanStartClientX) / bgViewScale;
      bgPanY = bgPanStartPanY - (e.clientY - bgPanStartClientY) / bgViewScale;
      redrawBg();
      e.preventDefault();
      return;
    }
    if (!bgDrawing || !bgCurrentStroke) return;
    if (tool === 'line') {
      const p = bgScreenToWorld(e.clientX, e.clientY);
      bgCurrentStroke.points[1] = p;
    } else {
      const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      const list = events.length ? events : [e];
      for (const ev of list) {
        const p = bgScreenToWorld(ev.clientX, ev.clientY);
        bgCurrentStroke.points.push(p);
      }
    }
    redrawBg();
    e.preventDefault();
  });

  function endBgStroke(e){
    if (bgPanning) {
      bgPanning = false;
      try { canvasBg.releasePointerCapture(e.pointerId); } catch(_){}
      updateCursor();
      return;
    }
    if (!bgDrawing) return;
    bgDrawing = false;
    if (bgCurrentStroke) {
      if (typeof e.clientX === 'number') {
        const p = bgScreenToWorld(e.clientX, e.clientY);
        if (tool === 'line') bgCurrentStroke.points[1] = p;
        else bgCurrentStroke.points.push(p);
      }
      bgStrokes.push(bgCurrentStroke);
      bgCurrentStroke = null;
    }
    try { canvasBg.releasePointerCapture(e.pointerId); } catch(_){}
    redrawBg();
  }
  canvasBg.addEventListener('pointerup', endBgStroke);
  canvasBg.addEventListener('pointercancel', endBgStroke);

  // ── инструменты (ручка/ластик/линия/рука) — общая группа, активен ровно один ──
  // кнопка «рука» лежит в отдельной (второй) панели, поэтому ищем по всему документу
  const toolBtns = [...document.querySelectorAll('[data-tool]')];
  const eraserMainBtn = toolbar.querySelector('.eraser');
  const penMainBtn = toolbar.querySelector('.pen-main');

  function setActiveTool(btn){
    toolBtns.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    if (btn.dataset.tool === 'eraser' && btn !== eraserMainBtn) {
      eraserMainBtn.classList.add('active');
    }
    if (btn.dataset.tool === 'pen' && btn !== penMainBtn) {
      penMainBtn.classList.add('active');
    }
  }

  toolBtns.forEach(btn=>{
    btn.onclick = ()=>{
      setActiveTool(btn);
      const t = btn.dataset.tool;
      if (t === 'pen') {
        tool = 'pen';
        if (btn.dataset.width) penWidth = Number(btn.dataset.width);
      } else if (t === 'line') {
        tool = 'line';
      } else if (t === 'eraser') {
        tool = 'eraser';
        if (btn.dataset.size) eraserSize = Number(btn.dataset.size);
      } else if (t === 'hand') {
        tool = 'hand';
      }
      updateCursor();
    };
  });

  // ── всплывающие окошки с размерами (ручка/ластик): наведение показывает,
  // уход прячет — но с небольшой задержкой, чтобы курсор успевал доехать до
  // окошка, даже если путь неидеально прямой ──
  const HOVER_HIDE_DELAY = 350;
  [...document.querySelectorAll('.tool-group')].forEach(group=>{
    const flyout = group.querySelector('.size-flyout');
    if (!flyout) return;
    let hideTimer = null;
    function show(){ clearTimeout(hideTimer); flyout.classList.add('open'); }
    function scheduleHide(){ clearTimeout(hideTimer); hideTimer = setTimeout(()=> flyout.classList.remove('open'), HOVER_HIDE_DELAY); }
    group.addEventListener('mouseenter', show);
    group.addEventListener('mouseleave', scheduleHide);
    flyout.addEventListener('mouseenter', show);
    flyout.addEventListener('mouseleave', scheduleHide);
  });

  // ── цвет ручки — независимая группа ──
  const colorBtns = [...toolbar.querySelectorAll('[data-color]')];
  const firstPenBtn = toolbar.querySelector('[data-tool="pen"][data-width]');
  colorBtns.forEach(btn=>{
    btn.onclick = ()=>{
      colorBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      penColor = btn.dataset.color;
      tool = 'pen';
      const widthBtn = toolbar.querySelector(`[data-tool="pen"][data-width="${penWidth}"]`) || firstPenBtn;
      setActiveTool(widthBtn);
    };
  });

  // ── «свой» цвет: SV-квадрат + слайдер оттенка + RGB-поля + пипетка ──
  function hsvToRgb(h, s, v){
    h = ((h % 360) + 360) % 360;
    const c = v * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = v - c;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    return { r: Math.round((r + m) * 255), g: Math.round((g + m) * 255), b: Math.round((b + m) * 255) };
  }
  function rgbToHsv(r, g, b){
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d !== 0) {
      if (max === r) h = 60 * (((g - b) / d) % 6);
      else if (max === g) h = 60 * ((b - r) / d + 2);
      else h = 60 * ((r - g) / d + 4);
    }
    if (h < 0) h += 360;
    return { h, s: max === 0 ? 0 : d / max, v: max };
  }
  function rgbToHex(r, g, b){
    return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase();
  }
  function hexToRgb(hex){
    const m = /^#?([0-9a-f]{6})$/i.exec((hex || '').trim());
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  const customColorBtn = document.getElementById('customColorBtn');
  const customColorDot = document.getElementById('customColorDot');
  const cpSvCanvas = document.getElementById('cpSvCanvas');
  const cpSvCtx = cpSvCanvas.getContext('2d');
  const cpSvThumb = document.getElementById('cpSvThumb');
  const cpHue = document.getElementById('cpHue');
  const cpHueThumb = document.getElementById('cpHueThumb');
  const cpSwatch = document.getElementById('cpSwatch');
  const cpEyedropper = document.getElementById('cpEyedropper');
  const cpR = document.getElementById('cpR'), cpG = document.getElementById('cpG'), cpB = document.getElementById('cpB');

  let customHue = 280, customSat = 0.71, customVal = 0.87; // стартовый фиолетовый — просто заготовка на будущее

  function renderSvSquare(){
    const w = cpSvCanvas.width, h = cpSvCanvas.height;
    const hc = hsvToRgb(customHue, 1, 1);
    cpSvCtx.fillStyle = `rgb(${hc.r},${hc.g},${hc.b})`;
    cpSvCtx.fillRect(0, 0, w, h);
    const wg = cpSvCtx.createLinearGradient(0, 0, w, 0);
    wg.addColorStop(0, 'rgba(255,255,255,1)');
    wg.addColorStop(1, 'rgba(255,255,255,0)');
    cpSvCtx.fillStyle = wg;
    cpSvCtx.fillRect(0, 0, w, h);
    const bg = cpSvCtx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, 'rgba(0,0,0,0)');
    bg.addColorStop(1, 'rgba(0,0,0,1)');
    cpSvCtx.fillStyle = bg;
    cpSvCtx.fillRect(0, 0, w, h);
  }
  function updateCpThumbs(){
    cpSvThumb.style.left = (customSat * 100) + '%';
    cpSvThumb.style.top = ((1 - customVal) * 100) + '%';
    cpHueThumb.style.left = (customHue / 360 * 100) + '%';
  }
  // opts.updateInputs=false — не перезаписывать RGB-поля (когда цвет и так пришёл из них)
  // opts.activate=false — только обновить визуал кнопки/окошка, не делать цвет активным цветом пера
  function setCustomColor(rgb, opts){
    opts = opts || {};
    const hex = rgbToHex(rgb.r, rgb.g, rgb.b);
    customColorBtn.dataset.color = hex;
    cpSwatch.style.background = hex;
    customColorDot.style.background = hex;
    if (opts.updateInputs !== false) { cpR.value = rgb.r; cpG.value = rgb.g; cpB.value = rgb.b; }
    updateCpThumbs();
    if (opts.activate !== false) customColorBtn.click(); // переиспользуем обычный обработчик цветовых кнопок
    return hex;
  }

  renderSvSquare();
  setCustomColor(hsvToRgb(customHue, customSat, customVal), { activate: false });

  let svDragging = false;
  function pickFromSv(e){
    const rect = cpSvCanvas.getBoundingClientRect();
    customSat = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    customVal = 1 - Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
    setCustomColor(hsvToRgb(customHue, customSat, customVal));
  }
  cpSvCanvas.addEventListener('pointerdown', e=>{
    svDragging = true;
    cpSvCanvas.setPointerCapture(e.pointerId);
    pickFromSv(e);
    e.preventDefault(); e.stopPropagation();
  });
  cpSvCanvas.addEventListener('pointermove', e=>{
    if (!svDragging) return;
    pickFromSv(e);
    e.preventDefault(); e.stopPropagation();
  });
  cpSvCanvas.addEventListener('pointerup', e=>{
    svDragging = false;
    try { cpSvCanvas.releasePointerCapture(e.pointerId); } catch(_){}
    e.stopPropagation();
  });

  let hueDragging = false;
  function pickFromHue(e){
    const rect = cpHue.getBoundingClientRect();
    customHue = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * 360;
    renderSvSquare();
    setCustomColor(hsvToRgb(customHue, customSat, customVal));
  }
  cpHue.addEventListener('pointerdown', e=>{
    hueDragging = true;
    cpHue.setPointerCapture(e.pointerId);
    pickFromHue(e);
    e.preventDefault(); e.stopPropagation();
  });
  cpHue.addEventListener('pointermove', e=>{
    if (!hueDragging) return;
    pickFromHue(e);
    e.preventDefault(); e.stopPropagation();
  });
  cpHue.addEventListener('pointerup', e=>{
    hueDragging = false;
    try { cpHue.releasePointerCapture(e.pointerId); } catch(_){}
    e.stopPropagation();
  });

  function clampByte(n){
    n = Math.round(Number(n));
    if (!Number.isFinite(n)) n = 0;
    return Math.max(0, Math.min(255, n));
  }
  function onRgbInputChange(){
    const r = clampByte(cpR.value), g = clampByte(cpG.value), b = clampByte(cpB.value);
    cpR.value = r; cpG.value = g; cpB.value = b;
    const hsv = rgbToHsv(r, g, b);
    customHue = hsv.h; customSat = hsv.s; customVal = hsv.v;
    renderSvSquare();
    setCustomColor({ r, g, b }, { updateInputs: false });
  }
  [cpR, cpG, cpB].forEach(inp=>{
    inp.addEventListener('input', ()=>{ inp.value = inp.value.replace(/[^\d]/g, '').slice(0, 3); });
    inp.addEventListener('change', onRgbInputChange);
    inp.addEventListener('blur', onRgbInputChange);
    inp.addEventListener('keydown', e=>{ if (e.key === 'Enter') inp.blur(); });
    inp.addEventListener('pointerdown', e=> e.stopPropagation());
  });

  cpEyedropper.addEventListener('click', async e=>{
    e.preventDefault(); e.stopPropagation();
    if (!window.EyeDropper) return; // браузер не поддерживает EyeDropper API — кнопка просто неактивна
    try {
      const ed = new EyeDropper();
      const result = await ed.open();
      const rgb = hexToRgb(result.sRGBHex);
      if (rgb) {
        const hsv = rgbToHsv(rgb.r, rgb.g, rgb.b);
        customHue = hsv.h; customSat = hsv.s; customVal = hsv.v;
        renderSvSquare();
        setCustomColor(rgb);
      }
    } catch(_) { /* пользователь отменил выбор пипеткой */ }
  });
  if (!window.EyeDropper) cpEyedropper.style.opacity = '0.4';

  // ── отмена последнего действия: Ctrl+Z / ⌘+Z ──
  window.addEventListener('keydown', e=>{
    const tag = (e.target && e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || (e.target && e.target.isContentEditable)) return;
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')) {
      e.preventDefault();
      undo();
    }
  });

  document.getElementById('clearBoardBtn').onclick = clearBoard;

  // ── масштаб фона: кнопки +/− и сброс вида (у листа своего зума нет) ──
  function zoomBy(factor){
    bgViewScale = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, bgViewScale * factor));
    zoomResetBtn.textContent = Math.round(bgViewScale * 100) + '%';
    redrawBg();
  }
  document.getElementById('zoomInBtn').onclick = ()=> zoomBy(ZOOM_STEP);
  document.getElementById('zoomOutBtn').onclick = ()=> zoomBy(1 / ZOOM_STEP);
  zoomResetBtn.onclick = ()=>{
    bgViewScale = 1; bgPanX = 0; bgPanY = 0;
    zoomResetBtn.textContent = '100%';
    redrawBg();
  };

  window.addEventListener('resize', ()=>{ resizeCanvas(); resizeBgCanvas(); });

  // ── доска активна, только пока data-board="on": как только атрибут
  // появляется, запускаем цикл, который каждый кадр подгоняет лист под текущий
  // прямоугольник .sheet и перерисовывает фон с учётом прокрутки страницы —
  // а как только доску выключают, цикл сам останавливается ──
  let rafHandle = null;
  function boardLoop(){
    if (document.documentElement.getAttribute('data-board') !== 'on') { rafHandle = null; return; }
    syncBoardTarget();
    redraw();
    redrawBg();
    rafHandle = requestAnimationFrame(boardLoop);
  }
  function ensureLoopRunning(){
    if (rafHandle == null && document.documentElement.getAttribute('data-board') === 'on') {
      rafHandle = requestAnimationFrame(boardLoop);
    }
  }
  if (window.MutationObserver) {
    new MutationObserver(ensureLoopRunning).observe(document.documentElement, { attributes: true, attributeFilter: ['data-board'] });
  }
  ensureLoopRunning();
  resizeCanvas();
  resizeBgCanvas();
  updateCursor();
})();
</script>
<script>
/* ═══════════════ калькулятор в столбик («свой пример») ═══════════════
   Встраивает через iframe те же тренажёры сложения/вычитания/умножения/
   деления в столбик (файлы *_embed.html), чтобы часть примеров можно было
   решать вообще без использования тетради. Самостоятельный блок — не
   зависит от структуры els этого файла, ищет свои элементы напрямую. */
(function(){
  const CALC_OP_META = {
    add: { title: '➕ Сложение в столбик — свой пример', file: 'addition_embed.html' },
    sub: { title: '➖ Вычитание в столбик — свой пример', file: 'subtraction_embed.html' },
    mul: { title: '✖️ Умножение в столбик — свой пример', file: 'multiplication_embed.html' },
    div: { title: '➗ Деление в столбик — свой пример', file: 'division_embed.html' },
  };

  const calcPanel = document.getElementById('calcPanel');
  const calcPanelTitle = document.getElementById('calcPanelTitle');
  const calcIframe = document.getElementById('calcIframe');
  const calcPanelClose = document.getElementById('calcPanelClose');
  const calcHistoryBtn = document.getElementById('calcHistoryBtn');
  const calcHistoryPanel = document.getElementById('calcHistoryPanel');
  const calcHistoryClose = document.getElementById('calcHistoryClose');
  const calcHistoryList = document.getElementById('calcHistoryList');
  const calcHistoryEmpty = document.getElementById('calcHistoryEmpty');
  if (!calcPanel || !calcIframe) return; // блока калькулятора на странице нет — выходим тихо

  let calcResizeTimer = null;

  function openCalc(op) {
    calcPanel.style.display = 'block';
    calcPanelTitle.textContent = CALC_OP_META[op].title;
    calcIframe.style.height = '760px';
    calcIframe.src = `${CALC_OP_META[op].file}?embed=1`;
    document.querySelectorAll('.calc-tool-btn[data-op]').forEach(b => b.classList.toggle('active', b.dataset.op === op));
    calcPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    clearInterval(calcResizeTimer);
    calcResizeTimer = setInterval(fitCalcIframe, 400);
  }
  function fitCalcIframe() {
    if (!calcIframe || calcPanel.style.display === 'none') { clearInterval(calcResizeTimer); return; }
    try {
      const doc = calcIframe.contentWindow && calcIframe.contentWindow.document;
      if (doc && doc.documentElement) {
        const h = Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
        if (h > 0) calcIframe.style.height = (h + 20) + 'px';
      }
    } catch (e) { /* кросс-доменные ограничения — оставляем текущую высоту */ }
  }
  function closeCalc() {
    calcPanel.style.display = 'none';
    calcIframe.src = 'about:blank';
    clearInterval(calcResizeTimer);
    document.querySelectorAll('.calc-tool-btn[data-op]').forEach(b => b.classList.remove('active'));
  }
  document.querySelectorAll('.calc-tool-btn[data-op]').forEach(btn => {
    btn.onclick = () => openCalc(btn.dataset.op);
  });
  if (calcPanelClose) calcPanelClose.onclick = closeCalc;
  calcIframe.addEventListener('load', fitCalcIframe);

  /* ─── история решений: копится за всё время, пока открыта страница ─── */
  let calcHistory = [];
  let calcHistoryNextId = 1;
  let calcHistoryFilter = 'all';

  function addCalcHistoryEntry(op, expr, result) {
    calcHistory.push({ id: calcHistoryNextId++, op, expr, result });
    if (calcHistoryPanel.style.display === 'block') renderCalcHistory();
  }
  function renderCalcHistory() {
    const items = calcHistoryFilter === 'all' ? calcHistory : calcHistory.filter(h => h.op === calcHistoryFilter);
    calcHistoryList.innerHTML = '';
    calcHistoryEmpty.style.display = items.length ? 'none' : 'block';
    items.slice().reverse().forEach(h => {
      const row = document.createElement('div');
      row.className = 'calc-history-row';
      const num = document.createElement('span');
      num.className = 'calc-history-num';
      num.textContent = '№' + h.id;
      const expr = document.createElement('span');
      expr.className = 'calc-history-expr';
      expr.textContent = h.expr;
      const copyBtn = document.createElement('button');
      copyBtn.className = 'calc-history-copy';
      copyBtn.textContent = '⧉ ' + h.result;
      copyBtn.title = 'Скопировать результат';
      copyBtn.onclick = () => copyCalcResult(h.result, copyBtn);
      row.appendChild(num);
      row.appendChild(expr);
      row.appendChild(copyBtn);
      calcHistoryList.appendChild(row);
    });
  }
  function copyCalcResult(result, btn) {
    const done = () => {
      btn.textContent = '✓ скопировано';
      setTimeout(() => { btn.textContent = '⧉ ' + result; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(String(result)).then(done).catch(done);
    } else {
      done();
    }
  }
  function toggleCalcHistory() {
    const willOpen = calcHistoryPanel.style.display !== 'block';
    calcHistoryPanel.style.display = willOpen ? 'block' : 'none';
    calcHistoryBtn.classList.toggle('active', willOpen);
    if (willOpen) {
      renderCalcHistory();
      calcHistoryPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }
  function closeCalcHistory() {
    calcHistoryPanel.style.display = 'none';
    calcHistoryBtn.classList.remove('active');
  }
  document.querySelectorAll('.calc-history-filter').forEach(btn => {
    btn.onclick = () => {
      calcHistoryFilter = btn.dataset.filter;
      document.querySelectorAll('.calc-history-filter').forEach(b => b.classList.toggle('active', b === btn));
      renderCalcHistory();
    };
  });
  if (calcHistoryBtn) calcHistoryBtn.onclick = toggleCalcHistory;
  if (calcHistoryClose) calcHistoryClose.onclick = closeCalcHistory;

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (d && d.source === 'oge-calc-history' && d.op && d.expr && d.result !== undefined) {
      addCalcHistoryEntry(d.op, d.expr, d.result);
    }
  });
})();
</script>
