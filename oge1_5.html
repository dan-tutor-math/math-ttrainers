<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E1A">
<script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОГЭ №1–5 — практические задачи</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:'Onest',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --font-mono:ui-monospace,-apple-system,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#EEF1F7;
  --blob-1:rgba(120,150,255,.16);
  --blob-2:rgba(190,150,230,.14);
  --card:rgba(255,255,255,.8);
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.85);
  --glass-inset:rgba(255,255,255,.55);
  --hl:var(--hl-14);
  --muted-1:#8E8E93;
  --muted-2:#6E6E73;
  --muted-3:#48484A;
  --muted-4:#3A3A3C;
  --muted-5:#1D1D1F;
  --muted-6:#8E8E93;
  --paper:#FDFCF7;
  --grid:#DCE4F0;
  --ink:#004C99;
  --ink-active:#003A75;
  --pencil:#1D1D1F;
  --teacher:#FF3B30;
  --ok:#248A3D;
  --ok-tint:rgba(36,138,61,.1);
  --ok-shadow:rgba(36,138,61,.3);
  --shadow:0 10px 34px rgba(20,30,60,.08);
  --hl-10:rgba(0,76,153,.10);
  --hl-14:var(--hl);
  --hl-35:rgba(0,76,153,.35);
}
html[data-theme="dark"]{
  --bg:#0B0E1A;
  --blob-1:rgba(90,110,255,.22);
  --blob-2:rgba(150,90,220,.18);
  --paper:#151A2C;
  --card:rgba(30,37,64,.82);
  --glass:rgba(40,46,74,.5);
  --glass-strong:rgba(46,53,84,.65);
  --glass-border:rgba(255,255,255,.12);
  --glass-inset:rgba(255,255,255,.07);
  --hl:rgba(40,110,214,.26);
  --grid:#232A44;
  --ink:#2E7DE0;
  --ink-active:#4A93F0;
  --pencil:#F2F3F5;
  --teacher:#FF6961;
  --ok:#3E8E5B;
  --ok-tint:rgba(62,142,91,.14);
  --ok-shadow:rgba(62,142,91,.35);
  --shadow:0 10px 40px rgba(0,0,0,.55);
  --hl-10:rgba(46,125,224,.16);
  --hl-14:var(--hl);
  --hl-35:rgba(46,125,224,.5);
  --muted-1:#9A9AA2;
  --muted-2:#9A9AA2;
  --muted-3:#AEAEB4;
  --muted-4:#C7C7CC;
  --muted-5:#F2F3F5;
  --muted-6:#9A9AA2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    var(--bg);
  font-family:var(--font-ui);
  color:var(--pencil);
  min-height:100vh;
  padding:18px 12px 60px;
}
.wrap{max-width:820px;margin:0 auto;position:relative;pointer-events:none}
.wrap > *{pointer-events:auto}
/* пока доска включена: всё содержимое .wrap не перехватывает клики (можно рисовать
   поверх текста/картинок/таблиц), кроме самих управляющих элементов — их явно
   возвращаем выше холста; заодно снимаем backdrop-filter (он создаёт свой контекст
   наложения и не даёт кнопкам внутри карточек пробиться выше холста по z-index) */
html[data-board="on"] .wrap *{pointer-events:none;}
html[data-board="on"] .wrap button,
html[data-board="on"] .wrap input,
html[data-board="on"] .wrap select,
html[data-board="on"] .wrap textarea,
html[data-board="on"] .wrap a,
html[data-board="on"] .wrap [contenteditable="true"],
html[data-board="on"] .wrap [role="button"]{pointer-events:auto;position:relative;z-index:3;}
html[data-board="on"] .wrap,
html[data-board="on"] .wrap *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;}
/* элементы вроде mainPanel.reveal заканчивают анимацию появления с "мёртвым"
   transform:translateY(0) (matrix identity) — он визуально ничего не делает,
   но по спецификации CSS всё равно создаёт свой контекст наложения и не даёт
   кнопкам внутри (например nextBtn) пробиться выше холста; поэтому гасим
   transform у всех НЕуправляющих элементов, пока доска включена */
html[data-board="on"] .wrap *:not(button):not(input):not(select):not(textarea):not(a):not([contenteditable="true"]):not([role="button"]){transform:none!important;animation:none!important;}

/* ─── интерактивная доска на фоне вокруг примера ─── */
#boardCanvas{position:fixed;top:0;left:0;z-index:2;touch-action:none;cursor:crosshair;border-radius:20px;}
#boardCanvasBg{position:fixed;top:0;left:0;z-index:0;touch-action:none;cursor:crosshair;}
#boardSpace{height:0;pointer-events:none;transition:height .2s ease;}
.board-toolbar{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:8px;align-items:center;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:20px;padding:9px 11px;box-shadow:var(--shadow);}
.toolbar-sep{width:1px;align-self:stretch;background:var(--glass-border);margin:2px 0;}
.board-tool-btn{width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s, border-color .15s, background .15s;}
.board-tool-btn:active{transform:scale(.92)}
.board-tool-btn:hover{border-color:var(--ink);}
.board-tool-btn.active{background:var(--ink);border-color:var(--ink);}
.board-tool-btn .dot{border-radius:50%;background:var(--pencil);display:block;}
.board-tool-btn.active .dot{background:#fff;}
.board-tool-btn.eraser{font-size:15px;}
.board-tool-btn.pen-main{font-size:15px;}
.board-tool-btn.color-btn.active{background:var(--glass);border-color:var(--ink);box-shadow:0 0 0 2px var(--ink);}
.tool-group{position:relative;}
/* всплывающее окошко с размерами (для ручки и ластика) — управляется из JS через
   класс .open, а не через :hover, потому что чистый CSS-hover рвётся, стоит
   курсору чуть отклониться от прямой линии между кнопкой и окошком */
.size-flyout{position:absolute;bottom:100%;right:0;margin-bottom:10px;display:none;gap:8px;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;padding:8px;box-shadow:var(--shadow);}
.size-flyout.open{display:flex;}
/* невидимый мостик над кнопкой, чтобы курсор не «выпадал» из зоны наведения,
   пока едет от кнопки к окошку */
.tool-group::after{content:'';position:absolute;left:0;right:0;bottom:100%;height:14px;}

/* ─── всплывающая палитра для «своего» цвета ─── */
.board-tool-btn.custom-color-btn{overflow:hidden;}
.color-picker-flyout{flex-direction:column;align-items:stretch;width:200px;padding:12px;gap:10px;}
.cp-sv-wrap{position:relative;width:100%;height:120px;border-radius:12px;overflow:hidden;cursor:crosshair;touch-action:none;}
.cp-sv{display:block;width:100%;height:100%;}
.cp-sv-thumb{position:absolute;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;top:0;left:0;}
.cp-row{display:flex;align-items:center;gap:8px;}
.cp-eyedropper{width:28px;height:28px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--pencil);transition:transform .15s;}
.cp-eyedropper:active{transform:scale(.9)}
.cp-eyedropper:hover{border-color:var(--ink);}
.cp-swatch{width:26px;height:26px;flex:0 0 auto;border-radius:50%;border:1px solid var(--glass-border);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);}
.cp-hue-wrap{position:relative;flex:1;height:16px;touch-action:none;}
.cp-hue{position:absolute;inset:0;border-radius:8px;background:linear-gradient(to right,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);cursor:pointer;}
.cp-hue-thumb{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none;}
.cp-rgb-row{display:flex;gap:6px;}
.cp-field{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.cp-field input{width:100%;box-sizing:border-box;text-align:center;border-radius:8px;border:1px solid var(--glass-border);background:var(--glass);color:var(--pencil);font-family:var(--font-mono);font-size:12px;padding:5px 2px;}
.cp-field label{font-size:10px;color:var(--muted-3);font-family:var(--font-ui);}

.board-view-toolbar{position:fixed;left:18px;bottom:18px;z-index:50;display:flex;gap:8px;align-items:center;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:20px;padding:9px 11px;box-shadow:var(--shadow);}
.board-zoom-label{min-width:44px;height:34px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass);display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-3);padding:0 6px;transition:transform .15s;}
.board-zoom-label:active{transform:scale(.92)}
.board-zoom-label:hover{border-color:var(--ink);}
.board-tool-btn.hand-tool{font-size:16px;}
.board-tool-btn.clear-btn{font-size:15px;}

/* ─── доска изначально выключена — включается отдельной кнопкой под переключателем темы ─── */
html:not([data-board="on"]) #boardCanvas,
html:not([data-board="on"]) #boardCanvasBg,
html:not([data-board="on"]) .board-toolbar,
html:not([data-board="on"]) .board-view-toolbar{display:none;}
html[data-board="on"] #boardSpace{height:72vh;transition:height .32s ease;}
/* при свёрнутых подсказках место под алгоритмами/счётчиками освобождается — отдаём его доске */
html[data-board="on"][data-focus="on"] #boardSpace{height:90vh;}
html[data-board="on"] body{background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    var(--bg);}

/* ─── свернуть подсказки: освобождает место для записи на доске ─── */
.focus-toggle{position:fixed;top:112px;right:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;}
.focus-toggle:hover{border-color:var(--ink)}
.focus-toggle:active{transform:scale(.92)}

/* ─── аккуратное сворачивание: max-height/opacity вместо мгновенного display:none ─── */
h1,.sub,.theory-block,.stats,.example-history-toggle,.example-history-panel,.submode-tabs,.taskset-nav{overflow:hidden;min-height:0;transition:max-height .32s ease, opacity .22s ease, margin .32s ease;}
h1{max-height:64px}
.sub{max-height:50px}
/* .theory-block — не просто текст: в задании «Шина 1» внутри лежит открытая
   пользователем (кнопкой «Показать теорию») теория с двумя картинками, реальная
   высота которой сильно растёт на узких экранах (картинки/текст переносятся).
   Раньше здесь стояло фиксированное 140px (годится только для СВЁРНУТОГО вида
   с одной кнопкой) — из-за overflow:hidden это обрезало открытую теорию почти
   полностью. Значения ниже измерены реальным рендером (Chromium) для полностью
   открытой теории на разных ширинах, с запасом. */
.theory-block{max-height:750px}
@media(max-width:799px){.theory-block{max-height:800px}}
@media(max-width:699px){.theory-block{max-height:900px}}
@media(max-width:599px){.theory-block{max-height:1100px}}
@media(max-width:479px){.theory-block{max-height:1450px}}
.stats{max-height:90px}
.example-history-toggle{max-height:56px}
.example-history-panel{max-height:220px}
.submode-tabs{max-height:56px}
.taskset-nav{max-height:52px}
html[data-focus="on"] h1,
html[data-focus="on"] .sub,
html[data-focus="on"] .theory-block,
html[data-focus="on"] .stats,
html[data-focus="on"] .example-history-toggle,
html[data-focus="on"] .example-history-panel,
html[data-focus="on"] .submode-tabs,
html[data-focus="on"] .taskset-nav{
  max-height:0;
  min-height:0;
  padding:0;
  border-width:0;
  opacity:0;
  margin-top:0;
  margin-bottom:0;
  pointer-events:none;
}
html[data-focus="on"] #pickerArea{display:none!important;}

/* ─── медали за пять решённых примеров подряд в этом прототипе ─── */
.mode-medals{font-family:var(--font-ui);font-size:12px;margin-top:4px;opacity:.85;}
.medal-badge-row{display:inline-flex;gap:3px;margin-left:8px;font-size:15px;vertical-align:middle;}
.medal-tray{position:fixed;left:0;right:0;bottom:0;z-index:150;display:none;gap:7px;align-items:center;padding:8px 16px;overflow-x:auto;background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border-top:1px solid var(--glass-border);}
.medal-tray.show{display:flex;}
.medal-tray-icon{font-size:20px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));animation:medalPop .45s cubic-bezier(.34,1.56,.64,1) both;flex:none;}
@keyframes medalPop{0%{transform:scale(0);}70%{transform:scale(1.3);}100%{transform:scale(1);}}
.medal-flyer{position:fixed;z-index:300;pointer-events:none;font-size:44px;filter:drop-shadow(0 4px 14px rgba(0,0,0,.3));transition:transform .85s cubic-bezier(.32,.9,.35,1), opacity .85s ease .1s;}

/* ─── история последних пяти примеров этого прототипа ─── */
.example-history-toggle{display:block;width:100%;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:11px 18px;cursor:pointer;margin-top:18px;margin-bottom:14px;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, background .12s;}
.example-history-toggle:active{transform:scale(.98)}
.example-history-toggle:hover{background:var(--hl-10);}
.example-history-panel{display:none;position:relative;padding:18px;margin-bottom:14px;}
.example-history-list{display:flex;flex-direction:column;}
.example-history-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--glass-border);}
.example-history-row:first-child{border-top:none;}
.example-history-mark{font-size:16px;flex:none;margin-top:1px;}
.example-history-prompt{font-family:var(--font-mono);font-size:14px;color:var(--pencil);line-height:1.4;}
.example-history-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.example-history-answer{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--ok);line-height:1.3;}
.example-history-empty{font-family:var(--font-ui);font-size:14px;color:var(--muted-6);text-align:center;padding:16px 0;}

h1{font-family:var(--font-ui);font-weight:700;letter-spacing:-.02em;font-size:clamp(24px,5vw,34px);color:var(--pencil);text-align:center;}
.sub{font-family:var(--font-ui);font-weight:500;text-align:center;color:var(--muted-2);font-size:15px;margin:4px 0 22px;}

/* ─── выбор типа (группами) ─── */
.group-title{font-family:var(--font-ui);font-weight:700;font-size:14px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;margin:18px 2px 8px;}
.group-title:first-child{margin-top:0}
.modes{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.mode-card{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px 16px;text-align:left;
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-border);border-radius:14px;
  box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);
  padding:11px 18px;cursor:pointer;transition:transform .12s, border-color .12s;font-family:var(--font-ui);
}
.mode-card:hover{border-color:var(--ink); transform:translateX(3px)}
.mode-card .mtitle{font-weight:600;font-size:15px;color:var(--pencil);line-height:1.3;flex:1 1 260px;margin:0;}
.mode-card.random{background:linear-gradient(135deg, var(--hl-10), transparent);border-color:var(--ink);margin-bottom:14px;}
.mode-card.soon{opacity:.55;cursor:default;}
.mode-card.soon:hover{border-color:var(--glass-border);transform:none;}
.soon-badge{font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-1);background:var(--glass);border-radius:8px;padding:3px 8px;}

/* ─── шапка задачи ─── */
.task-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.type-nav{display:flex;align-items:center;gap:8px;}
.type-nav-btn{height:28px;flex:0 0 auto;border:1px solid var(--glass-border);border-radius:12px;background:var(--glass-strong);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-family:var(--font-ui);font-weight:600;font-size:12px;line-height:1;cursor:pointer;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;transition:transform .12s, border-color .12s;}
.type-nav-btn:hover{border-color:var(--ink)}
.type-nav-btn:active{transform:scale(.9)}
.submode-tabs{display:flex;gap:8px;margin-bottom:14px;}
.submode-tab{flex:1;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--muted-3);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:10px 6px;cursor:pointer;text-align:center;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, border-color .15s, color .15s, background .15s;}
.submode-tab:active{transform:scale(.96)}
.submode-tab:hover{border-color:var(--ink);}
.submode-tab.active{color:#fff;background:var(--ink);border-color:var(--ink);}
.coming-soon{font-family:var(--font-ui);font-weight:500;font-size:15px;color:var(--muted-3);text-align:center;padding:34px 16px;line-height:1.5;}
.back-btn{font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(16px) saturate(160%);transition:transform .15s;}
.back-btn:active{transform:scale(.96)}
.back-btn:hover{border-color:var(--ink)}
.task-title{font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--muted-3)}
.corner{font-family:var(--font-ui);font-weight:500;display:flex;align-items:center;gap:10px;}
.refresh-btn{width:28px;height:28px;flex:0 0 auto;border:1px solid var(--glass-border);border-radius:50%;background:var(--glass-strong);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-size:15px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .18s, border-color .12s;}
.refresh-btn:hover{border-color:var(--ink);transform:rotate(80deg)}
.refresh-btn:active{transform:scale(.9)}
.basket-add-btn{width:28px;height:28px;flex:0 0 auto;border:1px solid var(--glass-border);border-radius:50%;background:var(--glass-strong);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-size:13px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s, border-color .12s, background .2s, color .2s;}
.basket-add-btn:hover{border-color:var(--ink)}
.basket-add-btn:active{transform:scale(.9)}
.basket-add-btn.ok{background:var(--ok, #34c759);border-color:var(--ok, #34c759);color:#fff;}

/* ─── навигация по заданиям внутри темы ─── */
.taskset-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.taskset-nav-btn{font-family:var(--font-ui);font-weight:600;font-size:13.5px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:9px 14px;cursor:pointer;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, border-color .12s, opacity .12s;}
.taskset-nav-btn:active{transform:scale(.96)}
.taskset-nav-btn:hover:not(:disabled){border-color:var(--ink)}
.taskset-nav-btn:disabled{opacity:.35;cursor:default;}
.taskset-nav-label{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--muted-2);flex:0 0 auto;}

/* ─── панель ─── */
.panel{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:22px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);padding:20px;margin-bottom:14px;}
@keyframes revealUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
#mainPanel.reveal{animation:revealUp .38s cubic-bezier(.22,.9,.35,1) both;}
@keyframes correctPop{0%{transform:scale(.94);}55%{transform:scale(1.025);}100%{transform:scale(1);}}
.mcq-btn.correct{animation:correctPop .32s ease;}
.prompt{font-family:var(--font-ui);font-weight:500;font-size:clamp(16px,3vw,19px);color:var(--muted-5);margin-bottom:14px;line-height:1.5;}

/* ─── таблица данных ─── */
.data-table{width:100%;border-collapse:collapse;margin:10px 0 4px;font-family:var(--font-mono);font-size:14px;}
.data-table th,.data-table td{border:1px solid var(--glass-border);padding:6px 10px;text-align:center;}
.data-table th{background:var(--glass);font-family:var(--font-ui);font-weight:600;color:var(--muted-3);}

/* ─── теория (сворачиваемый блок) ─── */
.theory-block{padding:14px 16px;}
.theory-block-head{display:flex;gap:8px;align-items:center;}
.theory-block-head .theory-toggle{flex:1;}
.theory-toggle{
  width:100%;text-align:left;font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--ink);
  background:var(--hl-10);border:1px solid var(--glass-border);border-radius:14px;padding:11px 16px;cursor:pointer;transition:transform .15s;}
.theory-toggle:active{transform:scale(.96)}
.theory-toggle:hover{border-color:var(--ink)}
.theory-content{margin-top:12px;animation:revealUp .3s ease both;}
.theory-images{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;}
.theory-images figure{margin:0;text-align:center;max-width:240px;background:#fff;border-radius:14px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;align-items:center;}
.theory-images svg,.theory-images img{width:100%;height:auto;display:block;border-radius:4px;}
.theory-images figcaption{font-family:var(--font-ui);font-size:12.5px;color:var(--muted-2);margin-top:6px;}
.theory-text{font-family:var(--font-ui);font-size:15px;color:var(--muted-4);line-height:1.6;background:var(--card);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:14px;padding:14px 16px;}
.theory-text p{margin:0 0 8px;}
.theory-text ul{margin:6px 0 10px;padding-left:20px;}
.theory-text li{margin:4px 0;}
.theory-text b{color:var(--ink)}
.theory-text .formula{display:inline-block;font-family:var(--font-ui);background:var(--hl-10);border-radius:8px;padding:4px 8px;color:var(--ink);margin-top:4px;}

/* ─── MCQ ─── */
.mcq-title{font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--muted-3);margin-bottom:10px;}
.mcq-options{display:flex;flex-direction:column;gap:8px;}
.input-answer-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.answer-input{
  font-family:var(--font-mono);font-size:19px;color:var(--ink);
  background:var(--card);border:1.5px solid var(--glass-border);border-radius:14px;
  padding:11px 14px;width:130px;
}
.answer-input:focus{outline:none;border-color:var(--ink)}
.answer-input.good{border-color:var(--ok);background:var(--ok-tint);color:var(--ok);}
.answer-input.bad{border-color:var(--teacher);background:rgba(255,59,48,.1);color:var(--teacher);}
@keyframes shakeInput{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.answer-input.shake{animation:shakeInput .35s;}
.answer-unit{font-family:var(--font-ui);font-weight:500;font-size:15px;color:var(--muted-3);}
.check-btn{font-family:var(--font-ui);font-weight:600;font-size:15px;background:var(--ink);color:#fff;border:none;border-radius:14px;padding:11px 22px;cursor:pointer;transition:transform .15s;}
.check-btn:active{transform:scale(.98)}
.check-btn:disabled{opacity:.5;cursor:default}
.change-answer-btn{display:none;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--teacher);background:none;border:none;padding:10px 2px 0;cursor:pointer;text-decoration:underline;animation:revealUp .3s ease both;transition:opacity .15s;}
.change-answer-btn:active{opacity:.6}
.solution-btn{display:none;width:100%;font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--ink);background:var(--glass);border:1.5px dashed var(--ink);border-radius:14px;padding:12px 18px;cursor:pointer;margin-bottom:14px;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, background .12s;}
.solution-btn:hover{background:var(--hl-10);}
.solution-btn:active{transform:scale(.98);}

/* ─── калькулятор в столбик (свой пример) — встраивает настоящие тренажёры через iframe ─── */
.calc-tools{display:none;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.calc-tool-btn{flex:1;min-width:130px;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:11px 8px;cursor:pointer;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s, border-color .12s, background .12s, color .12s;}
.calc-tool-btn:active{transform:scale(.96)}
.calc-tool-btn:hover{border-color:var(--ink)}
.calc-tool-btn.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.calc-panel{display:none;position:relative;padding:18px;}
.calc-panel-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--glass-border);background:var(--glass-strong);color:var(--muted-3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .15s;}
.calc-panel-close:active{transform:scale(.9)}
.calc-panel-close:hover{border-color:var(--ink)}
.calc-panel-title{font-family:var(--font-ui);font-weight:700;font-size:15px;color:var(--pencil);margin-bottom:14px;padding-right:32px;}
.calc-iframe{display:block;width:100%;border:none;border-radius:14px;background:transparent;}
.calc-history-panel{display:none;position:relative;padding:18px;margin-bottom:14px;}
.calc-history-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;padding-right:32px;}
.calc-history-filter{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:6px 12px;cursor:pointer;transition:transform .15s, border-color .12s, background .12s, color .12s;}
.calc-history-filter:active{transform:scale(.96)}
.calc-history-filter:hover{border-color:var(--ink)}
.calc-history-filter.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.calc-history-list{display:flex;flex-direction:column;}
.calc-history-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--glass-border);}
.calc-history-row:first-child{border-top:none;}
.calc-history-num{font-family:var(--font-ui);font-weight:600;font-size:12px;color:var(--muted-6);min-width:20px;}
.calc-history-expr{font-family:var(--font-mono);font-size:15px;color:var(--pencil);flex:1;}
.calc-history-copy{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:6px 10px;cursor:pointer;white-space:nowrap;transition:border-color .12s, background .12s;}
.calc-history-copy:hover{border-color:var(--ink)}
.calc-history-copy:active{transform:scale(.96)}
.calc-history-empty{font-family:var(--font-ui);font-size:14px;color:var(--muted-6);text-align:center;padding:16px 0;}
.mcq-btn{
  display:flex;align-items:center;gap:10px;text-align:left;
  font-family:var(--font-mono);font-size:16px;color:var(--pencil);
  background:var(--card);border:1.5px solid var(--glass-border);border-radius:14px;
  padding:12px 16px;cursor:pointer;transition:transform .15s, border-color .12s, background .12s;
}
.mcq-btn:active{transform:scale(.96)}
.mcq-btn .mlabel{font-family:var(--font-ui);font-weight:700;color:var(--muted-1);flex:0 0 auto;}
.mcq-btn:hover:not(.disabled){border-color:var(--ink)}
.mcq-btn.correct{border-color:var(--ok);background:var(--ok-tint);color:var(--ok);}
.mcq-btn.wrong{border-color:var(--teacher);background:rgba(255,59,48,.1);color:var(--teacher);}
.mcq-btn.disabled{cursor:default}

.explain{font-family:var(--font-ui);font-size:15px;color:var(--muted-4);line-height:1.55;}
.explain b{color:var(--ink)}
.next-btn{font-family:var(--font-ui);font-weight:600;font-size:16px;background:var(--ok);color:#fff;border:none;border-radius:14px;padding:13px 26px;cursor:pointer;width:100%;margin-top:14px;box-shadow:0 6px 18px var(--ok-shadow);transition:transform .15s;}
.next-btn:active{transform:scale(.98)}

/* ─── статистика ─── */
.stats{display:flex;gap:10px;flex-wrap:wrap;}
.stat{flex:1;min-width:110px;background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);padding:12px 14px;text-align:center;}
.stat .v{font-family:var(--font-ui);font-weight:700;font-size:22px;color:var(--ink);}
.stat .l{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-6);}

/* ─── плавающая клавиатура для ввода ответа ─── */
.keypad{display:grid;grid-template-columns:repeat(3, 44px);gap:6px}
.keypad button{width:44px;height:40px;border:1px solid var(--glass-border);border-radius:12px;background:var(--glass);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);color:var(--ink);font-family:var(--font-mono);font-size:18px;cursor:pointer;touch-action:manipulation}
.keypad button:active{background:var(--hl)}
.keypad button.kp-minus{color:var(--teacher);font-weight:700}
.keypad button.kp-back{font-size:15px;color:var(--muted-6)}
.keypad button.kp-enter{grid-column:span 3;width:auto;height:38px;font-family:var(--font-ui);font-weight:600;font-size:14px;background:var(--ink);color:#fff;border-color:var(--ink);}
.keypad button.kp-enter:active{background:var(--ink-active);}
.keypad-float{position:fixed;top:160px;right:16px;background:var(--glass-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:20px;padding:12px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:50}
.keypad-close{position:absolute;top:-11px;right:-11px;width:26px;height:26px;border-radius:50%;background:var(--teacher);color:#fff;border:2px solid #fff;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.keypad-close:active{transform:scale(.9)}
.keypad-drag-handle{position:absolute;top:-11px;left:-11px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;border:2px solid #fff;font-size:12px;line-height:1;cursor:grab;display:flex;align-items:center;justify-content:center;touch-action:none;}
.keypad-drag-handle:active{cursor:grabbing;}
.keypad-toggle{position:fixed;top:160px;right:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:18px;cursor:pointer;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:50;transition:transform .15s;}
.keypad-toggle:active{transform:scale(.92)}
@media(max-width:720px){.keypad-float,.keypad-toggle{top:auto;bottom:16px;right:16px}}

.theme-toggle{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;}
.theme-toggle:hover{border-color:var(--ink)}
.theme-toggle:active{transform:scale(.92)}
.board-visibility-toggle{top:64px;transition:transform .15s;}
.board-visibility-toggle:active{transform:scale(.92)}
.board-visibility-toggle.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.home-btn{position:fixed;top:16px;left:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;text-decoration:none;}
.home-btn:hover{border-color:var(--ink)}
.home-btn:active{transform:scale(.92)}
/* этот файл не использует .sheet (тетрадный лист) как в калькуляторах/уравнениях —
   доска (#boardCanvas, position:fixed, z-index:2) поэтому подгоняется под весь
   #taskArea целиком (см. resolveBoardTarget). Из-за этого при включённой доске она
   перекрывала обычные static-кнопки навигации и проверки — их не получалось нажать.
   Поднимаем именно эти кнопки над холстом, не трогая сам холст и пустое место
   вокруг — там по-прежнему можно рисовать. */
.back-btn, .refresh-btn, .submode-tab, .taskset-nav-btn, .theory-toggle, .check-btn, .example-history-toggle{position:relative;z-index:3;}
</style>
</head>
<body>
<a class="home-btn" href="index.html" title="Ко всем тренажёрам" aria-label="Ко всем тренажёрам">←</a>
<button class="theme-toggle" id="themeToggle" title="Светлая/тёмная тема" aria-label="Переключить тему">🌙</button>
<button class="theme-toggle board-visibility-toggle" id="boardVisibilityToggle" title="Показать доску" aria-label="Показать/скрыть доску">🖊️</button>
<script>(function(){
  var btn=document.getElementById('themeToggle');
  function apply(t, persist){
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    if (persist) { try{ localStorage.setItem('theme', t); }catch(e){} }
  }
  apply(document.documentElement.getAttribute('data-theme') || 'light', false);
  btn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(cur, true);
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSystemChange = function(e){
      var explicit = false;
      try{ explicit = !!localStorage.getItem('theme'); }catch(err){}
      if (explicit) return;
      apply(e.matches ? 'dark' : 'light', false);
    };
    if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
    else if (mq.addListener) mq.addListener(onSystemChange);
  }
})();</script>
<script>(function(){
  var btn = document.getElementById('boardVisibilityToggle');
  function apply(on){
    document.documentElement.setAttribute('data-board', on ? 'on' : 'off');
    btn.classList.toggle('active', on);
    btn.title = on ? 'Скрыть доску' : 'Показать доску';
  }
  apply(false); // доска изначально выключена
  btn.addEventListener('click', function(){
    apply(document.documentElement.getAttribute('data-board') !== 'on');
  });
})();</script>

<!-- кнопка "свернуть подсказки" намеренно лежит здесь, СНАРУЖИ .wrap, а не внутри
     него: у .wrap свой контекст наложения (нужен для доски), и любой position:fixed
     элемент ВНУТРИ .wrap не смог бы пробиться выше #boardCanvas по z-index -->
<button class="focus-toggle" id="focusToggle" title="Свернуть подсказки" aria-label="Свернуть/показать подсказки и алгоритм">⛶</button>
  <script>(function(){
    var btn = document.getElementById('focusToggle');
    function apply(on){
      document.documentElement.setAttribute('data-focus', on ? 'on' : 'off');
      btn.title = on ? 'Показать подсказки' : 'Свернуть подсказки';
    }
    apply(false);
    btn.addEventListener('click', function(){
      apply(document.documentElement.getAttribute('data-focus') !== 'on');
    });
  })();</script>

          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.2 3.8a2.7 2.7 0 0 1 0 3.8l-1.4 1.4-3.8-3.8L15.4 3.8a2.7 2.7 0 0 1 3.8 0Z" fill="currentColor"></path>
            <path d="M12.6 6.6l3.8 3.8L6 20.8l-4 1 1-4L12.6 6.6Z" fill="currentColor"></path>

/* ═══════════════ утилиты ═══════════════ */
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fmtNum(x) {
  const r = Math.round(x * 100) / 100;
  return (Number.isInteger(r) ? String(r) : String(r).replace('.', ',')).replace('-', '−');
}
/* убирает погрешность плавающей точки, не теряя точность значения
   (у наших шинных величин всегда не больше 2 знаков после запятой) */
function clean2(x) { return Math.round(x * 100) / 100; }
function buildOptions(correct, candidates, fallbackGen) {
  const seen = new Set([correct]);
  const picked = [];
  for (const c of candidates) {
    if (!seen.has(c)) { seen.add(c); picked.push(c); }
    if (picked.length === 3) break;
  }
  let guard = 0;
  while (picked.length < 3 && guard < 30) {
    guard++;
    const extra = fallbackGen(guard);
    if (!seen.has(extra)) { seen.add(extra); picked.push(extra); }
  }
  return shuffleArr([correct, ...picked]);
}
function tableHTML(headers, rows) {
  return `<table class="data-table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>` +
    `<tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

const TIRE_THEORY_TEXT_PARAGRAPHS = [
  `Автомобильное колесо представляет из себя металлический диск с установленной на него резиновой шиной. Диаметр диска совпадает с диаметром внутреннего отверстия в шине.`,
  `Для маркировки автомобильных шин применяется единая система обозначений. Например, 195/65R15 (рис. 1). Первое число означает ширину шины в миллиметрах (размер B на рис. 2). Второе число - высота боковины шины H в процентах от ширины шины. Например, шина с маркировкой 195/65R15 имеет ширину B = 195 мм и высоту боковины H = 195 · 0,65 = 126,75(мм).`,
  `Буква R означает, что шина имеет радиальную конструкцию, то есть нити каркаса в боковине шины расположены вдоль радиусов колеса. Такие шины применяются на всех легковых автомобилях.`,
  `За буквой R следует диаметр диска d в дюймах (в одном дюйме 25,4 мм). Таким образом, общий диаметр колеса D можно найти, зная диаметр диска и высоту боковины.`,
];

/* теория для «Шина 1» — последнее предложение динамическое: содержит маркировку
   заводской шины, зафиксированную на весь сеанс (см. curFactoryTire) */
function buildTireTheoryHTML(factoryTire) {
  const paragraphs = TIRE_THEORY_TEXT_PARAGRAPHS.map(p => `<p>${p}</p>`).join('') +
    `<p>Завод производит легковые автомобили определённой модели и устанавливает на них колёса с шинами ${factoryTire.width}/${factoryTire.profile}R${factoryTire.rim}.</p>`;
  return TIRE_THEORY_IMAGES_HTML + `<div class="theory-text">${paragraphs}</div>`;
}

function tireDiameter(width, profile, rim){ return 2*(width*profile/100) + rim*25.4; }

/* заводская шина — фиксируется один раз при входе в «Шина 1» и используется
   в теории и заданиях 3 и 5, пока пользователь не откроет тему заново */
let curFactoryTire = null;
const FACTORY_TIRE_POOL = [
  {width:175,profile:70,rim:13}, {width:175,profile:65,rim:14}, {width:185,profile:70,rim:14},
  {width:185,profile:65,rim:15}, {width:195,profile:65,rim:15}, {width:195,profile:60,rim:15},
  {width:195,profile:55,rim:16}, {width:205,profile:60,rim:16}, {width:205,profile:55,rim:16},
  {width:205,profile:55,rim:17}, {width:215,profile:55,rim:17}, {width:215,profile:60,rim:16},
];
function pickFactoryTire(){ return pick(FACTORY_TIRE_POOL); }
function ensureFactoryTire(){ if (!curFactoryTire) curFactoryTire = pickFactoryTire(); return curFactoryTire; }

// ── заводская шина переживает перезагрузку страницы (раньше выбиралась заново
// при КАЖДОМ входе в «Шина 1», из-за чего теория показывала одну шину, а
// восстановленное задание было посчитано под другую — числа расходились).
// Теперь шина хранится в localStorage и меняется только если её ещё не было
// или все 5 заданий этой темы уже отмечены решёнными — либо явно, кнопкой
// «Новая шина» ──

/* пул "новых" шин для заданий 4 и 5 — заметно отличается от заводского набора
   (реальная замена шин обычно меняет и ширину, и профиль, и диаметр диска, а не
   только диаметр диска) */
const UPGRADE_TIRE_POOL = [
  {width:165,profile:70,rim:13}, {width:165,profile:65,rim:14},
  {width:185,profile:60,rim:15}, {width:195,profile:70,rim:14},
  {width:195,profile:50,rim:16}, {width:205,profile:65,rim:15},
  {width:205,profile:50,rim:17}, {width:215,profile:65,rim:16},
  {width:215,profile:50,rim:17}, {width:215,profile:45,rim:18},
  {width:225,profile:60,rim:16}, {width:225,profile:55,rim:17},
  {width:225,profile:50,rim:17}, {width:225,profile:45,rim:18},
  {width:225,profile:40,rim:18}, {width:235,profile:55,rim:17},
  {width:235,profile:50,rim:18}, {width:235,profile:45,rim:18},
  {width:235,profile:40,rim:19}, {width:245,profile:45,rim:18},
  {width:245,profile:40,rim:19}, {width:245,profile:35,rim:20},
];
/* подбирает шину «на замену»: ширина, профиль и диаметр диска отличаются от
   заводских одновременно, а итоговый диаметр колеса — больше заводского */
function pickUpgradeTire(ft) {
  const D1 = tireDiameter(ft.width, ft.profile, ft.rim);
  const candidates = UPGRADE_TIRE_POOL.filter(t =>
    t.width !== ft.width && t.profile !== ft.profile && t.rim !== ft.rim &&
    (tireDiameter(t.width, t.profile, t.rim) - D1) >= 5 // разница заметна и не «съедается» округлением
  );
  return candidates.length ? pick(candidates) : pick(UPGRADE_TIRE_POOL);
}

/* подбирает шину с ПОЧТИ таким же итоговым диаметром, что и у заводской (типичный
   реальный plus-sizing: диаметр диска и ширина меняются, а профиль подбирается так,
   чтобы общий диаметр колеса остался практически прежним) — нужна для того, чтобы
   в задании 5 иногда получался маленький процент (даже меньше 1%), как бывает на
   настоящем экзамене */
function pickCloseTire(ft) {
  const D1 = tireDiameter(ft.width, ft.profile, ft.rim);
  // держим замену диска/ширины в разумных пределах от заводских, чтобы сочетание
  // выглядело правдоподобно (не «16 дюймов → 20 дюймов» за один раз)
  const rimOptions = [13,14,15,16,17,18,19,20].filter(r => r !== ft.rim && Math.abs(r - ft.rim) <= 3);
  const widthOptions = [165,175,185,195,205,215,225,235,245].filter(w => w !== ft.width && Math.abs(w - ft.width) <= 40);
  const candidates = [];
  rimOptions.forEach(rim => {
    widthOptions.forEach(width => {
      // подбираем профиль так, чтобы диаметр вышел близким к D1
      const targetProfile = (D1 - rim * 25.4) / (2 * width) * 100;
      const profile = Math.round(targetProfile / 5) * 5;
      if (profile < 30 || profile > 80 || profile === ft.profile) return;
      const D2 = tireDiameter(width, profile, rim);
      const diffPct = (D2 - D1) / D1 * 100;
      if (diffPct >= 0.1 && diffPct <= 2) candidates.push({ width, profile, rim });
    });
  });
  return candidates.length ? pick(candidates) : null;
}

/* заранее подобранные реалистичные наборы шин (принцип plus-sizing: с ростом диаметра диска

function tireCellsTableHTML(ds){
  const head1 = `<th rowspan="2">Ширина шин (мм)</th><th colspan="${ds.rims.length}">Диаметр диска (дюймы)</th>`;
  const head2 = ds.rims.map(r=>`<th>${r}</th>`).join('');
  const body = ds.widths.map(w => {
    const cells = ds.rims.map(r => {
      const key = `${w},${r}`;
      const profiles = ds.cells[key];
      return `<td>${profiles ? profiles.map(p=>`${w}/${p}`).join('; ') : '—'}</td>`;
    }).join('');
    return `<tr><td>${w}</td>${cells}</tr>`;
  }).join('');
  return `<table class="data-table"><thead><tr>${head1}</tr><tr>${head2}</tr></thead><tbody>${body}</tbody></table>`;
}

function gen_tire_task1() {
  const ds = pick(TIRE_DATASETS);
  // берём диаметры диска, для которых допустимо хотя бы 2 разные ширины —
  // иначе "наименьшая"/"наибольшая" были бы одним и тем же числом
  const eligibleRims = ds.rims.filter(r => ds.widths.filter(w => ds.cells[`${w},${r}`]).length >= 2);
  const rim = pick(eligibleRims);
  const allowedWidths = ds.widths.filter(w => ds.cells[`${w},${rim}`]).sort((a,b) => a-b);
  const wantMax = Math.random() < 0.5;
  const correct = wantMax ? allowedWidths[allowedWidths.length-1] : allowedWidths[0];

  return {
    type: 'input',
    unit: 'мм',
    correctValue: correct,
    prompt: `Шины какой ${wantMax ? 'наибольшей' : 'наименьшей'} ширины можно устанавливать на автомобиль, если диаметр диска равен ${rim} дюймам?` +
      tireCellsTableHTML(ds) +
      `<br>Ответ дайте в миллиметрах.`,
    explain: `В таблице находим столбец, соответствующий диаметру диска ${rim} дюймов. В этом столбце указаны допустимые ширины шин: ${allowedWidths.join(', ')} мм — это все маркировки, которые завод разрешает устанавливать при таком диаметре диска.<br>Нужно выбрать ${wantMax ? 'наибольшую' : 'наименьшую'} из них. Сравнивая числа ${allowedWidths.join(', ')}, видим, что ${wantMax ? 'наибольшее' : 'наименьшее'} значение — ${correct} мм.<br><b>Ответ: ${correct} мм.</b>`
  };
}

function gen_tire_task3() {

}

function gen_tire_task4() {
  const ft = ensureFactoryTire();
  const H1 = clean2(ft.width * ft.profile / 100);
  const rim1MM = clean2(ft.rim * 25.4);
  const D1 = clean2(rim1MM + 2 * H1);
  const newTire = pickUpgradeTire(ft);
  const H2 = clean2(newTire.width * newTire.profile / 100);
  const rim2MM = clean2(newTire.rim * 25.4);
  const D2 = clean2(rim2MM + 2 * H2);
  const correct = clean2(D2 - D1);
  return {
    type: 'input',
    unit: 'мм',
    correctValue: correct,
    prompt: `На сколько миллиметров увеличится диаметр колеса, если заменить колёса, установленные на заводе, колёсами с шинами ${newTire.width}/${newTire.profile} R${newTire.rim}?`,
    explain: `Заводская шина — ${ft.width}/${ft.profile}R${ft.rim}. Высота боковины: H₁ = ${ft.width} · ${ft.profile}/100 = ${fmtNum(H1)} мм. Диаметр диска в мм: ${ft.rim} · 25,4 = ${fmtNum(rim1MM)} мм. Диаметр колеса: D₁ = ${fmtNum(rim1MM)} + 2 · ${fmtNum(H1)} = ${fmtNum(D1)} мм.<br>Новая шина — ${newTire.width}/${newTire.profile}R${newTire.rim}. Высота боковины: H₂ = ${newTire.width} · ${newTire.profile}/100 = ${fmtNum(H2)} мм. Диаметр диска в мм: ${newTire.rim} · 25,4 = ${fmtNum(rim2MM)} мм. Диаметр колеса: D₂ = ${fmtNum(rim2MM)} + 2 · ${fmtNum(H2)} = ${fmtNum(D2)} мм.<br>Увеличение диаметра: D₂ − D₁ = ${fmtNum(D2)} − ${fmtNum(D1)} = ${fmtNum(correct)} мм.<br><b>Ответ: ${fmtNum(correct)} мм.</b>`
  };
}

function gen_tire_task5() {
  const ft = ensureFactoryTire();
  const H1 = clean2(ft.width * ft.profile / 100);
  const rim1MM = clean2(ft.rim * 25.4);
  const D1 = clean2(rim1MM + 2 * H1);
  // на реальном экзамене примерно в половине случаев ответ маленький (≤2%, порой
  // даже доли процента) — подмешиваем такие «близкие по диаметру» замены шин
  const newTire = (Math.random() < 0.5 ? pickCloseTire(ft) : null) || pickUpgradeTire(ft);
  const H2 = clean2(newTire.width * newTire.profile / 100);
  const rim2MM = clean2(newTire.rim * 25.4);
  const D2 = clean2(rim2MM + 2 * H2);
  const correct = Number(((D2 - D1) / D1 * 100).toFixed(1));
  return {
    type: 'input',
    unit: '%',
    correctValue: correct,

    explain: `За один оборот колесо проезжает расстояние, равное длине его окружности, а она пропорциональна диаметру колеса — поэтому вместо длины окружности можно сравнивать сами диаметры.<br>Заводская шина ${ft.width}/${ft.profile}R${ft.rim}: диаметр D₁ = ${ft.rim} · 25,4 + 2 · (${ft.width} · ${ft.profile}/100) = ${fmtNum(rim1MM)} + ${fmtNum(2*H1)} = ${fmtNum(D1)} мм.<br>Новая шина ${newTire.width}/${newTire.profile}R${newTire.rim}: диаметр D₂ = ${newTire.rim} · 25,4 + 2 · (${newTire.width} · ${newTire.profile}/100) = ${fmtNum(rim2MM)} + ${fmtNum(2*H2)} = ${fmtNum(D2)} мм.<br>Пробег за один оборот увеличится на столько же процентов, на сколько увеличился диаметр: (D₂ − D₁)/D₁ × 100% = (${fmtNum(D2)} − ${fmtNum(D1)})/${fmtNum(D1)} × 100% = ${fmtNum((D2-D1)/D1*100)}%.<br>Округляем до десятых, как требует условие.<br><b>Ответ: ${correct}%.</b>`
  };
}

function gen_tariff1() {
  const base = pick([300,350,400,450,500]);
  const includedMin = pick([300,400,500]);
  const overRate = pick([1,2,3]);
  const used = includedMin + ri(10,80);
  const over = used - includedMin;
  const correct = base + over*overRate;
  const wrong1 = base + used*overRate;
  const wrong2 = over*overRate;
  const wrong3 = base + over*overRate + includedMin;
  const options = buildOptions(String(correct), shuffleArr([wrong1,wrong2,wrong3]).map(String), k => String(correct + (k%2?1:-1)*10*k));
  return {
    prompt: `Тариф «Стандарт»: абонентская плата ${base} ₽ в месяц, включено ${includedMin} минут разговора. Каждая минута сверх лимита стоит ${overRate} ₽.<br>В этом месяце абонент разговаривал ${used} минут. Сколько рублей он должен заплатить?`,
    options, correctIndex: options.indexOf(String(correct)),
    explain: `Сверх лимита: ${used} − ${includedMin} = ${over} мин. Доплата: ${over} × ${overRate} = ${over*overRate} ₽. Итого: ${base} + ${over*overRate} = ${correct} ₽.`
  };
}

function gen_tariff2() {
  for (let t = 0; t < 300; t++) {
    const baseA = pick([300,350,400]), incA = pick([300,400]), rateA = pick([1,2]);
    const baseB = pick([250,450,500]), incB = pick([200,500]), rateB = pick([2,3]);
    const used = ri(250,600);
    const costA = baseA + Math.max(0, used-incA)*rateA;
    const costB = baseB + Math.max(0, used-incB)*rateB;
    if (costA === costB) continue;
    const diff = Math.abs(costA-costB);
    const cheaper = costA<costB ? 'A' : 'B';
    const options = buildOptions(String(diff), shuffleArr([costA, costB, diff+ri(20,60)]).map(String), k => String(diff + (k%2?1:-1)*20*k));
    return {
      prompt: `Тариф A: абонплата ${baseA} ₽, включено ${incA} минут, сверх лимита — ${rateA} ₽/мин.<br>Тариф B: абонплата ${baseB} ₽, включено ${incB} минут, сверх лимита — ${rateB} ₽/мин.<br>Абонент разговаривает ${used} минут в месяц. На сколько рублей выгоднее более дешёвый тариф?`,
      options, correctIndex: options.indexOf(String(diff)),
      explain: `Тариф A: ${baseA} + max(0, ${used}−${incA})·${rateA} = ${costA} ₽. Тариф B: ${baseB} + max(0, ${used}−${incB})·${rateB} = ${costB} ₽. Разница: |${costA}−${costB}| = ${diff} ₽ (выгоднее тариф ${cheaper}).`
    };
  }
  return gen_tariff2();
}

   ни текущий пример, ни счётчик медалей, и всё это переживает перезагрузку страницы. */
const PROGRESS_NS = 'ogeProg:oge1_5:';
function loadProg(key) {
  try { const raw = localStorage.getItem(PROGRESS_NS + key); return raw ? JSON.parse(raw) : null; }
  catch (e) { return null; }
}
function saveProg(key, data) {
  try { data.lastActiveAt = Date.now(); localStorage.setItem(PROGRESS_NS + key, JSON.stringify(data)); } catch (e) {}
}
function clearProg(key) {
  try { localStorage.removeItem(PROGRESS_NS + key); } catch (e) {}
}
function freshProg() {
  return { task: null, answered: false, hadWrongPick: false, pickedIndex: null,
           solvedInBatch: 0, errorsInBatch: 0, history: [], medals: { gold: 0, silver: 0, bronze: 0 } };
}
const SESSION_GAP_MS = 3 * 60 * 60 * 1000; // 3 часа без захода в этот прототип — считаем, что началась новая учебная сессия
function loadProgOrFresh(key) {
  const saved = loadProg(key);
  if (!saved) return freshProg();
  if (!saved.lastActiveAt || (Date.now() - saved.lastActiveAt) > SESSION_GAP_MS) {
    // новая сессия после паузы: обнуляем историю примеров и прогресс к медали (и незавершённую задачу),
    // но уже полученные медали не трогаем — это заслуженное достижение, а не сессионное состояние
    return Object.assign(freshProg(), { medals: saved.medals || { gold: 0, silver: 0, bronze: 0 } });
  }
  return saved;
}
let curProg = freshProg();
const MEDAL_EMOJI = { gold: '🥇', silver: '🥈', bronze: '🥉' };
const MEDAL_TITLE = { gold: 'Золото — пять примеров без ошибок', silver: 'Серебро — пять примеров, 1–2 ошибки', bronze: 'Бронза — пять примеров решено' };
function medalBadgeText(medals) {
  if (!medals) return '';
  return ['gold', 'silver', 'bronze'].filter(t => medals[t]).map(t => `${MEDAL_EMOJI[t]}${medals[t]}`).join(' ');
}
function sumMedals(...medalSets) {
  const out = { gold: 0, silver: 0, bronze: 0 };
  medalSets.forEach(m => { if (m) ['gold','silver','bronze'].forEach(t => out[t] += (m[t]||0)); });
  return out;
}
function renderMedalBadges() {
  const row = document.getElementById('medalBadgeRow');
  if (row) row.textContent = medalBadgeText(curProg.medals);
}
function renderExampleHistory() {
  const list = document.getElementById('exampleHistoryList');
  const empty = document.getElementById('exampleHistoryEmpty');
  const btn = document.getElementById('exampleHistoryToggle');
  if (!list) return;
  const items = curProg.history || [];
  btn.textContent = `🕓 История примеров (${items.length})`;
  list.innerHTML = '';
  empty.style.display = items.length ? 'none' : 'block';
  items.forEach(h => {
    const row = document.createElement('div');
    row.className = 'example-history-row';
    const mark = document.createElement('span');
    mark.className = 'example-history-mark';
    mark.textContent = h.correct ? (h.hadError ? '🟡' : '✅') : '❌';
    const body = document.createElement('div');
    body.className = 'example-history-body';
    const prompt = document.createElement('span');
    prompt.className = 'example-history-prompt';
    prompt.innerHTML = h.prompt;
    body.appendChild(prompt);
    if (h.answer) {
      const answer = document.createElement('span');
      answer.className = 'example-history-answer';
      answer.innerHTML = 'Ответ: ' + h.answer;
      body.appendChild(answer);
    }
    row.appendChild(mark); row.appendChild(body);
    list.appendChild(row);
  });
}
document.getElementById('exampleHistoryToggle').onclick = () => {
  const panel = document.getElementById('exampleHistoryPanel');
  const willOpen = panel.style.display !== 'block';
  panel.style.display = willOpen ? 'block' : 'none';
  if (willOpen) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

document.getElementById('exampleHistoryClose').onclick = () => {
  document.getElementById('exampleHistoryPanel').style.display = 'none';
};
function playMedalAnimation(tier) {
  const tray = document.getElementById('medalTray');
  const emoji = MEDAL_EMOJI[tier];
  const titleRect = els.taskTitle.getBoundingClientRect();
  const flyer = document.createElement('div');
  flyer.className = 'medal-flyer';
  flyer.textContent = emoji;
  flyer.style.left = (titleRect.left + titleRect.width / 2 - 22) + 'px';
  flyer.style.top = (titleRect.top - 10) + 'px';
  flyer.style.opacity = '0';
  flyer.style.transform = 'scale(.4)';
  document.body.appendChild(flyer);

  requestAnimationFrame(() => {
    flyer.style.opacity = '1';
    flyer.style.transform = 'scale(1.3)';
    setTimeout(() => {
      tray.classList.add('show');
      const trayRect = tray.getBoundingClientRect();
      const curRect = flyer.getBoundingClientRect();
      const dx = (trayRect.left + 24) - curRect.left;
      const dy = (trayRect.top + trayRect.height / 2 - 10) - curRect.top;
      flyer.style.transform = `translate(${dx}px, ${dy}px) scale(.5)`;
      flyer.style.opacity = '0.15';
      setTimeout(() => {
        flyer.remove();
        const icon = document.createElement('span');
        icon.className = 'medal-tray-icon';
        icon.textContent = emoji;
        icon.title = MEDAL_TITLE[tier];
        tray.appendChild(icon);
      }, 900);
    }, 650);
  });
}
function recordSolve() {
  // ввод текстом всегда завершается показом верного значения (даже после ошибок),
  // а вот MCQ может закончиться и на "неверно, вот правильный ответ" без угадывания —
  // поэтому для input считаем "верно", а для выбора вариантов сверяем реальный индекс
  const gotItRight = curTask.type === 'input' ? true : (curProg.pickedIndex === curTask.correctIndex);
  curProg.history.unshift({ prompt: curTask.prompt, correct: gotItRight, hadError: !!curProg.hadWrongPick, answer: curTask.type === 'input' ? (String(curTask.correctValue) + (curTask.unit ? ' ' + curTask.unit : '')) : curTask.options[curTask.correctIndex] });
  curProg.history = curProg.history.slice(0, 5);
  curProg.solvedInBatch = (curProg.solvedInBatch || 0) + 1;
  let awardedTier = null;
  if (curProg.solvedInBatch >= 5) {
    const errs = curProg.errorsInBatch || 0;
    awardedTier = errs === 0 ? 'gold' : (errs <= 2 ? 'silver' : 'bronze');
    curProg.medals[awardedTier] = (curProg.medals[awardedTier] || 0) + 1;
    curProg.solvedInBatch = 0;
    curProg.errorsInBatch = 0;
  }
  saveProg(curMode, curProg);
  renderMedalBadges();
  renderExampleHistory();
  if (awardedTier) playMedalAnimation(awardedTier);
}
// значок на карточке в общем списке тем: для обычного прототипа — его собственные
// медали; для "Шина 1" — сумма медалей по всем её заданиям
function pickerBadgeFor(rawMode) {
  if (rawMode.kind === 'taskset') {
    return medalBadgeText(sumMedals(...rawMode.tasks.filter(t => t.gen).map(t => (loadProg(t.id) || {}).medals)));
  }
  return medalBadgeText((loadProg(rawMode.id) || {}).medals);
}

function renderPicker() {
  const realHTML = GROUPS.map(g => `
    <div class="group-title">${g.title}</div>
    <div class="modes">

        return `<div class="mode-card" data-id="${m.id}"><div class="mtitle">${m.title}</div>${badges ? `<div class="mode-medals">${badges}</div>` : ''}</div>`;
      }).join('')}

  const soonHTML = SOON_THEMES.map(title => `

}

/* открыть taskset сразу с первого задания. Заводская шина берётся из
   localStorage и переиспользуется, пока не решены все 5 заданий темы —
   раньше она перевыбиралась при КАЖДОМ входе (даже без перезагрузки страницы),
   и тогда теория показывала одну шину, а восстановленное задание было
   посчитано под другую. Прогресс/медали/история каждого отдельного задания
   внутри Шины хранятся и резюмируются по собственному id. */
function enterTaskset(tasksetMode) {
  curTasksetRef = tasksetMode;
  if (tasksetMode.id === 'tire_set1') {
    const saved = loadFactoryTire();
    if (saved && !allTireTasksAnswered(tasksetMode)) {
      curFactoryTire = saved;
    } else {
      // шины ещё не было, либо все 5 заданий уже решены под старую — берём
      // новую и сразу чистим сохранённые задания: под старую шину их числа
      // больше не подходят, иначе resumeOrNewTask() покажет старый пример
      curFactoryTire = pickFactoryTire();
      saveFactoryTire(curFactoryTire);
      tasksetMode.tasks.forEach(t => clearProg(t.id));
    }
    curTasksetTheory = buildTireTheoryHTML(curFactoryTire);
  }
  setCurMode(tasksetMode.tasks[0].id);
  curSubMode = 'exam';
  openTask();
}
/* явный сброс: новая случайная шина + прогресс всех 5 заданий этой темы —
   для тех случаев, когда автоматика (см. enterTaskset) не подходит: например,
   учитель хочет начать тему с нуля, не дожидаясь, пока ученик решит все 5 */
function rerollFactoryTire() {
  if (!curTasksetRef || curTasksetRef.id !== 'tire_set1') return;
  if (!confirm('Выбрать новую заводскую шину и начать «Шину 1» заново?\nПрогресс по всем 5 заданиям этой темы будет сброшен.')) return;
  curFactoryTire = pickFactoryTire();
  saveFactoryTire(curFactoryTire);
  curTasksetTheory = buildTireTheoryHTML(curFactoryTire);
  curTasksetRef.tasks.forEach(t => clearProg(t.id));
  setCurMode(curTasksetRef.tasks[0].id);
  curSubMode = 'exam';
  openTask();
}
els.newTireBtn.onclick = rerollFactoryTire;

const COMING_SOON_TEXT = {
  learn: '🚧 Режим «Обучение» ещё в разработке. Здесь появится подробное объяснение решения — со всеми подсказками, шаг за шагом.',
};

let curSubMode = 'exam';

function openTask() {
  els.picker.style.display = 'none';
  els.taskArea.style.display = 'block';
  window.scrollTo(0, 0);

  let title;
  if (curMode === 'random') {
    title = 'Случайно';

    const t = curTasksetRef.tasks.find(x => x.id === curMode);

  }

els.refreshBtn.onclick = () => { if (curSubMode === 'exam' || curSubMode === 'practice') newTask(); };

els.basketAddBtn = document.getElementById('basketAddBtn');

function updateTasksetNav() {
  if (!curTasksetRef) { els.tasksetNav.style.display = 'none'; return; }
  const idx = curTasksetRef.tasks.findIndex(t => t.id === curMode);
  els.tasksetNav.style.display = 'flex';

  els.prevTaskBtn.disabled = idx <= 0;

}
function navigateTaskset(delta) {
  if (!curTasksetRef) return;
  const idx = curTasksetRef.tasks.findIndex(t => t.id === curMode);
  const newIdx = idx + delta;
  if (newIdx < 0 || newIdx >= curTasksetRef.tasks.length) return;
  setCurMode(curTasksetRef.tasks[newIdx].id);
  openTask(); // теория и заводская шина не пересчитываются — сохраняются на весь сеанс
}
els.prevTaskBtn.onclick = () => navigateTaskset(-1);
els.nextTaskBtn.onclick = () => navigateTaskset(1);

/* переход «следующий/предыдущий тип» — листает соседние прототипы внутри той же
   тематической группы (например, между «Стоимость связи» и «Сравнение тарифов»).
   Внутри «Шины» (taskset) кнопки скрыты — там уже есть своя навигация по заданиям. */
function findGroupOf(modeId) {
  return GROUPS.find(g => g.modes.some(m => m.id === modeId));
}
function updateTypeNav() {
  const group = (curMode === 'random' || curTasksetRef) ? null : findGroupOf(curMode);
  const showNav = !!group && group.modes.length > 1;
  els.prevTypeBtn.style.display = showNav ? 'inline-flex' : 'none';
  els.nextTypeBtn.style.display = showNav ? 'inline-flex' : 'none';
}
function navigateType(delta) {
  if (curTasksetRef) return;
  const group = findGroupOf(curMode);
  if (!group) return;
  const idx = group.modes.findIndex(m => m.id === curMode);
  if (idx === -1) return;
  const newIdx = (idx + delta + group.modes.length) % group.modes.length;
  const target = group.modes[newIdx];
  if (target.kind === 'taskset') {
    enterTaskset(target);
  } else {
    setCurMode(target.id);
    openTask();
  }
}
els.prevTypeBtn.onclick = () => navigateType(-1);
els.nextTypeBtn.onclick = () => navigateType(1);

function switchSubMode(mode, isEntering) {
  curSubMode = mode;

  els.tabPractice.classList.toggle('active', mode === 'practice');

function renderCurrentTask(){

function newTask() {
  const tasksetDef = curTasksetRef ? curTasksetRef.tasks.find(t => t.id === curMode) : null;
  if (tasksetDef && !tasksetDef.gen) {
    els.questionPanel.style.display = 'none';
    els.mainPanel.style.display = 'none';
    els.showSolutionBtn.style.display = 'none';
    els.calcTools.style.display = 'none';
    closeCalc();
    closeCalcHistory();
    els.refreshBtn.style.display = 'none';
    els.comingSoonPanel.textContent = '🚧 Это задание ещё в разработке. Переходите к следующему через кнопку выше.';
    els.comingSoonPanel.style.display = 'block';
    syncKeypadVisibility();
    return;
  }
  els.comingSoonPanel.style.display = 'none';
  els.refreshBtn.style.display = 'inline-flex';

  // новый пример — новое содержимое листа: старые записи (если были) к нему уже
  // не относятся, поэтому лист очищается (и вместе с ним — сохранённая для этого
  // режима копия, чтобы при возврате сюда позже не подставились чужие заметки)
  if (window.clearInkForMode) window.clearInkForMode(curMode);

  const m = curMode === 'random' ? pick(ALL_MODES) : ALL_MODES.find(x => x.id === curMode);
  curTask = m.gen();
  taskAnswered = false;
  optionsLocked = false;
  solutionShown = false;
  hadWrongPick = false;

  renderCurrentTask();

  if (curMode !== 'random') {
    curProg.task = curTask;
    curProg.answered = false;
    curProg.hadWrongPick = false;
    curProg.pickedIndex = null;
    saveProg(curMode, curProg);
  }
}

// при входе/возврате в прототип (включая переход стрелками внутри "Шина 1") —
// восстановить последний пример, а не выдавать новый; для заглушек без .gen и для
// режима "случайно" резюмировать нечего — как и раньше, каждый раз выдаём новое
function resumeOrNewTask(){
  const tasksetDef = curTasksetRef ? curTasksetRef.tasks.find(t => t.id === curMode) : null;
  if (tasksetDef && !tasksetDef.gen) { newTask(); return; }

  if (curMode !== 'random' && curProg && curProg.task) {
    curTask = curProg.task;
    taskAnswered = !!curProg.answered;
    hadWrongPick = !!curProg.hadWrongPick;
    optionsLocked = taskAnswered || hadWrongPick;
    solutionShown = false;

    els.comingSoonPanel.style.display = 'none';
    els.refreshBtn.style.display = 'inline-flex';
    renderCurrentTask();

    // тот же самый пример показывается снова — вернуть и записи с листа, если
    // они остались с прошлого визита в этот режим (см. setCurMode)
    if (window.loadInkForMode) window.loadInkForMode(curMode);

    if (curTask.type === 'input') {
      if (taskAnswered) {
        els.answerInput.value = String(curTask.correctValue);
        els.answerInput.classList.add('good');
        els.answerInput.disabled = true;
        els.checkAnswerBtn.disabled = true;
      }
    } else {
      const btns = [...els.mcqOptions.querySelectorAll('.mcq-btn')];
      if (taskAnswered) {
        btns.forEach(b => { b.onclick = null; b.classList.add('disabled'); });
        if (typeof curProg.pickedIndex === 'number' && curProg.pickedIndex !== curTask.correctIndex && btns[curProg.pickedIndex]) {
          btns[curProg.pickedIndex].classList.add('wrong');
        }
        if (btns[curTask.correctIndex]) btns[curTask.correctIndex].classList.add('correct');
      } else if (hadWrongPick && typeof curProg.pickedIndex === 'number' && btns[curProg.pickedIndex]) {
        btns[curProg.pickedIndex].classList.add('wrong');
        btns.forEach(b => b.classList.add('disabled'));
        els.changeAnswerBtn.style.display = 'block';
      }
    }

    if (taskAnswered) finishTask(false);
  } else {
    newTask();
  }
}

els.checkAnswerBtn.onclick = submitInputAnswer;

/* ───────── ввод ответа словами: "тридцать четыре" наравне с "34" ───────── */
function parseRuNumber(raw){
  if(raw==null) return NaN;
  const s=String(raw).trim();
  if(s==='') return NaN;
  const plain=s.replace(',','.');
  if(/^[+-]?\d+(\.\d+)?$/.test(plain)) return Number(plain);
  return parseRuNumberWords(s);
}
function parseRuNumberWords(raw){
  let s=raw.toLowerCase().replace(/ё/g,'е').replace(/[-−–]/g,' ').replace(/\s+/g,' ').trim();
  if(s==='') return NaN;
  let negative=false;
  if(/^минус\s+/.test(s)){ negative=true; s=s.replace(/^минус\s+/,''); }
  else if(s==='минус') return NaN;
  const words=s.split(' ').filter(Boolean);
  if(!words.length) return NaN;
  const ones={ноль:0,один:1,одна:1,одно:1,два:2,две:2,три:3,четыре:4,пять:5,шесть:6,семь:7,восемь:8,девять:9,
    десять:10,одиннадцать:11,двенадцать:12,тринадцать:13,четырнадцать:14,пятнадцать:15,шестнадцать:16,семнадцать:17,восемнадцать:18,девятнадцать:19};
  const tens={двадцать:20,тридцать:30,сорок:40,пятьдесят:50,шестьдесят:60,семьдесят:70,восемьдесят:80,девяносто:90};
  const hundreds={сто:100,двести:200,триста:300,четыреста:400,пятьсот:500,шестьсот:600,семьсот:700,восемьсот:800,девятьсот:900};
  const thousandWords=new Set(['тысяча','тысячи','тысяч']);
  const millionWords=new Set(['миллион','миллиона','миллионов']);
  let total=0, current=0, matched=false;
  for(const w of words){
    if(w in hundreds){ current+=hundreds[w]; matched=true; continue; }
    if(w in tens){ current+=tens[w]; matched=true; continue; }
    if(w in ones){ current+=ones[w]; matched=true; continue; }
    if(thousandWords.has(w)){ total+=(current||1)*1000; current=0; matched=true; continue; }
    if(millionWords.has(w)){ total+=(current||1)*1000000; current=0; matched=true; continue; }
    return NaN;
  }
  total+=current;
  if(!matched) return NaN;
  return negative?-total:total;
}

function submitInputAnswer() {
  if (taskAnswered) return;
  const raw = els.answerInput.value.trim().replace(',', '.');
  if (raw === '') return;
  const val = parseRuNumber(raw);
  const isCorrect = Number.isFinite(val) && Math.abs(val - curTask.correctValue) < 1e-9;

  if (isCorrect) {
    els.answerInput.classList.remove('bad');
    els.answerInput.classList.add('good');
    els.answerInput.disabled = true;
    els.checkAnswerBtn.disabled = true;
    streak++; totalSolved++;
    els.stSolved.textContent = totalSolved;
    els.stStreak.textContent = streak;
    taskAnswered = true;
    syncKeypadVisibility();
    if (curMode !== 'random') { curProg.answered = true; saveProg(curMode, curProg); }
    finishTask(true);
  } else if (hadWrongPick) {
    els.answerInput.classList.add('bad');
    els.answerInput.value = String(curTask.correctValue);
    els.answerInput.classList.remove('bad');
    els.answerInput.classList.add('good');
    els.answerInput.disabled = true;
    els.checkAnswerBtn.disabled = true;
    streak = 0; totalErrors++;
    els.stErrors.textContent = totalErrors;
    els.stStreak.textContent = streak;
    taskAnswered = true;
    syncKeypadVisibility();
    if (curMode !== 'random') { curProg.answered = true; saveProg(curMode, curProg); }
    finishTask(true);
  } else {
    hadWrongPick = true;
    streak = 0; totalErrors++;
    els.stErrors.textContent = totalErrors;
    els.stStreak.textContent = streak;
    els.answerInput.classList.remove('shake');
    void els.answerInput.offsetWidth;
    els.answerInput.classList.add('bad', 'shake');
    if (curMode !== 'random') {
      if (!curProg.hadWrongPick) curProg.errorsInBatch = (curProg.errorsInBatch || 0) + 1;
      curProg.hadWrongPick = true;
      saveProg(curMode, curProg);
    }
  }
}

function attachMCQHandlers() {
  const btns = [...els.mcqOptions.querySelectorAll('.mcq-btn')];
  btns.forEach(b => {
    b.onclick = () => {
      if (optionsLocked || taskAnswered) return;
      optionsLocked = true;
      els.changeAnswerBtn.style.display = 'none';
      const i = Number(b.dataset.i);
      btns.forEach(x => { x.onclick = null; x.classList.add('disabled'); });
      if (i === curTask.correctIndex) {
        b.classList.add('correct');
        streak++; totalSolved++;
        els.stSolved.textContent = totalSolved;
        els.stStreak.textContent = streak;
        taskAnswered = true;
        if (curMode !== 'random') { curProg.pickedIndex = i; curProg.answered = true; saveProg(curMode, curProg); }
        finishTask(true);
      } else if (hadWrongPick) {
        b.classList.add('wrong');
        btns[curTask.correctIndex].classList.add('correct');
        streak = 0; totalErrors++;
        els.stErrors.textContent = totalErrors;
        els.stStreak.textContent = streak;
        taskAnswered = true;
        if (curMode !== 'random') { curProg.pickedIndex = i; curProg.answered = true; saveProg(curMode, curProg); }
        finishTask(true);
      } else {
        b.classList.add('wrong');
        hadWrongPick = true;
        streak = 0; totalErrors++;
        els.stErrors.textContent = totalErrors;
        els.stStreak.textContent = streak;
        els.changeAnswerBtn.style.display = 'block';
        if (curMode !== 'random') {
          if (!curProg.hadWrongPick) curProg.errorsInBatch = (curProg.errorsInBatch || 0) + 1;
          curProg.pickedIndex = i;
          curProg.hadWrongPick = true;
          saveProg(curMode, curProg);
        }
      }
    };
  });
}

els.changeAnswerBtn.onclick = () => {
  if (taskAnswered) return;

/* ═══════════════ КАЛЬКУЛЯТОР В СТОЛБИК («свой пример») ═══════════════
   Доступен в режиме «Тренировка»: вместо самодельной упрощённой копии —
   встраиваем через iframe настоящие тренажёры сложения/вычитания/умножения/
   деления в столбик (те же файлы addition.html/subtraction.html/
   multiplication.html/division.html), сразу открывая их раздел «Свой пример».
   Так ученик получает тот же самый, уже отточенный движок, а не урезанную копию. */
const CALC_OP_META = {
  add: { title: '➕ Сложение в столбик — свой пример', file: 'addition_embed.html' },
  sub: { title: '➖ Вычитание в столбик — свой пример', file: 'subtraction_embed.html' },
  mul: { title: '✖️ Умножение в столбик — свой пример', file: 'multiplication_embed.html' },
  div: { title: '➗ Деление в столбик — свой пример', file: 'division_embed.html' },
};
/* _embed.html — независимые копии addition/subtraction/multiplication/division.html,
   созданные специально для встраивания сюда через iframe. Правки в этих копиях
   не затрагивают отдельные тренажёры, и наоборот. */
let calcOp = null, calcResizeTimer = null;

function openCalc(op) {
  calcOp = op;
  els.calcPanel.style.display = 'block';
  els.calcPanelTitle.textContent = CALC_OP_META[op].title;
  els.calcIframe.style.height = '760px';

  els.calcPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  clearInterval(calcResizeTimer);
  calcResizeTimer = setInterval(fitCalcIframe, 400);
}
function fitCalcIframe() {
  if (!els.calcIframe || els.calcPanel.style.display === 'none') { clearInterval(calcResizeTimer); return; }
  try {
    const doc = els.calcIframe.contentWindow && els.calcIframe.contentWindow.document;
    if (doc && doc.documentElement) {
    const wrapEl = doc.querySelector('.wrap');
    const h = wrapEl ? wrapEl.getBoundingClientRect().height : Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
    if (h > 0) els.calcIframe.style.height = (Math.ceil(h) + 40) + 'px';
    }
  } catch (e) { /* на случай кросс-доменных ограничений — просто оставляем текущую высоту */ }
}
function closeCalc() {
  if (!els.calcPanel) return;

/* ─── история решений калькулятора: копится за всё время, пока открыта страница ─── */
let calcHistory = [];
let calcHistoryNextId = 1;
let calcHistoryFilter = 'all';

function addCalcHistoryEntry(op, expr, result) {
  calcHistory.push({ id: calcHistoryNextId++, op, expr, result });
  if (els.calcHistoryPanel.style.display === 'block') renderCalcHistory();
}

function renderCalcHistory() {
  const items = calcHistoryFilter === 'all' ? calcHistory : calcHistory.filter(h => h.op === calcHistoryFilter);
  els.calcHistoryList.innerHTML = '';
  els.calcHistoryEmpty.style.display = items.length ? 'none' : 'block';
  items.slice().reverse().forEach(h => {
    const row = document.createElement('div');
    row.className = 'calc-history-row';
    const num = document.createElement('span');
    num.className = 'calc-history-num';
    num.textContent = '№' + h.id;
    const expr = document.createElement('span');
    expr.className = 'calc-history-expr';
    expr.textContent = h.expr;
    const copyBtn = document.createElement('button');
    copyBtn.className = 'calc-history-copy';
    copyBtn.textContent = '⧉ ' + h.result;
    copyBtn.title = 'Скопировать результат';
    copyBtn.onclick = () => copyCalcResult(h.result, copyBtn);
    row.appendChild(num);
    row.appendChild(expr);
    row.appendChild(copyBtn);
    els.calcHistoryList.appendChild(row);
  });
}

function copyCalcResult(result, btn) {
  const done = () => {
    const old = btn.textContent;
    btn.textContent = '✓ скопировано';
    setTimeout(() => { btn.textContent = '⧉ ' + result; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(String(result)).then(done).catch(done);
  } else {
    done();
  }
}

function toggleCalcHistory() {
  const willOpen = els.calcHistoryPanel.style.display !== 'block';
  els.calcHistoryPanel.style.display = willOpen ? 'block' : 'none';
  els.calcHistoryBtn.classList.toggle('active', willOpen);
  if (willOpen) {
    renderCalcHistory();

  }
}

  if (!els.calcHistoryPanel) return;

}
