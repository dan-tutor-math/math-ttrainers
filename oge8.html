els.tabLearn.onclick = () => switchSubMode('learn');
els.tabPractice.onclick = () => switchSubMode('practice');
els.tabExam.onclick = () => switchSubMode('exam');
els.refreshInlineBtn.onclick = guardStudentAction('refreshOne', newTask);

function renderCurrentTask() {
  window.scrollTo(0, 0);
  els.questionPanel.style.display = 'block';
  els.questionPromptText.innerHTML = curTask.prompt;

  els.answerInput.value = '';
  els.answerInput.classList.remove('good', 'bad', 'shake');
  els.answerInput.disabled = false;
  els.checkAnswerBtn.disabled = false;
  setTimeout(() => els.answerInput.focus(), 30);

  els.mainPanel.style.display = 'none';
  els.explainBox.style.display = 'none';
  els.nextBtn.style.display = 'none';
  els.showSolutionBtn.style.display = (curSubMode === 'practice') ? 'inline-flex' : 'none';
  els.showSolutionBtn.textContent = 'Показать решение и ответ';
  syncKeypadVisibility();
  // после плавного роста панели (setupAutoHeightAnimation, 280 мс) — раньше
  // её высота ещё не окончательная и подъём вышел бы недостаточным
  setTimeout(keepTaskClearOfKeypad, 350);
}

function newTask(opts) {
  opts = opts || {};
  // skipSnapshot: true — используется внутренними вызовами (resumeOrNewTask при
  // первом входе в тип, nextBatchAll после своего собственного снимка всей
  // страницы), чтобы не задваивать снимок/очистку одного и того же задания
  if (!opts.skipSnapshot) snapshotAndClear('single', document.getElementById('card1Wrapper'));
  const m = curMode === 'random' ? pick(RANDOM_MODES) : ALL_MODES.find(x => x.id === curMode);
  curTask = genUnique(m);
  taskAnswered = false;
  hadWrongPick = false;

  renderCurrentTask();

  if (curMode !== 'random') {
    curProg.task = curTask;
    curProg.answered = false;
    curProg.hadWrongPick = false;
    curProg.taskRenderVersion = TASK_RENDER_VERSION;
    saveProg(curMode, curProg);
  }
  if (window.TrainerSession) window.TrainerSession.push();
}

// при входе в прототип — восстановить последний пример (если есть), а не выдавать новый
function resumeOrNewTask() {
  if (curMode !== 'random' && curProg && curProg.task) {
    curTask = curProg.task;
    taskAnswered = !!curProg.answered;
    hadWrongPick = !!curProg.hadWrongPick;

    renderCurrentTask();

    if (taskAnswered) {
      els.answerInput.value = String(curTask.correctValue);
      els.answerInput.classList.add('good');
      els.answerInput.disabled = true;
      els.checkAnswerBtn.disabled = true;
      syncKeypadVisibility();
      finishTask(false);
    } else if (hadWrongPick) {
      els.answerInput.classList.add('bad');
    }
    // Промпт №27: раньше эта ветка (возврат к уже сохранённому для этого типа
    // заданию — обычный случай при повторном заходе в ранее открытый тип)
    // ничего не рассылала: newTask() в ветке else рассылает сама, а тут
    // рассылки не было вообще — из-за этого при смене типа у ученика первая
    // (исходная) карточка «застревала» на предыдущем типе, хотя добавленные
    // задания обновлялись (их рассылает renderAddedList() отдельно)
    if (window.TrainerSession) window.TrainerSession.push();
  } else {
    newTask({ skipSnapshot: true }); // это не «замена» видимого задания — задание ещё не отображалось
  }
}

function submitInputAnswer() {
  if (taskAnswered) return;
  const raw = els.answerInput.value.trim().replace(',', '.');
  if (raw === '') return;
  const val = parseFloat(raw);
  const isCorrect = Number.isFinite(val) && Math.abs(val - curTask.correctValue) < 1e-9;

  if (isCorrect) {
    els.answerInput.classList.remove('bad');
    els.answerInput.classList.add('good');
    els.answerInput.disabled = true;
    els.checkAnswerBtn.disabled = true;
    streak++; totalSolved++;
    els.stSolved.textContent = totalSolved;
    els.stStreak.textContent = streak;
    taskAnswered = true;
    syncKeypadVisibility();
    if (curMode !== 'random') { curProg.answered = true; saveProg(curMode, curProg); }
    finishTask(true);
  } else if (hadWrongPick) {
    els.answerInput.value = String(curTask.correctValue);
    els.answerInput.classList.remove('bad');
    els.answerInput.classList.add('good');
    els.answerInput.disabled = true;
    els.checkAnswerBtn.disabled = true;
    streak = 0; totalErrors++;
    els.stErrors.textContent = totalErrors;
    els.stStreak.textContent = streak;
    taskAnswered = true;
    syncKeypadVisibility();
    if (curMode !== 'random') { curProg.answered = true; saveProg(curMode, curProg); }
    finishTask(true);
  } else {
    hadWrongPick = true;
    streak = 0; totalErrors++;
    els.stErrors.textContent = totalErrors;
    els.stStreak.textContent = streak;
    els.answerInput.classList.remove('shake');
    void els.answerInput.offsetWidth;
    els.answerInput.classList.add('bad', 'shake');
    if (curMode !== 'random') {
      if (!curProg.hadWrongPick) curProg.errorsInBatch = (curProg.errorsInBatch || 0) + 1;
      curProg.hadWrongPick = true;
      saveProg(curMode, curProg);
    }
  }
  if (window.TrainerSession) window.TrainerSession.push();
}
els.checkAnswerBtn.onclick = submitInputAnswer;
els.answerInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitInputAnswer(); });

/* Промпт №31: «Следующий пример →» заменяет ЕДИНСТВЕННОЕ текущее задание —
   когда на доске уже несколько добавленных заданий, эта кнопка у первого
   номера только сбивает с толку (у каждой карточки для этого есть свои
   личные кнопки). Поэтому показываем её лишь пока задание одно. */
function nextBtnAllowed(){ return addedTasks.length === 0; }
function syncNextBtnVisibility(){
  if (!nextBtnAllowed()) els.nextBtn.style.display = 'none';
}

function finishTask(isFreshSolve) {
  if (isFreshSolve === undefined) isFreshSolve = true;
  els.showSolutionBtn.style.display = 'none';
  els.mainPanel.style.display = 'block';
  els.explainBox.style.display = 'block';
  els.explainBox.innerHTML = `<b>Решение:</b> ${curTask.explain}`;
  els.nextBtn.style.display = nextBtnAllowed() ? 'block' : 'none';
  els.mainPanel.classList.remove('reveal');
  void els.mainPanel.offsetWidth;
  els.mainPanel.classList.add('reveal');

  if (isFreshSolve && curMode !== 'random') recordSolve();
}
els.nextBtn.onclick = newTask;

let solutionShown = false;
function revealSolution() {
  solutionShown = true;
  els.showSolutionBtn.textContent = 'Скрыть решение и ответ';
  els.mainPanel.style.display = 'block';
  els.explainBox.style.display = 'block';
  els.explainBox.innerHTML = `<b>Решение:</b> ${curTask.explain}`;
  els.nextBtn.style.display = nextBtnAllowed() ? 'block' : 'none';
  els.mainPanel.classList.remove('reveal');
  void els.mainPanel.offsetWidth;
  els.mainPanel.classList.add('reveal');
}
function hideSolution() {
  solutionShown = false;
  els.showSolutionBtn.textContent = 'Показать решение и ответ';
  els.mainPanel.style.display = 'none';
  els.explainBox.style.display = 'none';
  els.nextBtn.style.display = 'none';
}
els.showSolutionBtn.onclick = guardStudentAction('showSolution', () => {
  if (taskAnswered) return;
  if (solutionShown) hideSolution(); else revealSolution();
});

/* ═══════════════ «+» — добавление ещё нескольких заданий того же типа ═══════════════
   Встроено прямо в «Экзамен»/«Тренировку», без отдельной вкладки. Первое (исходное) задание —
   это по-прежнему curTask/#questionPanel, как и раньше, без изменений. Всё, что добавлено
   через «+», живёт в addedTasks — независимые карточки, каждая со своим input, своей кнопкой
   «Проверить» и своей кнопкой «⟳ Обновить пример»; у добавленных, в отличие от первой, есть
   ещё и «− Убрать». Добавление (плашка «+1..+10» и сама «+») дописывает карточки в конец
   списка, не трогая уже существующие — набранный, но ещё не проверенный текст в них не теряется.
   Удаление (в т.ч. «Очистить») делает полную перерисовку списка — так проще и безопаснее
   переиндексировать оставшиеся карточки, чем аккуратно сдвигать DOM вручную. */
let addedTasks = []; // [{task, answered, hadWrongPick, solutionRevealed}]

function addedSolutionBtnDisplay(bt){
  return (curSubMode === 'practice' && !bt.answered) ? 'inline-flex' : 'none';
}
// переключение вкладок не пересоздаёт добавленные карточки — синхронизируем
// видимость и текст их кнопок отдельно, и на всякий случай прячем решение,
// если оно было раскрыто вручную, при уходе из «Тренировки»
function syncAddedSolutionUI(){
  // строго внутри tasksColumnsWrap, а не document целиком: пока идёт снимок для
  // «Истории урока» (Промпт №23), в document какое-то время висит offscreen-клон
  // с теми же классами (см. lesson-history.js) — document-wide селектор мог бы
  // случайно подцепить и его
  els.tasksColumnsWrap.querySelectorAll('.added-task-card').forEach((card, i) => {
    const bt = addedTasks[i];
    if (!bt) return;
    if (curSubMode !== 'practice' && !bt.answered && bt.solutionRevealed) {
      bt.solutionRevealed = false;
      const ex = card.querySelector('.added-explain');
      if (ex) { ex.style.display = 'none'; ex.innerHTML = ''; }
    }
    const btn = card.querySelector('.added-solution-btn');
    if (btn) {
      btn.style.display = addedSolutionBtnDisplay(bt);
      btn.textContent = bt.solutionRevealed ? 'Скрыть решение и ответ' : 'Показать решение и ответ';
    }
  });
}
let addRailOpen = false; // Промпт №32: развёрнута ли боковая колонка добавления

function genAddedTask(){
  const m = curMode === 'random' ? pick(RANDOM_MODES) : ALL_MODES.find(x => x.id === curMode);
  return { task: genUnique(m), answered: false, hadWrongPick: false, solutionRevealed: false };
}
// «В подборку» работает на трёх уровнях: личная кнопка у КАЖДОЙ карточки (включая первую) —
// добавляет только её; общая 📥 в шапке и иконка 📥 в панели добавления — обе разом добавляют
// ВСЕ задания, которые сейчас на доске (первая карточка + все добавленные)
function addSingleTaskToBasket(selector){
  if (!window.Basket) return false;
  const rich = window.Basket.extractFromSelectorsRich([selector]);
  if (!rich || !rich.text) return false;
  window.Basket.add({ trainerId: 'oge8', modeTitle: els.taskTitle.textContent, text: rich.text, html: rich.html });
  return true;
}
function addAllTasksToBasket(){
  if (!window.Basket) return;
  addSingleTaskToBasket('#card1Question');
  addedTasks.forEach((bt, i) => addSingleTaskToBasket(`.added-task-card[data-idx="${i}"] .added-card-question`));
}
els.basketInlineBtn.onclick = () => {
  if (!addSingleTaskToBasket('#card1Question')) return;
  const orig = els.basketInlineBtn.textContent;
  els.basketInlineBtn.classList.add('ok');
  els.basketInlineBtn.textContent = '✓';
  setTimeout(() => { els.basketInlineBtn.classList.remove('ok'); els.basketInlineBtn.textContent = orig; }, 900);
};
// при смене типа задания (открытие нового типа, навигация ◀▶) количество заданий на доске
// больше не сбрасывается до одного — вся текущая партия (первая карточка + все добавленные)
// пересоздаётся из генератора НОВОГО типа, в том же количестве; раскладка по колонкам не
// трогается отдельно — applyColumns() внутри renderAddedList() сама посчитает её от того же
// total, что был до переключения
function regenerateAddedTasksForNewType(){
  addedTasks = addedTasks.map(() => genAddedTask());
  // не рассылаем здесь: и openTask(), и navigateType() гарантированно вызывают
  // resumeOrNewTask()/switchSubMode() сразу после — вот они и разошлют уже
  // полностью согласованное состояние (см. renderAddedList)
  if (els.tasksColumnsWrap) renderAddedList(true);
}
// пороги по ОБЩЕМУ числу заданий на доске (исходное + добавленные): 1–3 → 1 колонка,
// 4–6 → 2 колонки, 7 и далее → 3 колонки (дальше рост идёт только вниз внутри них)
function desiredColsForTotal(total){
  if (total <= 3) return 1;
  if (total <= 6) return 2;
  return 3;
}
function applyColumns(){
  if (!els.tasksColumnsWrap) return;
  const total = 1 + addedTasks.length;
  let cols = desiredColsForTotal(total);
  if (window.innerWidth < 560) cols = Math.min(cols, 1);
  else if (window.innerWidth < 820) cols = Math.min(cols, 2);
  const rows = Math.max(1, Math.ceil(total / cols));
  els.tasksColumnsWrap.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  els.tasksColumnsWrap.style.gridTemplateRows = `repeat(${rows}, auto)`;
}
window.addEventListener('resize', () => { if (curSubMode === 'exam' || curSubMode === 'practice') applyColumns(); });
function addedCardInnerHTML(bt){
  const t = bt.task;
  const stateCls = bt.answered ? 'good' : (bt.hadWrongPick ? 'bad' : '');
  const val = bt.answered ? String(t.correctValue) : '';
  const disabled = bt.answered ? 'disabled' : '';
  // .added-card-question — отдельный контейнер только для условия и поля ввода (без кнопок
  // и без разбора), чтобы «В подборку» захватывала ровно то же самое, что и обычная 📥 у
  // первой карточки (которая берёт #questionPanel целиком, но кнопки basket-core.js и так
  // всегда вырезает — а вот блок с готовым разбором ей вообще не показывают, его тут нет).
  return `
    <div class="added-card-question">
      <div class="prompt">${t.prompt}</div>
      <div class="input-answer-row">
        <input type="text" inputmode="decimal" class="answer-input added-answer-input ${stateCls}" placeholder="?" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" value="${val}" ${disabled}>
        <button class="check-btn added-check-btn" ${disabled}>Проверить</button>
      </div>
    </div>
    <div class="card-btn-row">
      <button class="refresh-inline-btn icon-only added-refresh-btn" title="Обновить пример">⟳</button>
      <button class="refresh-inline-btn icon-only added-basket-btn" title="В подборку">📥</button>
      <button class="refresh-inline-btn added-solution-btn" style="display:${addedSolutionBtnDisplay(bt)}">${bt.solutionRevealed ? 'Скрыть решение и ответ' : 'Показать решение и ответ'}</button>
      <button class="added-remove-btn">− Убрать</button>
    </div>
    <div class="explain added-explain" style="display:${(bt.answered || bt.solutionRevealed) ? 'block' : 'none'}">${(bt.answered || bt.solutionRevealed) ? '<b>Решение:</b> ' + t.explain : ''}</div>`;
}
function makeAddedCardEl(bt, idx){
  const div = document.createElement('div');
  div.className = 'panel added-task-card';
  div.dataset.idx = String(idx);
  div.innerHTML = addedCardInnerHTML(bt);
  const inp = div.querySelector('.added-answer-input');
  if (window.TrainerSession) window.TrainerSession.registerField('added-' + idx, inp);
  const submit = () => submitAddedAnswer(+div.dataset.idx);
  div.querySelector('.added-check-btn').onclick = submit;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  div.querySelector('.added-refresh-btn').onclick = guardStudentAction('refreshOne', () => refreshAddedTask(+div.dataset.idx));
  div.querySelector('.added-remove-btn').onclick = guardStudentAction('deleteTask', () => removeAddedTask(+div.dataset.idx));
  const solutionBtn = div.querySelector('.added-solution-btn');
  solutionBtn.onclick = guardStudentAction('showSolution', () => {
    const cur = addedTasks[+div.dataset.idx];
    if (!cur || cur.answered) return;
    cur.solutionRevealed = !cur.solutionRevealed;
    const ex = div.querySelector('.added-explain');
    if (cur.solutionRevealed) {
      ex.innerHTML = '<b>Решение:</b> ' + cur.task.explain;
      ex.style.display = 'block';
      solutionBtn.textContent = 'Скрыть решение и ответ';
    } else {
      ex.style.display = 'none';
      solutionBtn.textContent = 'Показать решение и ответ';
    }
  });
  const basketBtn = div.querySelector('.added-basket-btn');
  basketBtn.onclick = () => {
    if (!addSingleTaskToBasket(`.added-task-card[data-idx="${div.dataset.idx}"] .added-card-question`)) return;
    const orig = basketBtn.textContent;
    basketBtn.classList.add('ok');
    basketBtn.textContent = '✓';
    setTimeout(() => { basketBtn.classList.remove('ok'); basketBtn.textContent = orig; }, 900);
  };
  return div;
}
function renderAddedList(skipPush){
  // #card1Wrapper — не трогаем: он живёт внутри tasksColumnsWrap постоянно, в нём —
  // рабочие DOM-узлы questionPanel/mainPanel, на которые уже указывают ссылки в els
  if (window.TrainerSession) window.TrainerSession.unregisterFieldsWithPrefix('added-');
  els.tasksColumnsWrap.querySelectorAll('.added-task-card').forEach(el => el.remove());
  addedTasks.forEach((bt, i) => els.tasksColumnsWrap.appendChild(makeAddedCardEl(bt, i)));
  applyColumns();
  updateAddUI();
  // skipPush: true — используется при смене типа задания (см. regenerateAddedTasksForNewType):
  // в этот момент основное задание (curTask) ещё не обновлено на новый тип, и немедленная
  // рассылка состояния отправила бы ученику рассинхронизированный снимок (новые добавленные
  // задания + СТАРОЕ основное) — вызывающий код (openTask/navigateType) сам гарантированно
  // разошлёт полное и уже согласованное состояние сразу вслед за этим (Промпт №27)
  if (!skipPush && window.TrainerSession) window.TrainerSession.push();
}
function appendAddedTasks(n){
  for (let i = 0; i < n; i++){
    const bt = genAddedTask();
    addedTasks.push(bt);
    els.tasksColumnsWrap.appendChild(makeAddedCardEl(bt, addedTasks.length - 1));
  }
  applyColumns();
  updateAddUI();
  if (window.TrainerSession) window.TrainerSession.push();
}
function removeAddedTask(idx){
  const card = els.tasksColumnsWrap.querySelector(`.added-task-card[data-idx="${idx}"]`);
  snapshotAndClear('single', card);
  addedTasks.splice(idx, 1);
  renderAddedList();
}
function clearAddedTasks(){
  snapshotAndClear('whole', els.tasksColumnsWrap);
  addedTasks = [];
  renderAddedList();
}
function refreshAddedTask(idx){
  const bt = addedTasks[idx];
  if (!bt) return;
  const card = els.tasksColumnsWrap.querySelector(`.added-task-card[data-idx="${idx}"]`);
  snapshotAndClear('single', card);
  addedTasks[idx] = genAddedTask();
  const card2 = els.tasksColumnsWrap.querySelector(`.added-task-card[data-idx="${idx}"]`);
  if (card2) card2.replaceWith(makeAddedCardEl(addedTasks[idx], idx));
  else renderAddedList();
  if (window.TrainerSession) window.TrainerSession.push();
}
function nextBatchAll(){
  // «Следующий пример» в панели — вся текущая партия (первая карточка + все добавленные)
  // заменяется свежей, того же типа и того же размера, независимо от того, что уже решено
  snapshotAndClear('whole', els.tasksColumnsWrap);
  newTask({ skipSnapshot: true }); // снимок всей страницы уже сделан строкой выше — не задваиваем
  addedTasks = addedTasks.map(() => genAddedTask());
  renderAddedList();
}
function updateAddUI(){
  const has = addedTasks.length > 0;
  // Промпт №32: сама колонка добавления видна на экране задания всегда (одной
  // кнопкой «+» у края), а свёрнута она или развёрнута — решает только
  // пользователь, кнопкой. Групповые действия (обновить всё / в подборку всё /
  // очистить) появляются в ней лишь тогда, когда на доске есть что группировать.
  els.addRail.style.display = 'flex';
  els.addRail.classList.toggle('open', addRailOpen);
  els.addRailToggle.setAttribute('aria-expanded', addRailOpen ? 'true' : 'false');
  els.addRailToggle.title = addRailOpen ? 'Свернуть' : 'Добавить примеры';
  els.addRailSep.style.display = has ? 'block' : 'none';
  els.addNextBatchBtn.style.display = has ? 'inline-flex' : 'none';
  els.addToBasketAllBtn.style.display = has ? 'inline-flex' : 'none';
  els.addClearBtn.style.display = has ? 'inline-flex' : 'none';

  // у исходной карточки личные кнопки появляются, как только она перестала
  // быть единственной (в «тренировке» — всегда)
  els.card1BtnRow.style.display = (has || curSubMode === 'practice') ? 'flex' : 'none';
  els.refreshInlineBtn.style.display = has ? 'inline-flex' : 'none';
  els.basketInlineBtn.style.display = has ? 'inline-flex' : 'none';
  syncNextBtnVisibility(); // Промпт №31 — задание перестало быть единственным
}
function submitAddedAnswer(idx){
  const bt = addedTasks[idx];
  if (!bt || bt.answered) return;
  const card = els.tasksColumnsWrap.querySelector(`.added-task-card[data-idx="${idx}"]`);
  if (!card) return;
  const inp = card.querySelector('.added-answer-input');
  const raw = inp.value.trim().replace(',', '.');
  if (raw === '') return;
  const val = parseFloat(raw);
  const isCorrect = Number.isFinite(val) && Math.abs(val - bt.task.correctValue) < 1e-9;

  if (isCorrect || bt.hadWrongPick) {
    if (!isCorrect) inp.value = String(bt.task.correctValue);
    inp.classList.remove('bad');
    inp.classList.add('good');
    inp.disabled = true;
    card.querySelector('.added-check-btn').disabled = true;
    bt.answered = true;
    if (isCorrect) { streak++; totalSolved++; } else { streak = 0; totalErrors++; }
    els.stSolved.textContent = totalSolved;
    els.stErrors.textContent = totalErrors;
    els.stStreak.textContent = streak;
    bt.solutionRevealed = false;
    const solBtn = card.querySelector('.added-solution-btn');
    if (solBtn) solBtn.style.display = 'none';
    const explainEl = card.querySelector('.added-explain');
    explainEl.innerHTML = '<b>Решение:</b> ' + bt.task.explain;
    explainEl.style.display = 'block';
    if (curMode !== 'random') recordSolveFor(bt.task, bt.hadWrongPick);
  } else {
    bt.hadWrongPick = true;
    if (curMode !== 'random') { curProg.errorsInBatch = (curProg.errorsInBatch || 0) + 1; saveProg(curMode, curProg); }
    streak = 0; totalErrors++;
    els.stErrors.textContent = totalErrors;
    els.stStreak.textContent = streak;
    inp.classList.remove('shake');
    void inp.offsetWidth;
    inp.classList.add('bad', 'shake');
  }
  if (window.TrainerSession) window.TrainerSession.push();
}
// Промпт №32: одна и та же кнопка разворачивает и сворачивает колонку —
// раньше «Скрыть» прятала панель безвозвратно (вернуть её можно было, только
// добавив ещё одно задание), и это читалось как «кнопка не работает».
els.addRailToggle.onclick = () => { addRailOpen = !addRailOpen; updateAddUI(); };
els.addRailBody.querySelectorAll('.add-qty-btn').forEach(btn => {
  btn.onclick = () => appendAddedTasks(+btn.dataset.n);
});
els.addClearBtn.onclick = guardStudentAction('deleteTask', clearAddedTasks);
els.addNextBatchBtn.onclick = guardStudentAction('refreshAll', nextBatchAll);
els.addToBasketAllBtn.onclick = () => {
  if (!window.Basket) return;
  addAllTasksToBasket();
  els.addToBasketAllBtn.classList.add('ok');
  els.addToBasketAllBtn.textContent = '✓';
  setTimeout(() => { els.addToBasketAllBtn.classList.remove('ok'); els.addToBasketAllBtn.textContent = '📥'; }, 900);
};

/* ═══ растягиваемая рабочая зона — центральная область с карточками заданий
   тянется вручную за любой край и расширяется симметрично с обеих сторон;
   доступна всегда, независимо от того, сколько заданий сейчас на доске
   (пригодится в первую очередь при 7+ заданиях в три колонки, но не только) ── */
const WORK_W_KEY = 'oge8:workZoneW';
/* ширина рабочей зоны «по умолчанию» — вся ширина её родителя (--work-w не
   задана, 100%). Нужна clampWorkW: клавиатура ограничивает растягивание,
   только когда стоит СБОКУ от зоны такой ширины. В узком окне (тренажёр в
   панели на доске, пол-экрана) клавиатура висит поверх зоны уже по
   умолчанию — там её предел только сжимал зону при первом же касании
   края до узкой полосы и не давал растянуть обратно под окно */
function workZoneBaseW(){
  try {
    const p = els.workZone.parentElement;
    const cs = getComputedStyle(p);
    return p.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
  } catch (e) { return 0; }
}
function clampWorkW(w){
  const min = 380;
  let max = window.innerWidth - 24;
  try {
    const kp = document.getElementById('keypadFloat');
    if (kp && getComputedStyle(kp).display !== 'none') {
      const kpLeft = kp.getBoundingClientRect().left;
      const gap = 16; // запас, чтобы край рабочей зоны не касался клавиатуры
      const maxByKeypad = 2 * (kpLeft - gap - window.innerWidth / 2);
      if (maxByKeypad > 0 && maxByKeypad >= workZoneBaseW()) max = Math.min(max, maxByKeypad);
    }
  } catch(e){}
  max = Math.max(min, max);
  return Math.min(max, Math.max(min, w));
}
(function restoreWorkZoneWidth(){
  try {
    const w = parseFloat(localStorage.getItem(WORK_W_KEY));
    if (w) els.workZone.style.setProperty('--work-w', clampWorkW(w) + 'px');
  } catch(e){}
})();

function setupWorkZoneResize(handleEl, side){
  let start = null; // {x, w}
  handleEl.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    handleEl.setPointerCapture(e.pointerId);
    handleEl.classList.add('dragging');
    start = { x: e.clientX, w: els.workZone.getBoundingClientRect().width };
  });
  handleEl.addEventListener('pointermove', (e) => {
    if (!start) return;
    const dx = (side === 'right') ? (e.clientX - start.x) : (start.x - e.clientX);
    const w = clampWorkW(start.w + dx * 2);
    els.workZone.style.setProperty('--work-w', w + 'px');
  });
  function end(){
    if (!start) return;
    start = null;
    handleEl.classList.remove('dragging');
    try {
      const w = parseFloat(getComputedStyle(els.workZone).width);
      localStorage.setItem(WORK_W_KEY, String(w));
    } catch(e){}
    // после завершения растягивания форсируем перерисовку — не дожидаясь скролла
    setTimeout(forceRepaintWorkArea, 30);
    // Промпт №23: растянутая ширина рабочей зоны должна долететь до собеседника —
    // сама ширина уже читается в tsGetState() при любом push(), но нужен ещё явный
    // push() именно в момент завершения растягивания
    if (window.TrainerSession) window.TrainerSession.push();
  }
  handleEl.addEventListener('pointerup', end);
  handleEl.addEventListener('pointercancel', end);
}
setupWorkZoneResize(els.workResizeLeft, 'left');
setupWorkZoneResize(els.workResizeRight, 'right');

// ── принудительная перерисовка после растягивания рабочей зоны и после скролла ──
// (см. комментарий выше setupWorkZoneResize) — лечит «призрачные» полупрозрачные
// прямоугольники и смещённую плавающую клавиатуру, которые иногда остаются на экране
// после сочетания «растянуть рабочую зону» + «прокрутить вниз, в ранее невидимую область»
function forceRepaint(el){
  if (!el) return;
  const prev = el.style.opacity;
  el.style.opacity = '0.999999';
  requestAnimationFrame(() => { el.style.opacity = prev; });
}
function forceRepaintWorkArea(){
  forceRepaint(els.workZone);
  const kp = document.getElementById('keypadFloat');
  if (kp) forceRepaint(kp);
}
let workAreaRepaintTimer = null;
window.addEventListener('scroll', () => {
  clearTimeout(workAreaRepaintTimer);

/* ───────── плавающая клавиатура ───────── */
let keypadOpen = true;
function setupFloatingKeypad(){
  // раскладка одна на все тренажёры — keypad.js
  const kb = document.getElementById('keypadButtons');
  kb.innerHTML = Keypad.keys([]);
  Keypad.bind(kb, keypadPress);
  document.getElementById('kpClose').onclick = ()=>{ keypadOpen=false; syncKeypadVisibility(); };
  document.getElementById('kpToggle').onclick = ()=>{ keypadOpen=true; syncKeypadVisibility(); keepTaskClearOfKeypad(); };
  makeKeypadDraggable(document.getElementById('keypadFloat'), document.getElementById('kpDragHandle'));
}
function makeKeypadDraggable(floatEl, handleEl){
  if(!floatEl || !handleEl || floatEl._dragReady) return;
  floatEl._dragReady = true;
  let dragging = false, offsetX = 0, offsetY = 0;
  function clamp(x, y){
    const w = floatEl.offsetWidth, h = floatEl.offsetHeight;
    const maxX = Math.max(4, window.innerWidth - w - 4);
    const maxY = Math.max(4, window.innerHeight - h - 4);
    return { x: Math.min(Math.max(x, 4), maxX), y: Math.min(Math.max(y, 4), maxY) };
  }
  function onPointerDown(e){
    dragging = true;
    const rect = floatEl.getBoundingClientRect();
    floatEl.style.left = rect.left + 'px';
    floatEl.style.top = rect.top + 'px';
    floatEl.style.right = 'auto';
    // На телефоне CSS прижимает клавиатуру к низу (bottom:16px). Если его не
    // сбросить, при заданном top панель растягивается до низа экрана и за ней
    // остаётся пустой «хвост».
    floatEl.style.bottom = 'auto';
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    try{ handleEl.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  }
  function onPointerMove(e){
    if(!dragging) return;
    const pos = clamp(e.clientX - offsetX, e.clientY - offsetY);
    floatEl.style.left = pos.x + 'px';
    floatEl.style.top = pos.y + 'px';
  }
  function onPointerUp(e){
    dragging = false;
    try{ handleEl.releasePointerCapture(e.pointerId); }catch(err){}
  }
  handleEl.addEventListener('pointerdown', onPointerDown);
  handleEl.addEventListener('pointermove', onPointerMove);
  handleEl.addEventListener('pointerup', onPointerUp);
  handleEl.addEventListener('pointercancel', onPointerUp);
  window.addEventListener('resize', ()=>{
    if(floatEl.style.left && floatEl.style.left!=='auto'){
      const rect = floatEl.getBoundingClientRect();
      const pos = clamp(rect.left, rect.top);
      floatEl.style.left = pos.x + 'px';
      floatEl.style.top = pos.y + 'px';
    }
  });
}
function keypadPress(ch){
  const inp = els.answerInput;
  if(!inp || inp.disabled) return;
  if(ch==='enter'){ submitInputAnswer(); return; }
  // в место курсора и с событием input — набранное видит собеседник в сессии
  Keypad.press(inp, ch);
}
function syncKeypadVisibility(){
  const needsInput = els.taskArea.style.display !== 'none' &&
    els.questionPanel.style.display !== 'none' &&
    !els.answerInput.disabled;
  const kp = document.getElementById('keypadFloat');
  const shown = needsInput && keypadOpen;
  kp.style.display = shown ? 'block' : 'none';
  document.getElementById('kpToggle').style.display = (needsInput && !keypadOpen) ? 'flex' : 'none';
  document.body.classList.toggle('kp-open', shown);
  if (shown) document.body.style.setProperty('--kp-h', kp.offsetHeight + 'px');
}

/* На телефоне клавиатура прижата к низу и закрывала поле ответа и
   «Проверить»: ученик видел половину задания. Не двигаем панель (её место
   учитель может выбрать сам, перетащив), а поднимаем страницу, пока условие
   и поле ответа не окажутся над ней. Если всё условие не влезает, главное —
   строка ответа. Клавиатуру уже перетаскивали (makeKeypadDraggable ставит
   ей top) — место выбрано руками, страницу не трогаем. По положению это
   не определить: на 320×568 нетронутая панель выше половины экрана */
function keepTaskClearOfKeypad(){
  const kp = document.getElementById('keypadFloat');
  if (!kp || kp.style.display === 'none' || kp.style.top) return;
  const k = kp.getBoundingClientRect();
  const q = document.getElementById('card1Question').getBoundingClientRect();
  const row = document.getElementById('inputAnswerArea').getBoundingClientRect();
  if (q.right <= k.left || q.left >= k.right) return;
  let limit = k.top - 12;
  // «+» (.add-rail) закреплена слева посередине экрана: условие, стоящее над
  // клавиатурой, на телефоне ложилось под неё началом формулы. Если карточка
  // помещается выше «+», ставим её туда. Карточка, которая и после подъёма
  // над клавиатурой останется целиком ниже «+», ей не мешает
  const rail = document.querySelector('.add-rail');
  // у position:fixed offsetParent всегда null — видимость только по размеру
  const r = rail && rail.getBoundingClientRect();
  const topAfterLift = q.top - Math.max(0, q.bottom - limit);
  if (r && r.height > 0 && r.right > q.left && topAfterLift < r.bottom) {
    const railLimit = r.top - 12;
    if (railLimit < limit && q.height <= railLimit - 8) limit = railLimit;
  }
  if (q.bottom <= limit) return;
  const need = row.bottom - limit;
  const dy = Math.max(Math.min(q.bottom - limit, q.top - 8), need);
  if (dy <= 0) return;
  // Сразу, без плавной прокрутки: её обрывает первое же касание, а в фоновой
  // вкладке она не идёт вовсе — задание оставалось бы под клавиатурой. Резкого
  // скачка нет: renderCurrentTask только что так же сразу поднял страницу к 0
  window.scrollBy(0, dy);
}

/* ═══ Промпт №19: совместный доступ — синхронизация состояния тренажёра ═══
   Синхронизируем «что мы вместе сейчас решаем»: экран выбора типа/сам тип,
   вкладку режима, текущее основное задание и его статус, весь список
   добавленных заданий. Личный прогресс (streak/решено/ошибки, медали,
   история примеров) — НЕ синхронизируется: это персональная статистика
   каждого, а не общая задача. Посимвольный ввод в поля ответа
   синхронизируется отдельно, через TrainerSession.registerField(). */
function tsGetState(){
  const base = {
    picker: els.taskArea.style.display === 'none',
    curMode, curSubMode,
    curTask, taskAnswered: !!taskAnswered, hadWrongPick: !!hadWrongPick,
    addedTasks: addedTasks.map(bt => ({
      task: bt.task, answered: !!bt.answered, hadWrongPick: !!bt.hadWrongPick, solutionRevealed: !!bt.solutionRevealed,
    })),
    // Промпт №23: ширина растянутой рабочей зоны — чтобы у обоих участников
    // задания и заметки поверх них были видны в одном и том же масштабе
    workW: parseFloat(getComputedStyle(els.workZone).width) || null,
    // Промпт №25: статистика (решено/серия/ошибки) — учитель должен видеть
    // актуальные показатели ученика в реальном времени, а не только у себя
    totalSolved, streak, totalErrors,
    // Промпт №18 нового списка: галочка «Нулевые и отрицательные степени» —
    // ученик видит выбор учителя, и доска, придумывая «ещё такое же» в
    // невидимом кадре, берёт задание с той же галочкой
    hardNums: hardCtl.get(),
  };
  // доска (инструмент рисования поверх тренажёра) — своё, отдельно управляемое
  // подмодулем поле; подмешиваем его снимок сюда же, чтобы штрихи попадали в
  // ту же общую сохраняемую/рассылаемую «полную» синхронизацию состояния,
  // не заводя для этого отдельную таблицу/канал
  if (window.__boardGetState) Object.assign(base, window.__boardGetState());
  return base;
}
function tsApplyState(state){
  if (!state || typeof state.picker === 'undefined') return; // пустой снимок — сессией ещё никто не пользовался
  // применяем штрихи доски ДО развилки по picker/задаче — доска видна и
  // доступна независимо от того, какой сейчас экран у тренажёра
  if (window.__boardApplyState) window.__boardApplyState(state);
  // до openTask/newTask ниже: задание, которое придумает этот вызов
  // (доска в невидимом кадре зовёт newTask сразу после), — уже с
  // галочкой из снимка. Снимок без поля — от вкладки до промпта №18,
  // тогда галочка выключена, как и было. Не в localStorage: это чужой
  // выбор, свой на этом устройстве он не меняет
  hardCtl.set(!!state.hardNums, { persist: false });
  // Промпт №25: статистика — тоже независимо от picker/задачи, и всегда,
  // когда пришедший снимок её содержит (не только когда числа отличаются:
  // достаточно дёшево, а лишних перерисовок DOM тут не будет — textContent
  // и так не трогает layout, если значение совпадает)
  if (typeof state.totalSolved === 'number') {
    totalSolved = state.totalSolved; streak = state.streak; totalErrors = state.totalErrors;
    els.stSolved.textContent = totalSolved;
    els.stStreak.textContent = streak;
    els.stErrors.textContent = totalErrors;
  }
  // ширина рабочей зоны — тоже независимо от picker/задачи: применяем сразу,
  // если она реально отличается (иначе на каждый push() дёргали бы CSS зря)
  if (state.workW) {
    const curW = parseFloat(getComputedStyle(els.workZone).width);
    if (Math.abs(curW - state.workW) > 1) {
      const w = clampWorkW(state.workW);
      els.workZone.style.setProperty('--work-w', w + 'px');
      try { localStorage.setItem(WORK_W_KEY, String(w)); } catch(e){}
      setTimeout(forceRepaintWorkArea, 30);
    }
  }
  if (state.picker) {
    if (els.taskArea.style.display !== 'none') { els.taskArea.style.display = 'none'; els.picker.style.display = 'block'; renderPicker(); }
    return;
  }
  if (els.picker.style.display !== 'none' || curMode !== state.curMode) {
    curMode = state.curMode;
    openTask(); // сама переключит экран, тип, вызовет switchSubMode('exam') и т.д.
  }
  if (curSubMode !== state.curSubMode) switchSubMode(state.curSubMode);

  // state.curTask временно бывает null: сам openTask() выше — многошаговый
  // (генерирует список добавленных заданий РАНЬШЕ, чем основное задание через
  // switchSubMode -> newTask), и промежуточный push() успевает уйти в сеть
  // до того, как curTask на отправляющей стороне вообще появился. Просто
  // пропускаем обновление основной панели в этот момент — у нас уже есть
  // временная (своя) задача от локального openTask() выше, а через мгновение
  // придёт следующий, уже полный снимок и всё равно всё перерисует.
  /* ═══ Промпт №31: перерисовываем задания ТОЛЬКО когда они реально
     изменились. Раньше renderCurrentTask() и renderAddedList() вызывались на
     КАЖДЫЙ входящий снимок — а снимок прилетает на каждое действие
     собеседника, включая каждый штрих на доске. Из-за этого, стоило ученику
     начать писать, у второго участника заново перерисовывалась карточка:
     повторно проигрывалась анимация решения первого примера и экран
     подбрасывало вверх. Сравниваем пришедшее с тем, что уже на экране
     (а не с «последним применённым»): так любое настоящее изменение всё
     так же применяется мгновенно, а пустые перерисовки исчезают. ═══ */
  if (state.curTask) {
    const sameMain = curTask
      && !!taskAnswered === !!state.taskAnswered
      && !!hadWrongPick === !!state.hadWrongPick
      && JSON.stringify(curTask) === JSON.stringify(state.curTask);
    if (!sameMain) {
      curTask = state.curTask;
      taskAnswered = !!state.taskAnswered;
      hadWrongPick = !!state.hadWrongPick;
      renderCurrentTask();
      if (taskAnswered) {
        els.answerInput.value = String(curTask.correctValue);
        els.answerInput.classList.remove('bad');
        els.answerInput.classList.add('good');
        els.answerInput.disabled = true;
        els.checkAnswerBtn.disabled = true;
        syncKeypadVisibility();
        finishTask(false);
      } else if (hadWrongPick) {
        els.answerInput.classList.add('bad');
      }
    }
  }

  const incomingAdded = (state.addedTasks || []).filter(x => x && x.task).map(x => ({
    task: x.task, answered: !!x.answered, hadWrongPick: !!x.hadWrongPick, solutionRevealed: !!x.solutionRevealed,
  }));
  const sameAdded = JSON.stringify(addedTasks) === JSON.stringify(incomingAdded);
  addedTasks = incomingAdded;
  if (!sameAdded) {
    renderAddedList();
    syncAddedSolutionUI();
  }
}
if (window.TrainerSession) {

<script>
/* ─── плавная посадка блоков при изменении высоты .panel/.sheet ───
   Раньше при появлении подсказки/кнопки "дальше" панель ввода мгновенно
   скачком меняла высоту, а всё что ниже (статистика, теория) так же
   мгновенно дёргалось следом — расстояния оставались верными, но сам
   скачок выглядел "криво". ResizeObserver ловит ЛЮБОЕ изменение высоты
   независимо от того, какая функция его вызвала, и вместо мгновенного
   скачка красиво анимирует высоту — весь интерфейс ниже плавно
   "съезжает" на новое место, сохраняя одинаковый отступ всегда. */
function setupAutoHeightAnimation(el, duration){
  if(!el || typeof ResizeObserver==='undefined') return;
  duration = duration || 280;
  let lastH = null, resizing = false, settleTimer = null;
  const ro = new ResizeObserver(entries=>{
    if(resizing) return;
    const entry = entries[0];
    const cs = getComputedStyle(el);
    const newH = (entry.borderBoxSize && entry.borderBoxSize[0])
      ? entry.borderBoxSize[0].blockSize
      : entry.contentRect.height + parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);
    if(lastH===null){ lastH=newH; return; }
    if(Math.abs(newH-lastH)<1) return;
    const oldH = lastH;
    lastH = newH;
    resizing = true;
    el.style.height = oldH+'px';
    /* прячем оверфлоу только когда блок СЖИМАЕТСЯ — если он растёт (например,
       под KaTeX-формулу нужно больше места), контент не должен быть обрезан
       даже на долю секунды анимации: пусть на миг выйдет за скруглённый угол
       карточки, это гораздо лучше, чем спрятать половину дроби/корня. */
    el.style.overflow = (newH < oldH) ? 'hidden' : 'visible';
    void el.offsetHeight;
    el.style.transition = 'height '+duration+'ms cubic-bezier(.4,0,.2,1)';
    requestAnimationFrame(()=>{ el.style.height = newH+'px'; });
    clearTimeout(settleTimer);
    settleTimer = setTimeout(()=>{
      el.style.transition = '';
      el.style.height = '';
      el.style.overflow = '';
      resizing = false;
      lastH = el.getBoundingClientRect().height;
    }, duration+50);
  });
  ro.observe(el);
}
const PANEL_ANIM_SELECTOR = '.panel:not(.calc-history-panel):not(.calc-panel):not(.example-history-panel):not(.coming-soon):not(.theory-block)';
document.querySelectorAll(PANEL_ANIM_SELECTOR).forEach(p=>setupAutoHeightAnimation(p));

</script>

<script>
/* ═══════════════ калькулятор в столбик («свой пример») ═══════════════
   Встраивает через iframe те же тренажёры сложения/вычитания/умножения/
   деления в столбик (файлы *_embed.html), чтобы часть примеров можно было
   решать вообще без использования тетради. Самостоятельный блок — не
   зависит от структуры els этого файла, ищет свои элементы напрямую. */
(function(){
  const CALC_OP_META = {
    add: { title: '➕ Сложение в столбик — свой пример', file: 'addition_embed.html' },
    sub: { title: '➖ Вычитание в столбик — свой пример', file: 'subtraction_embed.html' },
    mul: { title: '✖️ Умножение в столбик — свой пример', file: 'multiplication_embed.html' },
    div: { title: '➗ Деление в столбик — свой пример', file: 'division_embed.html' },
  };

  const calcPanel = document.getElementById('calcPanel');
  const calcPanelTitle = document.getElementById('calcPanelTitle');
  const calcIframe = document.getElementById('calcIframe');
  const calcPanelClose = document.getElementById('calcPanelClose');
  const calcHistoryBtn = document.getElementById('calcHistoryBtn');
  const calcHistoryPanel = document.getElementById('calcHistoryPanel');
  const calcHistoryClose = document.getElementById('calcHistoryClose');
  const calcHistoryList = document.getElementById('calcHistoryList');
  const calcHistoryEmpty = document.getElementById('calcHistoryEmpty');
  if (!calcPanel || !calcIframe) return; // блока калькулятора на странице нет — выходим тихо

  let calcResizeTimer = null;

  function openCalc(op) {
    calcPanel.style.display = 'block';
    calcPanelTitle.textContent = CALC_OP_META[op].title;
    calcIframe.style.height = '760px';
    calcIframe.src = `${CALC_OP_META[op].file}?embed=1`;
    document.querySelectorAll('.calc-tool-btn[data-op]').forEach(b => b.classList.toggle('active', b.dataset.op === op));
    calcPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    clearInterval(calcResizeTimer);
    calcResizeTimer = setInterval(fitCalcIframe, 400);
  }
  function fitCalcIframe() {
    if (!calcIframe || calcPanel.style.display === 'none') { clearInterval(calcResizeTimer); return; }
    try {
      const doc = calcIframe.contentWindow && calcIframe.contentWindow.document;
      if (doc && doc.documentElement) {
      const wrapEl = doc.querySelector('.wrap');
      const h = wrapEl ? wrapEl.getBoundingClientRect().height : Math.max(doc.documentElement.scrollHeight, doc.body ? doc.body.scrollHeight : 0);
      if (h > 0) calcIframe.style.height = (Math.ceil(h) + 40) + 'px';
      }
    } catch (e) { /* кросс-доменные ограничения — оставляем текущую высоту */ }
  }
  function closeCalc() {
    calcPanel.style.display = 'none';
    calcIframe.src = 'about:blank';
    clearInterval(calcResizeTimer);
    document.querySelectorAll('.calc-tool-btn[data-op]').forEach(b => b.classList.remove('active'));
  }
  document.querySelectorAll('.calc-tool-btn[data-op]').forEach(btn => {
    btn.onclick = () => openCalc(btn.dataset.op);
  });
  if (calcPanelClose) calcPanelClose.onclick = closeCalc;
  calcIframe.addEventListener('load', fitCalcIframe);

  /* ─── история решений: копится за всё время, пока открыта страница ─── */
  let calcHistory = [];
  let calcHistoryNextId = 1;
  let calcHistoryFilter = 'all';

  function addCalcHistoryEntry(op, expr, result) {
    calcHistory.push({ id: calcHistoryNextId++, op, expr, result });
    if (calcHistoryPanel.style.display === 'block') renderCalcHistory();
  }
  function renderCalcHistory() {
    const items = calcHistoryFilter === 'all' ? calcHistory : calcHistory.filter(h => h.op === calcHistoryFilter);
    calcHistoryList.innerHTML = '';
    calcHistoryEmpty.style.display = items.length ? 'none' : 'block';
    items.slice().reverse().forEach(h => {
      const row = document.createElement('div');
      row.className = 'calc-history-row';
      const num = document.createElement('span');
      num.className = 'calc-history-num';
      num.textContent = '№' + h.id;
      const expr = document.createElement('span');
      expr.className = 'calc-history-expr';
      expr.textContent = h.expr;
      const copyBtn = document.createElement('button');
      copyBtn.className = 'calc-history-copy';
      copyBtn.textContent = '⧉ ' + h.result;
      copyBtn.title = 'Скопировать результат';
      copyBtn.onclick = () => copyCalcResult(h.result, copyBtn);
      row.appendChild(num);
      row.appendChild(expr);
      row.appendChild(copyBtn);
      calcHistoryList.appendChild(row);
    });
  }
  function copyCalcResult(result, btn) {
    const done = () => {
      btn.textContent = '✓ скопировано';
      setTimeout(() => { btn.textContent = '⧉ ' + result; }, 1200);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(String(result)).then(done).catch(done);
    } else {
      done();
    }
  }
  function toggleCalcHistory() {
    const willOpen = calcHistoryPanel.style.display !== 'block';
    calcHistoryPanel.style.display = willOpen ? 'block' : 'none';
    calcHistoryBtn.classList.toggle('active', willOpen);
    if (willOpen) {
      renderCalcHistory();
      calcHistoryPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }
  function closeCalcHistory() {
    calcHistoryPanel.style.display = 'none';
    calcHistoryBtn.classList.remove('active');
  }
  document.querySelectorAll('.calc-history-filter').forEach(btn => {
    btn.onclick = () => {
      calcHistoryFilter = btn.dataset.filter;
      document.querySelectorAll('.calc-history-filter').forEach(b => b.classList.toggle('active', b === btn));
      renderCalcHistory();
    };
  });
  if (calcHistoryBtn) calcHistoryBtn.onclick = toggleCalcHistory;
  if (calcHistoryClose) calcHistoryClose.onclick = closeCalcHistory;

  window.addEventListener('message', (e) => {
    const d = e.data;
    if (d && d.source === 'oge-calc-history' && d.op && d.expr && d.result !== undefined) {
      addCalcHistoryEntry(d.op, d.expr, d.result);
    }
  });
})();
</script>

</body></html>
