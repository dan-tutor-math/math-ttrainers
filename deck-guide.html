<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Гайд: HTML-презентации — Mathh</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- тема сайта (localStorage 'theme') — до первой отрисовки, как на всех
     страницах: иначе гайд брал тему системы и в светлой теме сайта
     открывался тёмным -->
<script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
/* Страница показывает deck-guide.md как есть: текст гайда один — и для
   людей, и для нейросети (кнопка «Скопировать» берёт тот же файл), чтобы
   страница и то, что уходит в чат, никогда не расходились */
@font-face{font-family:'Onest';src:url(fonts/onest-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Onest';src:url(fonts/onest-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#EEF1F7;--card:#FFFFFF;--ink:#004C99;--pencil:#1D1D1F;--muted:#6E6E73;--line:#DCE4F0;--code:#F5F7FB}
:root[data-theme="dark"]{--bg:#0B0E1A;--card:#151A2C;--ink:#4A93F0;--pencil:#F2F3F5;--muted:#9A9AA2;--line:#2A3150;--code:#1B2136}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--pencil);font-family:'Onest',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.55}
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;background:color-mix(in srgb, var(--bg) 82%, transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top a.back{color:var(--ink);text-decoration:none;font-weight:600;margin-right:auto}
.top button{height:36px;padding:0 14px;border-radius:10px;border:1.5px solid var(--ink);background:none;color:var(--ink);font:600 14px/1 inherit;font-family:inherit;cursor:pointer}
.top button.main{background:var(--ink);color:#fff}
.top button.theme{width:36px;padding:0;border-color:var(--line);font-size:17px}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 80px}
.doc{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 32px}
@media (max-width:600px){.doc{padding:18px 16px}}
.doc h1{font-size:28px;line-height:1.2;margin:0 0 14px}
.doc h2{font-size:21px;margin:30px 0 10px;color:var(--ink)}
.doc h3{font-size:17px;margin:22px 0 8px}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 12px;padding-left:24px}
.doc li{margin:4px 0}
.doc code{background:var(--code);border-radius:6px;padding:1px 5px;font-size:.9em;font-family:ui-monospace,Menlo,Consolas,monospace}
.doc pre{background:var(--code);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;font-size:13px;line-height:1.45}
.doc pre code{background:none;padding:0}
.doc table{border-collapse:collapse;margin:0 0 14px;font-size:14.5px;width:100%}
.doc th,.doc td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.doc th{color:var(--ink)}
.doc a{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1D1D1F;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="boards.html">← К доскам</a>
  <button class="main" id="copyBtn">Скопировать для нейросети</button>
  <button id="mdBtn">Скачать .md</button>
  <button id="sampleBtn">Скачать образец</button>
  <button class="theme" id="themeToggle" title="Светлая/тёмная тема" aria-label="Переключить тему">🌙</button>
</div>
<div class="wrap"><article class="doc" id="doc">Загружаем гайд…</article></div>
<div class="toast" id="toast"></div>
<script>
let MD = '';
const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// строка markdown → HTML: код, жирный, ссылки (сначала код — внутри него ничего не трогаем)
function inline(t){
  return esc(t).split(/(`[^`]+`)/).map(part => {
    if (/^`[^`]+`$/.test(part)) return '<code>' + part.slice(1, -1) + '</code>';
    return part.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  }).join('');
}
/* Небольшой разбор markdown: заголовки, абзацы, списки, таблицы, блоки
   кода — ровно то, что есть в гайде. Свой, а не библиотека: страница
   должна открываться без чужих серверов */
function render(md){
  const L = md.replace(/\r/g, '').split('\n'), out = [];
  let i = 0;
  while (i < L.length){
    const l = L[i];
    if (/^```/.test(l)){
      const buf = []; i++;
      while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    const h = /^(#{1,3})\s+(.*)$/.exec(l);
    if (h){ out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>'); i++; continue; }
    if (/^\|/.test(l)){
      const rows = [];
      while (i < L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter((r, k) => k !== 1);
      out.push('<table>' + body.map((r, k) => '<tr>' + cells(r).map(c => k ? '<td>' + inline(c) + '</td>' : '<th>' + inline(c) + '</th>').join('') + '</tr>').join('') + '</table>');
      continue;
    }
    if (/^(-|\d+\.)\s/.test(l)){
      const ord = /^\d/.test(l), items = [];
      while (i < L.length && /^(-|\d+\.)\s/.test(L[i])) items.push(L[i++].replace(/^(-|\d+\.)\s+/, ''));
      out.push((ord ? '<ol>' : '<ul>') + items.map(x => '<li>' + inline(x) + '</li>').join('') + (ord ? '</ol>' : '</ul>'));
      continue;
    }
    if (!l.trim()){ i++; continue; }
    const buf = [];
    while (i < L.length && L[i].trim() && !/^(#|```|\||-\s|\d+\.\s)/.test(L[i])) buf.push(L[i++]);
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}
function toast(t){ const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 1800); }
function save(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
// образец — первый блок ```html в гайде: отдельного файла нет, чтобы не разошлись
function sample(){ const m = /```html\n([\s\S]*?)```/.exec(MD); return m ? m[1] : ''; }
fetch('deck-guide.md', { cache: 'no-cache' }).then(r => r.text()).then(t => {
  MD = t;
  document.getElementById('doc').innerHTML = render(t);
}).catch(() => { document.getElementById('doc').textContent = 'Не получилось загрузить гайд — проверьте связь.'; });
document.getElementById('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(MD); toast('Скопировано — вставьте в чат с нейросетью'); }
  catch (e) { save('deck-guide.md', MD, 'text/markdown'); toast('Скопировать не вышло — гайд скачан файлом'); }
};
document.getElementById('mdBtn').onclick = () => save('deck-guide.md', MD, 'text/markdown');
document.getElementById('sampleBtn').onclick = () => save('deck-sample.html', sample(), 'text/html');
// та же кнопка темы, что на сайте: тот же ключ — выбор общий со всеми страницами
const themeBtn = document.getElementById('themeToggle');
const curTheme = () => document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
function applyTheme(t, persist){
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  if (persist){ try { localStorage.setItem('theme', t); } catch (e) {} }
}
applyTheme(curTheme(), false);
themeBtn.onclick = () => applyTheme(curTheme() === 'dark' ? 'light' : 'dark', true);
// тему сменили в соседней вкладке (на досках) — гайд следом
addEventListener('storage', (e) => { if (e.key === 'theme' && (e.newValue === 'dark' || e.newValue === 'light')) applyTheme(e.newValue, false); });
</script>
</body>
</html>
