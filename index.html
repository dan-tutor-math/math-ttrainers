<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E1A">
<script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<!-- предмет ставим на <html> до первого кадра, как тему: от него зависит цвет
     всей страницы, и без этого русский на мгновение мигал бы синим -->
<script>(function(){var s='math';try{var q=new URLSearchParams(location.search).get('subject');s=q||localStorage.getItem('ogeNav:subject')||'math';}catch(e){}if(!/^(math|rus|soc|eng)$/.test(s))s='math';document.documentElement.setAttribute('data-subject',s);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёры — Школа репетиторов</title>
<link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="onest.css">
<!-- Жидкое стекло: значки, режимы «обычный»/«максимум», меню «⋯».
     liquid-glass.js — в <head>, чтобы режим «максимум» включился до первого кадра -->
<link rel="stylesheet" href="liquid-glass.css">
<script src="mathh-icons.js"></script>
<script src="liquid-glass.js"></script>
<script src="mathh-menu.js"></script>
<style>
.katex{visibility:hidden}
html.katex-fonts-ready .katex{visibility:visible}
:root{
  --font-ui:'Onest',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --font-mono:ui-monospace,-apple-system,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#EEF1F7;
  --blob-1:rgba(120,150,255,.16);
  --blob-2:rgba(190,150,230,.14);
  --card:rgba(255,255,255,.8);
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.85);
  --glass-inset:rgba(255,255,255,.55);
  --hl:var(--hl-14);
  --hover-1:var(--hl-06);
  --hover-2:var(--hl-10);
  --muted-1:#8E8E93;
  --muted-2:#6E6E73;
  --muted-3:#48484A;
  --muted-4:#3A3A3C;
  --muted-5:#1D1D1F;
  --muted-6:#8E8E93;
  --muted-7:#C7C7CC;
  --muted-8:#8E8E93;
  --paper:#FDFCF7;
  --grid:#DCE4F0;
  --margin-red:#FF9F0A;
  --ink:#004C99;
  --ink-active:#003A75;
  --pencil:#1D1D1F;
  --teacher:#FF3B30;
  --ok:#248A3D;
  --moved:#5AC8FA;
  --shadow:0 10px 34px rgba(20,30,60,.08);
  --hl-06:rgba(0,76,153,.06);
  --hl-10:rgba(0,76,153,.10);
  --hl-14:var(--hl);
}

html[data-theme="dark"]{
  --bg:#0B0E1A;
  --blob-1:rgba(90,110,255,.22);
  --blob-2:rgba(150,90,220,.18);
  --paper:#151A2C;
  --card:rgba(30,37,64,.82);
  --glass:rgba(40,46,74,.5);
  --glass-strong:rgba(46,53,84,.65);
  --glass-border:rgba(255,255,255,.12);
  --glass-inset:rgba(255,255,255,.07);
  --hl:rgba(40,110,214,.26);
  --grid:#232A44;
  --margin-red:#FF9F0A;
  --ink:#2E7DE0;
  --ink-active:#4A93F0;
  --pencil:#F2F3F5;
  --teacher:#FF6961;
  --ok:#3E8E5B;
  --moved:#64D2FF;
  --shadow:0 10px 40px rgba(0,0,0,.55);
  --hl-06:rgba(46,125,224,.1);
  --hl-10:rgba(46,125,224,.16);
  --hl-14:var(--hl);
  --muted-1:#9A9AA2;
  --muted-2:#9A9AA2;
  --muted-3:#AEAEB4;
  --muted-4:#C7C7CC;
  --muted-5:#F2F3F5;
  --muted-6:#9A9AA2;
  --muted-7:#3A3F55;
  --muted-8:#9A9AA2;
  --hover-1:rgba(127,160,255,.08);
  --hover-2:rgba(127,160,255,.14);
}
html[data-theme="dark"] input{background:var(--card)}

/* У каждого предмета свой цвет: им окрашены вкладки, кнопки капсул и пятно
   фона. Меняем только --ink и его производные — все компоненты страницы
   (и liquid-glass.css) уже берут цвет из них, отдельных правил не нужно.
   Математика остаётся прежней синей. В тёмной теме тон светлее, чтобы белый
   текст на активной вкладке читался так же */
html[data-subject="rus"]{--ink:#9E2A47;--ink-active:#7E1F37;--hl-06:rgba(158,42,71,.06);--hl-10:rgba(158,42,71,.10);--blob-1:rgba(194,64,95,.16)}
html[data-subject="soc"]{--ink:#17694F;--ink-active:#10523D;--hl-06:rgba(23,105,79,.06);--hl-10:rgba(23,105,79,.10);--blob-1:rgba(36,137,106,.16)}
html[data-subject="eng"]{--ink:#5B3596;--ink-active:#47287A;--hl-06:rgba(91,53,150,.06);--hl-10:rgba(91,53,150,.10);--blob-1:rgba(122,82,184,.16)}
html[data-theme="dark"][data-subject="rus"]{--ink:#C9506E;--ink-active:#D86A86;--hl-06:rgba(210,90,118,.10);--hl-10:rgba(210,90,118,.16);--blob-1:rgba(210,90,118,.22)}
html[data-theme="dark"][data-subject="soc"]{--ink:#2F8F70;--ink-active:#3FA584;--hl-06:rgba(58,158,126,.10);--hl-10:rgba(58,158,126,.16);--blob-1:rgba(58,158,126,.22)}
html[data-theme="dark"][data-subject="eng"]{--ink:#8462C8;--ink-active:#9878D6;--hl-06:rgba(148,116,208,.10);--hl-10:rgba(148,116,208,.16);--blob-1:rgba(148,116,208,.22)}

*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    var(--bg);
  /* цветные пятна — в коробке постоянной высоты, а не во всю страницу:
     «circle at 6% -8%» считает центр и радиус от высоты body, и на длинном
     списке («1–4 классы», 6000+ px) пятно раздувалось и уезжало вверх — верх
     страницы темнел. 1460px — высота страницы на «Экзамены → ОГЭ», под её
     оттенок и подогнано; ниже коробки пятна уже прозрачные, повтор не нужен.
     Не background-attachment:fixed — на iPhone он молча становится scroll */
  background-size:100% 1460px,100% 1460px,24px 24px,24px 24px,auto;
  background-repeat:no-repeat,no-repeat,repeat,repeat,repeat;
  font-family:var(--font-ui);
  color:var(--pencil);
  min-height:100vh;
  padding:32px 16px 60px;
}
.wrap{max-width:760px;margin:0 auto}
h1{font-family:var(--font-ui);font-weight:700;letter-spacing:-.02em;font-size:clamp(26px,5vw,38px);color:var(--pencil);text-align:center;}
.sub{font-family:var(--font-ui);font-weight:500;text-align:center;color:var(--muted-2);font-size:15px;margin:4px 0 10px;}
/* сброс прогресса, совместный доступ и тема живут в меню «⋯» справа сверху
   (mathh-menu.js): раньше это были три отдельные квадратные кнопки в ряд, и
   каждая новая настройка добавила бы ещё одну. Пока скрипт не перенёс кнопки
   в меню, они лежат в разметке прямо в <body> — прячем, чтобы не мигали */
body > #resetProgressBtn, body > #themeToggle, body > #basketToggle{display:none}
/* на телефоне кнопки углов (капсула «Подборка · Доски · Работы» слева и
   «⋯» справа) сходятся к середине и налезали на заголовок: на узком экране
   отдаём им отдельную строку сверху, а левую капсулу кладём горизонтально */
@media (max-width:620px){
  body{padding-top:64px;}
  .lg-side{flex-direction:row;}
  .lg-side .lg-tip{left:50%;top:calc(100% + 10px);transform:translate(-50%,-6px);}
  .lg-side :hover > .lg-tip,.lg-side :focus-visible > .lg-tip{transform:translate(-50%,0);}
  h1{font-size:clamp(22px,7vw,30px);}
  /* вкладки липнут ниже строки с капсулами, а не под ними: при прокрутке
     «Экзамены / Классы / Основа» уезжали под «Подборку · Доски» и
     просвечивали сквозь стекло. 16px отступ капсулы + 46px её высота + зазор */
  .wrap .nav-bar{top:70px;}
}
.nav-bar{position:sticky;top:10px;z-index:100;margin-bottom:16px;}
/* предмет — уровнем выше вкладок «Экзамены / Классы / Основа»: у каждого
   предмета своё дерево разделов. Капсула не липнет при прокрутке вместе с
   вкладками — предмет за урок меняют редко, а место сверху на телефоне дорого */
.subj-row{display:flex;justify-content:center;margin:2px 0 14px;}
.subj-bar{display:inline-flex;gap:4px;padding:5px;border-radius:999px;background:var(--glass-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);box-shadow:var(--shadow);max-width:100%;}
.subj-btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:none;border-radius:999px;background:none;cursor:pointer;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--muted-3);white-space:nowrap;}
.subj-btn:hover{background:var(--hover-1);color:var(--pencil);}
.subj-btn .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;opacity:.55;}
.subj-btn.active{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 2px 10px rgba(20,30,60,.10);}
.subj-btn.active .dot{opacity:1;}
html[data-theme="dark"] .subj-btn.active{background:rgba(255,255,255,.14);color:#fff;}
/* точки — цвета самих предметов, а не текущего акцента: по ним предмет
   узнаётся ещё до того, как прочитано название */
.subj-btn[data-id="math"] .dot{background:#1E6FC2}
.subj-btn[data-id="rus"] .dot{background:#C2405F}
.subj-btn[data-id="soc"] .dot{background:#24896A}
.subj-btn[data-id="eng"] .dot{background:#7A52B8}
@media (max-width:620px){
  .subj-bar{flex-wrap:wrap;justify-content:center;border-radius:24px;}
  .subj-btn{padding:0 12px;font-size:13px;min-height:38px;}
}
.nav-tabs,.nav-subtabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--glass-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:18px;padding:7px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);}
.nav-subtabs{margin-top:8px;padding:6px;border-radius:16px;}
.nav-tab,.nav-subtab{flex:1 1 auto;text-align:center;font-family:var(--font-ui);color:var(--muted-3);background:none;border:none;border-radius:12px;padding:11px 12px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;}
.nav-tab{font-weight:700;font-size:15px;}
.nav-subtab{font-weight:600;font-size:13px;padding:8px 10px;}
.nav-tab:hover,.nav-subtab:hover{background:var(--hover-1);color:var(--pencil);}
.nav-tab.active,.nav-subtab.active{background:var(--ink);color:#fff;}
.nav-tab .tcount,.nav-subtab .tcount{opacity:.65;font-weight:500;}
.section-title{font-family:var(--font-ui);font-weight:700;font-size:14px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;padding:14px 22px 8px;}
.section-title:first-child{padding-top:18px;}
.section-title .count{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-1);text-transform:none;letter-spacing:0;margin-left:6px;}
.coming-soon-tab{font-family:var(--font-ui);font-weight:500;font-size:15px;color:var(--muted-3);text-align:center;padding:34px 20px;line-height:1.5;}
.topics{display:flex;flex-direction:column;gap:12px}
.topic{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:22px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);overflow:hidden;}
.topic-header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;background:none;border:none;cursor:pointer;text-align:left;font-family:var(--font-ui);font-weight:700;font-size:18px;color:var(--pencil);}
.topic-header:hover{background:var(--hover-1);}
.topic-header .count{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-1);margin-left:8px;}
.chevron{flex:0 0 auto;width:22px;height:22px;color:var(--ink);transition:transform .25s ease;}
.topic.open .chevron{transform:rotate(180deg)}
.topic-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease;
}
.topic.open .topic-body{max-height:600px}
.topic-list{
  padding:2px 10px 14px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.topic-list:first-child{padding-top:14px;}
.topic-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 12px;
  border-radius:10px;
  text-decoration:none;
  color:var(--pencil);
  transition:background .12s;
}
.topic-item:hover{background:var(--hover-2)}
.item-num{font-family:var(--font-mono);font-size:13px;color:var(--muted-1);min-width:22px;}
.item-name{font-size:17px}
.topic-item.soon{opacity:.5;cursor:default;pointer-events:none;}
/* «1–4 классы»: подзаголовок класса стоит между карточками блоков. Цвета —
   только переменные темы (--pencil, --muted-*), поэтому тёмная тема и цвет
   предмета подхватываются сами, отдельных правил под них нет */
.grade-section{display:flex;flex-direction:column;gap:12px;}
.grade-section + .grade-section{margin-top:18px;}
.grade-head{margin:6px 6px 0;font-family:var(--font-ui);font-weight:800;font-size:22px;line-height:1.2;color:var(--pencil);}
/* названия тем начальной школы длинные (до двух строк на телефоне): даём
   имени сжиматься и переноситься, а «скоро» остаётся справа одной строкой */
.grade-section .item-name{min-width:0;overflow-wrap:anywhere;line-height:1.3;}
.grade-section .topic-item.soon .item-soon{flex:0 0 auto;}
@media (max-width:620px){
  .grade-head{font-size:19px;}
  .grade-section .item-name{font-size:15px;}
  .grade-section .topic-item{gap:10px;padding:10px 8px;}
  .grade-section .section-title{padding-left:16px;padding-right:16px;}
}
.item-soon{margin-left:auto;font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-1);white-space:nowrap;}
.group{margin:2px 4px 6px;border-radius:14px;background:var(--hover-1);overflow:hidden;}
.group-header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:none;border:none;cursor:pointer;text-align:left;font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--pencil);}
.group-header:hover{background:var(--hover-2)}
.group-header .count{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-1);margin-left:8px;}
.group .chevron{width:18px;height:18px}
.group.open .chevron{transform:rotate(180deg)}
.group-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.group.open .group-body{max-height:400px}
.group-list{padding:0 8px 10px;display:flex;flex-direction:column;gap:2px;}
.group-list .topic-item{padding:10px 12px}
.feedback{margin-top:18px;background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;padding:12px 16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
.feedback-title{font-family:var(--font-ui);font-weight:500;font-size:13px;color:var(--muted-8);}
.feedback-btn{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-ui);font-weight:600;font-size:13px;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:2px;padding:2px 4px;border-radius:6px;transition:color .12s;}
.feedback-btn:hover{color:var(--ink-active)}
footer{text-align:center;font-family:var(--font-ui);font-weight:500;color:var(--muted-1);font-size:13px;margin-top:28px;}


/* «Доски», «Работы» и панель для доски — платформенные инструменты, отдельные
   от предметной навигации: одна стеклянная капсула .lg-side (liquid-glass.css),
   как панели iOS 26. «Подборка» раньше стояла здесь первой, но ей пользуются
   редко — теперь она последняя в меню «⋯», а капсула на телефоне короче.
   Здесь только то, что своё у каждой кнопки */
.basket-toggle.active{background:var(--ink);color:#fff;}
.basket-toggle .badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--teacher);color:#fff;font-family:var(--font-ui);font-size:10.5px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 2px var(--bg,#fff);}
/* панель совместного доступа открывается слева от капсулы меню, а не под
   ней: капсула со списком кнопок занимает правый край сверху вниз.
   body — чтобы перебить стиль, который session-share.js вставляет позже */
body .ts-share-pop{top:16px;right:calc(16px + var(--lg-menu-w, 48px) + 12px);max-height:calc(100vh - 32px);}

/* ───────── подборка ───────── */
.basket-toolbar{margin-bottom:14px;}
.basket-toolbar-row{display:flex;gap:10px;flex-wrap:wrap;padding:14px;}
.basket-btn{font-family:var(--font-ui);font-weight:600;font-size:14px;color:#fff;background:var(--ink);border:none;border-radius:12px;padding:10px 16px;cursor:pointer;transition:transform .15s;}
.basket-btn:active{transform:scale(.96)}
.basket-btn.quiet{background:var(--glass-strong);color:var(--ink);border:1px solid var(--glass-border);}
.basket-list{padding:4px 16px 14px;}
.basket-item{border-bottom:1px solid var(--glass-border);padding:12px 0;}
.basket-item:last-child{border-bottom:none;}
.basket-item-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;}
.basket-item-src{font-family:var(--font-ui);font-weight:600;font-size:12.5px;color:var(--muted-2);}
.basket-item-text{font-family:var(--font-ui);font-size:15px;color:var(--pencil);line-height:1.5;white-space:pre-line;}
.basket-item .rm{border:none;background:none;color:var(--teacher);font-size:18px;cursor:pointer;padding:2px 6px;line-height:1;}
.basket-item .rm:hover{opacity:.7}

/* вертикальная дробь в тексте задания — и на экране, и на печати;
   вложенные (многоэтажные) дроби рисуются чуть мельче внешней */
.basket-frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;margin:0 4px;line-height:1.2;font-variant-numeric:tabular-nums;position:relative;top:.12em;white-space:nowrap;}
.bf-n, .bf-d{padding:0 2px;}
.bf-bar{display:block;width:100%;border-top:1.5px solid currentColor;margin:2px 0;}
.basket-frac .basket-frac{font-size:.82em;margin:0 3px;}

/* список вариантов ответа — некликабельный пронумерованный список,
   отдельно от текста условия. Короткие числовые/дробные варианты (кнопки
   .mcq-options в тренажёре) выстраиваются в один ряд, как на самом экзамене
   — .basket-opt-list-inline; более длинные утверждения (верно/неверно)
   остаются по одному в строке — обычный .basket-opt-list */
.basket-opt-list{margin-top:8px;display:flex;flex-direction:column;gap:5px;}

/* точка центрируется точно на самой прямой (см. .bnl-line — top:22px,

<script>
/* прогрев шрифтов KaTeX: запускаем загрузку/декодирование всех начертаний
   сразу, как только страница начала рисоваться (см. скрытый блок выше),
   и как только браузер подтвердит готовность — открываем показ формул
   классом на <html>. Это защищает от ситуации, когда первая же открытая
   задача успевает отрисоваться раньше, чем нужный шрифт декодировался. */
(function(){
  function ready(){ document.documentElement.classList.add('katex-fonts-ready'); }
  if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
    document.fonts.ready.then(ready).catch(ready);
    setTimeout(ready, 1500); // подстраховка, если Font Loading API поведёт себя не так, как ожидается
  } else {
    ready();
  }
})();

<script>(function(){
  var btn=document.getElementById('themeToggle');
  // кнопка показывает, КУДА переключит: в тёмной теме — солнце «Светлая тема».
  // Значок и подпись перерисовываем по самому атрибуту data-theme: тему может
  // сменить и session-share.js (тема учителя у ученика), а он пишет в кнопку
  // эмодзи — наблюдатель ниже тут же возвращает наш значок
  function render(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    var label = dark ? 'Светлая тема' : 'Тёмная тема';
    btn.innerHTML = MathhIcons.html(dark ? 'theme_light' : 'theme_dark');
    btn.setAttribute('aria-label', label);
    var lab = btn.parentNode && btn.parentNode.querySelector('.lg-label');
    if (lab) lab.textContent = label;
  }
  function apply(t, persist){
    document.documentElement.setAttribute('data-theme', t);
    render();
    if (persist) { try{ localStorage.setItem('theme', t); }catch(e){} }
  }
  window.renderThemeToggle = render;
  new MutationObserver(render)
    .observe(document.documentElement, { attributes:true, attributeFilter:['data-theme'] });
  new MutationObserver(function(){ if (!btn.querySelector('svg.mi')) render(); })
    .observe(btn, { childList:true });
  apply(document.documentElement.getAttribute('data-theme') || 'light', false);
  btn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(cur, true);
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSystemChange = function(e){
      var explicit = false;
      try{ explicit = !!localStorage.getItem('theme'); }catch(err){}
      if (explicit) return;
      apply(e.matches ? 'dark' : 'light', false);
    };
    if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
    else if (mq.addListener) mq.addListener(onSystemChange);
  }
})();</script>

   них только экзамены, остальные вкладки появятся вместе с тренажёрами.
   soonText — что написать вместо пустого списка */
const SUBJECTS = [
  { id: 'math', title: 'Математика', nav: NAV },
  { id: 'rus',  title: 'Русский', nav: [
    { id: 'exams', title: 'Экзамены', subtabs: [
      { id: 'oge', title: 'ОГЭ', groups: [
        { title: 'Часть 1 — изложение', items: ['rus1'] },
        { title: 'Часть 2 — краткий ответ', items: rusIds(2, 12), continueNum: true },
        { title: 'Часть 3 — сочинение', items: ['rus13'], continueNum: true },
      ] },
      { id: 'ege', title: 'ЕГЭ', groups: [], soon: true,
        soonText: 'ЕГЭ по русскому готовим следующим — тоже по открытому банку ФИПИ.' },
    ] },
  ] },
  { id: 'soc',  title: 'Обществознание', nav: [
    { id: 'exams', title: 'Экзамены', subtabs: [
      { id: 'oge', title: 'ОГЭ', groups: [], soon: true,
        soonText: 'Обществознание готовим: первыми появятся задания открытого банка ФИПИ к ОГЭ.' },
      { id: 'ege', title: 'ЕГЭ', groups: [], soon: true },
    ] },
  ] },
  { id: 'eng',  title: 'Английский', nav: [
    { id: 'exams', title: 'Экзамены', subtabs: [
      { id: 'oge', title: 'ОГЭ', groups: [], soon: true,
        soonText: 'Английский готовим: первыми появятся задания открытого банка ФИПИ к ОГЭ.' },
      { id: 'ege', title: 'ЕГЭ', groups: [], soon: true },
    ] },
  ] },
];
const SUBJECT_KEY = 'ogeNav:subject';
let curSubject = document.documentElement.getAttribute('data-subject') || 'math';
if (!SUBJECTS.some(s => s.id === curSubject)) curSubject = 'math';
function curNav(){ return SUBJECTS.find(s => s.id === curSubject).nav; }
// ?subject=rus в адресе (кнопка «домой» в rus_oge.html) уже применён в <head>;
// запоминаем его и убираем из адреса, чтобы он не перебивал дальнейший выбор
(function(){
  try {
    const url = new URL(location.href);
    if (url.searchParams.has('subject')) {
      localStorage.setItem(SUBJECT_KEY, curSubject);
      url.searchParams.delete('subject');
      history.replaceState(history.state, '', url.pathname + url.search + url.hash);
    }
  } catch(e){}
})();

// ── полный сброс прогресса: все тренажёры хранят решённые примеры, медали
// и историю в localStorage под ключами вида 'ogeProg:<файл>:...' — все эти
// файлы открыты с одного домена/источника, поэтому localStorage у них общий,
// и достаточно одной кнопки здесь, чтобы стереть прогресс сразу везде. Это
// не трогает тему оформления и то, какая вкладка была открыта в этом меню.
document.getElementById('resetProgressBtn').onclick = () => {
  let keys = [];
  try { keys = Object.keys(localStorage).filter(k => k.startsWith('ogeProg:')); } catch(e){}
  if (keys.length === 0) { alert('Прогресс уже пуст — сбрасывать нечего.'); return; }
  const ok = confirm(
    `Стереть весь сохранённый прогресс, медали и историю по всем тренажёрам (${keys.length} записей)?\n` +
    `Пригодится перед занятием с новым учеником. Отменить это действие нельзя.`
  );
  if (!ok) return;
  try { keys.forEach(k => localStorage.removeItem(k)); } catch(e){}
  alert('Готово — прогресс по всем тренажёрам сброшен.');
};

// у математики ключ прежний — открытая вкладка у старых пользователей не сбросится;
// у остальных предметов свой ключ, чтобы при переключении туда и обратно
// возвращаться в ту же вкладку
const NAV_STATE_KEY = 'ogeNav:state';
function navStateKey(){ return curSubject === 'math' ? NAV_STATE_KEY : NAV_STATE_KEY + ':' + curSubject; }
let curTabId = null, curSubtabId = null;
// «Подборка» — платформенная функция, не часть предметной навигации,
// поэтому у неё свой флаг, а не место среди вкладок NAV (см. .basket-toggle)
let basketOpen = false;
// подвкладки, которые переименовали или слили: у кого в ogeNav:state осталась
// старая, открывается та, куда её содержимое переехало, а не первая попавшаяся
// (сейчас «1 класс» → «1–4 классы»; так же потом сольются 5–9 классы)
const SUBTAB_MOVED = { g1: 'g1_4' };
function restoreNavState(){
  curTabId = null; curSubtabId = null;
  const nav = curNav();
  let moved = false;
  try {
    const saved = JSON.parse(localStorage.getItem(navStateKey()) || 'null');
    if (saved && nav.some(t => t.id === saved.tabId)) {
      curTabId = saved.tabId; curSubtabId = saved.subtabId || null;
      if (SUBTAB_MOVED[curSubtabId]) { curSubtabId = SUBTAB_MOVED[curSubtabId]; moved = true; }
    }
  } catch(e){}
  if (!curTabId) curTabId = nav[0].id;
  // перезаписываем сразу, чтобы старый id не жил в хранилище до первого клика
  if (moved) saveNavState();
}
restoreNavState();
function saveNavState(){
  try { localStorage.setItem(navStateKey(), JSON.stringify({ tabId: curTabId, subtabId: curSubtabId })); } catch(e){}
}

function renderSubjects(){
  const bar = document.getElementById('subjBar');
  bar.innerHTML = SUBJECTS.map(s =>
    `<button class="subj-btn${s.id === curSubject ? ' active' : ''}" type="button" data-id="${s.id}" aria-pressed="${s.id === curSubject}">` +
    `<span class="dot" aria-hidden="true"></span><span>${s.title}</span></button>`).join('');
  bar.querySelectorAll('.subj-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.id === curSubject && !basketOpen) return;
      curSubject = btn.dataset.id;
      document.documentElement.setAttribute('data-subject', curSubject);
      try { localStorage.setItem(SUBJECT_KEY, curSubject); } catch(e){}
      basketOpen = false;
      restoreNavState();
      renderSubjects();
      renderNav();
      renderContent();
    });
  });
}

/* ii — порядковый номер внутри группы; base сдвигает нумерацию, чтобы в
   разделе, разбитом на несколько групп подряд (ЕГЭ: часть 1 и часть 2),
   серый счётчик слева продолжался, а не начинался заново — иначе рядом с
   «№14» стояло бы «01» */
function itemHTML(it, ii, base){
  const num = String((base || 0) + ii + 1).padStart(2,'0');
  if(!it.href){
    return `
      <div class="topic-item soon" aria-disabled="true">
        <span class="item-num">${num}</span>
        <span class="item-name">${it.name}</span>
        <span class="item-soon">скоро</span>
      </div>
    `;
  }
  return `
    <a class="topic-item" href="${it.href}">
      <span class="item-num">${num}</span>
      <span class="item-name">${it.name}</span>
    </a>
  `;
}

function groupsCount(groups){
  return (groups||[]).reduce((sum,g)=>sum + g.items.filter(id=>TRAINERS[id] && TRAINERS[id].href).length, 0);
}
/* тема программы (CURRICULUM) → то же, что запись TRAINERS: у заглушки нет
   href, и itemHTML рисует её «скоро» тем же путём, что и неготовые номера
   русского. Неизвестный id → null: выпадает из списка, а не становится
   заглушкой с чужим названием */
function curriculumItem(x){
  if (typeof x === 'string') return { name: x, href: null };
  return (x && TRAINERS[x.id]) || null;
}
// в счётчик « · N» идут только живые тренажёры: сотня заглушек иначе
// раздула бы цифру у «Классов», а там считают именно готовое
function sectionsCount(sections){
  return (sections||[]).reduce((sum,s)=>sum + (s.groups||[]).reduce((n,g)=>
    n + g.items.filter(x => typeof x !== 'string' && TRAINERS[x.id] && TRAINERS[x.id].href).length, 0), 0);
}
function defCount(def){ return def.sections ? sectionsCount(def.sections) : groupsCount(def.groups); }

function getCurTab(){ const nav = curNav(); return nav.find(t => t.id === curTabId) || nav[0]; }
function getCurSubtab(){
  const tab = getCurTab();
  if (!tab.subtabs) return null;
  return tab.subtabs.find(s => s.id === curSubtabId) || tab.subtabs[0];
}
// то, что реально сейчас показываем: либо подвкладка, либо сама вкладка (если плоская)
function getActiveDef(){
  const tab = getCurTab();
  return tab.subtabs ? getCurSubtab() : tab;
}

function updateBasketToggle(){
  const btn = document.getElementById('basketToggle');
  const badge = document.getElementById('basketBadge');
  if (!btn) return;
  const n = Basket.count();
  btn.classList.toggle('active', basketOpen);
  if (n > 0) { badge.style.display = 'flex'; badge.textContent = n > 99 ? '99+' : String(n); }
  else { badge.style.display = 'none'; }
}

function renderNav(){
  const mainEl = document.getElementById('mainTabs');
  mainEl.innerHTML = curNav().map(t => {
    const n = t.subtabs ? t.subtabs.reduce((s,st)=>s+defCount(st),0) : defCount(t);
    // «· 0» у предмета, который ещё готовим, читается как ошибка — нуль не пишем
    return `<button class="nav-tab${(!basketOpen && t.id===curTabId)?' active':''}" data-id="${t.id}">${t.title}${n ? `<span class="tcount"> · ${n}</span>` : ''}</button>`;
  }).join('');
  mainEl.querySelectorAll('.nav-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      curTabId = btn.dataset.id;
      basketOpen = false;
      const tab = getCurTab();
      curSubtabId = tab.subtabs ? tab.subtabs[0].id : null;
      saveNavState();
      renderNav();
      renderContent();
    });
  });
  updateBasketToggle();

  const subEl = document.getElementById('subTabs');
  const tab = getCurTab();
  if (tab.subtabs) {
    if (!tab.subtabs.some(s=>s.id===curSubtabId)) curSubtabId = tab.subtabs[0].id;
    subEl.style.display = 'flex';
    subEl.innerHTML = tab.subtabs.map(s => {
      const n = defCount(s);
      return `<button class="nav-subtab${s.id===curSubtabId?' active':''}" data-id="${s.id}">${s.title}${s.soon?'':` <span class="tcount"> · ${n}</span>`}</button>`;
    }).join('');
    subEl.querySelectorAll('.nav-subtab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        curSubtabId = btn.dataset.id;
        basketOpen = false;
        saveNavState();
        renderNav();
        renderContent();
      });
    });
  } else {
    subEl.style.display = 'none';
    subEl.innerHTML = '';
  }
}

function renderContent(){
  const el = document.getElementById('topics');
  if (basketOpen) { renderBasketView(); return; }
  const def = getActiveDef();
  if (def && !def.soon && def.sections) { renderSections(el, def.sections); return; }
  if (!def || def.soon || !(def.groups||[]).length) {
    const text = (def && def.soonText) || 'Здесь пока нет тренажёров — они появятся в числе первых, когда будут готовы.';
    el.innerHTML = `<div class="topic"><div class="coming-soon-tab">🚧 ${text}</div></div>`;
    return;
  }
  let numBase = 0;
  el.innerHTML = def.groups.map(g => {
    const items = g.items.map(id => TRAINERS[id]).filter(Boolean);
    const base = g.continueNum ? numBase : 0;
    numBase += items.length;
    return `
      <div class="topic">
        ${g.title ? `<div class="section-title">${g.title}</div>` : ''}
        <div class="topic-list">
          ${items.map((it, ii) => itemHTML(it, ii, base)).join('')}
        </div>
      </div>
    `;
  }).join('');
}

/* подвкладка по классам: секция без title (5–11 класс, где подвкладка
   и есть класс) рисуется без подзаголовка. Подзаголовок класса — отдельной строкой между
   карточками, а не ещё одним уровнем внутри карточки, иначе на телефоне
   три вложенных рамки съедают ширину под длинные названия тем. Блоки класса —
   обычные карточки .topic, как группы в остальных вкладках */
function renderSections(el, sections){
  el.innerHTML = sections.map(s => `
    <section class="grade-section" data-grade="${s.id}">
      ${s.title ? `<h2 class="grade-head">${s.title}</h2>` : ''}
      ${(s.groups||[]).map(g => {
        const items = g.items.map(curriculumItem).filter(Boolean);
        return `
          <div class="topic">
            <div class="section-title">${g.title}</div>
            <div class="topic-list">
              ${items.map((it, ii) => itemHTML(it, ii, 0)).join('')}
            </div>
          </div>
        `;
      }).join('')}
    </section>
  `).join('');
}

/* ───────── подборка ─────────
   собирается кнопкой «📥 В подборку» на страницах тренажёров (см. basket-core.js),
   здесь только просмотр/удаление/печать. Без seed/PDF/ключа ответов — это
   первая, простая версия. */
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function basketItemHTML(it){
  const trainer = TRAINERS[it.trainerId];
  const base = trainer ? trainer.name : (it.trainerTitle || it.file || '');
  const src = (it.modeTitle && it.modeTitle !== base) ? (base + ' · ' + it.modeTitle) : base;
  return `
    <div class="basket-item">
      <div class="basket-item-head">
        <span class="basket-item-src">${escapeHtml(src)}</span>
        <button class="rm" data-id="${it.id}" title="Убрать">×</button>
      </div>
      <div class="basket-item-text">${it.html ? it.html : escapeHtml(it.text)}</div>
    </div>
  `;
}
let basketSortDir = 'desc'; // 'desc' = сначала новые (по умолчанию), 'asc' = сначала первые добавленные
function renderBasketView(){
  const el = document.getElementById('topics');
  const all = Basket.all().slice(); // Basket.all() отдаёт в порядке добавления, от первого к последнему
  const items = basketSortDir === 'desc' ? all.reverse() : all;
  if (!items.length) {
    el.innerHTML = `<div class="topic"><div class="coming-soon-tab">Пока пусто. Открой любой тренажёр, реши или просто сгенерируй задание и нажми «📥 В подборку» под ним — оно появится здесь.</div></div>`;
    return;
  }
  el.innerHTML = `
    <div class="topic basket-toolbar">
      <div class="basket-toolbar-row">
        <button class="basket-btn" id="basketPrintBtn">🖨 Печать</button>
        <button class="basket-btn quiet" id="basketSortBtn">${basketSortDir === 'desc' ? '⬇️ Сначала новые' : '⬆️ Сначала старые'}</button>
        <button class="basket-btn quiet" id="basketClearBtn">Очистить всё</button>
      </div>
    </div>
    <div class="topic basket-list" id="basketList">
      ${items.map(basketItemHTML).join('')}
    </div>
  `;
  resolveBasketTex(document.getElementById('basketList'));
  document.getElementById('basketPrintBtn').onclick = () => window.print();
  document.getElementById('basketSortBtn').onclick = () => {
    basketSortDir = basketSortDir === 'desc' ? 'asc' : 'desc';
    renderBasketView();
  };
  document.getElementById('basketClearBtn').onclick = () => {
    if (!confirm('Убрать все задания из подборки? Это нельзя отменить.')) return;
    Basket.clear(); renderNav(); renderContent();
  };
  el.querySelectorAll('.basket-item .rm').forEach(btn => {
    btn.onclick = () => { Basket.remove(btn.dataset.id); renderNav(); renderContent(); };
  });
}

document.getElementById('basketToggle').addEventListener('click', () => {
  basketOpen = !basketOpen;
  renderNav();
  renderContent();
});

renderSubjects();
renderNav();
renderContent();

/* ═══ Промпт №30: совместный доступ на главной странице — сессию теперь
   можно запускать не только из отдельного тренажёра, но и отсюда, а
   переход по карточке тренажёра во время активной сессии синхронный:
   у присоединившегося (не главного) он всегда заблокирован (перейти может
   только учитель — см. studentRestricted('navigate') в session-share.js),
   а у главного уводит с собой всех подключённых учеников. У главной
   страницы нет собственного «состояния задания», поэтому getState/applyState
   здесь пустые — session-share нужен только ради кода сессии, кнопки
   «Совместный доступ» и синхронной навигации. ═══ */
if (window.TrainerSession) {
  window.TrainerSession.init({ trainer: 'index', getState: () => ({}), applyState: () => {} });
  window.TrainerSession.mountShareButton();
}
// Промпт №11 нового списка: «Доски» — тоже переход группы: ученики уходят
// следом и видят доску учителя (board-stage.js)
(function () {
  const a = document.querySelector('a.boards-toggle[href]');
  if (!a || !window.TrainerSession) return;
  a.addEventListener('click', function (e) {
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    window.TrainerSession.guardStudentAction('navigate', function () {
      window.TrainerSession.navigateTo('boards.html');
    })();
  });
})();
// делегирование на контейнер, а не на каждую карточку по отдельности —
// список тренажёров перерисовывается заново при каждом renderContent()
document.getElementById('topics').addEventListener('click', function (e) {
  if (!window.TrainerSession) return; // модуль не загрузился — обычная ссылка сработает сама
  const a = e.target.closest('a.topic-item[href]');
  if (!a) return;
  e.preventDefault();
  const href = a.getAttribute('href');
  window.TrainerSession.guardStudentAction('navigate', function () {
    window.TrainerSession.navigateTo(href);
  })();
});
</script>
