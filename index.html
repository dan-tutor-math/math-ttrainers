<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E1A">
<script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёры — Школа репетиторов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:'Onest',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --font-mono:ui-monospace,-apple-system,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#EEF1F7;
  --blob-1:rgba(120,150,255,.16);
  --blob-2:rgba(190,150,230,.14);
  --card:rgba(255,255,255,.8);
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.85);
  --glass-inset:rgba(255,255,255,.55);
  --hl:var(--hl-14);
  --hover-1:var(--hl-06);
  --hover-2:var(--hl-10);
  --muted-1:#8E8E93;
  --muted-2:#6E6E73;
  --muted-3:#48484A;
  --muted-4:#3A3A3C;
  --muted-5:#1D1D1F;
  --muted-6:#8E8E93;
  --muted-7:#C7C7CC;
  --muted-8:#8E8E93;
  --paper:#FDFCF7;
  --grid:#DCE4F0;
  --margin-red:#FF9F0A;
  --ink:#004C99;
  --ink-active:#003A75;
  --pencil:#1D1D1F;
  --teacher:#FF3B30;
  --ok:#248A3D;
  --moved:#5AC8FA;
  --shadow:0 10px 34px rgba(20,30,60,.08);
  --hl-06:rgba(0,76,153,.06);
  --hl-10:rgba(0,76,153,.10);
  --hl-14:var(--hl);
}

html[data-theme="dark"]{
  --bg:#0B0E1A;
  --blob-1:rgba(90,110,255,.22);
  --blob-2:rgba(150,90,220,.18);
  --paper:#151A2C;
  --card:rgba(30,37,64,.82);
  --glass:rgba(40,46,74,.5);
  --glass-strong:rgba(46,53,84,.65);
  --glass-border:rgba(255,255,255,.12);
  --glass-inset:rgba(255,255,255,.07);
  --hl:rgba(40,110,214,.26);
  --grid:#232A44;
  --margin-red:#FF9F0A;
  --ink:#2E7DE0;
  --ink-active:#4A93F0;
  --pencil:#F2F3F5;
  --teacher:#FF6961;
  --ok:#3E8E5B;
  --moved:#64D2FF;
  --shadow:0 10px 40px rgba(0,0,0,.55);
  --hl-06:rgba(46,125,224,.1);
  --hl-10:rgba(46,125,224,.16);
  --hl-14:var(--hl);
  --muted-1:#9A9AA2;
  --muted-2:#9A9AA2;
  --muted-3:#AEAEB4;
  --muted-4:#C7C7CC;
  --muted-5:#F2F3F5;
  --muted-6:#9A9AA2;
  --muted-7:#3A3F55;
  --muted-8:#9A9AA2;
  --hover-1:rgba(127,160,255,.08);
  --hover-2:rgba(127,160,255,.14);
}
html[data-theme="dark"] input{background:var(--card)}

*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    var(--bg);
  background-size:auto,auto,24px 24px,24px 24px,auto;
  font-family:var(--font-ui);
  color:var(--pencil);
  min-height:100vh;
  padding:32px 16px 60px;
}
.wrap{max-width:760px;margin:0 auto}
h1{font-family:var(--font-ui);font-weight:700;letter-spacing:-.02em;font-size:clamp(26px,5vw,38px);color:var(--pencil);text-align:center;}
.sub{font-family:var(--font-ui);font-weight:500;text-align:center;color:var(--muted-2);font-size:15px;margin:4px 0 10px;}
.reset-progress-link{display:block;margin:0 auto 18px;font-family:var(--font-ui);font-weight:600;font-size:12.5px;color:var(--muted-2);background:none;border:none;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:2px 4px;transition:color .12s;}
.reset-progress-link:hover{color:var(--ink)}
.nav-bar{position:sticky;top:10px;z-index:100;margin-bottom:16px;}
.nav-tabs,.nav-subtabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--glass-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:18px;padding:7px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);}
.nav-subtabs{margin-top:8px;padding:6px;border-radius:16px;}
.nav-tab,.nav-subtab{flex:1 1 auto;text-align:center;font-family:var(--font-ui);color:var(--muted-3);background:none;border:none;border-radius:12px;padding:11px 12px;cursor:pointer;transition:background .15s,color .15s;white-space:nowrap;}
.nav-tab{font-weight:700;font-size:15px;}
.nav-subtab{font-weight:600;font-size:13px;padding:8px 10px;}
.nav-tab:hover,.nav-subtab:hover{background:var(--hover-1);color:var(--pencil);}
.nav-tab.active,.nav-subtab.active{background:var(--ink);color:#fff;}
.nav-tab .tcount,.nav-subtab .tcount{opacity:.65;font-weight:500;}
.section-title{font-family:var(--font-ui);font-weight:700;font-size:14px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;padding:14px 22px 8px;}
.section-title:first-child{padding-top:18px;}
.section-title .count{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-1);text-transform:none;letter-spacing:0;margin-left:6px;}
.coming-soon-tab{font-family:var(--font-ui);font-weight:500;font-size:15px;color:var(--muted-3);text-align:center;padding:34px 20px;line-height:1.5;}
.topics{display:flex;flex-direction:column;gap:12px}
.topic{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:22px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);overflow:hidden;}
.topic-header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;background:none;border:none;cursor:pointer;text-align:left;font-family:var(--font-ui);font-weight:700;font-size:18px;color:var(--pencil);}
.topic-header:hover{background:var(--hover-1);}
.topic-header .count{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-1);margin-left:8px;}
.chevron{flex:0 0 auto;width:22px;height:22px;color:var(--ink);transition:transform .25s ease;}
.topic.open .chevron{transform:rotate(180deg)}
.topic-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .3s ease;
}
.topic.open .topic-body{max-height:600px}
.topic-list{
  padding:2px 10px 14px;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.topic-list:first-child{padding-top:14px;}
.topic-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 12px;
  border-radius:10px;
  text-decoration:none;
  color:var(--pencil);
  transition:background .12s;
}
.topic-item:hover{background:var(--hover-2)}
.item-num{font-family:var(--font-mono);font-size:13px;color:var(--muted-1);min-width:22px;}
.item-name{font-size:17px}
.topic-item.soon{opacity:.5;cursor:default;pointer-events:none;}
.item-soon{margin-left:auto;font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-1);white-space:nowrap;}
.group{margin:2px 4px 6px;border-radius:14px;background:var(--hover-1);overflow:hidden;}
.group-header{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:none;border:none;cursor:pointer;text-align:left;font-family:var(--font-ui);font-weight:600;font-size:15px;color:var(--pencil);}
.group-header:hover{background:var(--hover-2)}
.group-header .count{font-family:var(--font-ui);font-weight:500;font-size:12px;color:var(--muted-1);margin-left:8px;}
.group .chevron{width:18px;height:18px}
.group.open .chevron{transform:rotate(180deg)}
.group-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.group.open .group-body{max-height:400px}
.group-list{padding:0 8px 10px;display:flex;flex-direction:column;gap:2px;}
.group-list .topic-item{padding:10px 12px}
.feedback{margin-top:18px;background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;padding:12px 16px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;}
.feedback-title{font-family:var(--font-ui);font-weight:500;font-size:13px;color:var(--muted-8);}
.feedback-btn{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-ui);font-weight:600;font-size:13px;background:none;color:var(--ink);text-decoration:underline;text-underline-offset:2px;padding:2px 4px;border-radius:6px;transition:color .12s;}
.feedback-btn:hover{color:var(--ink-active)}
footer{text-align:center;font-family:var(--font-ui);font-weight:500;color:var(--muted-1);font-size:13px;margin-top:28px;}

.theme-toggle{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;}
.theme-toggle:hover{border-color:var(--ink)}
.theme-toggle:active{transform:scale(.92)}

/* «Подборка» — отдельная от предметной навигации, платформенная функция,
   поэтому вынесена квадратной иконкой в левый верхний угол, зеркально
   переключателю темы справа */
.basket-toggle{position:fixed;top:16px;left:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s, background .12s, color .12s;}
.basket-toggle svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.basket-toggle:hover{border-color:var(--ink)}
.basket-toggle:active{transform:scale(.92)}
.basket-toggle.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.basket-toggle .badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--teacher);color:#fff;font-family:var(--font-ui);font-size:10.5px;font-weight:700;display:none;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 2px var(--bg,#fff);}

/* «Доски» — второй платформенный инструмент, сразу под «Подборкой» в том же левом углу */
.boards-toggle{position:fixed;top:64px;left:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);z-index:200;transition:transform .15s, border-color .12s;text-decoration:none;}
.boards-toggle svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.boards-toggle:hover{border-color:var(--ink)}
.boards-toggle:active{transform:scale(.92)}

/* ───────── подборка ───────── */
.basket-toolbar{margin-bottom:14px;}
.basket-toolbar-row{display:flex;gap:10px;flex-wrap:wrap;padding:14px;}
.basket-btn{font-family:var(--font-ui);font-weight:600;font-size:14px;color:#fff;background:var(--ink);border:none;border-radius:12px;padding:10px 16px;cursor:pointer;transition:transform .15s;}
.basket-btn:active{transform:scale(.96)}
.basket-btn.quiet{background:var(--glass-strong);color:var(--ink);border:1px solid var(--glass-border);}
.basket-list{padding:4px 16px 14px;}
.basket-item{border-bottom:1px solid var(--glass-border);padding:12px 0;}
.basket-item:last-child{border-bottom:none;}
.basket-item-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;}
.basket-item-src{font-family:var(--font-ui);font-weight:600;font-size:12.5px;color:var(--muted-2);}
.basket-item-text{font-family:var(--font-ui);font-size:15px;color:var(--pencil);line-height:1.5;white-space:pre-line;}
.basket-item .rm{border:none;background:none;color:var(--teacher);font-size:18px;cursor:pointer;padding:2px 6px;line-height:1;}
.basket-item .rm:hover{opacity:.7}

/* вертикальная дробь в тексте задания — и на экране, и на печати;
   вложенные (многоэтажные) дроби рисуются чуть мельче внешней */
.basket-frac{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;vertical-align:middle;margin:0 4px;line-height:1.2;font-variant-numeric:tabular-nums;position:relative;top:.12em;white-space:nowrap;}
.bf-n, .bf-d{padding:0 2px;}
.bf-bar{display:block;width:100%;border-top:1.5px solid currentColor;margin:2px 0;}
.basket-frac .basket-frac{font-size:.82em;margin:0 3px;}

/* список вариантов ответа — некликабельный пронумерованный список,
   отдельно от текста условия. Короткие числовые/дробные варианты (кнопки
   .mcq-options в тренажёре) выстраиваются в один ряд, как на самом экзамене
   — .basket-opt-list-inline; более длинные утверждения (верно/неверно)
   остаются по одному в строке — обычный .basket-opt-list */
.basket-opt-list{margin-top:8px;display:flex;flex-direction:column;gap:5px;}
.basket-opt-list-inline{flex-direction:row;flex-wrap:wrap;gap:8px 26px;justify-content:center;}
.basket-opt{padding:1px 0;}

/* блочный элемент условия (заголовок, отдельный абзац и т.п.) — реально
   начинается с новой строки, а не склеивается с соседним текстом */
.basket-block{margin:4px 0;}
.basket-block:first-child{margin-top:0;}
.basket-block:last-child{margin-bottom:0;}

/* картинка из теории/задания — того же небольшого размера, что и в самом
   тренажёре, а не растянута на всю ширину карточки; несколько картинок
   подряд встают в ряд, как и в оригинале */
.basket-img{display:inline-block;width:160px;max-width:42%;height:auto;margin:6px 10px 6px 0;vertical-align:top;border-radius:4px;}
.basket-fig-row{margin-bottom:8px;}

/* таблица — тот же чёрно-белый стиль, что и у остального задания */
.basket-table{border-collapse:collapse;margin:10px 0;font-family:var(--font-ui);font-size:14px;}
.basket-table td, .basket-table th{border:1px solid currentColor;padding:6px 10px;text-align:center;}
.basket-table th{font-weight:700;}

/* числовая прямая — реконструирована из координат (left:%), не текст.
   basket-numline-row центрирует её и ставит на отдельную строку — не
   встык к предложению с условием */
.basket-numline-row{margin:14px 0;text-align:center;}
.basket-numline{position:relative;display:inline-block;vertical-align:middle;width:220px;max-width:80%;height:44px;margin:8px 6px;}
.bnl-line{position:absolute;left:2px;right:2px;top:22px;height:2px;background:currentColor;}
.bnl-tick{position:absolute;top:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;}
.bnl-tickmark{width:2px;height:16px;background:currentColor;}
.bnl-ticklabel{font-size:13px;margin-top:2px;white-space:nowrap;}
/* точка центрируется точно на самой прямой (см. .bnl-line — top:22px,
   высота 2px, центр на 23px), а не «пришивается» строкой ниже подписи —
   подпись подвешена над точкой отдельным абсолютным блоком, не занимая
   места в потоке (та же схема, что и в живом виджете тренажёра) */
.bnl-point{position:absolute;top:23px;transform:translate(-50%,-50%);}
.bnl-dot{display:block;width:9px;height:9px;border-radius:50%;background:currentColor;}
.bnl-plabel{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:5px;font-size:13px;font-weight:700;white-space:nowrap;}

@media print{
  body{background:#fff !important;padding:0;}
  h1, .sub, .reset-progress-link, .nav-bar, .basket-toolbar, .basket-item .rm, .feedback, footer, .theme-toggle, .basket-toggle, .boards-toggle{display:none !important;}
  .topic, .basket-item{background:#fff !important;border:none !important;box-shadow:none !important;backdrop-filter:none !important;border-radius:0 !important;}
  .basket-item{border-bottom:1px solid #000 !important;padding:6px 0;}
  body, .wrap, .basket-item-text, .basket-item-src{color:#000 !important;}
  .basket-item-text{font-size:12.5px;line-height:1.35;}
  .basket-frac{margin:0 4px;font-size:1.05em;}
  .bf-bar{border-top:1.5px solid #000;margin:2px 0;}
  .basket-opt-list{margin-top:6px;gap:3px;}
  .basket-img{width:150px;max-width:36%;margin:4px 8px 4px 0;}
  .basket-fig-row{margin-bottom:4px;}
  .basket-table{font-size:11px;margin:6px 0;}
  .basket-table td, .basket-table th{padding:3px 6px;}
}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" title="Светлая/тёмная тема" aria-label="Переключить тему">🌙</button>
<button class="basket-toggle" id="basketToggle" title="Подборка" aria-label="Подборка">
  <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
  <span class="badge" id="basketBadge">0</span>
</button>
<a class="boards-toggle" href="boards.html" title="Доски" aria-label="Доски">
  <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="10" x2="9" y2="20"/></svg>
</a>
<script>(function(){
  var btn=document.getElementById('themeToggle');
  function apply(t, persist){
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '\u2600\uFE0F' : '\uD83C\uDF19';
    if (persist) { try{ localStorage.setItem('theme', t); }catch(e){} }
  }
  apply(document.documentElement.getAttribute('data-theme') || 'light', false);
  btn.addEventListener('click', function(){
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(cur, true);
  });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onSystemChange = function(e){
      var explicit = false;
      try{ explicit = !!localStorage.getItem('theme'); }catch(err){}
      if (explicit) return;
      apply(e.matches ? 'dark' : 'light', false);
    };
    if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
    else if (mq.addListener) mq.addListener(onSystemChange);
  }
})();</script>
<div class="wrap">
  <h1>Тренажёры</h1>
  <div class="sub">выбери раздел — список тренажёров откроется ниже</div>
  <button class="reset-progress-link" id="resetProgressBtn" title="Стереть весь сохранённый прогресс, медали и историю по всем тренажёрам — например, перед занятием с новым учеником">🔁 Сбросить весь прогресс (новый ученик)</button>

  <div class="nav-bar" id="navBar">
    <div class="nav-tabs" id="mainTabs"></div>
    <div class="nav-subtabs" id="subTabs" style="display:none"></div>
  </div>

  <div class="topics" id="topics"></div>

  <div class="feedback">
    <span class="feedback-title">Нашли ошибку или есть идея?</span>
    <a class="feedback-btn" href="https://t.me/tutor_mathh" target="_blank" rel="noopener">Написать в телеграм →</a>
  </div>

  <footer>Ещё темы появятся здесь по мере готовности</footer>
</div>

<script src="basket-core.js"></script>
<script>
/* ───────── реестр тренажёров ─────────
   каждый тренажёр описан один раз, здесь; чтобы добавить новый — добавь запись сюда,
   а в NAV просто ссылайся на её id (одну и ту же ссылку можно вставлять в сколько
   угодно вкладок, файл при этом не копируется) */
const TRAINERS = {
  oge1_5:   { name: '№1–5. Практические задачи',      href: 'oge1_5.html',            eq: 'шины, тарифы, участок…' },
  oge6:     { name: '№6. Числа и вычисления',         href: 'oge6.html',              eq: '1/10 + 29/20 = ?' },
  oge7:     { name: '№7. Сравнение и оценка чисел',   href: 'oge7.html',              eq: '5 < √27 < 6' },
  oge8:     { name: '№8. Выражения и формулы',        href: 'oge8.html',              eq: 'a²−b² = (a−b)(a+b)' },
  oge9:     { name: '№9. Уравнения и неравенства',    href: 'oge9.html',              eq: '3x²−7x+2 = 0' },
  oge10:    { name: '№10. Теория вероятности',        href: 'oge10.html',             eq: 'P(A) = 5⁄20 = 0,25' },
  oge11:    { name: '№11. Графики функций',           href: 'oge11.html',             eq: 'y = kx + b' },
  oge12:    { name: '№12. Вычисления по формулам',    href: 'oge12.html',             eq: 'v = v₀ + at' },
  oge13:    { name: '№13. Неравенства',               href: 'oge13.html',             eq: 'x² − 9 ≤ 0 ⟺ [−3; 3]' },
  oge14:    { name: '№14. Прогрессии',                href: 'oge14.html',             eq: 'aₙ = a₁ + (n−1)d' },
  oge15_18: { name: '№15–18. Геометрия',              href: 'oge15_18.html',          eq: 'S, P, теорема Пифагора' },
  oge19:    { name: '№19. Верные утверждения',        href: 'oge19.html',             eq: 'верно / неверно' },
  add_col:  { name: 'Сложение в столбик',             href: 'addition.html',          eq: '999 + 1 = ?' },
  sub_col:  { name: 'Вычитание в столбик',            href: 'subtraction.html',       eq: '700 − 458 = ?' },
  mul_col:  { name: 'Умножение в столбик',            href: 'multiplication.html',    eq: '347 × 26 = ?' },
  div_col:  { name: 'Деление в столбик',              href: 'division.html',          eq: '4826 : 7 = ?' },
  linear:   { name: 'Линейные уравнения',             href: 'linear.html',            eq: '3(2x−5)+x = 2x−7' },
  quadratic:{ name: 'Квадратные уравнения',           href: 'quadratic.html',         eq: '2x² − 7x + 3 = 0' },
  frac_mul: { name: 'Умножение дробей',               href: 'fraction_multiply.html', eq: '4⁄9 × 3⁄8 = ?' },
  frac_div: { name: 'Деление дробей',                 href: 'fraction_divide.html',   eq: '2⁄3 ÷ 4⁄5 = ?' },
  neg_pos:  { name: 'Сложение и вычитание положительных и отрицательных чисел', href: null, eq: '−7 + 12 = ?' },
};

/* ───────── дерево разделов ─────────
   у вкладки либо есть subtabs (тогда открываются они), либо сразу groups (плоская вкладка).
   soon:true — вкладка пока без тренажёров ("скоро"). items — id-шники из TRAINERS. */
const NAV = [
  { id: 'exams', title: 'Экзамены', subtabs: [
    { id: 'oge',      title: 'ОГЭ',           groups: [ { items: ['oge1_5','oge6','oge7','oge8','oge9','oge10','oge11','oge12','oge13','oge14','oge15_18','oge19'] } ] },
    { id: 'ege_prof', title: 'ЕГЭ профиль',   groups: [], soon: true },
    { id: 'ege_base', title: 'ЕГЭ база',      groups: [], soon: true },
    { id: 'vpr',      title: 'ВПР / МЦКО',    groups: [], soon: true },
  ]},
  { id: 'grades', title: 'Классы', subtabs: [
    { id: 'g5', title: '5 класс', groups: [
      { title: 'Действия с числами', items: ['add_col','sub_col','mul_col','div_col'] },
      { title: 'Действия с дробями', items: ['frac_mul','frac_div'] },
    ]},
    { id: 'g6', title: '6 класс', groups: [
      { title: 'Положительные и отрицательные числа', items: ['neg_pos'] },
      { title: 'Действия с дробями', items: ['frac_mul','frac_div','oge6'] },
    ]},
    { id: 'g7', title: '7 класс', groups: [
      { title: 'Уравнения', items: ['linear'] },
    ]},
    { id: 'g8', title: '8 класс', groups: [
      { title: 'Уравнения', items: ['quadratic'] },
    ]},
    { id: 'g9', title: '9 класс', groups: [
      { title: 'Подготовка к ОГЭ', items: ['oge9','oge10','oge13','oge14'] },
    ]},
  ]},
  { id: 'base', title: 'Основа', groups: [
    { title: 'Действия с числами', items: ['add_col','sub_col','mul_col','div_col'] },
    { title: 'Положительные и отрицательные числа', items: ['neg_pos'] },
    { title: 'Действия с дробями', items: ['frac_mul','frac_div','oge6'] },
    { title: 'Уравнения', items: ['linear','quadratic'] },
  ]},
];

// ── полный сброс прогресса: все тренажёры хранят решённые примеры, медали
// и историю в localStorage под ключами вида 'ogeProg:<файл>:...' — все эти
// файлы открыты с одного домена/источника, поэтому localStorage у них общий,
// и достаточно одной кнопки здесь, чтобы стереть прогресс сразу везде. Это
// не трогает тему оформления и то, какая вкладка была открыта в этом меню.
document.getElementById('resetProgressBtn').onclick = () => {
  let keys = [];
  try { keys = Object.keys(localStorage).filter(k => k.startsWith('ogeProg:')); } catch(e){}
  if (keys.length === 0) { alert('Прогресс уже пуст — сбрасывать нечего.'); return; }
  const ok = confirm(
    `Стереть весь сохранённый прогресс, медали и историю по всем тренажёрам (${keys.length} записей)?\n` +
    `Пригодится перед занятием с новым учеником. Отменить это действие нельзя.`
  );
  if (!ok) return;
  try { keys.forEach(k => localStorage.removeItem(k)); } catch(e){}
  alert('Готово — прогресс по всем тренажёрам сброшен.');
};

const NAV_STATE_KEY = 'ogeNav:state';
let curTabId = null, curSubtabId = null;
// «Подборка» — платформенная функция, не часть предметной навигации,
// поэтому у неё свой флаг, а не место среди вкладок NAV (см. .basket-toggle)
let basketOpen = false;
(function restoreNavState(){
  try {
    const saved = JSON.parse(localStorage.getItem(NAV_STATE_KEY) || 'null');
    if (saved && NAV.some(t => t.id === saved.tabId)) { curTabId = saved.tabId; curSubtabId = saved.subtabId || null; }
  } catch(e){}
  if (!curTabId) curTabId = NAV[0].id;
})();
function saveNavState(){
  try { localStorage.setItem(NAV_STATE_KEY, JSON.stringify({ tabId: curTabId, subtabId: curSubtabId })); } catch(e){}
}

function itemHTML(it, ii){
  if(!it.href){
    return `
      <div class="topic-item soon">
        <span class="item-num">${String(ii+1).padStart(2,'0')}</span>
        <span class="item-name">${it.name}</span>
        <span class="item-soon">скоро</span>
      </div>
    `;
  }
  return `
    <a class="topic-item" href="${it.href}">
      <span class="item-num">${String(ii+1).padStart(2,'0')}</span>
      <span class="item-name">${it.name}</span>
    </a>
  `;
}

function groupsCount(groups){
  return (groups||[]).reduce((sum,g)=>sum + g.items.filter(id=>TRAINERS[id] && TRAINERS[id].href).length, 0);
}

function getCurTab(){ return NAV.find(t => t.id === curTabId) || NAV[0]; }
function getCurSubtab(){
  const tab = getCurTab();
  if (!tab.subtabs) return null;
  return tab.subtabs.find(s => s.id === curSubtabId) || tab.subtabs[0];
}
// то, что реально сейчас показываем: либо подвкладка, либо сама вкладка (если плоская)
function getActiveDef(){
  const tab = getCurTab();
  return tab.subtabs ? getCurSubtab() : tab;
}

function updateBasketToggle(){
  const btn = document.getElementById('basketToggle');
  const badge = document.getElementById('basketBadge');
  if (!btn) return;
  const n = Basket.count();
  btn.classList.toggle('active', basketOpen);
  if (n > 0) { badge.style.display = 'flex'; badge.textContent = n > 99 ? '99+' : String(n); }
  else { badge.style.display = 'none'; }
}

function renderNav(){
  const mainEl = document.getElementById('mainTabs');
  mainEl.innerHTML = NAV.map(t => {
    const n = t.subtabs ? t.subtabs.reduce((s,st)=>s+groupsCount(st.groups),0) : groupsCount(t.groups);
    return `<button class="nav-tab${(!basketOpen && t.id===curTabId)?' active':''}" data-id="${t.id}">${t.title}<span class="tcount"> · ${n}</span></button>`;
  }).join('');
  mainEl.querySelectorAll('.nav-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      curTabId = btn.dataset.id;
      basketOpen = false;
      const tab = getCurTab();
      curSubtabId = tab.subtabs ? tab.subtabs[0].id : null;
      saveNavState();
      renderNav();
      renderContent();
    });
  });
  updateBasketToggle();

  const subEl = document.getElementById('subTabs');
  const tab = getCurTab();
  if (tab.subtabs) {
    if (!tab.subtabs.some(s=>s.id===curSubtabId)) curSubtabId = tab.subtabs[0].id;
    subEl.style.display = 'flex';
    subEl.innerHTML = tab.subtabs.map(s => {
      const n = groupsCount(s.groups);
      return `<button class="nav-subtab${s.id===curSubtabId?' active':''}" data-id="${s.id}">${s.title}${s.soon?'':` <span class="tcount"> · ${n}</span>`}</button>`;
    }).join('');
    subEl.querySelectorAll('.nav-subtab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        curSubtabId = btn.dataset.id;
        basketOpen = false;
        saveNavState();
        renderNav();
        renderContent();
      });
    });
  } else {
    subEl.style.display = 'none';
    subEl.innerHTML = '';
  }
}

function renderContent(){
  const el = document.getElementById('topics');
  if (basketOpen) { renderBasketView(); return; }
  const def = getActiveDef();
  if (!def || def.soon || !(def.groups||[]).length) {
    el.innerHTML = `<div class="topic"><div class="coming-soon-tab">🚧 Здесь пока нет тренажёров — они появятся в числе первых, когда будут готовы.</div></div>`;
    return;
  }
  el.innerHTML = def.groups.map(g => {
    const items = g.items.map(id => TRAINERS[id]).filter(Boolean);
    return `
      <div class="topic">
        ${g.title ? `<div class="section-title">${g.title}</div>` : ''}
        <div class="topic-list">
          ${items.map((it, ii) => itemHTML(it, ii)).join('')}
        </div>
      </div>
    `;
  }).join('');
}

/* ───────── подборка ─────────
   собирается кнопкой «📥 В подборку» на страницах тренажёров (см. basket-core.js),
   здесь только просмотр/удаление/печать. Без seed/PDF/ключа ответов — это
   первая, простая версия. */
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function basketItemHTML(it){
  const trainer = TRAINERS[it.trainerId];
  const base = trainer ? trainer.name : (it.trainerTitle || it.file || '');
  const src = (it.modeTitle && it.modeTitle !== base) ? (base + ' · ' + it.modeTitle) : base;
  return `
    <div class="basket-item">
      <div class="basket-item-head">
        <span class="basket-item-src">${escapeHtml(src)}</span>
        <button class="rm" data-id="${it.id}" title="Убрать">×</button>
      </div>
      <div class="basket-item-text">${it.html ? it.html : escapeHtml(it.text)}</div>
    </div>
  `;
}
let basketSortDir = 'desc'; // 'desc' = сначала новые (по умолчанию), 'asc' = сначала первые добавленные
function renderBasketView(){
  const el = document.getElementById('topics');
  const all = Basket.all().slice(); // Basket.all() отдаёт в порядке добавления, от первого к последнему
  const items = basketSortDir === 'desc' ? all.reverse() : all;
  if (!items.length) {
    el.innerHTML = `<div class="topic"><div class="coming-soon-tab">Пока пусто. Открой любой тренажёр, реши или просто сгенерируй задание и нажми «📥 В подборку» под ним — оно появится здесь.</div></div>`;
    return;
  }
  el.innerHTML = `
    <div class="topic basket-toolbar">
      <div class="basket-toolbar-row">
        <button class="basket-btn" id="basketPrintBtn">🖨 Печать</button>
        <button class="basket-btn quiet" id="basketSortBtn">${basketSortDir === 'desc' ? '⬇️ Сначала новые' : '⬆️ Сначала старые'}</button>
        <button class="basket-btn quiet" id="basketClearBtn">Очистить всё</button>
      </div>
    </div>
    <div class="topic basket-list" id="basketList">
      ${items.map(basketItemHTML).join('')}
    </div>
  `;
  document.getElementById('basketPrintBtn').onclick = () => window.print();
  document.getElementById('basketSortBtn').onclick = () => {
    basketSortDir = basketSortDir === 'desc' ? 'asc' : 'desc';
    renderBasketView();
  };
  document.getElementById('basketClearBtn').onclick = () => {
    if (!confirm('Убрать все задания из подборки? Это нельзя отменить.')) return;
    Basket.clear(); renderNav(); renderContent();
  };
  el.querySelectorAll('.basket-item .rm').forEach(btn => {
    btn.onclick = () => { Basket.remove(btn.dataset.id); renderNav(); renderContent(); };
  });
}

document.getElementById('basketToggle').addEventListener('click', () => {
  basketOpen = !basketOpen;
  renderNav();
  renderContent();
});

renderNav();
renderContent();
</script>
</body>
</html>
