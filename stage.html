<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- масштаб страницы браузером запрещён: щипок обрабатывает сама сцена
     (см. «щипок» в скрипте). Родное увеличение браузера на iPhone роняло
     страницу — «На странице повторно возникла проблема» -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2126">
<title>Экран учителя · Тренажёры</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  Промпт №11 нового списка: «сцена» ученика в совместной сессии.

  Зачем. Каждый участник раньше верстал страницу тренажёра под своё окно:
  у ученика на телефоне блоки уже и переносятся иначе, а записи доски
  привязаны к координатам документа — обведённое учителем оказывалось у
  ученика рядом, а не на месте. Здесь страница тренажёра открыта в кадре
  РОВНО такого размера, как окно учителя (размер присылает сама страница
  тренажёра, см. session-share.js, «общий экран»), и кадр целиком
  масштабируется под экран ученика. Внутри кадра всё как у учителя —
  вёрстка, медиазапросы, координаты доски, прокрутка, — поэтому совпадает
  без пересчёта координат: уменьшает картинку браузер.

  Что делает эта страница — только рамка: размер и масштаб кадра, смена
  страниц без мигания (два кадра), курсор учителя, состояние связи, адрес
  для перезагрузки, кнопки масштаба (прежний «Обычный режим» убран в
  промпте №82). Сессию, задания и
  доску ведёт страница тренажёра внутри кадра, как у любого
  присоединившегося.

  Кадр узнаёт, что он на сцене, по имени окна tsStageFrame: имя переживает
  переходы внутри кадра.
-->
<style>
:root{
  --stage-bg:#1f2126;
  --bar-bg:rgba(24,26,31,.86);
  --bar-border:rgba(255,255,255,.14);
  --bar-ink:#f1f2f4;
  --bar-muted:#a3a8b3;
  --bar-hover:rgba(255,255,255,.10);
  --bar-active:rgba(255,255,255,.18);
  --warn:#e0a03a;
  --bad:#d9534f;
  --good:#2e9e5b;
  --cursor:#e5484d;
}
html,body{margin:0;height:100%;background:var(--stage-bg);overflow:hidden;touch-action:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;}
/* окно просмотра: пока сцена целиком помещается, прокрутки нет; увеличили —
   появляется своя прокрутка сцены (кадр внутри её прокрутить нельзя: у
   ученика прокрутку ведёт учитель) */
#vp{position:fixed;inset:0;overflow:hidden;touch-action:none;}
#vp.zoomed{overflow:auto;}
#box{position:relative;background:#fff;transform-origin:0 0;}
/* пока пальцы сводят/разводят — сцена масштабируется картинкой (без
   перевёрстки и перерисовки кадра), настоящий масштаб — когда отпустили */
#box.pinching{will-change:transform;}
/* Кадров два, когда учитель меняет страницу: старый остаётся на экране, а
   новый грузится под ним невидимым и проявляется, только когда уже показывает
   то же, что у учителя. Прячем прозрачностью, а не visibility/display:
   скрытые так кадры браузер может не рисовать и притормаживать их таймеры */
.stage-frame{position:absolute;left:0;top:0;border:0;display:block;transform-origin:0 0;background:#fff;
  z-index:1;transition:opacity .18s ease;}
.stage-frame.waiting{opacity:0;pointer-events:none;z-index:0;}
/* «рука»: прозрачная накладка поверх кадра, чтобы увеличенную сцену можно
   было двигать пальцем — сам кадр жесты прокрутки у ученика гасит */
#pan{position:absolute;inset:0;display:none;cursor:grab;touch-action:none;z-index:2;}
#pan.drag{cursor:grabbing;}
#vp.panning #pan{display:block;}

/* Курсор учителя. Размер не масштабируется вместе со сценой: на телефоне
   сцена уменьшена в три-четыре раза, и уменьшенная стрелка потерялась бы.
   Сам #cursor — точка, куда указывает учитель (горячая точка курсора), всё
   остальное разложено вокруг неё */
#cursor{position:absolute;left:0;top:0;z-index:3;pointer-events:none;width:0;height:0;
  opacity:0;transition:opacity .2s;will-change:transform;}
#cursor.on{opacity:1;}
#cursor svg, #cursor img{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));}
#cursor .arrow{position:absolute;left:-3px;top:-2px;}
/* «Курсор-инструмент»: вместо стрелки — тот курсор, что у учителя (ручка,
   «рука», крестик…), и кольцо ластика в масштабе сцены.
   Красного кружка «нажал» вокруг курсора больше нет ни у какого вида (просьба
   Даниила): при письме он мигал у ученика на каждом штрихе и мешал смотреть.
   Нажатие и так видно по тому, что появляется на доске. Класс .down остаётся —
   по нему проверяют тесты */
#cursor .look{position:absolute;display:none;}
#cursor.look-on .look{display:block;}
#cursor.look-on .arrow, #cursor.look-none .arrow{display:none;}
#cursor .erase{position:absolute;left:0;top:0;display:none;border-radius:50%;transform:translate(-50%,-50%);box-sizing:border-box;
  border:1.5px solid rgba(18,18,26,.85);box-shadow:0 0 0 1px rgba(255,255,255,.9), inset 0 0 0 1px rgba(255,255,255,.9);}
#cursor .erase::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;
  border-radius:50%;background:rgba(18,18,26,.85);}
#cursor.erase-on .erase{display:block;}
#cursor.erase-on.down .erase{background:rgba(0,120,255,.10);}   /* ластик стирает — подкрашено, как у учителя при смене размера */

#bar{position:fixed;z-index:10;display:flex;align-items:center;gap:2px;padding:4px;
  border-radius:14px;background:var(--bar-bg);border:1px solid var(--bar-border);
  backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
  box-shadow:0 6px 24px rgba(0,0,0,.35);color:var(--bar-ink);
  left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);}
/* панель висит поверх сцены (полей по краям нет) — делаем её тише, чтобы не
   спорила с заданием; при наведении и нажатии возвращаем полную яркость */
#bar.over{opacity:.5;transition:opacity .15s;}
#bar.over:hover,#bar.over:focus-within,#bar.over.show{opacity:1;}
#bar.vertical{flex-direction:column;left:auto;bottom:auto;top:50%;right:calc(8px + env(safe-area-inset-right));transform:translateY(-50%);}
#bar button{appearance:none;border:0;background:none;color:inherit;font:inherit;font-size:13px;font-weight:600;
  min-width:34px;height:34px;padding:0 9px;border-radius:10px;cursor:pointer;display:inline-flex;
  align-items:center;justify-content:center;white-space:nowrap;}
#bar button:hover{background:var(--bar-hover);}
#bar button[aria-pressed="true"]{background:var(--bar-active);}
#bar button:disabled{opacity:.35;cursor:default;background:none;}
#bar .sep{width:1px;height:20px;background:var(--bar-border);margin:0 3px;}
#bar.vertical .sep{width:20px;height:1px;margin:3px 0;}
#zoomLabel{min-width:52px;font-variant-numeric:tabular-nums;}
/* сбоку поле узкое (телефон лёжа) — подпись «Обычный режим» не влезла бы и
   легла на задание, там вместо неё значок; полное название — в подсказке */
#bar .short{display:none;font-size:16px;}
#bar.vertical .full{display:none;}
#bar.vertical .short{display:inline;}
/* точка связи в панели: зелёная — всё хорошо, жёлтая/красная — см. #conn */
#connDot{width:8px;height:8px;border-radius:50%;background:var(--good);margin:0 7px;flex:0 0 auto;}
#connDot.warn{background:var(--warn);animation:pulse 1.2s ease-in-out infinite;}
#connDot.bad{background:var(--bad);animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

#status,#conn{position:fixed;left:50%;transform:translateX(-50%);z-index:11;padding:8px 14px;border-radius:12px;
  background:var(--bar-bg);border:1px solid var(--bar-border);color:var(--bar-ink);font-size:13px;line-height:1.35;
  box-shadow:0 6px 24px rgba(0,0,0,.35);transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);
  box-sizing:border-box;text-align:center;}
#status{top:calc(18px + env(safe-area-inset-top));}
#status.hidden,#conn.hidden{opacity:0;}
#status a{color:#9cc3ff;pointer-events:auto;}
/* о связи — заметно и сверху: ученик должен понять, что это не «учитель
   молчит», а связь прервалась, и что делать ничего не нужно */
#conn{top:calc(60px + env(safe-area-inset-top));font-weight:600;}
#conn.warn{border-color:var(--warn);}
#conn.bad{border-color:var(--bad);}
#conn.good{border-color:var(--good);}
/* Промпт №79: учитель завершил занятие — надпись поверх последнего экрана */
#ended{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;
  box-sizing:border-box;background:rgba(15,16,20,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);}
#ended.on{display:flex;}
#ended .card{max-width:380px;width:100%;box-sizing:border-box;text-align:center;padding:28px 24px 20px;border-radius:20px;
  background:var(--bar-bg);border:1px solid var(--bar-border);color:var(--bar-ink);box-shadow:0 12px 40px rgba(0,0,0,.45);
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);}
#ended .icon{font-size:34px;line-height:1;margin-bottom:10px;}
#ended h2{margin:0 0 6px;font-size:21px;font-weight:700;}
#ended p{margin:0 0 18px;font-size:15px;color:var(--bar-muted);line-height:1.45;}
#ended .home{display:block;width:100%;padding:11px 14px;border-radius:12px;border:none;cursor:pointer;
  background:#f1f2f4;color:#1f2126;font:inherit;font-size:15px;font-weight:600;}
#ended .stay{margin-top:8px;background:none;border:none;color:var(--bar-muted);font:inherit;font-size:13px;cursor:pointer;padding:6px;}
</style>
</head>
<body>
<div id="vp">
  <div id="box">
    <div id="pan"></div>
    <div id="cursor" aria-hidden="true">
      <span class="erase"></span>
      <span class="look"></span>
      <svg class="arrow" width="22" height="22" viewBox="0 0 22 22"><path d="M3 2 L3 17 L7.2 13.2 L10 19.5 L12.8 18.3 L10.1 12.2 L15.8 12 Z" fill="#e5484d" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div>
  </div>
</div>

<div id="bar" role="toolbar" aria-label="Экран учителя">
  <span id="connDot" title="На связи"></span>
  <button id="zoomOut" title="Уменьшить" aria-label="Уменьшить">−</button>
  <button id="zoomLabel" title="Показать экран учителя целиком">100%</button>
  <button id="zoomIn" title="Увеличить" aria-label="Увеличить">+</button>
  <button id="panBtn" aria-pressed="false" title="Двигать увеличенный экран" aria-label="Двигать увеличенный экран">✋</button>
  <!-- Промпт №82: «Обычный режим» убран — он работал неверно (записи доски
       у ученика оказывались не на своих местах). Выйти из занятия — в панели
       «Совместный доступ» -->
</div>
<div id="status">Подключаемся к экрану учителя…</div>
<div id="conn" class="hidden" role="status" aria-live="polite"></div>
<div id="ended" role="dialog" aria-live="polite">
  <div class="card">
    <div class="icon">👋</div>
    <h2 id="endedTitle">Занятие завершено</h2>
    <p id="endedText">Спасибо за урок, до свидания!</p>
    <button class="home" id="endedHome">На главную</button>
    <button class="stay" id="endedStay">Остаться на этой странице</button>
  </div>
</div>

<script src="wake-lock.js"></script>
<script>
(function(){
  'use strict';
  // экран у ученика не гаснет, пока открыта сцена (см. wake-lock.js)
  try { window.MathhWakeLock && window.MathhWakeLock.hold(); } catch (_) {}
  const params = new URLSearchParams(location.search);
  const code = (params.get('s') || '').trim().toUpperCase();
  const vp = document.getElementById('vp');
  const box = document.getElementById('box');
  const pan = document.getElementById('pan');
  const cursorEl = document.getElementById('cursor');
  const bar = document.getElementById('bar');
  const statusEl = document.getElementById('status');
  const connEl = document.getElementById('conn');
  const connDot = document.getElementById('connDot');
  const zoomLabel = document.getElementById('zoomLabel');
  const zoomInBtn = document.getElementById('zoomIn');
  const zoomOutBtn = document.getElementById('zoomOut');
  const panBtn = document.getElementById('panBtn');

  function showStatus(html, keep){
    statusEl.innerHTML = html;
    statusEl.classList.remove('hidden');
    clearTimeout(showStatus.t);
    if (!keep) showStatus.t = setTimeout(() => statusEl.classList.add('hidden'), 2500);
  }

  if (!code) {
    showStatus('Нет кода сессии. <a href="index.html">На главную</a>', true);
    bar.style.display = 'none';
    return;
  }

  // адрес страницы в кадре: только наш сайт — сцену нельзя превратить в
  // рамку для чужой страницы, подставив её адрес в ?to=
  function targetUrl(raw){
    let u;
    try { u = new URL(raw || 'index.html', location.href); } catch (e) { u = null; }
    if (!u || u.origin !== location.origin || /\/stage\.html$/i.test(u.pathname)) u = new URL('index.html', location.href);
    u.searchParams.set('s', code);
    return u;
  }

  /* ── размер и масштаб ──
     teacher — окно учителя в CSS-пикселях. Пока его нет (учитель ещё не
     ответил или у него старая версия страницы), кадр просто во всё окно —
     обычная вёрстка, без масштаба. zoom — множитель поверх «вписать
     целиком»: 1 — весь экран учителя виден, больше — крупнее, с прокруткой */
  let teacher = null;
  // Размер учителя помним в этой вкладке: при перезагрузке сцены кадр сразу
  // верстается под него, а не под окно ученика
  const SIZE_KEY = 'tsStage:size:' + code;
  try {
    const c = JSON.parse(sessionStorage.getItem(SIZE_KEY) || 'null');
    if (c && c.w > 0 && c.h > 0) teacher = { w: c.w, h: c.h };
  } catch (e) {}
  let zoom = 1;
  const ZOOM_STEPS = [1, 1.25, 1.5, 2, 2.5, 3, 4];
  const ZOOM_MAX = ZOOM_STEPS[ZOOM_STEPS.length - 1];
  let scale = 1;

  /* ── кадры ──
     active — тот, что на экране. pending — следующая страница, пока она
     грузится и догоняет учителя (см. «смена страницы» ниже) */
  let active = null, pending = null;
  function frameSize(){
    return teacher ? teacher : { w: vp.clientWidth, h: vp.clientHeight };
  }
  function sizeFrame(f){
    const sz = frameSize();
    f.style.width = sz.w + 'px';
    f.style.height = sz.h + 'px';
    f.style.transform = scale === 1 ? '' : 'scale(' + scale + ')';
  }
  function createFrame(src){
    const f = document.createElement('iframe');
    // имя — до адреса: страница читает его при запуске
    f.name = 'tsStageFrame';
    f.title = 'Экран учителя';
    f.setAttribute('allow', 'clipboard-write; fullscreen');
    f.className = 'stage-frame waiting';
    f._doc = null;       // сведения о текущем документе кадра, см. 'url'
    box.insertBefore(f, pan);
    sizeFrame(f);
    f.src = src;
    return f;
  }
  window.__stageActiveFrame = () => active;   // для теста и отладки

  function layout(keepCenter){
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const sz = frameSize();
    const fit = teacher ? Math.min(vw / sz.w, vh / sz.h) : 1;
    // центр видимой области в координатах кадра — чтобы при смене масштаба
    // остаться на том же месте, а не отъехать в угол
    let cx = null, cy = null;
    if (keepCenter && scale > 0) {
      cx = (vp.scrollLeft + vw / 2 - box.offsetLeft) / scale;
      cy = (vp.scrollTop + vh / 2 - box.offsetTop) / scale;
    }
    scale = fit * zoom;
    const bw = sz.w * scale, bh = sz.h * scale;
    [active, pending].forEach(f => { if (f) sizeFrame(f); });
    box.style.width = bw + 'px';
    box.style.height = bh + 'px';
    // пока сцена меньше окна — по центру, свободное место поровну по краям
    box.style.marginLeft = Math.max(0, (vw - bw) / 2) + 'px';
    box.style.marginTop = Math.max(0, (vh - bh) / 2) + 'px';
    vp.classList.toggle('zoomed', zoom > 1);
    if (cx != null && zoom > 1) {
      vp.scrollLeft = cx * scale + box.offsetLeft - vw / 2;
      vp.scrollTop = cy * scale + box.offsetTop - vh / 2;
    }
    placeBar(vw, vh, bw, bh);
    placeCursor();
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    zoomOutBtn.disabled = zoom <= ZOOM_STEPS[0] + 1e-6;
    zoomInBtn.disabled = zoom >= ZOOM_MAX - 1e-6;
    panBtn.disabled = zoom <= 1;
    if (zoom <= 1 && panning) setPanning(false);
    window.__stageScale = scale;   // для теста и отладки
  }

  // Панель — в свободное поле по краю, если оно есть (так она не закрывает
  // задание): снизу/сверху — горизонтально, справа — вертикально. Полей нет —
  // висит поверх, но приглушённая
  function placeBar(vw, vh, bw, bh){
    const freeV = (vh - bh) / 2, freeH = (vw - bw) / 2;
    // вертикальная панель шириной ~62 px (кнопка «100%» плюс поля)
    const vertical = zoom <= 1 && freeV < 48 && freeH >= 66;
    bar.classList.toggle('vertical', vertical);
    bar.classList.toggle('over', zoom > 1 || (freeV < 48 && freeH < 66));
  }

  function setZoom(z){
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_STEPS[0], z));
    layout(true);
    scheduleFrameDpr();
  }
  zoomInBtn.onclick = () => setZoom(ZOOM_STEPS.find(z => z > zoom + 1e-6) || zoom);
  zoomOutBtn.onclick = () => setZoom([...ZOOM_STEPS].reverse().find(z => z < zoom - 1e-6) || ZOOM_STEPS[0]);
  zoomLabel.onclick = () => setZoom(1);

  window.addEventListener('resize', () => { layout(true); scheduleFrameDpr(); });
  window.addEventListener('orientationchange', () => setTimeout(() => layout(true), 250));

  /* ── двигать увеличенную сцену ── */
  let panning = false, lastManualAt = 0;
  function setPanning(on){
    panning = !!on;
    vp.classList.toggle('panning', panning);
    panBtn.setAttribute('aria-pressed', panning ? 'true' : 'false');
  }
  panBtn.onclick = () => setPanning(!panning);
  let drag = null;
  pan.addEventListener('pointerdown', (e) => {
    // пальцы двигают сцену через «щипок и перетаскивание» ниже — здесь
    // только мышь и перо, иначе одно касание двигало бы сцену дважды
    if (e.pointerType === 'touch') return;
    drag = { x: e.clientX, y: e.clientY, sl: vp.scrollLeft, st: vp.scrollTop };
    pan.classList.add('drag');
    try { pan.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  pan.addEventListener('pointermove', (e) => {
    if (!drag) return;
    vp.scrollLeft = drag.sl - (e.clientX - drag.x);
    vp.scrollTop = drag.st - (e.clientY - drag.y);
    lastManualAt = Date.now();
  });
  const endDrag = () => { drag = null; pan.classList.remove('drag'); };
  pan.addEventListener('pointerup', endDrag);
  pan.addEventListener('pointercancel', endDrag);
  // колесо и полосы прокрутки самой сцены — тоже ручное перемещение
  vp.addEventListener('wheel', () => { lastManualAt = Date.now(); }, { passive: true });

  /* ── щипок и перетаскивание пальцами ──
     Раньше щипок на телефоне увеличивал всю страницу средствами браузера.
     На iPhone это роняло страницу («повторно возникла проблема»): браузер
     перерисовывал увеличенный кадр с холстами доски в полном разрешении
     экрана, и памяти не хватало. На Android щипок над кадром не работал
     вовсе — кадр забирал касания себе. Теперь масштаб браузера запрещён
     (viewport, gesture*, touch-action), а щипок и перетаскивание делает
     сама сцена, одинаково на iPhone и Android:
     - двумя пальцами — увеличить/уменьшить (от 100 % до ZOOM_MAX) и сразу
       двигать: точка между пальцами остаётся под пальцами;
     - одним пальцем — двигать увеличенную сцену: всегда на полях сцены и
       на доске учителя (там ученик ничего не нажимает), а в тренажёре —
       только с «рукой» ✋: одним пальцем ученик там вводит ответы;
     - по ходу жеста сцена масштабируется картинкой (transform на #box) —
       плавно и без перерисовки кадра; настоящий масштаб ставится, когда
       пальцы отпустили.
     Касания над кадром приходят в документ кадра, а не сцены, — сцена
     подписывается на них сама (hookFrame). На досках кадр гасит touchstart
     (board-stage.js), поэтому жест начинается с первого touchmove */
  const PAN_SLOP = 6;   // столько пикселей палец может сдвинуться, пока это ещё нажатие
  let gest = null;      // { mode: 'pinch' | 'pan' | 'wait', … }
  function rel(){ return box.getBoundingClientRect(); }
  function pinchStart(a, b){
    const r = rel();
    gest = {
      mode: 'pinch',
      d0: Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)),
      m0: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
      r0: { x: r.left, y: r.top },
      zoom0: zoom, scale0: scale, v: 1, m: null,
    };
    box.classList.add('pinching');
  }
  function pinchMove(a, b){
    const g = gest;
    const d = Math.max(10, Math.hypot(a.x - b.x, a.y - b.y));
    const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const z = Math.min(ZOOM_MAX, Math.max(ZOOM_STEPS[0], g.zoom0 * d / g.d0));
    g.v = z / g.zoom0;
    g.m = m;
    // точка сцены, что была между пальцами, — снова между пальцами
    const qx = g.m0.x - g.r0.x, qy = g.m0.y - g.r0.y;
    const tx = m.x - g.v * qx - g.r0.x, ty = m.y - g.v * qy - g.r0.y;
    box.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + g.v + ')';
    lastManualAt = Date.now();
  }
  function pinchEnd(){
    const g = gest;
    gest = null;
    box.classList.remove('pinching');
    box.style.transform = '';
    if (!g.m) return;   // пальцы поставили и убрали, не двигая
    let z = g.zoom0 * g.v;
    if (z < 1.04) z = 1;   // почти «целиком» — ровно целиком
    // точка кадра под пальцами в начале жеста
    const cx = (g.m0.x - g.r0.x) / g.scale0, cy = (g.m0.y - g.r0.y) / g.scale0;
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_STEPS[0], z));
    layout(false);
    if (zoom > 1) {
      vp.scrollLeft = box.offsetLeft + cx * scale - g.m.x;
      vp.scrollTop = box.offsetTop + cy * scale - g.m.y;
    }
    lastManualAt = Date.now();
    scheduleFrameDpr();
  }
  function panStart(p){
    gest = { mode: 'wait', x: p.x, y: p.y, sl: vp.scrollLeft, st: vp.scrollTop };
  }
  function panMove(p){
    const g = gest;
    if (g.mode === 'wait') {
      if (Math.hypot(p.x - g.x, p.y - g.y) < PAN_SLOP) return false;
      g.mode = 'pan';
    }
    vp.scrollLeft = g.sl - (p.x - g.x);
    vp.scrollTop = g.st - (p.y - g.y);
    lastManualAt = Date.now();
    return true;
  }
  /* pts — касания в координатах окна сцены; canPan — можно ли двигать
     одним пальцем там, где оно началось. Возвращает true, если касание
     забрала сцена (тогда preventDefault — браузер его не обрабатывает) */
  function onTouches(type, pts, canPan){
    if (type === 'end') {
      if (gest && gest.mode === 'pinch') {
        if (pts.length < 2) pinchEnd();
        // остался один палец — дальше он двигает сцену с этого места
        if (pts.length === 1 && zoom > 1 && canPan) panStart(pts[0]);
        return true;
      }
      if (gest && !pts.length) { const was = gest.mode; gest = null; return was === 'pan'; }
      return false;
    }
    if (pts.length >= 2) {
      if (!gest || gest.mode !== 'pinch') pinchStart(pts[0], pts[1]);
      else pinchMove(pts[0], pts[1]);
      return true;
    }
    if (pts.length === 1 && zoom > 1 && canPan) {
      if (!gest) { panStart(pts[0]); return false; }
      if (gest.mode === 'pinch') return true;
      return panMove(pts[0]);
    }
    return false;
  }
  const listOf = (tl, map) => { const out = []; for (let i = 0; i < tl.length; i++) out.push(map(tl[i])); return out; };
  // касания над самой сценой (поля, «рука», панель масштаба)
  ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach((t) => {
    document.addEventListener(t, (e) => {
      if (e.target && e.target.closest && e.target.closest('#bar, #ended, #status a')) return;   // кнопки — как обычно
      const kind = t === 'touchstart' ? 'start' : t === 'touchmove' ? 'move' : 'end';
      const took = onTouches(kind, listOf(e.touches, (p) => ({ x: p.clientX, y: p.clientY })), true);
      if ((took || e.touches.length > 1) && e.cancelable) e.preventDefault();
    }, { passive: false, capture: true });
  });
  // Safari: свой жест масштаба страницы — гасим везде
  ['gesturestart', 'gesturechange', 'gestureend'].forEach((t) => document.addEventListener(t, (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false }));
  // двойное нажатие на iPhone тоже увеличивает страницу — не здесь
  let lastTapAt = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTapAt < 320 && e.cancelable && !(e.target && e.target.closest && e.target.closest('#bar, #ended'))) e.preventDefault();
    lastTapAt = now;
  }, { passive: false });

  /* Касания над кадром: подписываемся на документ кадра (свой сайт, доступ
     есть). Подписываемся заново после каждой загрузки страницы в кадре —
     проверка раз в 300 мс, потому что событие load у тяжёлой страницы
     приходит поздно, а щипок может начаться раньше */
  function hookFrame(f){
    let w, d;
    try { w = f.contentWindow; d = w && w.document; } catch (_) { return; }
    if (!w || !d || w.__stageTouchHooked || d.readyState === 'loading') return;
    w.__stageTouchHooked = true;
    const toStage = (p) => {
      const r = f.getBoundingClientRect();
      const k = f.offsetWidth ? r.width / f.offsetWidth : scale;
      return { x: r.left + p.clientX * k, y: r.top + p.clientY * k };
    };
    // одним пальцем двигаем сцену, где ученик ничего не нажимает сам: доска
    // учителя (просмотр) — или когда включена «рука» (тогда сверху накладка
    // #pan, и касания вообще приходят в сцену)
    const canPan = () => { try { return !!w.__boardViewer; } catch (_) { return false; } };
    ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach((t) => {
      w.addEventListener(t, (e) => {
        if (f !== active) return;
        const kind = t === 'touchstart' ? 'start' : t === 'touchmove' ? 'move' : 'end';
        const took = onTouches(kind, listOf(e.touches, toStage), canPan());
        if ((took || e.touches.length > 1) && e.cancelable) e.preventDefault();
        if (kind === 'end') { try { window.MathhWakeLock && window.MathhWakeLock.poke(); } catch (_) {} }
      }, { passive: false, capture: true });
    });
    ['gesturestart', 'gesturechange', 'gestureend'].forEach((t) => w.addEventListener(t, (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false, capture: true }));
    // и родной щипок/двойное нажатие внутри кадра браузеру не отдаём; свои
    // правила touch-action у холстов (none) этим не отменяются
    try {
      const st = d.createElement('style');
      st.textContent = 'html{touch-action:pan-x pan-y;}';
      (d.head || d.documentElement).appendChild(st);
    } catch (_) {}
    applyFrameDpr(f, true);
  }
  setInterval(() => { [active, pending].forEach((f) => { if (f) hookFrame(f); }); }, 300);

  /* ── разрешение холстов в кадре ──
     Кадр — окно учителя (например 1440×900), уменьшенное под телефон в
     три-четыре раза. А холсты доски внутри кадра рисуются в разрешении
     экрана телефона (devicePixelRatio = 3): каждый — десятки мегабайт, у
     доски на тренажёре — во всю длину страницы. Ученику столько точек не
     видно: на экране холст всё равно уменьшен в scale раз. Поэтому кадру
     сообщаем «плотность» по тому, что реально видно: экран × масштаб сцены
     (с запасом), не меньше 1 и не больше настоящей. Память холстов на
     телефоне падает в разы — это и была главная причина падений на iPhone.
     Увеличили сцену — плотность растёт, и картинка снова чёткая. Движки
     досок перечитывают devicePixelRatio при resize — его кадру и шлём */
  const DEV_DPR = Math.max(1, window.devicePixelRatio || 1);
  function wantDpr(){
    return Math.round(Math.min(DEV_DPR, Math.max(1, DEV_DPR * scale * 1.15)) * 100) / 100;
  }
  function applyFrameDpr(f, fresh){
    let w;
    try { w = f && f.contentWindow; } catch (_) { return; }
    if (!w) return;
    const v = wantDpr();
    let cur = 0;
    try { cur = w.__stageDpr || 0; } catch (_) { return; }
    // без заметной разницы не пересоздаём холсты зря
    if (!fresh && cur && Math.abs(cur - v) / cur < 0.15) return;
    try {
      w.__stageDpr = v;
      Object.defineProperty(w, 'devicePixelRatio', { configurable: true, get: () => w.__stageDpr });
      if (v !== DEV_DPR || cur) w.dispatchEvent(new w.Event('resize'));
    } catch (_) {}
  }
  let dprTimer = null;
  function scheduleFrameDpr(){
    clearTimeout(dprTimer);
    dprTimer = setTimeout(() => { [active, pending].forEach((f) => { if (f) applyFrameDpr(f, false); }); }, 300);
  }
  window.__stageDpr = () => wantDpr();   // для теста и отладки

  /* ── следить за учителем ──
     Ученик увеличил сцену, а учитель пишет или показывает курсором за краем
     видимой части — сцена сама подъезжает. Если ученик только что двигал её
     сам, не перебиваем его несколько секунд */
  const FOLLOW_PAUSE_MS = 3000;
  function follow(x, y){
    if (zoom <= 1 || Date.now() - lastManualAt < FOLLOW_PAUSE_MS) return;
    const vw = vp.clientWidth, vh = vp.clientHeight;
    const px = box.offsetLeft + x * scale - vp.scrollLeft;
    const py = box.offsetTop + y * scale - vp.scrollTop;
    const mx = vw * 0.18, my = vh * 0.18;
    if (px >= mx && px <= vw - mx && py >= my && py <= vh - my) return;
    vp.scrollTo({
      left: box.offsetLeft + x * scale - vw / 2,
      top: box.offsetTop + y * scale - vh / 2,
      behavior: 'smooth',
    });
  }

  /* ── курсор учителя ── */
  let cur = null;   // {x, y, d} в координатах окна учителя или null — спрятан
  function placeCursor(){
    if (!cur) { cursorEl.classList.remove('on', 'down'); return; }
    cursorEl.style.transform = 'translate(' + (cur.x * scale) + 'px,' + (cur.y * scale) + 'px)';
    cursorEl.classList.add('on');
    cursorEl.classList.toggle('down', !!cur.d);
    sizeErase();
  }

  /* ── вид курсора учителя («курсор-инструмент») ──
     Учитель присылает свой CSS-курсор (l.c) — так, как его отдаёт браузер:
     картинка с горячей точкой («url("data:…") 9 28, crosshair») или слово
     (crosshair, grab, text…). Картинку показываем как есть (ручка — с цветом
     чернил), слова — своими значками в духе системных: настоящий системный
     курсор поверх кадра не нарисовать. Неизвестное слово и «auto» — прежняя
     красная стрелка. l.r — кольцо ластика, диаметр в пикселях окна учителя */
  const lookEl = cursorEl.querySelector('.look');
  const eraseEl = cursorEl.querySelector('.erase');
  let look = null, lookKey = '';
  // обводка белым под чёрным — читается и на белом листе, и на тёмной теме
  function outlined(d, w){
    return '<path d="' + d + '" fill="none" stroke="#fff" stroke-width="' + (w + 2.4) + '" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<path d="' + d + '" fill="none" stroke="#111" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  function svg24(body){ return '<svg width="24" height="24" viewBox="0 0 24 24">' + body + '</svg>'; }
  // рука: пальцы — толстые скруглённые линии (чёрный контур, белая заливка),
  // ладонь — скруглённый прямоугольник. tops — где кончается каждый из
  // четырёх пальцев: у открытой ладони высоко, у сжатой — низко
  function hand(tops){
    const xs = [8.6, 11.4, 14.2, 17];
    const fingers = (w, col) => xs.map((x, i) => '<path d="M' + x + ' 14V' + tops[i] + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>').join('');
    const thumb = (w, col) => '<path d="M7.2 16.5L4.6 13.4" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>';
    const palm = (inset, col) => '<rect x="' + (6.6 + inset) + '" y="' + (11.4 + inset) + '" width="' + (12.2 - 2 * inset) + '" height="' + (9.6 - 2 * inset) + '" rx="' + (3.6 - inset) + '" fill="' + col + '"/>';
    return svg24(fingers(4.4, '#111') + thumb(4.4, '#111') + palm(0, '#111')
      + fingers(2.4, '#fff') + thumb(2.4, '#fff') + palm(1, '#fff'));
  }
  function arrowPair(rot){
    const d = 'M4 12H20M7.5 8.5L4 12L7.5 15.5M16.5 8.5L20 12L16.5 15.5';
    return svg24('<g transform="rotate(' + rot + ' 12 12)">' + outlined(d, 1.6) + '</g>');
  }
  const KW = {
    crosshair: { svg: svg24(outlined('M12 3.5V9.5M12 14.5V20.5M3.5 12H9.5M14.5 12H20.5', 1.5)), hx: 12, hy: 12 },
    text: { svg: svg24(outlined('M9 4.5C10.8 4.5 12 5.2 12 6.5V17.5C12 18.8 10.8 19.5 9 19.5M15 4.5C13.2 4.5 12 5.2 12 6.5V17.5C12 18.8 13.2 19.5 15 19.5M10.3 12H13.7', 1.4)), hx: 12, hy: 12 },
    grab: { svg: hand([6, 4.6, 5, 6.8]), hx: 12, hy: 12 },
    grabbing: { svg: hand([11, 10.4, 10.6, 11.4]), hx: 12, hy: 13 },
    pointer: { svg: hand([3.4, 10.6, 10.8, 11.6]), hx: 8.6, hy: 3 },
    move: { svg: svg24(outlined('M12 3.5V20.5M3.5 12H20.5M9.5 6L12 3.5L14.5 6M9.5 18L12 20.5L14.5 18M6 9.5L3.5 12L6 14.5M18 9.5L20.5 12L18 14.5', 1.6)), hx: 12, hy: 12 },
    ew: { svg: arrowPair(0), hx: 12, hy: 12 },
    ns: { svg: arrowPair(90), hx: 12, hy: 12 },
    nwse: { svg: arrowPair(45), hx: 12, hy: 12 },
    nesw: { svg: arrowPair(-45), hx: 12, hy: 12 },
  };
  const KW_ALIAS = {
    '-webkit-grab': 'grab', '-webkit-grabbing': 'grabbing', 'all-scroll': 'move', cell: 'crosshair', 'vertical-text': 'text',
    'ew-resize': 'ew', 'e-resize': 'ew', 'w-resize': 'ew', 'col-resize': 'ew',
    'ns-resize': 'ns', 'n-resize': 'ns', 's-resize': 'ns', 'row-resize': 'ns',
    'nwse-resize': 'nwse', 'nw-resize': 'nwse', 'se-resize': 'nwse',
    'nesw-resize': 'nesw', 'ne-resize': 'nesw', 'sw-resize': 'nesw',
  };
  function kwOf(s){
    const k = String(s || '').split(',').pop().trim().toLowerCase();
    return KW_ALIAS[k] || k;
  }
  // «url("…") 9 28, crosshair» → адрес, горячая точка и запасное слово;
  // кавычки внутри адреса браузер экранирует обратной косой чертой
  const URL_RE = /^url\(\s*(?:"((?:[^"\\]|\\.)*)"|'((?:[^'\\]|\\.)*)'|([^)\s]*))\s*\)\s*(?:(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?))?\s*(?:,\s*([\s\S]*))?$/;
  function parseCursorCss(css){
    const s = String(css || '').trim();
    const m = URL_RE.exec(s);
    if (!m) return { kw: kwOf(s) };
    const raw = m[1] !== undefined ? m[1] : (m[2] !== undefined ? m[2] : m[3]);
    return { url: raw.replace(/\\(.)/g, '$1'), hx: +m[4] || 0, hy: +m[5] || 0, kw: kwOf(m[6]) };
  }
  function sizeErase(){
    if (!look || !(look.r > 0)) return;
    const d = Math.max(6, look.r * scale);
    eraseEl.style.width = eraseEl.style.height = d + 'px';
  }
  function applyLook(l){
    const key = l ? JSON.stringify(l) : '';
    if (key === lookKey) return;
    lookKey = key; look = l || null;
    let mode = 'arrow';
    lookEl.textContent = '';
    if (look && typeof look.c === 'string'){
      const p = parseCursorCss(look.c);
      // картинка — только своя, data:image: адрес приходит по сети, и чужой
      // ссылкой ученика никуда не отправим
      if (p.url && /^data:image\//i.test(p.url) && p.url.length < 200000){
        const img = new Image();
        img.alt = ''; img.draggable = false; img.src = p.url;
        lookEl.appendChild(img);
        lookEl.style.left = (-p.hx) + 'px'; lookEl.style.top = (-p.hy) + 'px';
        mode = 'look';
      } else if (p.kw === 'none'){
        mode = 'none';
      } else if (KW[p.kw]){
        lookEl.innerHTML = KW[p.kw].svg;   // наши же строки, не присланные
        lookEl.style.left = (-KW[p.kw].hx) + 'px'; lookEl.style.top = (-KW[p.kw].hy) + 'px';
        mode = 'look';
      }
    }
    cursorEl.classList.toggle('look-on', mode === 'look');
    cursorEl.classList.toggle('look-none', mode === 'none');
    cursorEl.classList.toggle('erase-on', !!(look && look.r > 0));
    sizeErase();
  }
  window.__stageCursor = { look: () => ({ key: lookKey, mode: cursorEl.classList.contains('look-on') ? 'look' : (cursorEl.classList.contains('look-none') ? 'none' : 'arrow') }) };

  let followCursorAt = 0;
  function onCursor(d){
    if (d.h) { cur = null; placeCursor(); return; }
    if (d.l) applyLook(d.l);
    cur = { x: d.x, y: d.y, d: d.d };
    placeCursor();
    // за курсором увеличенная сцена едет реже, чем за пером, — иначе при
    // каждом взмахе мыши экран ученика ёрзал бы
    const now = Date.now();
    if (now - followCursorAt > 600) { followCursorAt = now; follow(d.x, d.y); }
  }

  /* ── состояние связи ──
     Кадр сообщает своё состояние: канал на связи / переподключается / нет
     сети, и слышно ли учителя. Сцена показывает это крупно сверху, чтобы
     ученик понимал, что происходит, и точкой в панели — всегда */
  let connShownBad = false, connHideT = null;
  function showConn(kind, text){
    clearTimeout(connHideT);
    connEl.className = kind;
    connEl.textContent = text;
  }
  function setConn(state, teacherState){
    const offline = !navigator.onLine || state === 'offline';
    let dot = '', text = '', kind = '';
    if (offline) { dot = 'bad'; kind = 'bad'; text = 'Нет интернета — как только сеть вернётся, экран учителя появится сам'; }
    else if (state === 'reconnecting') { dot = 'warn'; kind = 'warn'; text = 'Связь прервалась — переподключаемся…'; }
    else if (teacherState === 'silent') { dot = 'warn'; kind = 'warn'; text = 'Учитель не на связи — ждём, пока он вернётся'; }
    connDot.className = dot;
    connDot.title = text || 'На связи';
    if (text) { showConn(kind, text); connShownBad = true; return; }
    if (connShownBad) {
      connShownBad = false;
      showConn('good', 'Связь восстановлена');
      connHideT = setTimeout(() => { connEl.className = 'hidden good'; }, 1800);
    }
  }
  let lastConn = { state: 'online', teacher: 'ok' };
  window.addEventListener('offline', () => setConn('offline', lastConn.teacher));
  window.addEventListener('online', () => setConn(lastConn.state, lastConn.teacher));

  /* ── обычный режим: своя вёрстка, как было до сцены ── */
  function frameHref(f){
    try { return (f || active).contentWindow.location.href; } catch (e) { return null; }
  }

  /* ── показать кадр ──
     Кадр проявляется, когда страница в нём сказала «готово» (догнала
     учителя, см. session-share.js) и размер учителя известен. Новая
     страница проявляется поверх старой, и старая уходит только после этого —
     поэтому у ученика нет ни пустого (тёмного) экрана, ни промежуточного
     экрана вроде списка номеров. Не сказала «готово» за 4 с — показываем как
     есть: лучше неидеальный экран, чем старый */
  const READY_TIMEOUT_MS = 4000;
  function reveal(f){
    if (!f) return;
    clearTimeout(f._revealT);
    if (f === pending) {
      const old = active;
      active = pending;
      pending = null;
      active.classList.remove('waiting');
      cur = null; placeCursor();
      // старый кадр убираем, когда новый уже проявился. Сначала говорим
      // ему «ты заменён» — уходя, он не прощается с учителем (номер
      // участника у кадров общий, прощание выписало бы и новый кадр).
      // Кадр, который уходит не по замене (вкладку закрыли, ученик ушёл
      // со сцены), прощается — и у учителя пропадает сразу (промпт №82)
      if (old) {
        try { old.contentWindow.postMessage({ source: 'ts-stage-host', type: 'retire' }, location.origin); } catch (_) {}
        setTimeout(() => { try { old.remove(); } catch (_) {} }, 250);
      }
    } else if (f === active) {
      f.classList.remove('waiting');
    }
    statusEl.classList.add('hidden');
  }
  function armRevealTimeout(f){
    clearTimeout(f._revealT);
    f._revealT = setTimeout(() => {
      if (f !== active && f !== pending) return;
      if (!teacher) showStatus('Экран учителя не прислал размер — показываю обычную вёрстку');
      reveal(f);
    }, READY_TIMEOUT_MS);
  }
  function tryReveal(f){
    if (f._doc && f._doc.ready && teacher) reveal(f);
  }

  /* ── смена страницы ──
     Учитель ушёл на другой тренажёр (или на главную): кадр на экране об этом
     сообщает, а сам остаётся — новая страница грузится во второй кадр */
  function samePage(a, b){
    try { const x = new URL(a, location.href), y = new URL(b, location.href); return x.pathname === y.pathname; }
    catch (e) { return false; }
  }
  function navigate(url){
    const u = targetUrl(url).toString();
    // о переходе могут сообщить дважды (событие учителя и сверка по его
    // снимку) — второй раз ту же страницу не перезапускаем
    if (pending) {
      if (samePage(pending._target, u)) return;
      pending._doc = null; pending._target = u; pending.src = u;
    } else {
      if (samePage(frameHref(active) || '', u)) return;
      pending = createFrame(u);
      pending._target = u;
    }
    armRevealTimeout(pending);
  }

  active = createFrame(targetUrl(params.get('to')).toString());
  armRevealTimeout(active);

  /* ── занятие завершено ── */
  let ended = false;
  const endedEl = document.getElementById('ended');
  // late: ссылка на уже завершённое; 'kicked' — учитель отключил это
  // устройство (промпт №82)
  function showEnded(late){
    if (ended) return;
    ended = true;
    if (late === 'kicked') {
      document.getElementById('endedTitle').textContent = 'Учитель отключил это устройство';
      document.getElementById('endedText').textContent = 'Если это ошибка — попросите у учителя ссылку ещё раз.';
    } else if (late === 'missing') {
      // промпт №21 нового списка: по коду в адресе никого нет
      endedMissing = true;
      document.querySelector('#ended .icon').textContent = '🔍';
      document.getElementById('endedTitle').textContent = 'Сессия не найдена';
      document.getElementById('endedText').textContent = 'Код неверный или занятие уже закончилось. Попросите у учителя новую ссылку.';
      document.getElementById('endedStay').textContent = 'Открыть страницу без сессии';
    } else if (late) document.getElementById('endedTitle').textContent = 'Это занятие уже завершено';
    statusEl.classList.add('hidden');
    connEl.classList.add('hidden');
    cursorEl.classList.remove('on');
    // второй кадр (учитель как раз менял страницу) больше не нужен
    if (pending) { try { pending.remove(); } catch (_) {} pending = null; }
    endedEl.classList.add('on');
  }
  document.getElementById('endedHome').addEventListener('click', () => { location.href = new URL('index.html', location.href).toString(); });
  // «остаться» при ненайденной сессии — смотреть в рамке нечего: та же
  // страница, но обычная, без кода
  let endedMissing = false;
  function leaveToPlain(){
    const u = targetUrl(frameHref() || params.get('to'));
    u.searchParams.delete('s');
    location.href = u.toString();
  }
  document.getElementById('endedStay').addEventListener('click', () => {
    if (endedMissing) { leaveToPlain(); return; }
    endedEl.classList.remove('on');
  });

  /* ── сообщения из кадров ── */
  function whichFrame(src){
    if (active && src === active.contentWindow) return active;
    if (pending && src === pending.contentWindow) return pending;
    return null;
  }
  window.addEventListener('message', (e) => {
    if (e.origin !== location.origin) return;
    const f = whichFrame(e.source);
    if (!f) return;
    const d = e.data;
    if (!d || d.source !== 'ts-stage') return;
    // Промпт №79: учитель завершил занятие (или ученик открыл ссылку на уже
    // завершённое). Ученик остаётся на том экране, что был, — поверх
    // надпись и «На главную». Код в его браузере кадр уже стёр, поэтому
    // главная откроется обычной страницей, а не сценой старого занятия
    if (d.type === 'ended') { showEnded(!f._doc || !f._doc.ready); return; }
    if (d.type === 'kicked') { showEnded('kicked'); return; }
    // Промпт №82: ученик сам вышел из занятия — код его браузер уже забыл,
    // главная откроется обычной страницей
    if (d.type === 'left') { location.href = new URL('index.html', location.href).toString(); return; }
    // «Обновить» учителя (или кнопка ученика на заставке доски): перезагружаем
    // сцену целиком, а не один кадр — заново заводится и кадр, и размер, и
    // ожидание «готово». Код в адресе сцены, роль — во вкладке, поэтому
    // ученик возвращается в то же занятие сам
    // Просьба учителя уходит дважды — номер выполненной помним во вкладке,
    // чтобы повтор не перезагрузил уже свежую сцену (сообщения от старого,
    // уходящего кадра сюда не доходят — whichFrame выше)
    if (d.type === 'reload') {
      if (d.rid) {
        try { if (sessionStorage.getItem('tsReload:done') === d.rid) return; sessionStorage.setItem('tsReload:done', d.rid); } catch (_) {}
      }
      try { location.reload(); } catch (_) {}
      return;
    }
    if (ended) return;
    if (d.type === 'size') {
      try { sessionStorage.setItem(SIZE_KEY, JSON.stringify({ w: d.w, h: d.h })); } catch (_) {}
      bar.title = 'Экран учителя: ' + d.w + '×' + d.h;
      const changed = !teacher || teacher.w !== d.w || teacher.h !== d.h;
      const hadTeacher = !!teacher;
      teacher = { w: d.w, h: d.h };
      if (changed) layout(hadTeacher);
      /* Страница, загруженная вслепую — когда размер учителя ещё не был
         известен и кадр был размером с окно ученика, — перезагружается один
         раз уже под нужный размер: часть тренажёров считает раскладку
         скриптом при загрузке (колонки, ширина условия) и после resize
         пересчитывает не всё. Остальные изменения размера (учитель растянул
         окно, у длинной страницы появилась полоса прокрутки) — обычный
         resize, как у самого учителя: перезагрузка тут дала бы мигание */
      if (f._doc && f._doc.blind && !f._doc.reloaded && changed) {
        f._doc.reloaded = true;
        f.classList.add('waiting');
        armRevealTimeout(f);
        try { f.contentWindow.location.reload(); } catch (_) { reveal(f); }
        return;
      }
      tryReveal(f);
    } else if (d.type === 'url') {
      // новый документ в кадре: первая загрузка, перезагрузка, переход
      const reloaded = !!(f._doc && f._doc.reloaded);
      f._doc = { blind: !teacher, reloaded: reloaded, ready: false };
      // адрес сцены повторяет страницу группы: перезагрузка или «открыть
      // ещё раз» вернут ученика туда, где сейчас группа
      const u = targetUrl(d.href);
      u.searchParams.delete('s');
      const next = new URL(location.href);
      next.searchParams.set('s', code);
      next.searchParams.set('to', (u.pathname.split('/').pop() || 'index.html') + u.search + u.hash);
      try { history.replaceState(null, '', next.toString()); } catch (_) {}
      if (d.title) document.title = 'Экран учителя · ' + d.title;
    } else if (d.type === 'ready') {
      if (f._doc) f._doc.ready = true;
      tryReveal(f);
    } else if (f !== active) {
      return;   // остальное — только от кадра на экране
    } else if (d.type === 'nav') {
      navigate(d.url);
    } else if (d.type === 'cursor') {
      onCursor(d);
    } else if (d.type === 'focus') {
      follow(d.x, d.y);
    } else if (d.type === 'conn') {
      lastConn = { state: d.state, teacher: d.teacher };
      setConn(d.state, d.teacher);
    } else if (d.type === 'leave') {
      // Промпт №21 нового списка: сессии с этим кодом нет. Раньше сцена
      // молча уходила на обычную страницу — со стороны это выглядело как
      // «ссылка ничего не сделала». Теперь — надпись и выбор
      if (d.reason === 'not_found') { showEnded('missing'); return; }
      leaveToPlain();
    }
  });

  layout(false);
})();
</script>
</body>
</html>
