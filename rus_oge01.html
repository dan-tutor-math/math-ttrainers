<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0B0E1A">
<script>(function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ОГЭ. Русский язык — изложение 1</title>
<link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="onest.css">
<style>
/* Токены и стекло — как в rus_oge.html (№2–12): у русского свой малиновый акцент. */
:root{
  --font-ui:'Onest',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;
  --bg:#EEF1F7;
  --blob-1:rgba(194,64,95,.14);
  --blob-2:rgba(190,150,230,.14);
  --card:rgba(255,255,255,.8);
  --glass:rgba(255,255,255,.55);
  --glass-strong:rgba(255,255,255,.72);
  --glass-border:rgba(255,255,255,.85);
  --glass-inset:rgba(255,255,255,.55);
  --muted-1:#8E8E93;
  --muted-2:#6E6E73;
  --muted-3:#48484A;
  --muted-4:#3A3A3C;
  --muted-5:#1D1D1F;
  --muted-6:#8E8E93;
  --ink:#9E2A47;
  --ink-2:#C2405F;
  --pencil:#1D1D1F;
  --teacher:#D70015;
  --bad-tint:rgba(215,0,21,.08);
  --ok:#248A3D;
  --ok-tint:rgba(36,138,61,.1);
  --ok-shadow:rgba(36,138,61,.3);
  --shadow:0 10px 34px rgba(20,30,60,.08);
  --hl-10:rgba(158,42,71,.09);
  --text-bg:rgba(255,255,255,.66);
}
html[data-theme="dark"]{
  --bg:#0B0E1A;
  --blob-1:rgba(194,64,95,.2);
  --blob-2:rgba(150,90,220,.18);
  --card:rgba(30,37,64,.82);
  --glass:rgba(40,46,74,.5);
  --glass-strong:rgba(46,53,84,.65);
  --glass-border:rgba(255,255,255,.12);
  --glass-inset:rgba(255,255,255,.07);
  --ink:#D25A76;
  --ink-2:#E07390;
  --pencil:#F2F3F5;
  --teacher:#FF6961;
  --bad-tint:rgba(255,105,97,.12);
  --ok:#4CB872;
  --ok-tint:rgba(76,184,114,.14);
  --ok-shadow:rgba(62,142,91,.35);
  --shadow:0 10px 40px rgba(0,0,0,.55);
  --hl-10:rgba(210,90,118,.16);
  --text-bg:rgba(20,25,44,.6);
  --muted-1:#9A9AA2;
  --muted-2:#9A9AA2;
  --muted-3:#AEAEB4;
  --muted-4:#C7C7CC;
  --muted-5:#F2F3F5;
  --muted-6:#9A9AA2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(circle at 6% -8%, var(--blob-1) 0%, transparent 40%),
    radial-gradient(circle at 102% 8%, var(--blob-2) 0%, transparent 38%),
    var(--bg);
  font-family:var(--font-ui);
  color:var(--pencil);
  min-height:100vh;
  padding:18px 12px 60px;
}
.wrap{max-width:820px;margin:0 auto}
h1{font-weight:700;letter-spacing:-.02em;font-size:clamp(24px,5vw,34px);text-align:center;}
.sub{font-weight:500;text-align:center;color:var(--muted-2);font-size:15px;margin:4px 0 22px;}
/* на телефоне угловые кнопки сходятся к заголовку — даём им свою строку */
@media (max-width:620px){ body{padding-top:66px} }
.home-btn,.theme-toggle{position:fixed;top:16px;width:40px;height:40px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-strong);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:60;color:var(--ink);font-size:18px;text-decoration:none;transition:transform .15s;}
.home-btn{left:16px}
.theme-toggle{right:16px}
.home-btn:hover,.theme-toggle:hover{border-color:var(--ink)}
.home-btn:active,.theme-toggle:active{transform:scale(.92)}

.modes{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.section-title{font-weight:700;font-size:13px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;margin:14px 4px 4px;}
.mode-card{
  display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;text-align:left;width:100%;
  background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
  border:1px solid var(--glass-border);border-radius:14px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);
  padding:11px 18px;cursor:pointer;transition:transform .12s, border-color .12s;font-family:var(--font-ui);color:var(--pencil);
}
.mode-card:hover:not(:disabled){border-color:var(--ink);transform:translateX(3px)}
.mode-card:disabled{cursor:default;opacity:.62}
.mode-card .mtitle{font-weight:600;font-size:15px;line-height:1.3;flex:1 1 260px;}
.mode-card .msub{font-size:13px;font-weight:500;color:var(--muted-3);flex:1 1 100%;}
.mode-card .mprog{font-size:13px;font-weight:600;color:var(--ok);}

.task-head{display:flex;flex-wrap:wrap;row-gap:8px;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
.corner{display:flex;flex-wrap:wrap;row-gap:6px;align-items:center;gap:8px;}
.task-title{font-weight:600;font-size:15px;color:var(--muted-3)}
.back-btn,.nav-btn{font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--ink);background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);transition:transform .15s,border-color .15s;}
.nav-btn{padding:8px 12px;min-width:40px}
.back-btn:hover,.nav-btn:hover:not(:disabled){border-color:var(--ink)}
.back-btn:active,.nav-btn:active{transform:scale(.96)}
.nav-btn:disabled{opacity:.4;cursor:default}

.submode-tabs{display:flex;gap:8px;margin-bottom:14px;}
.submode-tab{flex:1;font-family:var(--font-ui);font-weight:600;font-size:14px;color:var(--muted-3);background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:10px 6px;cursor:pointer;text-align:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:transform .15s,border-color .15s;}
.submode-tab:hover{border-color:var(--ink);}
.submode-tab:active{transform:scale(.96)}
.submode-tab.active{color:#fff;background:linear-gradient(135deg,var(--ink-2),var(--ink));border-color:var(--ink);}
.mode-hint{font-size:13px;font-weight:500;color:var(--muted-2);margin:-6px 4px 12px;}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{flex:1;min-width:100px;background:var(--glass);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--glass-border);border-radius:16px;padding:10px 12px;text-align:center;}
@media(max-width:359px){.stat{min-width:0}}
.stat .v{font-weight:700;font-size:20px;color:var(--ink);}
.stat .l{font-weight:500;font-size:12px;color:var(--muted-6);}

.panel{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);border-radius:22px;box-shadow:inset 0 1px 0 var(--glass-inset), var(--shadow);padding:20px;margin-bottom:14px;}
@keyframes revealUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.panel.reveal{animation:revealUp .38s cubic-bezier(.22,.9,.35,1) both;}

/* Текст изложения открывается после прослушивания в своём окне с прокруткой,
   чтобы поле изложения и образец не уезжали далеко вниз. */
.text-box{background:var(--text-bg);border:1px solid var(--glass-border);border-radius:16px;margin-bottom:16px;}
.text-box summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.text-box summary::-webkit-details-marker{display:none}
.text-box summary::after{content:'свернуть';font-weight:500;font-size:12.5px;color:var(--muted-2)}
.text-box:not([open]) summary::after{content:'показать'}
.text-body{padding:0 16px 14px;max-height:46vh;overflow:auto;font-size:15.5px;line-height:1.6;color:var(--muted-5);}
.text-body p{margin:0 0 6px}

.q{font-weight:500;font-size:clamp(16px,2.6vw,18px);color:var(--muted-5);line-height:1.55;margin-bottom:14px;}
.q p{margin:0 0 6px}
.q table{border-collapse:collapse;width:100%;margin:6px 0}
.q td{padding:3px 6px;vertical-align:top}
.q sup{font-size:.7em;color:var(--ink);font-weight:700}
/* шапки колонок, продублированные внутрь колонок (см. stackHeads): на широком
   экране их показывает строка-шапка, на телефоне — эти копии над каждой колонкой */
.q .col-head{display:none;margin:10px 0 4px}
/* №4 у ФИПИ свёрстан таблицей в две колонки (правила | предложения). На телефоне
   две колонки не помещаются — ставим колонки друг под другом, а сами пары
   «А) правило» внутри оставляем строками. :has — чтобы не трогать мелкие таблицы */
@media (max-width:620px){
  .q tr:has(> td > table){display:flex;flex-direction:column}
  .q tr:has(> td > table) > td{display:block;width:auto}
  .q td{overflow-wrap:break-word}
  .q tr.col-heads{display:none}
  .q .col-head{display:block}
}
/* кнопки — как в rus_oge.html */
.check-btn,.next-btn{font-family:var(--font-ui);font-weight:600;font-size:16px;color:#fff;border:none;border-radius:14px;padding:13px 26px;cursor:pointer;width:100%;margin-top:14px;transition:transform .15s;}
.check-btn{background:linear-gradient(135deg,var(--ink-2),var(--ink));}
.next-btn{background:var(--ok);box-shadow:0 6px 18px var(--ok-shadow);}
.check-btn:active,.next-btn:active{transform:scale(.98)}
.check-btn:disabled{opacity:.5;cursor:default}
.feedback{font-weight:600;font-size:15px;margin-top:12px;line-height:1.45;}
.feedback.bad{color:var(--teacher)}
.feedback.good{color:var(--ok)}
.answer-box{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--ok-tint);border:1px solid var(--ok);font-size:15px;line-height:1.5;color:var(--pencil);}
.answer-box b{color:var(--ok)}
.sol-row{display:flex;margin-top:12px;}
.soft-btn{font-family:var(--font-ui);font-weight:600;font-size:13px;color:var(--ink);background:var(--glass-strong);border:1px solid var(--glass-border);border-radius:11px;padding:9px 14px;cursor:pointer;transition:transform .15s,border-color .15s;}
.soft-btn:hover{border-color:var(--ink)}
.soft-btn:active{transform:scale(.96)}
/* подпись источника — мелко и спокойно: она для честности, а не для ученика */
.source-note{font-weight:500;font-size:12.5px;color:var(--muted-3);margin-top:14px;}
.mode-card .mnum{font-weight:700;font-size:13px;color:var(--muted-1);min-width:26px}

.step-title{font-weight:700;font-size:13px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.04em;margin:4px 2px 8px;}
.reqs{font-size:13.5px;color:var(--muted-3);line-height:1.5;margin:0 2px 10px;padding-left:18px}
.reqs li{margin:1px 0}

.essay{font-family:var(--font-ui);font-size:16px;line-height:1.55;color:var(--pencil);background:var(--card);border:1.5px solid var(--glass-border);border-radius:14px;padding:12px 14px;width:100%;min-height:240px;resize:vertical;}
.essay:focus{outline:none;border-color:var(--ink)}
.essay[readonly]{opacity:.85}
.essay-bar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;margin-top:8px;font-size:13.5px;font-weight:600;color:var(--muted-2)}
.wc.ok{color:var(--ok)}
.timer{font-variant-numeric:tabular-nums}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn-row .check-btn{margin-top:0}

/* самопроверка по критериям ФИПИ */
.crit{margin-top:16px;padding:14px;border-radius:16px;background:var(--text-bg);border:1px solid var(--glass-border)}
.crit-row{padding:10px 0;border-top:1px solid var(--glass-border)}
.crit-row:first-of-type{border-top:none;padding-top:4px}
.crit-name{font-weight:700;font-size:14.5px;color:var(--muted-5);margin-bottom:6px}
.crit-name span{font-weight:500;color:var(--muted-2)}
.crit-opts{display:flex;flex-direction:column;gap:6px}
.crit-opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font-family:var(--font-ui);font-size:14px;line-height:1.4;color:var(--pencil);background:var(--card);border:1.5px solid var(--glass-border);border-radius:12px;padding:8px 12px;cursor:pointer}
.crit-opt b{flex:0 0 auto;min-width:16px;color:var(--ink)}
.crit-opt:hover{border-color:var(--ink)}
.crit-opt.picked{border-color:var(--ink);background:var(--hl-10)}
.crit-total{margin-top:12px;font-weight:700;font-size:16px;color:var(--ink)}
.crit-note{margin-top:6px;font-size:12.5px;font-weight:500;color:var(--muted-2);line-height:1.45}
.short-warn{margin:4px 0 10px;font-weight:600;font-size:14px;color:var(--teacher)}

/* образец: части подписаны, у примеров — кнопка с номерами предложений */
.sample{margin-top:16px;padding:14px;border-radius:16px;background:var(--ok-tint);border:1px solid var(--ok)}
.sample-title{font-weight:700;font-size:14px;color:var(--ok);margin-bottom:8px}
.sp{font-size:15.5px;line-height:1.55;color:var(--pencil);margin:0 0 8px}
.tag{display:inline-block;font-family:var(--font-ui);font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ok);background:var(--card);border:1px solid var(--ok);border-radius:999px;padding:2px 9px;margin-right:6px;vertical-align:1px}
button.tag{cursor:pointer}
button.tag:hover{background:var(--ok);color:#fff}
.sample-note{font-size:12.5px;font-weight:500;color:var(--muted-2);margin-top:4px;line-height:1.45}
.no-sample{margin-top:12px;font-size:14px;color:var(--muted-2)}
/* ── №1: изложение ──────────────────────────────────────────────────────── */
.mode-card .mdur{font-weight:600;font-size:13px;color:var(--muted-2)}
/* плеер свой, а не <audio controls>: в «Экзамене» нельзя ни перематывать, ни
   ставить на паузу, а у стандартного плеера это не отключить */
.player{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border-radius:16px;background:var(--text-bg);border:1px solid var(--glass-border);margin-bottom:14px}
.play-btn{flex:0 0 auto;width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--ink-2),var(--ink));box-shadow:var(--shadow);transition:transform .15s}
.play-btn:active{transform:scale(.94)}
.play-btn:disabled{opacity:.45;cursor:default}
.pl-mid{flex:1 1 200px;min-width:0}
.pl-label{font-weight:600;font-size:14px;color:var(--pencil);margin-bottom:6px}
.pl-bar{width:100%;accent-color:var(--ink);margin:0}
.pl-bar:disabled{opacity:.9}
.pl-time{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted-2);font-variant-numeric:tabular-nums;margin-top:3px}
.plays{display:flex;gap:6px;margin-left:auto}
.plays i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);display:block}
.plays i.on{background:var(--ink)}
.notes-box{margin-bottom:12px}
.notes-box summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted-2);padding:2px}
.notes{font-family:var(--font-ui);font-size:15px;line-height:1.5;color:var(--pencil);background:var(--card);border:1.5px dashed var(--glass-border);border-radius:12px;padding:10px 12px;width:100%;min-height:110px;resize:vertical;margin-top:8px}
.notes:focus{outline:none;border-color:var(--ink)}
/* текст изложения — по микротемам: ученик сверяет, все ли три передал */
.mt{margin:0 0 12px}
.mt-head{font-weight:700;font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink);margin-bottom:3px}
.mt-sum{font-size:13.5px;font-weight:600;color:var(--muted-3);margin-bottom:4px}
.mt p{margin:0}
.mt.hl{background:var(--hl-10);box-shadow:0 0 0 6px var(--hl-10);border-radius:8px}
.sp-note{display:block;font-size:13px;font-weight:500;color:var(--muted-2);margin-top:3px}
.text-tail{font-size:13px;color:var(--muted-2);margin-top:8px}
.text-tail p{margin:0;text-align:right;font-style:italic}
</style>
</head>
<body>
<!-- ?subject=rus: «←» ведёт на главную сразу на русский -->
<a class="home-btn" id="homeBtn" href="index.html?subject=rus" title="Ко всем тренажёрам" aria-label="Ко всем тренажёрам">←</a>
<button class="theme-toggle" id="themeToggle" title="Светлая/тёмная тема" aria-label="Переключить тему">🌙</button>
<script>(function(){
  var btn=document.getElementById('themeToggle');
  function apply(t, persist){
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    if (persist) { try{ localStorage.setItem('theme', t); }catch(e){} }
  }
  apply(document.documentElement.getAttribute('data-theme') || 'light', false);
  btn.addEventListener('click', function(){
    apply(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
  });
})();</script>

<div class="wrap">
  <h1>ОГЭ. Русский язык</h1>
  <div class="sub" id="pageSub">№1. Сжатое изложение · аудиозаписи открытого банка ФИПИ</div>

  <div id="pickerArea">
    <div class="modes" id="textsGrid"></div>
  </div>

  <div id="taskArea" style="display:none">
    <div class="task-head">
      <button class="back-btn" id="backBtn">← все тексты</button>
      <div class="corner">
        <button class="nav-btn" id="prevBtn" title="Предыдущий текст" aria-label="Предыдущий текст">◀</button>
        <div class="task-title" id="taskTitle"></div>
        <button class="nav-btn" id="nextBtnTop" title="Следующий текст" aria-label="Следующий текст">▶</button>
      </div>
    </div>

    <div class="submode-tabs">
      <button class="submode-tab" id="tabPractice">Тренировка</button>
      <button class="submode-tab active" id="tabExam">Экзамен</button>
    </div>
    <div class="mode-hint" id="modeHint"></div>

    <div class="stats">
      <div class="stat"><div class="v" id="statDone">0</div><div class="l">изложений написано</div></div>
      <div class="stat"><div class="v" id="statAvg">—</div><div class="l">средний балл из 6</div></div>
    </div>

    <div class="panel" id="essayPanel"></div>
  </div>
</div>

<script src="rus-oge01-fipi.js"></script>
<script src="rus-titles.js"></script>
<script>
(function(){
'use strict';
const DATA = window.RUS_OGE01 || {tasks:[]};
const TASKS = DATA.tasks;
const MIN_WORDS = 70;
// на ОГЭ текст читают два раза — в «Экзамене» столько же
const EXAM_PLAYS = 2;
// В записи ФИПИ автор назван не всегда. Кого назвал эксперт по русскому, дописываем
// здесь, а не в rus-oge01-fipi.js: тот файл пересобирается скриптом
const AU_FIX = { B40EFA: 'По Н.П. Крыщуку' };
const authorOf = t => t.au || AU_FIX[t.id] || '';
// название как у учителей: «И.О. Фамилия. «Первые слова…»»
const titleOf = t => RusTitles.title(authorOf(t), t.p[0]);

// Критерии ИК1–ИК3 — по методическим рекомендациям ФИПИ 2026 (до 6 баллов).
// Грамотность (ГК) и фактическую точность (ФК) ставит преподаватель.
const CRIT = [
  {id:'ik1', name:'ИК1. Содержание', max:2, opts:[
    [2, 'Переданы все три микротемы'],
    [1, 'Одна микротема пропущена или добавлена лишняя'],
    [0, 'Пропущено или добавлено больше одной микротемы']]},
  {id:'ik2', name:'ИК2. Сжатие', max:2, opts:[
    [2, 'Приёмы сжатия (исключение, обобщение, упрощение) — во всех трёх микротемах'],
    [1, 'Сжаты только две микротемы'],
    [0, 'Сжата одна микротема или сжатия нет']]},
  {id:'ik3', name:'ИК3. Логичность речи', max:2, opts:[
    [2, 'Логических ошибок нет, абзацы — по микротемам'],
    [1, 'Одна-две логические ошибки или ошибки в абзацах'],
    [0, 'Три и больше']]},
];
const MAX_SCORE = CRIT.reduce((s, c) => s + c.max, 0);

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
// итог по тексту: w — слов, sc — самооценка (null, пока не выставлена)
let results = LS.get('rusOge01:results', {});
let mode = LS.get('rusOge01:mode', 'exam');

const S = { idx:0, plays:0, playing:false, submitted:false, checking:false, textShown:false, sampleShown:false, crit:{}, t0:null, timerId:null };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mmss = sec => { sec = Math.max(0, Math.floor(sec || 0)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); };

// слова считаем как ФИПИ: любые слова, в том числе служебные; дефис не делит слово
function countWords(s){ return (String(s).match(/[0-9A-Za-zА-Яа-яЁё]+(?:-[0-9A-Za-zА-Яа-яЁё]+)*/g) || []).length; }

// один <audio> на страницу: при переходе к другому тексту прошлый звук гарантированно замолкает
const audio = new Audio();
audio.preload = 'metadata';

// ── Список текстов ─────────────────────────────────────────────────────────
function renderPicker(){
  stopAudio(); stopTimer();
  $('pickerArea').style.display = '';
  $('taskArea').style.display = 'none';
  const done = TASKS.filter(t => results[t.id]).length;
  $('pageSub').textContent = `№1. Сжатое изложение · ${TASKS.length} аудиозаписи открытого банка ФИПИ` + (done ? ` · написано ${done}` : '');
  // в названии — автор и первые слова, как принято у учителей и в сборниках: по нему текст
  // узнают и ищут; сам текст при этом остаётся скрыт до прослушивания
  $('textsGrid').innerHTML = TASKS.map((t, i) => {
    const r = results[t.id];
    const prog = r ? `<span class="mprog">✓${r.sc != null ? ' ' + r.sc + ' из ' + MAX_SCORE : ' написано'}</span>` : '';
    return `<button class="mode-card" data-i="${i}"><span class="mnum">${i + 1}</span>` +
      `<span class="mtitle">${esc(titleOf(t) || 'Текст ' + (i + 1))}</span>${prog}` +
      `<span class="msub">аудио ${mmss(t.dur)}</span></button>`;
  }).join('');
  $('textsGrid').querySelectorAll('.mode-card').forEach(b => b.addEventListener('click', () => openTask(+b.dataset.i)));
}

// ── Задание ────────────────────────────────────────────────────────────────
function openTask(i){
  stopAudio(); stopTimer();
  S.idx = (i + TASKS.length) % TASKS.length;
  const t = TASKS[S.idx];
  Object.assign(S, { plays:0, playing:false, submitted:false, checking:false, textShown:false, sampleShown:false, crit:{}, t0:null });
  audio.src = t.a;
  LS.set('rusOge01:last', t.id);
  const url = new URL(location.href);
  url.searchParams.set('t', t.id);
  history.replaceState(null, '', url);
  render(true);
}
function cur(){ return TASKS[S.idx]; }

function render(animate){
  const t = cur();
  const exam = mode === 'exam';
  $('pickerArea').style.display = 'none';
  $('taskArea').style.display = '';
  $('pageSub').textContent = '№1. Сжатое изложение';
  $('taskTitle').textContent = `текст ${S.idx + 1} из ${TASKS.length}`;
  $('tabPractice').classList.toggle('active', !exam);
  $('tabExam').classList.toggle('active', exam);
  $('modeHint').textContent = exam
    ? 'Как на ОГЭ: текст можно прослушать два раза, без паузы и перемотки. Между прослушиваниями записывай главное в заметки'
    : 'Слушай сколько нужно, ставь на паузу, открывай текст и образец';
  renderStats();

  let h = '<div class="player" id="player">' +
    '<button class="play-btn" id="playBtn" type="button" aria-label="Слушать">▶</button>' +
    '<div class="pl-mid"><div class="pl-label" id="plLabel"></div>' +
    `<input class="pl-bar" id="plBar" type="range" min="0" max="1000" value="0" step="1"${exam ? ' disabled' : ''} aria-label="Позиция">` +
    '<div class="pl-time"><span id="plCur">0:00</span><span id="plDur"></span></div></div>' +
    (exam ? '<div class="plays" id="plays" title="Прослушиваний">' + Array.from({length:EXAM_PLAYS}, () => '<i></i>').join('') + '</div>' : '') +
    '</div>';
  h += '<details class="notes-box"><summary>Заметки во время прослушивания</summary>' +
    '<textarea class="notes" id="notes" placeholder="Ключевые слова, мысли каждого абзаца…"></textarea></details>';
  h += '<ul class="reqs"><li>Передай главное содержание каждой из трёх микротем и всего текста</li>' +
    '<li>Сожми текст: убери подробности и примеры, обобщи однородное, упрости предложения</li>' +
    '<li>Каждая микротема — свой абзац</li><li>Не меньше 70 слов</li></ul>';
  h += `<textarea class="essay" id="essay" placeholder="Сжатое изложение…" spellcheck="true"${S.submitted ? ' readonly' : ''}></textarea>`;
  h += '<div class="essay-bar"><span class="wc" id="wc"></span><span class="timer" id="timer"></span></div>';
  h += '<div class="btn-row">';
  if (exam) h += `<button class="check-btn" id="submitBtn"${S.submitted ? ' disabled' : ''}>${S.submitted ? 'Сдано' : 'Сдать изложение'}</button>`;
  else h += '<button class="check-btn" id="checkBtn">Проверить по критериям</button>';
  h += '</div><div class="btn-row">';
  if (!exam) {
    h += `<button class="soft-btn" id="textBtn">${S.textShown ? 'Скрыть текст' : 'Показать текст'}</button>`;
    h += `<button class="soft-btn" id="sampleBtn">${S.sampleShown ? 'Скрыть образец' : 'Показать образец'}</button>`;
  }
  h += '<button class="soft-btn" id="copyBtn">Скопировать для преподавателя</button></div>';
  h += '<div id="critArea"></div><div id="textArea"></div><div id="sampleArea"></div>';
  h += '<button class="next-btn" id="nextBtn" style="display:none">Следующий текст →</button>';
  h += sourceNote(t);
  $('essayPanel').innerHTML = h;

  const ta = $('essay');
  ta.value = LS.get('rusOge01:draft:' + t.id, '');
  ta.addEventListener('input', () => { LS.set('rusOge01:draft:' + t.id, ta.value); updateCount(); });
  const notes = $('notes');
  notes.value = LS.get('rusOge01:notes:' + t.id, '');
  if (notes.value) notes.closest('details').open = true;
  notes.addEventListener('input', () => LS.set('rusOge01:notes:' + t.id, notes.value));
  updateCount();
  bindPlayer();
  if ($('submitBtn')) $('submitBtn').addEventListener('click', submit);
  if ($('checkBtn')) $('checkBtn').addEventListener('click', () => { S.checking = true; renderCrit(); });
  if ($('textBtn')) $('textBtn').addEventListener('click', () => { S.textShown = !S.textShown; renderText(); $('textBtn').textContent = S.textShown ? 'Скрыть текст' : 'Показать текст'; });
  if ($('sampleBtn')) $('sampleBtn').addEventListener('click', () => { S.sampleShown = !S.sampleShown; renderSample(); $('sampleBtn').textContent = S.sampleShown ? 'Скрыть образец' : 'Показать образец'; });
  $('copyBtn').addEventListener('click', copyEssay);
  $('nextBtn').addEventListener('click', () => openTask(S.idx + 1));
  if (S.submitted || S.checking) renderCrit();
  renderText(); renderSample();
  if (animate) reveal();
}
function reveal(){ const P = $('essayPanel'); P.classList.remove('reveal'); void P.offsetWidth; P.classList.add('reveal'); }
function sourceNote(t){
  return `<div class="source-note">Источник аудио: открытый банк заданий ФИПИ, задание ${esc(t.id)}. Текст записан по аудио, микротемы и образец — Mathh.</div>`;
}

// ── Плеер ──────────────────────────────────────────────────────────────────
function bindPlayer(){
  $('playBtn').addEventListener('click', togglePlay);
  const bar = $('plBar');
  bar.addEventListener('input', () => { if (mode !== 'exam' && audio.duration) audio.currentTime = bar.value / 1000 * audio.duration; });
  updatePlayer();
}
function togglePlay(){
  const exam = mode === 'exam';
  if (S.playing) {
    if (exam) return;  // на экзамене паузы нет
    audio.pause(); S.playing = false; updatePlayer(); return;
  }
  if (exam && S.plays >= EXAM_PLAYS) return;
  if (exam || audio.ended) audio.currentTime = 0;
  if (exam) { S.plays++; if (!S.t0) startTimer(); }
  S.playing = true;
  const p = audio.play();
  if (p && p.catch) p.catch(() => { S.playing = false; updatePlayer(); });
  updatePlayer();
}
function stopAudio(){ try { audio.pause(); } catch(e) {} S.playing = false; }
audio.addEventListener('timeupdate', updatePlayer);
audio.addEventListener('loadedmetadata', updatePlayer);
// второе прослушивание ученик запускает сам: между ними на ОГЭ дают дописать заметки
audio.addEventListener('ended', () => { S.playing = false; updatePlayer(); });
function updatePlayer(){
  if (!$('playBtn')) return;
  const exam = mode === 'exam';
  const d = audio.duration || cur().dur || 0;
  $('plBar').value = d ? Math.round(audio.currentTime / d * 1000) : 0;
  $('plCur').textContent = mmss(audio.currentTime);
  $('plDur').textContent = mmss(d);
  const btn = $('playBtn');
  btn.textContent = S.playing ? (exam ? '♪' : '❚❚') : '▶';
  btn.disabled = exam && (S.submitted || (!S.playing && S.plays >= EXAM_PLAYS));
  let label;
  if (!exam) label = S.playing ? 'Звучит текст' : 'Прослушать текст';
  else if (S.playing) label = `Прослушивание ${S.plays} из ${EXAM_PLAYS}`;
  else if (S.plays >= EXAM_PLAYS) label = 'Текст прослушан два раза — пиши изложение';
  else if (S.plays) label = 'Прослушать второй раз';
  else label = 'Прослушать текст';
  $('plLabel').textContent = label;
  if ($('plays')) $('plays').querySelectorAll('i').forEach((x, k) => x.classList.toggle('on', k < S.plays));
}

function updateCount(){
  const n = countWords($('essay').value);
  const wc = $('wc');
  wc.textContent = `Слов: ${n}` + (n < MIN_WORDS ? ` · нужно не меньше ${MIN_WORDS}` : '');
  wc.classList.toggle('ok', n >= MIN_WORDS);
}

// ── Время (только «Экзамен», с первого прослушивания) ──────────────────────
function startTimer(){ S.t0 = Date.now(); tick(); S.timerId = setInterval(tick, 1000); }
function tick(){ if (!S.t0 || !$('timer')) return; $('timer').textContent = '⏱ ' + mmss((Date.now() - S.t0) / 1000).padStart(5, '0'); }
function stopTimer(){ if (S.timerId) { clearInterval(S.timerId); S.timerId = null; } }

function submit(){
  const ta = $('essay');
  if (!ta.value.trim()) { $('wc').textContent = 'Сначала напиши изложение'; return; }
  S.submitted = true;
  stopTimer(); stopAudio();
  saveResult(null);
  ta.readOnly = true;
  $('submitBtn').disabled = true; $('submitBtn').textContent = 'Сдано';
  S.textShown = true; S.sampleShown = true;
  updatePlayer();
  renderCrit(); renderText(); renderSample();
  $('nextBtn').style.display = '';
}

// ── Самопроверка ───────────────────────────────────────────────────────────
function renderCrit(){
  const area = $('critArea');
  const words = countWords($('essay').value);
  let h = '<div class="crit"><div class="step-title">Проверь себя по критериям ФИПИ</div>';
  if (words < MIN_WORDS) h += `<div class="short-warn">Меньше ${MIN_WORDS} слов — такое изложение не засчитывают, 0 баллов.</div>`;
  h += CRIT.map(c => `<div class="crit-row"><div class="crit-name">${c.name} <span>· до ${c.max}</span></div><div class="crit-opts">` +
    c.opts.map(([v, txt]) => `<button class="crit-opt${S.crit[c.id] === v ? ' picked' : ''}" data-c="${c.id}" data-v="${v}" type="button"><b>${v}</b><span>${txt}</span></button>`).join('') +
    '</div></div>').join('');
  h += `<div class="crit-total" id="critTotal"></div><div class="crit-note">Сравни своё изложение с текстом по микротемам. Грамотность (ГК1–ГК4) и фактическую точность (ФК1) оценивает преподаватель — скопируй изложение и отправь ему.</div></div>`;
  area.innerHTML = h;
  area.querySelectorAll('.crit-opt').forEach(b => b.addEventListener('click', () => {
    S.crit[b.dataset.c] = +b.dataset.v;
    area.querySelectorAll(`.crit-opt[data-c="${b.dataset.c}"]`).forEach(x => x.classList.toggle('picked', x === b));
    updateTotal();
  }));
  updateTotal();
  if (mode === 'practice') $('nextBtn').style.display = '';
}
function updateTotal(){
  const all = CRIT.every(c => S.crit[c.id] != null);
  let sc = CRIT.reduce((s, c) => s + (S.crit[c.id] || 0), 0);
  if (countWords($('essay').value) < MIN_WORDS) sc = 0;
  $('critTotal').textContent = all ? `Итого: ${sc} из ${MAX_SCORE}` : `Отметь все ${CRIT.length} критерия`;
  if (all) saveResult(sc);
}
function saveResult(sc){
  const t = cur();
  const prev = results[t.id] || {};
  results[t.id] = { w:countWords($('essay').value), sc: sc != null ? sc : (prev.sc != null ? prev.sc : null) };
  LS.set('rusOge01:results', results);
  renderStats();
}

// ── Текст по микротемам и образец ──────────────────────────────────────────
function renderText(){
  const area = $('textArea');
  if (!S.textShown) { area.innerHTML = ''; return; }
  const t = cur();
  area.innerHTML = '<details class="text-box" open><summary>Текст изложения</summary><div class="text-body">' +
    t.p.map((p, k) => `<div class="mt" data-k="${k}"><div class="mt-head">Микротема ${k + 1}</div>` +
      `<div class="mt-sum">${esc(t.mt[k])}</div><p>${esc(p)}</p></div>`).join('') +
    (authorOf(t) ? `<div class="text-tail"><p>(${esc(authorOf(t))})</p></div>` : '') + '</div></details>';
}
function renderSample(){
  const area = $('sampleArea');
  if (!S.sampleShown) { area.innerHTML = ''; clearHL(); return; }
  const s = cur().s;
  if (!s) { area.innerHTML = '<div class="no-sample">Образец к этому тексту ещё готовим.</div>'; return; }
  const words = countWords(s.map(x => x.t).join(' '));
  area.innerHTML = '<div class="sample"><div class="sample-title">Образец сжатого изложения</div>' +
    s.map((x, k) => `<p class="sp"><button class="tag ex" data-k="${k}" type="button" title="Показать микротему в тексте">Микротема ${k + 1}</button>${esc(x.t)}` +
      `<span class="sp-note">Как сжато: ${esc(x.k)}</span></p>`).join('') +
    `<div class="sample-note">${words} слов. Это один из возможных вариантов: засчитывается любое изложение, где переданы все три микротемы и текст сжат.</div></div>`;
  area.querySelectorAll('.tag.ex').forEach(b => b.addEventListener('click', () => showMt(+b.dataset.k)));
}
function clearHL(){ document.querySelectorAll('.mt.hl').forEach(x => x.classList.remove('hl')); }
// микротема образца — подсветить её абзац в тексте (текст при этом открываем)
function showMt(k){
  if (!S.textShown) { S.textShown = true; renderText(); if ($('textBtn')) $('textBtn').textContent = 'Скрыть текст'; }
  clearHL();
  const el = document.querySelector(`.mt[data-k="${k}"]`);
  if (el) { el.classList.add('hl'); el.scrollIntoView({behavior:'smooth', block:'center'}); }
}

function copyEssay(){
  const t = cur();
  const text = `Сжатое изложение (ОГЭ, №1)\nТекст ${S.idx + 1} — ${titleOf(t)}, задание ФИПИ ${t.id}\n\n${$('essay').value}`;
  const done = () => { $('copyBtn').textContent = 'Скопировано'; setTimeout(() => { if ($('copyBtn')) $('copyBtn').textContent = 'Скопировать для преподавателя'; }, 1600); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, done);
  else done();
}

function renderStats(){
  const list = Object.values(results);
  const scored = list.filter(r => r.sc != null);
  $('statDone').textContent = list.length;
  $('statAvg').textContent = scored.length ? (scored.reduce((s, r) => s + r.sc, 0) / scored.length).toFixed(1).replace('.', ',') : '—';
}

// ── Кнопки ─────────────────────────────────────────────────────────────────
$('backBtn').addEventListener('click', () => {
  const url = new URL(location.href); url.searchParams.delete('t');
  history.replaceState(null, '', url);
  renderPicker();
});
$('prevBtn').addEventListener('click', () => openTask(S.idx - 1));
$('nextBtnTop').addEventListener('click', () => openTask(S.idx + 1));
function setMode(m){
  if (mode === m) return;
  mode = m; LS.set('rusOge01:mode', m);
  openTask(S.idx);
}
$('tabPractice').addEventListener('click', () => setMode('practice'));
$('tabExam').addEventListener('click', () => setMode('exam'));

// ── Старт ──────────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const startId = params.get('t');
const startIdx = startId ? TASKS.findIndex(t => t.id === startId) : -1;
if (startIdx >= 0) openTask(startIdx);
else renderPicker();

window.__rusOge01 = { S, TASKS, audio, countWords, CRIT, MAX_SCORE, EXAM_PLAYS };
})();
</script>
</body>
</html>
